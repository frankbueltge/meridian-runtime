# THROWAWAY DIAGNOSTIC — delete before this branch merges.
#
# `error` is an honest but opaque status: the adapter maps a non-200 response,
# a transport failure and an unexpected 200 shape all onto it, and keeps no
# body. Right for an artefact, useless for a diagnosis. So this asks the
# provider directly and prints the number it refuses with.
#
# push-triggered on its own paths only: workflow_dispatch needs the file to
# exist on the default branch, and nothing goes to main without a go-ahead.

name: zz probe gemini

on:
  push:
    paths:
      - '.github/workflows/zz-probe-gemini.yml'
      - 'scripts/zz_probe_quota.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: What daily quota does each candidate model have
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/zz_probe_quota.py
