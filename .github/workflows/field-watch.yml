# The field watch — the read-only half of Meridian's second nightly routine.
#
# The capability roadmap of 2026-07-24 named two nightly routines: (1) project
# work, which is research-run.yml, and (2) meta-research on the practice's own
# subject with a feedback into its own development. This is routine 2's FIRST
# HALF, and only that half: it observes, it never reads, it never proposes, and
# it never calls a model. The half that turns a finding into a change needs a
# frozen evaluator with real labels and is not built.
#
# Runs at 01:10 UTC. The time was 03:40 for exactly one day and was wrong on
# both counts, which is worth writing down rather than quietly fixing.
#
# It collided: the Meridian practice's own nightly session opens between 03:36
# and 03:42 UTC (observed 2026-07-27 and 2026-08-01 in field-research). Running
# the watch into that minute buys nothing and risks reading a half-written
# night.
#
# And the ordering rationale it carried was fiction. It said the watch runs
# before research-run.yml "so a night's observation could produce the new
# question" — but the practice that would read an observation is
# field-research, and its sessions are scoped to their own repository
# (journal/2026-07-26.md: "This session's repository access was scoped to
# frankbueltge/field-research"). An observation committed here is invisible to
# it. That is the same blocker that stopped the labelling commission on
# 2026-08-01, rebuilt hours later in a different place.
#
# 01:10 is therefore chosen for the only reason that currently holds: it is
# clear of every other scheduled act in the ecology, so a night's observation
# is complete and settled before anything else starts. The delivery problem is
# an ADDRESSING problem and no cron expression fixes it.
#
# --- Silence has to mean something ------------------------------------------
#
# The script is fail-closed: any search that does not complete aborts the run
# non-zero and writes nothing. A night that finds nothing writes no file, makes
# no commit and opens no pull request — so "no PR this morning" means the field
# was quiet, never that the fetch broke. That distinction is the entire value
# of the routine and it is why there is no best-effort mode anywhere in it.
#
# --- Never credit a person or a product for a machine's run -----------------
#
# Same standing rule as research-run.yml: the committer is a machine identity
# at an .invalid address.

name: Field watch

on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the observation instead of committing it'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: field-watch

jobs:
  watch:
    name: What appeared in the subject
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --locked

      - name: Sweep
        id: sweep
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          args=(--today "$today")
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          # No `|| true` anywhere: a failed sweep must fail the job. Reporting
          # a partial sweep as an observation would make every future "nothing
          # new" ambiguous.
          uv run python scripts/watch_field.py "${args[@]}" | tee /tmp/sweep.json

      - name: Anything new?
        id: check
        run: |
          set -euo pipefail
          if git diff --quiet -- corpora/field-watch/; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "The sweep completed and the field was quiet. Nothing to lay before anyone."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Field watch — ${{ steps.sweep.outputs.today }}"
            echo
            if [ -s /tmp/sweep.json ]; then cat /tmp/sweep.json; fi
            echo
            echo "_An observation, not a reading. Nothing here has been classified and nothing"
            echo "here implies a change._"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Why this lands on main instead of opening a pull request -------
      #
      # The first version pushed a branch named for the date and left the
      # register on it. That breaks the way this owner actually works: he
      # starts the routine by hand, often more than once a day. The second run
      # would find the register on main unchanged, report the same sources as
      # new again, and collide with its own branch from the first run. A watch
      # whose memory only advances when a human merges has no memory on the
      # days it is used most.
      #
      # An observation is not a claim. It says what appeared; it says nothing
      # about what any of it means, and its own file says so. research-run.yml
      # keeps its pull request because a research RESULT is an assertion that
      # deserves a human before it lands. This is the other kind of artefact,
      # and treating them the same was a mistake of symmetry, not of caution.
      #
      # CONFIRMED BY THE OWNER, 2026-08-02. Carried as an open question since
      # the handoff of that date ("Bleibt der Direkt-Push der Wache auf
      # main?") and now settled: it stays. Recorded here rather than only in a
      # design note, because this is the line a reader doubts, and this is
      # where they are standing when they doubt it.
      #
      # Still reversible, and the cost of reversing is named: a register that
      # only advances when a human merges has no memory on the days the
      # routine is started by hand more than once.
      - name: Record the night on main
        if: steps.check.outputs.new == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "Field Watch"
          git config user.email "watch@meridian-runtime.invalid"
          git add corpora/field-watch/
          git commit -m "Field watch ${{ steps.sweep.outputs.today }}: what appeared in the subject

          An observation, not a reading. The sweep ran the frozen search set
          against arXiv, applied the frozen inclusion filter, and recorded only
          what was not already in the register.

          Nothing here has been classified. Nothing here implies a change to
          any instrument or to the constitution.

          No human started this run."
          git push origin HEAD:main

      # --- The delivery, and why it exists --------------------------------
      #
      # An observation recorded here has no reader: the practice that would act
      # on it is field-research, and its sessions are scoped to their own
      # repository. Recording something true at an address nobody can open is
      # the same mistake that stranded the labelling commission earlier the
      # same day. So the observation is landed inside the receiving practice's
      # own tree, exactly as the commission finally was.
      #
      # Degrades honestly: with no cross-repository token the observation stays
      # recorded here and the job says the delivery did not happen, rather than
      # passing quietly and leaving everyone to assume it did.
      - name: Deliver it where the practice can read it
        if: steps.check.outputs.new == 'true' && inputs.dry_run != true
        env:
          ECOLOGY_TOKEN: ${{ secrets.ECOLOGY_TOKEN }}
        run: |
          set -euo pipefail
          today="${{ steps.sweep.outputs.today }}"
          observation="corpora/field-watch/observations/$today.json"

          if [ -z "${ECOLOGY_TOKEN:-}" ]; then
            echo "::warning::ECOLOGY_TOKEN is not set — the observation is recorded here but NOT delivered to field-research, where the practice could read it. It has no reader until that secret exists."
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${ECOLOGY_TOKEN}@github.com/frankbueltge/field-research.git" \
            /tmp/field-research

          uv run python scripts/deliver_observation.py \
            --observation "$observation" --into /tmp/field-research/watch

          cd /tmp/field-research
          if git diff --quiet; then
            echo "Already delivered — nothing to push."
            exit 0
          fi
          git config user.name "Field Watch"
          git config user.email "watch@meridian-runtime.invalid"
          git add watch/
          git commit -m "Field watch $today: what the practice's own instrument saw

          Delivered from meridian-runtime, the runtime this practice owns and
          uses. An observation, not a reading: nothing here has been classified
          and nothing here implies that anything should change.

          It is delivered rather than merely recorded because a record written
          where its reader cannot open it is not a record. This practice's
          sessions are scoped to this repository."
          git push origin HEAD:main
