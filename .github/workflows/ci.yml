name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Unit and property tests
        run: make test

      - name: Contract tests
        run: make test-contract

      - name: Integration tests
        run: make test-integration

      - name: E2E tests
        run: make test-e2e

      - name: Adversarial tests
        run: make test-adversarial

      - name: Benchmark tier
        run: make benchmark

      - name: Security check
        run: make security-check
