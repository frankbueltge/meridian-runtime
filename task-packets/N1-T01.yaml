derived_decisions:
  - >-
    (a) Reliability, not validity. The blind pass is an independent INSTANCE
    (K1-T06 verifying instance), not a human gold standard; kappa here is
    inter-instance reproducibility. The report says so in its header and claims
    no validity. Validity vs human gold requires human labels and is N1-T02.
    This is the single most important honesty boundary of the packet.
  - >-
    (b) The crosswalk is an explicit, committed, hashed INPUT (R3), not code.
    "18/18 agreement" is true ONLY relative to a mapping of two different label
    vocabularies onto a common axis; making that mapping a first-class,
    contestable artifact is the whole point. Its lines are transcribed verbatim
    from comparison.md — a fact-locked mapping, never a guessed one (AGENTS rule 3).
  - >-
    (c) Stratified, never pooled. Instantiation (15 works) and theory (3 papers)
    are different label tasks; one pooled kappa over both is methodologically
    wrong. comparison.md's pooled "18/18" is precisely what T01 corrects; the
    pooled number is withheld, with a stated reason, not silently emitted.
  - >-
    (d) Hand-rolled metrics, no numeric dependency. Cohen's/weighted kappa and
    Krippendorff's nominal alpha are short closed-form computations; the repo
    prefers hand-written domain logic over pulling ML/stats frameworks, and this
    keeps the dependency footprint and the security-check surface unchanged.
  - >-
    (e) Report is a projection, not a persisted object. It is Pydantic-validated
    (rule 6 satisfied for an externally visible structure) but never enters the
    object store and is never authoritative (rule 7). A persisted, JSON-Schema-
    mirrored ValidationReport is deferred to N1-T02, alongside the human gold
    contract and the finalization gate.
  - >-
    (f) DB-free at runtime. Both raters are read from committed, hash-pinned
    corpus files; git is authoritative for these committed inputs. The corpus
    <-> sealed-EvidenceMatrix faithfulness was spot-verified at derivation
    (theory-shumailov -> supports in both), documented here rather than asserted
    as a CI integration test, since CI has no access to the real archival schema.
  - >-
    (g) The below-power flag is mandatory, not cosmetic. n = 15 and n = 3 are
    below the documented 20-30/category threshold (A4); the report marks this so
    the perfect-agreement result is never read as publication-grade evidence.
invariants:
  - No database connection is opened and no repository is constructed anywhere in the runtime path.
  - Nothing is written except the requested --output file (atomic os.replace); the archive is never touched.
  - No wall-clock timestamp in any rendered byte; identical inputs yield a byte-identical report and a stable content hash.
  - Agreement is always reported per stratum and always beside its majority-class baseline; no pooled cross-stratum kappa is ever emitted.
  - The report always carries the crosswalk sha256 and the reliability-not-validity header; neither can be absent.
  - A zero-support category and an undefined kappa are REPORTED as typed null-with-reason, never a crash and never a fabricated 0.
acceptance_tests:
  - >-
    AT1: over the committed K1-T04/K1-T06 model-collapse verification set, the
    report reproduces comparison.md — per stratum observed agreement = 1.0;
    Cohen's kappa = 1.0 for the instantiation stratum (n=15) and honestly
    undefined (null-with-reason "no expected-chance variation") for the theory
    stratum (n=3, both raters use one category, p_e=1), never a fabricated 1.0;
    asserted numerically, and the item-by-item common-space labels match
    comparison.md's Agreement column exactly.
  - >-
    AT2: the report flags below_power = True on both strata (n = 15, n = 3),
    names the 20-30/category threshold, and emits NO pooled kappa (pooled_note
    present and explanatory instead).
  - >-
    AT3: the crosswalk sha256 printed in the report equals the actual sha256 of
    corpora/model-collapse/verification/agreement-crosswalk.v1.json; changing the
    crosswalk file changes the reported hash (auditability of the mapping).
  - >-
    AT4: hand-computed metric oracles — a 2x2 confusion with p_o=0.7, p_e=0.5
    gives kappa=0.4; a supplied weighted-kappa worked example matches; a
    single-category input gives kappa=null-with-reason (no crash); a zero-support
    category gives F1=null-with-reason.
  - >-
    AT5: determinism and refusals — two renders of the same set are byte-identical;
    an incomplete alignment (an item in one rater absent from the crosswalk)
    exits 3 naming the item; a missing/unparseable input file exits 2; existing
    suites pass unmodified.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make security-check
specification_gaps:
  - >-
    Validity vs a human gold standard is NOT measured here — the blind pass is an
    independent instance, so T01 reports reliability only. Human gold-label
    ingestion + a finalization gate as object state + validity metrics are N1-T02,
    named and deferred (own use case, human labeling effort).
  - >-
    Prompt-stability over paraphrases (Krippendorff's alpha across prompt
    variants) is N1-T03 — it re-runs the classifier and touches the LLM adapter;
    it is the piece that later feeds Routine 2's frozen-evaluator optimization
    loop. Out of scope here.
  - >-
    A persisted, JSON-Schema-mirrored ValidationReport object (so a validation
    result can enter the governed record and be cited) is deferred to N1-T02;
    T01's report is a projection.
required_output:
  - Packet report per AGENTS "Required delivery format", embedding the exact
    `mrr validate agreement` invocation, the rendered Markdown report for the
    instantiation stratum verbatim (confusion matrix, kappa, majority baseline,
    below-power flag, reliability header), and the crosswalk sha256.
stop_conditions:
  - >-
    If reproducing comparison.md requires anything beyond the declared crosswalk
    (R3) — i.e. an item that cannot be aligned from comparison.md's own table, or
    a label that has no honest common-space mapping — STOP and report it as a
    crosswalk question, never widen the mapping by guessing (AGENTS rule 14).
  - >-
    If any make tier requires weakening an edge-case rule (a crash "fixed" by
    returning 0 for an undefined kappa, a mismatched-rater case silenced) to go
    green, STOP — rule 12 and the null-with-reason contract may not be softened.
  - >-
    If the corpus <-> sealed-object faithfulness spot-checked at derivation does
    not hold for an item the acceptance test touches (the committed label
    disagrees with the sealed EvidenceMatrix), STOP and report — T01 must
    validate the run's real classification, not a drifted file.
