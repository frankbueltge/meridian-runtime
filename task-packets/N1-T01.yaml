objective: >-
  After this packet, `mrr validate agreement --analysis-set <path>` renders a
  deterministic agreement report (JSON and Markdown) over two independent
  classifications of the same items, STRATIFIED by analysis, computing per
  stratum: confusion matrix in the declared common label space, observed
  agreement, per-category prevalence, a majority-class baseline, Cohen's kappa,
  linear- and quadratic-weighted kappa, Krippendorff's nominal alpha, and
  per-category precision/recall/F1 (with the designated reference rater named,
  since without human gold these are asymmetric, not validity). The report
  header states, in plain type: (a) this is inter-instance RELIABILITY, not
  validity vs human gold; (b) agreement is defined relative to declared crosswalk
  <sha256>; (c) each stratum's n and a below-power flag when n/category < 20.
  Run against the committed K1-T04/K1-T06 model-collapse verification set, it
  reproduces comparison.md's per-item agreement (18/18): observed agreement = 1.0
  per stratum. Cohen's kappa = 1.0 for the instantiation stratum (n=15); for the
  theory stratum (n=3) both raters use a single category, so p_e = 1 exactly and
  kappa/weighted-kappa/alpha are HONESTLY UNDEFINED (null with reason "no
  expected-chance variation"), never a fabricated 1.0 — perfect observed agreement
  with no chance-corrected signal. (Corrected 2026-07-24 post-build: the original
  "kappa = 1.0 per stratum" wording did not survive the theory stratum's real
  degenerate data; R1's null-with-reason contract governs it — see
  docs/design/2026-07-24-n1-t01-report.md.) It reads only committed files, opens
  no database connection, and writes only to the given output path (atomic
  os.replace).
source_of_truth:
  - docs/design/2026-07-24-n1-derivation.md                       # this packet's derivation
  - docs/design/2026-07-24-nachrecherche-empirische-methoden.md   # A3/A4/A5 — the validation protocol
  - corpora/model-collapse/corpus-entries.json                    # pipeline classification (evidence_relation)
  - corpora/model-collapse/verification/blind-returns.json        # independent second classification
  - corpora/model-collapse/verification/comparison.md             # the oracle (18/18) this hardens
  - services/control_plane/mrr/services/report/service.py         # projection/render pattern to mirror (read-only, atomic write)
  - services/control_plane/mrr/services/cli/report_main.py        # CLI pattern (NFR-012 ordering, exit 0/2/3, atomic os.replace)
  - services/control_plane/mrr/services/cli/main.py               # +2 lines: register + dispatch the new subcommand
  - packages/domain/mrr/domain/research_report.py                 # domain projection-model precedent
requirements:
  - >-
    R1 (pure agreement core, packages/domain/mrr/domain/agreement.py): hand-rolled
    closed-form functions, no numpy/scipy/scikit-learn, pure and DB-free. For two
    aligned rater sequences over a fixed category set: confusion_matrix;
    observed_agreement (p_o); category prevalence per rater; majority_baseline
    (agreement a constant most-frequent-category classifier would reach);
    cohen_kappa; weighted_kappa(weights: "linear"|"quadratic") over an EXPLICIT
    ordered category list (the caller supplies the order; no implicit ordering);
    krippendorff_alpha with nominal distance; per_category prf (precision, recall,
    F1) given a NAMED reference rater. Edge cases are explicit, never silent
    (AGENTS rule 12 / rule prohibiting collapsing statuses): a category with zero
    support is retained in the confusion matrix with zeros and its F1 is reported
    as null with reason "no support", never 0.0 and never a division error;
    p_e = 1 (a single category used by both raters) yields kappa = null with
    reason "undefined: no expected-chance variation", never a ZeroDivisionError;
    raters of unequal length or mismatched item sets raise a typed error naming
    the offending items. Determinism: identical inputs yield identical outputs
    (no wall clock, no set-iteration nondeterminism — sort categories explicitly).
  - >-
    R2 (report projection model, packages/domain/mrr/domain/agreement_report.py):
    a Pydantic v2 MRRModel (extra="forbid") assembling, PER STRATUM, the R1
    metrics plus: stratum id, n, category set, the two rater ids, the declared
    crosswalk's sha256, a below_power flag (True when any category's n < 20) with
    the documented threshold (20-30/category, A4), and a fixed honesty header
    string set: measures_reliability_not_validity=True, reference_note naming the
    reference rater for the asymmetric P/R/F1. It is NOT a BaseObject, has NO
    schemas/*.schema.json mirror, and is NEVER written to the object store. A
    top-level report carries an ORDERED list of strata (sorted by stratum id) and
    NO pooled cross-stratum kappa; a `pooled_note` field carries only the string
    explaining why pooling is withheld.
  - >-
    R3 (declared alignment + crosswalk fixture): add ONE committed file,
    corpora/model-collapse/verification/agreement-crosswalk.v1.json, encoding
    (a) the item alignment (blind item A1..B3 <-> corpus entry_id, transcribed
    verbatim from comparison.md, not invented), (b) the label crosswalk mapping
    each rater's raw labels into a common per-analysis label space
    (instantiation stratum: instantiates<->supports as "instantiates",
    references-only<->contradicts as "references", qualifies as "qualifies";
    theory stratum: supports as "supports", contradicts as "contradicts"), and
    (c) the per-stratum ordered category list used for weighted kappa. The file
    is self-describing (a `provenance` field citing comparison.md and the freeze
    commits it names) and is the SOLE place the crosswalk lives; its sha256 is
    echoed in every report so agreement is auditable against exactly this mapping.
  - >-
    R4 (ValidationService, services/control_plane/mrr/services/validation/
    service.py): read-only orchestration. Given an analysis-set spec (the two
    corpus files + the R3 crosswalk file), it loads all three, validates the
    alignment is total (every aligned item present in both raters, else typed
    refusal naming the gap — never a silent partial), maps each rater into the
    common label space per stratum, invokes the R1 core, builds the R2 report,
    and renders JSON + Markdown deterministically. It opens NO database
    connection and constructs no repository. Markdown shows, per stratum, the
    confusion matrix, the metric table, the majority baseline beside p_o (so the
    skew is visible), and the honesty header verbatim.
  - >-
    R5 (CLI, services/control_plane/mrr/services/cli/validation_main.py + 2 lines
    in cli/main.py): `mrr validate agreement` with --analysis-set <path to a
    committed set descriptor or the crosswalk file> (required), --format
    md|json (default md), --output <path> (default stdout). NFR-012 ordering:
    cheapest local checks first (output-path conflict, file existence/parse of
    the three inputs) before any computation; exit 0 success, exit 2 for an
    input file missing/unreadable/unparseable (dependency-unavailable analogue),
    exit 3 for a refusal (incomplete alignment, undefined-kappa-with-no-signal
    treated as a reported result NOT a refusal — see R1). Atomic os.replace for
    --output. A standalone build_parser()/main() enables
    `python -m mrr.services.cli.validation_main`. main.py gains exactly one
    register_validation_subcommand(subparsers) call and one
    `if args.command == "validate": return validation_main.run_command(args)`.
  - >-
    R6 (tests every tier + security-check). unit (DB-free): R1 metric correctness
    against HAND-COMPUTED known-value cases incl. a classic non-trivial kappa
    (e.g. a 2x2 with p_o=0.7, p_e=0.5 -> kappa=0.4) and a weighted-kappa worked
    example; zero-support category -> F1 null-with-reason; single-category ->
    kappa null-with-reason (no crash); unequal/mismatched raters -> typed error;
    R2 report shape incl. below_power=True at n=15/3 and the honesty header;
    determinism (two renders byte-identical, stable content hash). property
    (hypothesis): kappa in [-1, 1]; kappa == 1.0 iff perfect agreement with >1
    category used; kappa symmetric under swapping the two raters; alpha == kappa
    relationship holds for the 2-rater nominal case within tolerance; observed
    agreement in [0, 1]. acceptance (the point of the packet, DB-free, reads the
    REAL committed files): running the service over the K1-T04/K1-T06 set
    reproduces comparison.md — per stratum observed agreement = 1.0; Cohen's
    kappa = 1.0 for the instantiation stratum and honestly undefined
    (null-with-reason) for the theory stratum (n=3, one category used, p_e=1),
    never fabricated 1.0; the report flags below_power on both strata; NO pooled
    kappa is emitted; the crosswalk sha256 in the report equals the file's actual
    hash.
    contract: the R2 model validates its own instances (extra="forbid" rejects an
    unknown field). architecture (lint-imports): domain/agreement.py and
    agreement_report.py import no framework/service modules; no forbidden import
    introduced. All existing suites pass UNMODIFIED. Every make tier green
    INCLUDING make security-check.
