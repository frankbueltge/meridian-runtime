task_id: N1-T01
title: >-
  Agreement-metrics core and `mrr validate agreement` (read-only): compute a
  reproducible, hash-anchored inter-instance agreement statistic over the
  K1-T04/K1-T06 blind-vs-pipeline classification of the model-collapse corpus —
  confusion, observed agreement, Cohen's and weighted kappa, Krippendorff's
  nominal alpha, per-category precision/recall/F1, a majority-class baseline and
  a below-power flag — stratified by analysis, defined relative to a declared,
  committed label crosswalk, labelled as reliability (NOT validity), touching no
  database and writing nothing to the archive.
status: approved
epic: N1
reviewer_resolution: >-
  Approved 2026-07-24 by the main session as reviewing instance, under the
  owner's delegation of the roadmap ordering the same day ("mach einfach wie du
  denkst") recorded in docs/design/2026-07-24-n1-derivation.md, and under the
  standing use-first decision (docs/design/2026-07-22-nutzungsentscheidung-e9-
  vertagt.md). N1 is decomposed; ONLY N1-T01 is built now, on a real,
  today-satisfiable use case (make the asserted "18/18 agreement" of
  comparison.md auditable). Load-bearing design choices CONFIRMED at derivation:
  (1) reliability, NOT validity — the blind pass is an independent instance
  (K1-T06), not a human gold standard, so kappa here measures inter-instance
  reproducibility; the report labels itself so and claims no validity (validity
  vs human gold is N1-T02); (2) the label crosswalk (blind
  {instantiates/references-only/qualifies} <-> pipeline {supports/contradicts})
  is made an EXPLICIT, committed, hashed INPUT, not baked into code — agreement
  is defined relative to it and is therefore contestable; (3) STRATIFIED by
  analysis (instantiation n=15; theory n=3), never pooled — pooling two distinct
  label tasks into one kappa is methodologically wrong, and comparison.md's
  pooled "18/18" is exactly what this hardens; (4) metrics are hand-rolled
  closed-form in pure domain code (no numpy/scipy/scikit-learn) — matches the
  repo's hand-written-domain-logic preference and adds no dependency / no new
  security-check surface; (5) the report is a Pydantic-validated PROJECTION
  (rule 7), NOT a persisted object — no schemas/**, no migration, no object-store
  write; a persisted ValidationReport with a JSON-Schema mirror is deferred to
  N1-T02; (6) read-only and DB-free at runtime — both raters are read from
  committed, hash-pinned corpus files; the corpus<->sealed-object faithfulness
  was spot-verified at derivation (theory-shumailov -> supports in both), not
  asserted as a CI test (CI has no real schema).
depends_on: []
derivation: >-
  Derived 2026-07-24 from docs/design/2026-07-24-n1-derivation.md and the
  capability-roadmap draft (docs/design/2026-07-24-capability-roadmap-entwurf.md,
