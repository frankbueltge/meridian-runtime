  postgresql://mrr@127.0.0.1:54329/mrr_test, schema mrr_k1t04_real_run_v2:
  ConceptCharter entry `instantiate-vs-reference-v1` is a FINALIZED criteria
  object (the "validate only after finalization" precondition already holds as
  object state); EvidenceMatrix.rows[].extraction.classification_basis carries
  the pipeline classification. Committed corpus: corpora/model-collapse/
  corpus-entries.json has 18 entries with evidence_relation in
  {supports, contradicts} and applies_to_analysis splitting theory (3) from
  instantiation (15); corpora/model-collapse/verification/blind-returns.json has
