derived_decisions: >-
  (a) MethodProfile is UNSIGNED and revision-based, like ResearchScore/Claim — not
  event-only like TaskBundle, and not one of the three ADR-0004 cross-practice signed
  kinds (NodeManifest/TaskBundle/EvidenceCrate). Spec 08 section 3's table shows no
  signature requirement for any Layer-1 method object, and a MethodProfile is a LOCAL
  methodological declaration, not itself transferred cross-practice within K0/K1 scope.
  Each lifecycle transition therefore mints a NEW REVISION with `status` changed in the
  body (content hash recomputed), exactly mirroring
  `ResearchScoreService._transition`'s own pattern, not an ADR-0007-style event-only
  transition.
  (b) `profile_key` and `version` (the semantic version) are BODY-ONLY fields, not the
  object-repository key. Unlike NodeManifest (keyed by `node_id`, itself a proper
  `common.schema.json#/$defs/urn`-typed field per schemas/node-manifest.schema.json, the
  precedent `CapabilityRegistry` reuses for its own external key), spec 08 section 2
  frames `profile_key` as a plain human-legible slug (its own worked example is
  `systematic_evidence_synthesis`, section 5) with no urn shape implied anywhere in the
  spec text. Reusing it as `ObjectRepository`'s key would require it to be urn-shaped,
  which is not how the spec presents it. Object identity is therefore the object's own
  freshly minted baseObject `id` (`urn:mrr:method-profile:<ulid>`), mirroring
  ResearchScore/Claim — not `profile_key`. A later semver revision that supersedes an
  ACCEPTED profile mints a NEW `id` whose `supersedes` field (inherited from
  `baseObject`) points at the old id's latest accepted revision; WITHIN one id's own
  lifecycle, draft -> accepted -> superseded tracks that ONE version's own review,
  exactly mirroring how ResearchScore's ACTIVE -> SUPERSEDED already works. Flagged for
  reviewer confirmation in specification_gaps — this is the majority-precedent reading,
  not the only possible one.
  (c) Because `mrr.domain.repositories.ObjectRepository` offers no "list, or query by
  body field" operation (confirmed unchanged — `get_latest`/`get_revision`/
  `list_revisions` all take only an `id`) and `profile_key` is not the repository key
  per (b), `MethodProfileService` exposes `find_accepted_by_capability(capability_name)`
  mirroring `CapabilityRegistry.find_nodes_with_capability`'s own EXACT pattern: scan the
  event log for `method_profile.accepted` events, collect distinct `object_id`s, and
  re-resolve each candidate's CURRENT state via `ObjectRepository.get_latest` — keeping
  only ids whose latest revision's `status` is still `"accepted"` (a later `supersede`
  call moves that same id's current status to `"superseded"`, and re-resolving the
  latest revision rather than trusting the historical accepted event is exactly what
  excludes it, mirroring how `CapabilityRegistry`'s own validity-window check re-reads
  current state rather than trusting a stale registration event).
  (d) `claim_types` reuses `mrr.contracts.claim.ClaimType` verbatim — the existing
  seven-value docs/spec/02_DOMAIN_MODEL.md section 2.11 vocabulary (observational,
  causal, statistical, methodological, interpretive, normative, speculative) — rather
  than inventing a parallel, profile-specific vocabulary. Spec 08 section 2 does not cite
  section 2.11 explicitly, but Claim already has exactly this closed enum and no other
  "claim type" vocabulary exists anywhere in this repository; reusing it is the
  minimal-invention option (flagged for reviewer confirmation in specification_gaps).
  (e) The maximum-claim-ceiling seven-level taxonomy (spec 08 section 4: insufficient_
  evidence < mechanism_hypothesis < descriptive < associational_unadjusted <
  associational_adjusted < causal_local < causal_bounded) is entirely NEW — no existing
  vocabulary in this repository names it. Introduced here as `ClaimCeiling` (a `Literal`
  of the seven exact strings) plus `CLAIM_CEILING_ORDER`, an explicit ordered tuple
  (weakest-language-permitted first, exactly the spec's own ordering) exposed as a plain
  module-level constant in `mrr.contracts.method_profile` for K1-T02's ceiling-
  enforcement task to import and rank against, rather than re-deriving the ordering
  there. This task implements NO comparison or enforcement function over it (see
  forbidden_changes) — it only declares and orders the vocabulary once, for one later
  consumer, the same "reuse, don't fork" discipline task-packets/E6-T02.yaml's own
  module docstring states explicitly for its own reused traversal.
  (f) Declaring deterministic vs. model-assisted steps (MTH-016) uses a NEW, distinct
  two-value vocabulary, `ExecutorStepKind = Literal["deterministic", "model_assisted"]`
  — deliberately NOT the same type as `mrr.contracts.model_profile`'s existing
  `OperationKind` (`Literal["deterministic", "stochastic"]`, E4-T01), because the two
  describe different things: `OperationKind` is a property of one MODEL INVOCATION's own
  configuration; `ExecutorStepKind` is a property of one PROFILE STEP in the abstract,
  declared before any model is ever called. Conflating them would make a profile's step
  declaration accidentally claim something about sampling temperature it has no
  business claiming. `executor_steps` is `list[ExecutorStepDeclaration]`, each carrying
  `name` (str) and `kind` (`ExecutorStepKind`); required non-empty — a profile
  declaring zero steps declares nothing about MTH-016 at all, which is not a valid
  declaration.
  (g) "Profile activation ... MUST emit a domain event" (MTH-019) is read as the draft ->
  accepted transition specifically. Because docs/spec/03_API_AND_EVENTS.md section 5.2's
  Required-events list has no `method_profile.*` entry at all, this task adds
  `method_profile.proposed` (the create/draft step), `method_profile.accepted`, and
  `method_profile.superseded` — additive, non-breaking event types, reading section 5.2
  as a floor and not a ceiling, the SAME reading task-packets/E6-T01.yaml and
  task-packets/E6-T02.yaml already establish for `transfer.created`/
  `obligation.propagated`/`obligation.deferred`. Flagged in specification_gaps for
  reviewer confirmation.
  (h) Every field spec 08 section 2 says a profile MUST declare (`profile_key`,
  `version`, `claim_types`, `max_claim_ceiling`, `protocol_form`,
  `executor_task_family`, `executor_steps`, `inappropriate_uses`) is schema-REQUIRED
  unconditionally — present on every revision, including the very first draft — rather
  than "required only once accepted." This is the simpler, more defensible reading (it
  matches how e.g. ModelProfile's `determinism` field is required at all times, never
  phased in by lifecycle stage) and is what makes the plan's own acceptance test ("a
  profile without max-ceiling or protocol-form declaration is rejected") a SCHEMA/
  contract-level fact, true before `MethodProfileService` is ever called — not a
  service-level gate a draft could dodge.
specification_gaps:
  - >-
    Coordination note, not a blocker: packages/contracts/mrr/contracts/__init__.py,
    scripts/check_contracts.py's `ENTITY_MODELS` dict, and
    packages/domain/mrr/domain/lifecycles.py are ALSO touched by the in-flight
    (unreviewed, unmerged) task-packets/E6-T01.yaml (TransferContract) and
    task-packets/E6-T02.yaml (Obligation). `ENTITY_MODELS` is keyed by entity name, not
    merge order, so any sequencing among K0-T01/E6-T01/E6-T02 is safe there —
    task-packets/E6-T02.yaml's own derivation section already establishes this exact
    precedent for its own sibling addition. `lifecycles.py` is a plain Python module
    each of the three tasks appends one independent module-level `StateMachine` constant
    to — an ordinary textual merge conflict for whichever lands second or third, not a
    semantic one, and resolvable without redesign regardless of order.
  - >-
    Whether `profile_key`/`version` should instead BE the repository key (mirroring
    NodeManifest/CapabilityRegistry's `node_id` precedent) rather than staying
    body-only fields under a freshly minted `id` (derived_decisions (b)) is not settled
    by spec 08's own text — it names both as things to declare without saying which
    field, if any, is the object's primary identity. This task's reading follows the
    majority precedent (ResearchScore/Claim: own id, `supersedes` for lineage) over the
    minority precedent (NodeManifest: external key). Flagged for reviewer confirmation
    before K1 builds further lookups on top of it.
  - >-
    `claim_types` reusing `mrr.contracts.claim.ClaimType` verbatim (derived_decisions
    (d)) assumes "the claim types a profile can produce" (spec 08 section 2) means the
    SAME vocabulary as Claim's own `claim_type` field (section 2.11), not a
    profile-specific vocabulary spec 08 leaves unnamed. Spec 08 does not cite section
    2.11 explicitly. Flagged for reviewer confirmation.
  - >-
    Whether `inappropriate_uses` must be non-empty (a profile naming zero inappropriate
    uses has, in effect, declared no refusal boundary at all) is undrawn by spec 08
    section 2, which only says a profile MUST declare its inappropriate uses, not that
    the list must be non-empty. This task's schema allows an empty array; flagged for
    reviewer tightening if a non-empty floor is wanted.
  - >-
    Whether a superseded MethodProfile's own id may ever transition further (e.g. back
    toward draft for a correction) is undrawn — mirrors
    packages/domain/mrr/domain/lifecycles.py's own documented open question for
    ResearchScore's SUSPENDED state ("no drawn path back out"). This task's
    `METHOD_PROFILE_LIFECYCLE` declares exactly the two edges spec 08 section 3's table
    shows (draft -> accepted, accepted -> superseded) and nothing else, matching that
    module's own stated discipline of only implementing drawn transitions.
  - >-
    The exact `profile_key` string shape (this task's own proposed default: a
    non-empty, lowercase, underscore-separated slug, e.g. a conservative
    `^[a-z][a-z0-9_]*$` pattern) and the `version` field's semver pattern (e.g.
    `^\d+\.\d+\.\d+$`) are this task's own minimal proposal, not spec-derived — spec 08
    says only "semantic version" without a pattern. Flagged as a minor open detail, not
    separately gated by its own acceptance test.
invariants:
  - >-
    MethodProfile composes `common.schema.json#/$defs/baseObject` exactly (id,
    api_version, kind, practice_id, revision, created_at, created_by, content_hash, plus
    optional supersedes/labels) — a method object without the baseObject contract is
    invalid (spec 08 section 3)
  - >-
    every MethodProfile revision, including the first draft, carries a non-null
    profile_key, version, claim_types (drawn from mrr.contracts.claim.ClaimType),
    max_claim_ceiling (one of the seven ClaimCeiling values), protocol_form,
    executor_task_family (non-empty list of capability-name strings), executor_steps
    (non-empty list of name/kind pairs), and inappropriate_uses — a revision missing
    max_claim_ceiling or protocol_form is rejected by Pydantic/JSON Schema validation
    before MethodProfileService is ever called (MRR-MTH-003)
  - >-
    the seven ClaimCeiling values are exactly the spec 08 section 4 strings, in the
    spec's own weakest-to-strongest order, exposed as CLAIM_CEILING_ORDER — nothing
    added, nothing dropped, nothing reordered
  - >-
    executor_steps distinguishes deterministic from model-assisted steps explicitly per
    step; no step's kind is inferred or silently defaulted (MRR-MTH-016)
  - >-
    the lifecycle is exactly METHOD_PROFILE_LIFECYCLE's two edges, draft -> accepted and
    accepted -> superseded; an illegal transition raises InvalidTransitionError and
    persists nothing
  - >-
    accepting a MethodProfile (draft -> accepted) records a method_profile.accepted
    domain event, atomically with the new revision, carrying full MRR-NFR-001
    provenance (actor, occurred_at, policy_version, causation_id, correlation_id,
    object_id, object_revision) (MRR-MTH-019)
  - >-
    the registry introduces no new path around Research Score approval, Task Bundle
    negotiation, Run Manifests, or Evidence Crate sealing — it touches none of those
    objects or services at all (MRR-MTH-020)
  - >-
    no Alembic migration is added; objects.kind = "MethodProfile" is accepted by the
    existing un-CHECKed Text column exactly as-is
  - >-
    both import-linter contracts stay KEPT; the new contract/domain modules import no
    provider SDK, no web/workflow framework, and open no network
acceptance_tests:
  - >-
    schema round-trip — schemas/method-profile.schema.json is a valid Draft 2020-12
    document; the committed example validates against both the JSON Schema and the
    Pydantic model and round-trips via scripts/check_contracts.py's ENTITY_MODELS
  - a profile missing max_claim_ceiling is rejected at construction, never silently defaulted
  - a profile missing protocol_form is rejected at construction, same as above
  - claim_types accepts only ClaimType's seven values; an unrecognized claim type string is rejected
  - >-
    max_claim_ceiling accepts only the seven ClaimCeiling strings in
    CLAIM_CEILING_ORDER's declared order; an unrecognized ceiling string is rejected
  - >-
    executor_steps requires at least one entry, each declaring an explicit
    deterministic/model_assisted kind; an entry with a missing or unrecognized kind is
    rejected
  - creating a MethodProfile (draft) persists it as revision 1 plus a method_profile.proposed event
  - >-
    draft -> accepted succeeds via MethodProfileService and records a
    method_profile.accepted event, atomically with the new revision (MRR-MTH-019)
  - accepted -> superseded succeeds and records a method_profile.superseded event
  - >-
    an illegal transition (e.g. attempting superseded -> accepted, or creating a fresh
    object directly as accepted/superseded) raises InvalidTransitionError and persists
    nothing
  - >-
    find_accepted_by_capability returns only currently-accepted profiles declaring the
    queried capability name, excluding a profile whose current status has since moved
    to superseded (integration test, real PostgreSQL, mirroring
    CapabilityRegistry.find_nodes_with_capability's own precedent)
  - >-
    after adding the new modules, both import-linter contracts are still KEPT
    (tests/unit/architecture/test_import_boundaries.py passes)
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make test-integration
required_output:
  - implementation summary
  - >-
    the MethodProfile schema/contract/example triple, ClaimCeiling + CLAIM_CEILING_ORDER,
    ExecutorStepKind/ExecutorStepDeclaration, and METHOD_PROFILE_LIFECYCLE
  - MethodProfileService (propose/accept/supersede/find_accepted_by_capability) and its event recording
  - >-
    changed files, additive domain errors (e.g. MethodProfileNotFoundError), and
    explicit confirmation that packages/persistence/** and migrations/ were NOT touched
  - >-
    tests added and exact command results (format, lint, typecheck, test, test-contract,
    test-integration) proving green
  - >-
    security/privacy implications (no signature or cross-practice transport introduced;
    no provider SDK; no network; append-only revisions)
  - >-
    open specification questions exactly as listed under specification_gaps, plus the
    coordination note re: E6-T01/E6-T02 touching the same three shared files
stop_conditions:
  - >-
    MRR-MTH-003/016's declaration shape cannot be expressed without either an optional
    max_claim_ceiling or a silently-defaulted executor-step kind — stop and report
    rather than weakening either MUST
  - >-
    a reviewer determines profile_key/version should be the repository key rather than
    body-only fields under a freshly minted id (specification_gaps) — stop rather than
    silently building K0-T02's dispatch lookup on an assumption a reviewer rejects
  - >-
    implementation requires modifying packages/persistence/**, an Alembic migration, or
    either import-linter contract — confirmed unnecessary at planning time; report if
    that assumption turns out false
