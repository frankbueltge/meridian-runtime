  (MTH-019)."). First task of the new K epic series, numbered separately from the E
  epics (docs/spec/06_IMPLEMENTATION_PLAN.md) specifically so the method layer stays
  visibly distinct from the governance cathedral (plan doc, numbering note). No K0/K1
  packet exists anywhere in task-packets/ at the time this one is derived, so this
  task's own allowed_paths touch no in-flight K-series work. The closest analog for
  adding a NEW baseObject-composing entity end to end is task-packets/E4-T01.yaml
  (ModelProfile/ModelInvocation/ModelAdapter port) — schemas/model-profile.schema.json,
  packages/contracts/mrr/contracts/model_profile.py, and its registration in
  scripts/check_contracts.py's `ENTITY_MODELS` dict are this task's direct template for
  schema shape, Pydantic mirroring, and contract-tier wiring (confirmed: eighteen
  entities currently registered there, `model-profile`/`model-invocation` among them;
  this task adds MethodProfile as a nineteenth, or later depending on merge order with
  the in-flight E6-T01/E6-T02 packets — see specification_gaps). The closest analog for
  the REGISTRY service itself (an application-layer service persisting a first-class
  object and exposing a read-side matching primitive over data the object repository
  cannot itself query by body field) is
  services/control_plane/mrr/services/capability_registry/service.py (E2-T02/E5-T02) —
  `CapabilityRegistry.register`/`find_nodes_with_capability`. The closest analog for the
  LIFECYCLE machinery is services/control_plane/mrr/services/research_score/service.py
  (E2-T01) — `ResearchScoreService.create`/`_transition` — and
  packages/domain/mrr/domain/lifecycles.py's four existing `StateMachine` instances
  (`RESEARCH_SCORE_LIFECYCLE`, `TASK_BUNDLE_LIFECYCLE`, `CLAIM_LIFECYCLE`,
  `CORRECTION_LIFECYCLE`), which this task extends with a fifth.
objective: >-
  Provide the `MethodProfile` object (docs/spec/08_RESEARCH_METHOD_KERNEL.md section 2):
  a versioned, baseObject-composing declaration every Research Method Profile MUST
  publish before its executor task family may run — `profile_key` plus a semantic
  version, the Claim types it can produce, the maximum claim ceiling it can ever
  license (the seven-level taxonomy in section 4, exact strings, weakest-to-strongest
  order preserved and exposed for later reuse), the protocol form that must be locked
  before confirmatory work, its executor task family (capability names the K0-T02
  dispatch layer routes to), which of its executor steps are deterministic and which
  are model-assisted (MRR-MTH-016), and its inappropriate uses. Plus the registry
  service that drives a MethodProfile through its draft -> accepted -> superseded
  lifecycle (section 3's table), storing every revision in the existing generic
  `objects` table (no migration), and exposing a read-side matching primitive ("which
  currently-accepted profiles declare this capability name") that the K0-T02 dispatch
  layer and later K1 tasks consume. This is Layer 1 groundwork only — it introduces no
  executor, no claim-ceiling enforcement, and no protocol lock/amendment machinery (all
  K1 concerns); it adds no new path around Research Score approval, Task Bundle
  negotiation, Run Manifests, or Evidence Crate sealing (MRR-MTH-020), since nothing in
  this task touches any of those objects or services at all.
