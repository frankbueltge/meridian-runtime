task_id: K0-T01
title: MethodProfile contract, schema, and registry service — the versioned declaration every Research Method Profile must publish before its executor task family may run
status: approved
derivation: >-
  Derived by a planning session (not yet reviewed) per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/08_RESEARCH_METHOD_KERNEL.md (status ACCEPTED, 2026-07-21)
  section 2 (the Method Profile interface: "Every Method Profile MUST declare, in a
  versioned `MethodProfile` object: `profile_key` and semantic version; the claim types
  it can produce and the maximum claim ceiling it can ever license; the protocol form
  that must be locked before its confirmatory work; its executor task family (capability
  names the dispatch layer routes to); its deterministic steps vs. model-assisted steps
  (per MRR-MTH-016); its inappropriate uses.") and section 3 ("Method-governance objects
  (Layer 1)" — the table listing `MethodProfile` with lifecycle "draft -> accepted ->
  superseded", and "Each one composes `common.schema.json#/$defs/baseObject` exactly like
  every existing MRR object ... A method object without the baseObject contract is
  invalid."), plus docs/design/2026-07-21-research-method-kernel-plan.md's K0 epic
  definition ("K0-T01 -- MethodProfile contract and registry. schemas/method-profile
  .schema.json composing baseObject; Pydantic contract; example; registry service storing
  accepted profiles in the generic objects table. No migration (generic object store
  suffices). Acceptance: schema round-trip; a profile without max-ceiling or
