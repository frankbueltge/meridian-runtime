task_id: K0-T02
title: Capability dispatch layer — select an Executor by TaskBundle.capability, fail closed on an unrouted capability, keep ReferenceTaskExecutor wired as the reference-capability default
status: draft
depends_on: [K0-T01]
derivation: >-
  Derived by a planning session (not yet reviewed) per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/08_RESEARCH_METHOD_KERNEL.md section 1 ("A Method Profile is
  an executor task family plus a rulebook, not a researcher. It plugs into the runtime's
  existing executor boundary (the `Executor` protocol and the capability-based dispatch
  layer, which this kernel introduces).") and section 8's tiering table ("Executor
  dispatch layer (capability -> executor) | bounded, already designed for | low"), plus
  docs/design/2026-07-21-research-method-kernel-plan.md's K0 epic definition
  ("K0-T02 -- Capability dispatch layer. The 'future dispatch layer' the executor module
  already names: select an Executor implementation by TaskBundle.capability, fail
  closed on unknown capability with a typed error, keep ReferenceTaskExecutor as the
  fallback for the existing reference capability. Acceptance: dispatch table driven by
  registered profiles; unknown capability produces policy_denied-style explicit
  failure, never a silent fallback; existing E2E-001 loop unchanged."). Second task of
  the K0 epic, depends_on [K0-T01] for the MethodProfile object this task's table-
  building step reads (`executor_task_family`) — K0-T01 exists only as an unreviewed
  sibling planning packet with no MethodProfile schema/contract/service yet in the
  repository at the time this one is derived, so this dependency is a real sequencing
  requirement, not a formality (see stop_conditions for how this task's OWN pieces that
  do not need MethodProfile may still proceed independently). The exact deferral this
  task implements is quoted verbatim from
  services/node_runtime/mrr/services/node_runtime/executor.py's `ReferenceTaskExecutor`
  docstring (lines 219-224, in its "What this executor actually runs" section):
  "Selecting WHICH `Executor` implementation should handle a given `TaskBundle` by its
  `capability` is a future dispatch layer's responsibility (e.g. the deferred
  OCI-executor adapter's own capability check), not this class's: a caller must itself
  only route genuinely reference-shaped bundles here." The one production caller that
  currently makes this selection by hardcoding, rather than dispatching, is
  services/control_plane/mrr/services/cli/orchestration.py's `run_local_evidence_loop`,
  at the line `resolved_executor: Executor = executor if executor is not None else
  ReferenceTaskExecutor()` (module line 546, step "5. Execute") — confirmed the only
  such line in that function; every other of its seven numbered steps is untouched by
  this task. `packages/contracts/mrr/contracts/task_bundle.py`'s `CapabilityRef` (a
  `{name, version}` pair, mirrored on every `TaskBundle.capability`) is the value this
  task dispatches on, by `name` only (matching MethodProfile's own `executor_task_family`
  shape, K0-T01 derived_decisions (f) — capability NAMES, not versioned refs).
objective: >-
  Provide the capability dispatch layer that
  services/node_runtime/mrr/services/node_runtime/executor.py's own `ReferenceTaskExecutor`
  docstring explicitly defers: a framework-free lookup from a capability name
  (`TaskBundle.capability.name`) to the `Executor` instance that should run it, built
  from (1) currently-accepted `MethodProfile`s' `executor_task_family` capability names
  (K0-T01) paired with caller-supplied `Executor` factories for those names, and (2) the
  existing reference capability, unchanged. An unrouted capability name fails closed
  with a distinct, typed `UnknownCapabilityError` — never a silent fallback to
  `ReferenceTaskExecutor` or to any other default. `run_local_evidence_loop`, which
  today hardcodes its default executor, is rewired to resolve it through this dispatch
  table instead of that one hardcoded line — for the existing reference-capability path
  (no `MethodProfile` yet accepted, no dispatch table argument supplied), this produces
  the byte-identical `ReferenceTaskExecutor` instance as before, so the existing
  single-node evidence loop
  (docs/spec/05_EVALUATION_AND_ACCEPTANCE.md's E2E-001,
  tests/e2e/test_e2e_001_single_node_evidence_loop.py) is a PINNED regression, not a
  rewrite.
