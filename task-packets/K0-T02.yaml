    "existing E2E-001 loop unchanged" is found to require any behavioral change beyond
    the single executor-selection line this task's derivation names — stop and report
    rather than widening the diff
  - >-
    a reviewer determines UnknownCapabilityError should instead be converted into a
    policy_denied ExecutionResult sealed through RunManifest/EvidenceCrate
    (specification_gaps) — stop rather than guessing which of the two designs is wanted
  - >-
    K0-T01's MethodProfile contract does not yet exist in the codebase when
    implementation begins — the CapabilityDispatchTable type, dispatch(),
    UnknownCapabilityError, and their unit tests (with an in-test fake profile-like
    object, or a second hardcoded capability name, standing in for a real
    MethodProfile) MAY proceed independently, but build_dispatch_table's signature and
    its own tests MUST NOT invent a placeholder MethodProfile shape diverging from
    K0-T01's actual contract — stop that portion and report the blocking dependency
    instead
  - >-
    implementation requires modifying the Executor protocol itself,
    ReferenceTaskExecutor's internals, MethodProfileService, packages/persistence/**,
    or either import-linter contract — confirmed unnecessary at planning time; report
    if that assumption turns out false
