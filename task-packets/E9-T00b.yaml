derived_decisions:
  - >-
    (a) TRUST RESOLVER COMMONALITY/DIFFERENCE MATRIX. Every one of the five
    resolvers has the identical five-parameter public signature shape -
    `resolve_trusted_<X>_key(obj, trusted_<Y>_practice_id, ring, *, at=None)
    -> Ed25519PublicKey` (parameter NAMES for the trusted-practice-id vary
    cosmetically - `trusted_practice_id` (manifest), `trusted_signer_
    practice_id` (task, transfer), `trusted_node_practice_id` (crate),
    `trusted_notifying_practice_id` (correction notification) - same
    semantic role every time: "the practice id the CALLER trusts as this
    object's signer," never derived or looked up by the function itself).
    All five objects carry their signature via the SAME shared Pydantic
    type, `mrr.contracts.common.Signature` (`signer_practice_id: Urn`,
    `key_id: str`, `algorithm: Literal["Ed25519"]`, `value: str`,
    `signed_at`) - confirmed by direct grep of all five contracts' own
    `signature: Signature` field declarations - so every resolver's
    condition logic operates on structurally identical data. IDENTICAL
    logic, line for line, confirmed by direct reading of all five files:
    condition (a) `obj.signature.signer_practice_id !=
    trusted_..._practice_id` raises a distinctly-NAMED-but-identically-
    SHAPED `<X>SignerMismatchError(claimed_signer_practice_id=...,
    trusted_practice_id=...)` (all five error classes share the EXACT
    constructor keyword signature, confirmed by direct reading of
    exceptions.py); condition (b) `ring.get(kid)` returning `None` raises
    the SAME, already-shared `UnknownKeyIdError(kid)` in all five (no
    per-object variant exists for this one condition - exceptions.py's own
    docstring explains why: "its name and fields are already generic...
    unlike ManifestSignerMismatchError/ManifestKeyNotValidError"); condition
    (c) `not ring.is_valid_at(evaluation_instant, kid)` raises a
    distinctly-named-but-identically-shaped `<X>KeyNotValidError(kid, at=
    evaluation_instant)` (again, all five share the exact constructor
    keyword shape); the final step - `decode_public_key(descriptor.
    encoded_public_key)` then `verify_object_signature(verifying_key,
    json.loads(obj.model_dump_json(exclude_none=True)), obj.signature.value,
    algorithm=obj.signature.algorithm)` - is IDENTICAL code in all five,
    differing only in which local variable name holds `obj`. WHY they
    differ at all: only two axes - (i) which typed error pair to raise
    (cosmetic, by design - AGENTS.md's prohibited-shortcuts list forbids
    collapsing distinct failure kinds into one generic type, so keeping
    five distinctly-named SignerMismatch/KeyNotValid pairs is a deliberate,
    KEPT design choice, not itself duplication to remove); (ii)
    manifest_trust's own extra, condition (d) - "the resolved descriptor's
    key is one of the manifest's own declared public_keys" - which has NO
    analog in the other four (confirmed: TaskBundle/EvidenceCrate/
    TransferContract/CorrectionNotification contracts have no `public_keys`
    field at all; only NodeManifest does, `Field(min_length=1)`) because
    only a NodeManifest is ITSELF the thing declaring which keys speak for
    a node - a genuine, spec-grounded semantic difference, not an
    oversight, and the ONE piece of resolver logic this packet does NOT
    unify away.
  - >-
    (b) TRUST RESOLVER TARGET SHAPE. New module
    `packages/domain/mrr/domain/trust_resolution.py` (packages/domain is
    where all five existing resolvers already live; no layering change)
    exposes two functions, both PUBLIC (mirroring this codebase's own
    existing precedent of `manifest_trust.practice_key_ring` being a public,
    cross-imported shared helper, not a leading-underscore private symbol):
    `resolve_trusted_signer_key(obj, trusted_practice_id, ring, *, at,
    signer_mismatch_error, key_not_valid_error) -> Ed25519PublicKey` -
    conditions (a)/(b)/(c) plus decoding the resolved descriptor's key,
    typed against a local `SignedObject` Protocol requiring only
    `.signature: Signature` and `.model_dump_json(*, exclude_none: bool =
    ...) -> str` (every one of the five Pydantic contracts already
    satisfies this structurally); `signer_mismatch_error`/`key_not_valid_
    error` are injected as the two typed-error CONSTRUCTORS the caller
    wants raised (typed via two small local Protocols matching each error
    family's own exact keyword shape - `def __call__(self, *,
    claimed_signer_practice_id: str, trusted_practice_id: str) ->
    DomainError` and `def __call__(self, kid: str, *, at: datetime) ->
    DomainError` respectively) - so the SAME core function raises
    `ManifestSignerMismatchError` for one caller and
    `TaskSignerMismatchError` for another without ever branching on object
    type internally. `verify_trusted_signature(obj, verifying_key) -> None`
    - the final decode-body-and-verify step, taking the ALREADY-resolved
    key so it can be called either immediately after
    `resolve_trusted_signer_key` (four of the five resolvers) or after an
    extra caller-side check runs first (manifest_trust). Each of the five
    existing files' PUBLIC function becomes exactly: call
    `resolve_trusted_signer_key` with its own two error classes bound;
    for manifest_trust ONLY, run the existing, UNCHANGED declared-
    public_keys loop (still raising the existing
    `ManifestKeyNotDeclaredError` - which has no shared analog and is not
    touched); call `verify_trusted_signature`; return the key. This is the
    "old file's diff reduces to delegation with site-specific parameters
    made explicit" shape the mission asked for - each of the five diffs is
    independently readable and independently revertible without touching
    the other four.
  - >-
    (c) WHY packages/domain, NOT packages/persistence OR a services layer,
    FOR trust_resolution.py. Both import-linter contracts in pyproject.toml
    apply to `mrr.domain` as a listed `source_module`: contract 1 (MRR-
    NFR-010) forbids `mrr.domain` importing fastapi/starlette/temporalio/
    openai/anthropic/boto3/botocore - trust_resolution.py imports only
    `cryptography`, `mrr.contracts.common.Signature`, `mrr.crypto.keys`,
    `mrr.domain.exceptions.DomainError`, `mrr.domain.hashing_policy.
    verify_object_signature`, `mrr.domain.key_management.KeyRing` - all
    already-permitted imports every existing resolver already makes, so
    contract 1 stays satisfied trivially. Contract 2 forbids `mrr.domain`
    importing `mrr.services` - trust_resolution.py imports nothing from
    services either. Placing it anywhere under `mrr.services` instead would
    be a straight regression (the five existing resolvers living in
    `mrr.domain` would then have to import FROM `mrr.services`, which
    contract 2 forbids outright) - packages/domain is not a choice among
    alternatives, it is the only layer both existing resolvers already
    occupy and both contracts already permit.
  - >-
    (d) UNIT-OF-WORK COMMONALITY. Stripped of docstrings, all 19
    `RecordRevisionWithEvent = Callable[[StoredObject, int | None,
    DomainEvent], tuple[StoredObject, AppendedEvent]]` lines and all 19
    `bind_unit_of_work(engine, object_repository, event_log)` function
    bodies are 100% code-identical (verified mechanically by this
    derivation: `awk` extraction per file, a small Python script stripping
    triple-quoted docstrings and blank lines, then comparing the 19
    normalized bodies - exactly one distinct body). There is no
    "commonality/difference matrix" to draw for this pattern the way there
    is for the trust resolvers - there is no difference at all in the code
    that runs; every one of the 19 copies exists purely because
    `packages/persistence/mrr/persistence/unit_of_work.py` already contains
    the ONE function (`record_object_revision_with_event`) every copy binds,
    and no earlier task's `allowed_paths` included that file (see
    derivation's E2-T01 root-cause finding) until this one's does.
  - >-
    (e) UNIT-OF-WORK TARGET SHAPE AND THE ZERO-TEST-EDIT RE-EXPORT. Add
    `RecordRevisionWithEvent` and `bind_unit_of_work` to
    `packages/persistence/mrr/persistence/unit_of_work.py` immediately
    after `record_object_revision_with_event` (before `record_event`),
    using EXACTLY the existing body (byte-identical to what all 19 copies
    already contain) - this file already imports every symbol both
    definitions need (`Callable`, `StoredObject`, `PostgresEventLog`,
    `PostgresObjectRepository`, `DomainEvent`, `AppendedEvent`, `Engine`),
    confirmed by direct reading, so this addition requires ZERO new
    imports in unit_of_work.py. Then, in each of the 19 service files,
    delete the local `RecordRevisionWithEvent = Callable[...]` line and the
    local `def bind_unit_of_work(...): ...` block, and replace the existing
    `from mrr.persistence.unit_of_work import record_object_revision_with_
    event` import (now otherwise-unused in every file where it was only
    ever referenced inside the deleted closure - confirmed to be the only
    use site in each of the 19 files) with `from mrr.persistence.
    unit_of_work import (RecordRevisionWithEvent as RecordRevisionWithEvent,
    bind_unit_of_work as bind_unit_of_work)`. The redundant `as X as X`
    form is not stylistic - `pyproject.toml`'s `[tool.mypy] strict = true`
    includes `no_implicit_reexport`, and NONE of the 19 files declares an
    `__all__` (confirmed by `grep -l "^__all__"` across all 19 - zero
    matches), so a bare `from ... import bind_unit_of_work` would make
    mypy --strict reject every cross-module `from mrr.services.<x>.service
    import bind_unit_of_work` in the 33 dependent test files and 3 CLI
    wiring modules as "module has no attribute." The explicit-reexport
    idiom is what makes those 33+3 call sites need ZERO edits - not merely
    an import-PATH update as the mission's own fallback language
    anticipated, but no edit at all, because `mrr.services.<x>.service.
    bind_unit_of_work` remains a real, resolvable attribute of that exact
    module either way. `RecordRevisionWithEvent` stays additionally
    referenced within each of the 19 files as a live type annotation (each
    service's own `__init__`/`self._record: RecordRevisionWithEvent`), so
    ruff's unused-import check has no bare "imported but never referenced"
    case to flag for that symbol regardless; `bind_unit_of_work` itself is
    typically referenced nowhere else inside its OWN defining file (only by
    external callers), which is exactly the case the `as X as X` idiom
    exists for.
  - >-
    (f) ORDERING PRESERVED EXACTLY. Every existing resolver's condition
    order is reproduced without reordering: (a) signer match, (b) unknown
    kid, (c) key not valid at instant, [manifest_trust only:] (d) key not
    among declared public_keys, then the final verify step - never
    reordered, never short-circuited differently, never evaluated
    speculatively out of order. The unit-of-work change reorders nothing
    at the call-site level either - `bind_unit_of_work(engine, object_
    repository, event_log)` still returns a callable with the exact same
    three-argument, unchanged call shape
    `record(obj, expected_current_revision, event)`, still ultimately
    calling `record_object_revision_with_event` inside one
    `engine.begin()` transaction, unchanged.
