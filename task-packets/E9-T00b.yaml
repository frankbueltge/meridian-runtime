  genuinely SHARED steps - conditions (a) signer-practice match, (b) unknown
  key id, (c) key-not-valid-at-instant, and the final decode-and-verify step
  - into one new module, `packages/domain/mrr/domain/trust_resolution.py`,
  and make each of the five existing `resolve_trusted_*_key` functions a
  thin wrapper that calls it with its own typed error classes made explicit
  as arguments; `manifest_trust`'s extra, genuinely UNIQUE condition (the
  declared-`public_keys` check) stays in `manifest_trust.py` itself,
  inserted between the shared key-resolution call and the shared
  verify-signature call, exactly where it already runs today. (2) add
  `RecordRevisionWithEvent`/`bind_unit_of_work` to `packages/persistence/
  mrr/persistence/unit_of_work.py` (the module that already defines the
  `record_object_revision_with_event` function they merely bind) and
  replace all 19 local definitions with a two-line explicit re-export
  (`from mrr.persistence.unit_of_work import RecordRevisionWithEvent as
  RecordRevisionWithEvent, bind_unit_of_work as bind_unit_of_work`), so
  every existing `from mrr.services.<x>.service import bind_unit_of_work`
  (33 test files, 2 CLI wiring modules, verified by direct grep) keeps
  resolving to the exact same callable shape, unchanged, with ZERO test or
