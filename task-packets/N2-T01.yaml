  - packages/contracts/**
  - migrations/**
  - pyproject.toml                                                   # no new dependency; hand-rolled
  - uv.lock
  - corpora/e2e-survey/**                                            # fixtures committed at derivation — read only, never regenerated
  - corpora/model-collapse/**
  - services/node_runtime/**
  - services/control_plane/mrr/services/export/**
  - services/control_plane/mrr/services/report/**
  - services/control_plane/mrr/services/release/**
  - services/control_plane/mrr/services/validation/**               # N1's service — not touched
  - packages/persistence/**                                         # T01 is DB-free and network-free
derived_decisions:
  - >-
    (a) Existence is not support. The audit verifies a reference resolves to a
    real registered work and is correctly titled; it does NOT verify the source
    carries the claim it is cited for (N2-T02) or that a number is consistent
    (N2-T03). The report header says so. This is the single most important
    honesty boundary of the packet — the N2 analogue of N1's reliability-not-
    validity.
  - >-
    (b) Network is separated from the audit. Resolving identifiers touches the
    open metadata APIs (arXiv, Crossref); that gated fetch was run once at
    derivation and committed as resolution-snapshot.json. The audit tool is
    deterministic and no-network — it reads the committed snapshot, matching the
    repo pattern (pipelines fetch, the runtime reads committed) and MRR's no-live-
    egress stance. Regenerating the snapshot reproducibly is N2-T02.
  - >-
    (c) Five distinct statuses, never collapsed. resolved / not_found /
    title_mismatch / unverifiable / malformed each mean something different
    (a fabricated citation, a misattributed one, a paywalled-metadata-only one,
    an ill-formed identifier); collapsing them into pass/fail is the exact AGENTS
    prohibited shortcut. "unverifiable" in particular is never counted as either
    a pass or a fail.
  - >-
    (d) Hand-rolled, no dependency. Identifier-pattern checks and title
    comparison are short; the repo prefers hand-written domain logic, and this
    keeps the dependency and security-check surface unchanged (as N1-T01 did).
  - >-
    (e) Report is a projection, not a persisted object. Pydantic-validated
    (rule 6) but never entering the object store (rule 7). A persisted, schema-
    mirrored audit object is deferred to N2-T02.
  - >-
    (f) The real snapshot is the oracle. All eight e2e-survey citations resolved
    at derivation (7 arXiv + 1 Crossref DOI); the acceptance test asserts the
    tool reproduces that (8 resolved, 0 not_found, 0 title_mismatch) over the
    committed fixture. The tool's problem-catching (not_found/title_mismatch/
    malformed) is proven on SYNTHETIC unit fixtures, since the real data is clean.
invariants:
  - No network connection and no database connection are opened anywhere in the runtime path.
  - Nothing is written except the requested --output file (atomic os.replace); the archive is never touched.
  - No wall-clock timestamp in any rendered byte; identical inputs yield a byte-identical report and a stable content hash.
  - The five statuses are always reported distinctly; "unverifiable" is never counted as resolved or not_found.
  - The report always carries the snapshot sha256 and the existence-not-support header; neither can be absent.
  - A manifest citation with no matching resolution is a typed refusal, never a silent not_found.
acceptance_tests:
  - >-
    AT1: over the committed corpora/e2e-survey fixture, the report reports all
    eight citations `resolved`, zero not_found, zero title_mismatch, zero
    malformed; asserted by count and by per-citation status.
  - >-
    AT2: the report header carries verifies_existence_not_support=True with the
    note that a resolved citation is not evidence of support; support (N2-T02) and
    number-consistency (N2-T03) are named as out of scope.
  - >-
    AT3: the snapshot sha256 printed in the report equals the actual sha256 of
    resolution-snapshot.json; changing the snapshot changes the reported hash.
  - >-
    AT4: synthetic unit oracles hit every status — a made-up arxiv id with
    resolved=false -> not_found; a real id with a differing claimed_title ->
    title_mismatch; a metadata-only flag -> unverifiable; an ill-formed identifier
    -> malformed (classified before the snapshot is consulted); a manifest entry
    with no resolution -> MissingResolutionError.
  - >-
    AT5: determinism and refusals — two renders of the same inputs are
    byte-identical; a missing/unparseable manifest or snapshot exits 2; a manifest
    citation absent from the snapshot exits 3 naming the citation_id; existing
    suites pass unmodified.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make security-check
specification_gaps:
  - >-
    Support-checking — does the resolved source actually carry the claim it is
    cited for — is NOT done here (existence is not support). It is N2-T02, and it
    is LLM/human-touching (the hard part); it feeds Routine 2.
  - >-
    A gated fetch script that regenerates resolution-snapshot.json reproducibly
    (network, pipeline-style), plus extending the audit to the ~47 research-record
    citations and the model-collapse SourceRecords and their internal linkage
    integrity (every EvidenceAnchor -> a real SourceRecord; no cite-without-anchor),
    is N2-T02.
  - >-
    Number-consistency checking (is a figure attributed to a source consistent
    with it) is N2-T03. A persisted, schema-mirrored audit object is also deferred.
required_output:
  - Packet report per AGENTS "Required delivery format", embedding the exact
    `mrr audit citations` invocation, the rendered Markdown report for the
    e2e-survey fixture verbatim (the eight-row table, the summary counts, and the
    existence-not-support header), and the snapshot sha256.
stop_conditions:
  - >-
    If reproducing the 8/8-resolved result requires editing or re-fetching the
    committed fixtures, STOP — the snapshot is the oracle and must not be
    regenerated in this packet (AGENTS rule 3 / R3).
  - >-
    If any make tier requires collapsing two of the five statuses, or reporting
    "unverifiable" as a pass or a fail, to go green, STOP — the never-collapse
    contract may not be softened.
  - >-
    If the audit would need a network or database connection to be useful on this
    target, STOP — that is N2-T02, not this packet.
