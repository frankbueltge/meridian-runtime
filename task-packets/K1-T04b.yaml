title: >-
  Second real run — the model-collapse question under a corroboration-floor
  sensitivity variation. The first real-corpus exercise of the MRR-MTH-018
  execution capability PR #57 (K1-T03b) merged: a new, honestly-named
  ConceptCharterEntry (`corroboration-floor-v1`) raises the eligibility floor
  a supporting/contradicting side needs to count as adequately corroborated
  — `eligibility_rules.contested.min_independent_source_families`, run 1's
  own value 1, raised to 2 (matching the floor `eligibility_rules.supported`
  already uses) — over the SAME pinned atlas corpus and the SAME base
  protocol-parameters run 1 already used, changing nothing about what
  "instantiate" or "reference" or "model-collapse mechanism" MEAN. This is
  explicitly NOT a second, rival operationalization of the mechanism (no
  `model-collapse-mechanism-v2`); it is a threshold variation over
  already-accepted eligibility machinery, reported honestly whichever way it
  comes out. Run 1's own sealed schema (`mrr_k1t04_real_run_v2`) and its own
  eight committed files under `corpora/model-collapse/` are untouched; this
  is a genuinely second, additional real run, in its own fresh Postgres
  schema, under its own new proposal files
  (`corpora/model-collapse/run2-corroboration-floor/`). The channel-
  governance / S42-seeded candidate operationalization
  (`irrtum-als-methode/REQUESTS.md`, commit `1e1ef1f`, offer (2)) is
  explicitly excluded from this run's own scope — it stays contingent on
  Ulysses' own response to that same-day encounter offer, on Ulysses' own
  schedule, not this run's.
