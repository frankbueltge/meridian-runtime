  Numeric trace of the base run's own real classification outcome, verified
  directly against the committed `corpora/model-collapse/corpus-entries
  .json` (parsed fresh at this derivation, not assumed from
  `task-packets/K1-T04.yaml`'s own prose alone): 18 total rows — 3 rows
  under `applies_to_analysis: "model-collapse-mechanism-theory-
  confirmation"`, all `evidence_relation: "supports"`, all
  `verification_status: "verified"`; 15 rows under
  `"instantiation-vs-reference-classification"` — exactly 1
  `"supports"` (`works-hammond-v3-model-collapse`, verified) and 14
  `"contradicts"` (13 verified, 1 `"pending"` —
  `works-ubermorgen-next-biennial-machine`). Every one of these 18 rows
  carries `source_family_id: null` (confirmed by direct field scan), so
  `mrr.domain.source_independence.family_key` (read in full) falls every
  row back to its own `source_record_id`-derived singleton — each VERIFIED
  row is its own independent family; the one `pending` row contributes to
  NEITHER side's family count at all (`distinct_independent_source_family_
  count`'s own "only verified rows count" rule, unchanged, not touched by
  this packet). `corpora/model-collapse/protocol-parameters.sidecar.json`
  (run 1's own base sidecar, read fresh, sha256 recorded below) sets
  `eligibility_rules.supported.min_independent_source_families = 2`,
  `eligibility_rules.contested.min_independent_source_families = 1`,
  `kill_conditions.stop_insufficient_evidence.min_included_sources = 3`.
  Tracing `_classify_analysis` (`synthesis_executor.py` lines 685-766, read
  in full) by hand against these numbers: theory-confirmation —
  `supporting_family_count = 3`, `contradicting_family_count = 0`;
  `3 >= supported_threshold(2)` and `0 < contested_threshold(1)` both hold
  -> **`supported`** (matches `task-packets/K1-T04.yaml`'s own reported
  outcome, "Theorie-Positivkontrolle `supported`-track," session-handoff
  section 1). Instantiation-vs-reference — `supporting_family_count = 1`
  (Hammond alone), `contradicting_family_count = 13` (14 contradicting rows
  minus the one `pending` row, which never counts);
  `1 >= supported_threshold(2)`? No. `1 >= contested_threshold(1)` AND
  `13 >= contested_threshold(1)`? Both yes -> **`contested`** (matches
  `task-packets/K1-T04.yaml`'s own reported outcome, "Werk-Analyse endet
  `contested`"). This packet's own raised-floor sidecar
  (derived_decisions (c)) sets `eligibility_rules.contested.
  min_independent_source_families = 2` (RAISED from 1), holding
  `eligibility_rules.supported` at 2 (UNCHANGED) and every other field
  (`inclusion_filter`, `kill_conditions`) byte-identical to the base
  sidecar — isolating exactly ONE variable. Re-tracing
  `_classify_analysis` under this ONE change: theory-confirmation is
  UNAFFECTED (`0 < contested_threshold` holds for ANY positive threshold,
  since `contradicting_family_count = 0` regardless) -> still `supported`.
  Instantiation-vs-reference: `1 >= supported_threshold(2)`? No.
  `1 >= contested_threshold_new(2)`? No (fails on the FIRST operand of the
  `and`, short-circuiting before `contradicting_family_count` is even
  examined) -> falls to the `else` branch, **`unsupported`**. This is this
  packet's own PRIOR EXPECTATION, derived by hand-tracing the unchanged,
  already-merged algorithm against real numbers — it is NOT hardcoded as a
  required test outcome anywhere in this packet (see stop_conditions/
  required_output: the actual run must report whatever the code, run for
  real, actually produces).

