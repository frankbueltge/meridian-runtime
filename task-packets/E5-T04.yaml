task_id: E5-T04
title: Trust-anchored task negotiation — resolve a TaskBundle's signer key via the counterparty practice's KeyRing (both directions), fail closed
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E5 (E5-T04
  "task negotiation and modification flow"), docs/spec/01_SYSTEM_SPEC.md
  MRR-FR-022 (the target node makes the authoritative accept/modify/defer/reject
  decision), MRR-FR-023 (a modified task is a new SIGNED revision the origin
  must explicitly accept before execution), MRR-FR-024 (a refusal is preserved
  as a research event with a reason category), and MRR-FR-030/031 (a
  cross-practice TaskBundle is content-hashed and signed by the origin practice),
  docs/spec/04_SECURITY_AND_POLICY.md section 8.1/8.4 (trust per practice; new
  objects rejected after key revocation). E2-T03 already built the LOCAL
  negotiation state machine — NodeTaskDecisionService.accept/defer/reject/
  propose_modification and TaskBundleService.accept_modification, with the
  modification correctly minted as a new SIGNED content revision (MRR-FR-023) and
  refusals as events (MRR-FR-024) — but every decision method verifies the
  bundle's signature against a CALLER-SUPPLIED bare verifying_key, with no
  resolution of the bundle's own claimed signer practice / key id against a
  trusted key set. That is the exact trust-anchoring gap E5-T02 closed for
  NodeManifest, unaddressed here. It is also the payload-signature validation the
  E5-T03 note calls for (an envelope's payload_content_hash is a consistency
  check only; the payload's OWN signature must be verified by the payload flow —
  this task). E5-T04 closes it for TaskBundle, additively, reusing E5-T01's
  Practice/KeyRing/kid and the ADR-0004 exclude_none signature form.
objective: >
  Provide the trust-anchored verification the task negotiation was missing, at
  the OBJECT layer, CI-testable, framework-free: (1) a resolver
  resolve_trusted_task_key(bundle, trusted_signer_practice_id, ring, *, at) ->
  Ed25519PublicKey that returns the counterparty's trusted verifying key ONLY
  when ALL hold, each a DISTINCT typed error, fail closed: the bundle's
  signature.signer_practice_id == trusted_signer_practice_id, its signature.key_id
  resolves to a descriptor in ``ring``, that descriptor is
  KeyRing.is_valid_at(at) (active AND in window — so a revoked/rotated/expired/
  unknown key fails closed even if the raw signature is valid), and
  verify_object_signature (unchanged) passes over the exact ADR-0004 exclude_none
  form under the resolved key. It is SYMMETRIC: a receiving NODE calls it with the
  ORIGIN practice's id + ring to authenticate a received task; an ORIGIN calls it
  with the NODE practice's id + ring to authenticate a node-proposed modification
  (the new signed revision, MRR-FR-023). It performs NO manifest-specific
  "public_keys" check (E5-T02 condition d does not apply to a bundle). (2) A thin
  trust-anchored wiring so the negotiation is authenticated against TRUSTED keys
  rather than a bare caller-supplied key: an entry point that resolves the trusted
  key and then delegates to the EXISTING E2-T03 decision transitions
  (accept/defer/reject/propose_modification / accept_modification) unchanged —
  the resolved key becomes the verifying_key those methods already take. The
  E2-T03 decision transitions, their authority checks (MRR-FR-022), and the
  modification-as-signed-revision behavior (MRR-FR-023) are reused verbatim.
