forbidden_changes:
  - the E2-T03 decision TRANSITIONS themselves (accept/defer/reject/
    propose_modification/accept_modification), their OFFERED-authority checks
    (MRR-FR-022), the TaskBundle lifecycle/state machine, and the
    modification-as-new-signed-revision behavior (MRR-FR-023, ADR-0007) — E5-T04
    is ADDITIVE trust anchoring in FRONT of these; it does not alter how a
    decision is recorded once a trusted key is in hand
  - the crypto sign/verify/hash primitives, hashing_policy / prepare_for_* policy,
    mrr.crypto.keys, and the TaskBundle / Signature / Practice contracts (reuse
    unchanged); the E5-T02 manifest_trust and E5-T03 envelope_validation modules
    are NOT refactored here (a future DRY of the three near-identical signer-key
    resolvers is out of scope — keep this additive and low-risk)
  - any real network / mTLS / transport (E5-T03 is done; a task may arrive in an
    E5-T03 NodeMessageEnvelope, but building transport is not this task)
  - the result CONTENT flow (EvidenceCrate result) — E5-T05 — offline bundles —
    E5-T06 — and a durable processed-id/replay store or revocation-sweep over
    already-accepted tasks — E5-T07 (resolve validity AT the evaluation instant
    only)
  - any new DB model, migration, repository, or new persisted state beyond what
    the reused E2-T03 methods already write; both import-linter contracts MUST
    stay KEPT (the resolver is framework-free domain code, no provider/web import)
derived_decisions: >
  The resolver mirrors mrr.domain.manifest_trust.resolve_trusted_manifest_key and
  mrr.domain.envelope_validation exactly — same "resolve the signer's trusted key,
  fail closed with a distinct typed error per condition" discipline — applied to a
  TaskBundle, with NO condition-(d) analog (a bundle carries no public_keys list).
  It reuses mrr.domain.manifest_trust.practice_key_ring to build the ring from a
  Practice and verify_object_signature over json.loads(bundle.model_dump_json(
  exclude_none=True)); it decodes the RESOLVED descriptor's key (not any key the
  bundle itself claims) so a substituted key cannot be accepted. New task-specific
  typed errors (TaskSignerMismatchError, TaskKeyNotValidError) live in
  mrr.domain.exceptions; UnknownKeyIdError and the crypto Signature errors are
  reused verbatim. The thin wiring resolves the trusted key and passes it as the
  verifying_key the existing NodeTaskDecisionService methods already accept — so
  every persistence/event/authority guarantee E2-T03 provides is reused, not
  reimplemented; on a resolution failure nothing is decided or written and the
  typed error propagates (a future service may map it to a coarse refusal reason
  exactly as CapabilityRegistry.receive does for manifests — mirror that only if
  it fits within allowed_paths without touching E2-T03 transitions). Symmetry is
  by parameter: the caller passes whichever practice+ring it trusts for THIS
  message (origin for a received task, node for a received modification), so one
  resolver authenticates both legs of the MRR-FR-022/023 round trip.
invariants:
  - a TaskBundle decision is authorized ONLY when the bundle's signature resolves,
    via the trusted counterparty practice's KeyRing, to a key that is valid at the
    evaluation instant AND under which the signature verifies over the exclude_none
    form; a revoked/rotated/expired/unknown-kid or signer-mismatched bundle is
    rejected even if the raw Ed25519 signature is cryptographically valid
  - verification is against the key resolved from the RING, never a key taken from
    the bundle itself; a substituted signing key cannot be accepted
  - the distinct failure reasons (signer-mismatch / unknown-kid / key-not-valid /
    bad-signature) are DISTINCT typed errors, never collapsed into one generic
    failure; on any failure nothing is decided and no state is written
  - >-
    the resolver is symmetric: the same function authenticates an origin-signed
    task (trust the origin practice) and a node-signed modification (trust the node
    practice), per MRR-FR-023's round trip
  - E2-T03's decision transitions, authority checks (MRR-FR-022), refusal events
    (MRR-FR-024), and modification-as-signed-revision (MRR-FR-023) are UNCHANGED
    and still green; both import-linter contracts stay KEPT; no network/new store
acceptance_tests:
  - >-
    happy path, node side: an origin practice signs a TaskBundle with an active
    in-window key; the node resolves the trusted key via the origin practice's
    ring and a decision (accept) proceeds using that resolved key
  - >-
    happy path, origin side (MRR-FR-023): a node proposes a modification as a new
    signed revision; the origin resolves the trusted key via the NODE practice's
    ring and accept_modification proceeds using that resolved key
  - >-
    fail-closed matrix, each a distinct typed error, nothing decided/written:
    signer_practice_id != the trusted practice; kid does not resolve in the ring;
    resolved key revoked / rotated / expired / not-yet-valid at the instant; and a
    tampered bundle whose signature no longer verifies
  - a bundle signed by a key valid at signing but REVOKED in the counterparty ring
    by the evaluation instant is rejected (docs/spec/04 section 8.4), while the
    revoked descriptor stays resolvable in the ring
  - >-
    verification uses the ring's key: a bundle signed by an attacker key but
    claiming a trusted kid fails closed (SignatureVerificationError)
  - all existing E2-T03 task_bundle suites stay green; both import-linter contracts
    remain KEPT and the resolver imports no provider SDK / opens no network
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
required_output:
  - implementation summary
  - the resolver's accept rule + typed failure family, its symmetry (both
    negotiation directions), and the thin wiring that feeds the resolved key to
    the existing E2-T03 decision methods
  - changed files and any additive domain errors
  - tests added and exact command results (format, lint, typecheck, test,
    test-contract) proving green, plus CI for integration/e2e
  - security/privacy implications (trust anchoring beyond crypto for tasks,
    fail-closed matrix, verification against the ring's key, revocation respected
    at the instant, no network/new store)
  - open specification questions and what is deferred (result flow E5-T05, offline
    E5-T06, durable replay/revocation E5-T07; the future DRY of the three
    signer-key resolvers)
stop_conditions:
  - trust-anchored task authorization cannot be expressed without changing an
    E2-T03 decision transition or the TaskBundle lifecycle (report the conflict)
  - the resolver cannot verify against the ring's key without touching the crypto
    primitives, hashing_policy, or an existing contract
  - honoring "reject after revocation" (section 8.4) would force building the
    durable revocation-sweep store (E5-T07) — keep the at-instant check and stop
