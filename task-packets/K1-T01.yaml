task_id: K1-T01
title: >-
  Kernel governance contracts — QuestionModel, ConceptCharter, MethodProtocol
  (with lock/amendment lifecycle), EvidenceMatrix, MethodRuling, and
  ResearchDecision: baseObject-composed schemas, Pydantic contracts,
  lifecycle state machines, examples, and contract tests. No service, no
  persistence, no migration, no edges.
status: approved
reviewer_resolution: >-
  Approved 2026-07-21 with the following resolutions of the flagged gaps:
  (1) The MethodProtocol lifecycle question is resolved by a spec-08
  amendment in the same commit — amended -> reviewed is a drawn edge (the
  re-review cycle), so an amendment is re-reviewable and re-lockable and
  repeated amendments are possible without a self-transition; each lock
  binds its own revision's content hash, keeping earlier-lock work
  auditable. Implement the machine with that edge. (2) Lock hash IS the
  locked revision's baseObject.content_hash (ADR-0004) plus
  locked_by/locked_at — confirmed. (3) MTH-017 scope/non-applicability
  lives on MethodRuling for now; whether Claim needs its own copy is
  K1-T02's question — confirmed. (4) The proposed
  EvidenceMatrixVerificationStatus vocabulary is accepted as a local,
  versioned vocabulary. (5) issued_by stays distinct from created_by (the
  accountable decider may differ from the writer) — confirmed.
derivation: >-
  Derived by a planning session (not yet reviewed) per
  docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from
  docs/design/2026-07-21-research-method-kernel-plan.md's K1 epic definition
  (`K1-T01 — Kernel governance contracts. QuestionModel, ConceptCharter,
  MethodProtocol (with lock/amendment lifecycle), EvidenceMatrix,
  MethodRuling, ResearchDecision: schemas (baseObject-composed), Pydantic
  contracts, lifecycle state machines, examples, contract tests. Lock
  semantics per MTH-007/008 ... No migration.`, lines 37-42) and
  docs/spec/08_RESEARCH_METHOD_KERNEL.md (status ACCEPTED, 2026-07-21)
  section 3's object table (lines 40-55: the six kinds and their exact
  lifecycles — QuestionModel/ConceptCharter draft -> accepted -> superseded;
  MethodProtocol draft -> reviewed -> locked -> amended | executed;
  EvidenceMatrix draft -> active -> frozen -> superseded; MethodRuling
  pending -> issued -> superseded; ResearchDecision issued, append-only) and
  section 4's normative requirements (lines 76-140). This packet implements
  the CONTRACT SHAPES only — no registry/service, no persistence wiring, no
  migration, no edges — mirroring exactly how task-packets/K0-T01.yaml (the
  immediately preceding K-epic task, merged via PR #44, `b6ffdaa`) scoped
  itself to schema+contract+lifecycle for MethodProfile alone, and how
  task-packets/E1-T03.yaml demonstrated this repository's own precedent for
  bundling several baseObject-composed schemas, Pydantic models, and a
  cross-validation harness into ONE task packet rather than one packet per
  entity (`E1-T03`: six schemas — research-score, node-manifest, task-bundle,
  claim, evidence-crate, correction-event — in one packet, `commands: make
  test-contract`).

  Ground-truth check at derivation time (2026-07-21, main at `d49cb7d`):
  `scripts/check_contracts.py`'s `ENTITY_MODELS` dict (lines 88-110) carries
  exactly twenty-one entities today, the twenty-first being `method-profile`
  per that module's own docstring (lines 1-14: "extended to a twenty-first
  entity, MethodProfile, by K0-T01"). Two further entities are planned but
  NOT yet implemented in code, confirmed by direct search (no
  `CorrectionNotification`/`CorrectionResponse` string anywhere under
  `packages/`): task-packets/E6-T03.yaml (`CorrectionNotification`, status
  `approved` — governance-approved per commit `cdb9fc1`, "Governance: E6-T03
  approved", but that commit approves the DESIGN, not a merged
  implementation; no `schemas/correction-notification.schema.json`,
  no `packages/contracts/mrr/contracts/correction_notification.py` exist),
  and task-packets/E6-T04.yaml (`CorrectionResponse`, status `draft`, also
  unimplemented). Neither is assumed complete or in-flight by this packet;
  see specification_gaps for the resulting ordinal-numbering caveat on this
  packet's own six entities.

  MethodProfile's own contract module
  (packages/contracts/mrr/contracts/method_profile.py) is this task's direct
  structural template: `ClaimCeiling`/`CLAIM_CEILING_ORDER` (lines 124-151,
  reused verbatim here, not redeclared, for `MethodRuling.ruled_ceiling`),
  the "every declared field required unconditionally" discipline (module
  docstring's "Every declared field is required unconditionally" section,
  lines 84-104, and task-packets/K0-T01.yaml derived_decisions (h)), and the
  UNSIGNED/revision-based (not event-only, not ADR-0004-signed)
  classification for every Layer-1 method object (task-packets/K0-T01.yaml
  derived_decisions (a)) all carry over unchanged to these six new entities.
  `packages/domain/mrr/domain/lifecycles.py`'s existing seven `StateMachine`
  constants (lines 174-580, most recently `METHOD_PROFILE_LIFECYCLE` at
  lines 541-580) are the direct template for the six new machines this task
  adds, including that module's own established discipline of declaring
  ONLY transitions literally drawn in the owning specification text and
  flagging everything else as an open question (module docstring's "Open
  specification questions" section, lines 36-96) rather than inventing a
  plausible-but-undrawn edge — this discipline is load-bearing for
  MethodProtocol's own lock/amendment shape below (see derived_decisions).
  `packages/contracts/mrr/contracts/common.py`'s `Scope` model (lines
  102-114, mirroring `schemas/common.schema.json#/$defs/scope`, lines 59-68)
  is reused verbatim for QuestionModel's "population/scope/time" and
  MethodRuling's "scope of validity" (MTH-017) rather than inventing a
  parallel shape. `packages/domain/mrr/domain/hashing_policy.py`'s
  `compute_content_hash` (lines 80-85, composing `mrr.crypto.canonical` per
  ADR-0004) is cited, not touched, as the exact mechanism that already
  produces "the exact content hash" MTH-007 requires a lock to bind —
  see derived_decisions for why this task adds no new hashing function.
objective: >-
  Provide the six Layer-1 method-governance object kinds
  (docs/spec/08_RESEARCH_METHOD_KERNEL.md section 3) as baseObject-composed
  JSON Schemas, mirroring Pydantic v2 contracts, one example each, one
  `StateMachine` lifecycle definition each in
  packages/domain/mrr/domain/lifecycles.py, and contract-tier tests
  (positive round-trip via scripts/check_contracts.py's `ENTITY_MODELS`,
  per-entity variant tests, negative fixtures, unit and property tests
  against the six new lifecycle machines). This is CONTRACT-SHAPE work
  only: no `MethodProtocolService`-style registry or persistence-service is
  introduced (no new `services/**` path is touched at all), no Alembic
  migration is added (the generic `objects` table's un-CHECKed
  `kind` column already accepts any string, exactly as
  task-packets/K0-T01.yaml confirmed for `MethodProfile`), no new
  `EDGE_VOCABULARY` member or edge-type CHECK-constraint migration is added
  (the four new edge types spec 08 section 3 names —
  `operationalizes`/`governed_by_protocol`/`ruled_by`/`decided_by` — are
  explicitly task-packets/K1-T02.yaml's own scope per
  docs/design/2026-07-21-research-method-kernel-plan.md lines 43-49), no
  domain event is emitted anywhere (MRR-MTH-019's "profile activation,
  protocol lock, ruling issuance, kill triggers, and research decisions MUST
  each emit a domain event" requires a service to call from — none exists
  in this packet's scope, so MTH-019 is explicitly NOT claimed as satisfied
  here), and no claim-ceiling ENFORCEMENT is added (MRR-MTH-004/005/006's
  `CLAIM_CEILING_EXCEEDED` gate against a real `Claim` is
  task-packets/K1-T02.yaml's job; this task only imports and reuses the
  already-declared `ClaimCeiling`/`CLAIM_CEILING_ORDER` vocabulary for
  `MethodRuling.ruled_ceiling`).

  MethodProtocol's lock/amendment shape (MRR-MTH-007/008) is this packet's
  heaviest and most novel piece — described fully in derived_decisions and
  scoped crisply: this packet defines the SCHEMA-LEVEL co-occurrence
  invariants (locked status requires `locked_at`/`locked_by`; amended status
  requires a non-null `amendment` block) and the STATE-MACHINE shape (which
  transitions are legal), both testable today with no service; it does NOT
  implement the actual persistence-level tamper-proofing of an
  already-locked revision's stored bytes, which is an existing, unchanged,
  generic guarantee of `mrr.domain.repositories.ObjectRepository`'s
  append-only `insert_revision` (already exercised by
  tests/unit/domain/test_repositories.py and
  tests/integration/persistence/test_postgres_repositories.py for ANY
  object kind, not extended or duplicated by this packet).
