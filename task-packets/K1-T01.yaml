    each basis with exactly its own matching field populated is accepted
  - >-
    ResearchDecision — `decision_type: "stop_insufficient_evidence"`
    validates with the identical required-field set as every other
    `decision_type` value (no special-cased field)
  - ResearchDecision — an unrecognized `decision_type` string is rejected; `status` accepts only `"issued"`
  - >-
    lifecycle unit tests (extending tests/unit/domain/test_lifecycles.py's
    existing `_ALL_MACHINES`-parametrized suite with all six new machines,
    no new test bodies required beyond extending the tuples/dicts already
    parametrized there, mirroring how `METHOD_PROFILE_LIFECYCLE`'s own
