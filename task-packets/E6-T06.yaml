specification_gaps:
  - >-
    `CorrectionEvent`'s `DELIVERY_PENDING` state still has no drawn
    outgoing edge anywhere in docs/spec/01_SYSTEM_SPEC.md section 6.4 or
    `packages/domain/mrr/domain/lifecycles.py` (already flagged by that
    module's own docstring and again by task-packets/E6-T03.yaml). This
    task tracks and resolves per-recipient delivery outcomes WITHOUT ever
    transitioning the owning `CorrectionEvent`'s own status out of
    `DELIVERY_PENDING` — so a correction whose every recipient is fully
    resolved (delivered or exhausted) remains permanently at
    `DELIVERY_PENDING` at the aggregate level under this implementation.
    Whether and how a correction should ever leave that state is left to a
    future ADR or spec amendment, not resolved here.
  - >-
    docs/spec/03_API_AND_EVENTS.md section 4.2 lists "optional
    acknowledgement request" among the store-and-forward envelope's
    fields, but `schemas/node-message-envelope.schema.json` and
    `mrr.contracts.node_message_envelope.NodeMessageEnvelope` have no such
    field (confirmed absent from both `properties` and `required`) — there
    is no in-repo mechanism for a recipient to acknowledge receipt of an
    offline-delivered bundle back to the sender. Marking an OFFLINE retry
    `delivered` is therefore necessarily a caller-supplied signal with no
    automatic source in this codebase; only the ONLINE
    `EnvelopeTransport.send` path has a synchronous `"delivered"` outcome
    available without one. Whether a future task should add that
    acknowledgement field is flagged, not decided, here.
  - >-
    whether an `exhausted` per-recipient record should cause the sending
    practice to mint an entirely NEW `CorrectionNotification` (a fresh
    E6-T03 `notify_affected_practices` call with a new `notification_id`
    and a new `expires_at`) is unspecified — no `CORRECTION_LIFECYCLE` edge
    loops back from `DELIVERY_PENDING` to `NOTIFYING` either, so this is
    left an open workflow question for whoever schedules retries, not
    resolved unilaterally by this task.
  - >-
    docs/spec/02_DOMAIN_MODEL.md section 2.16 lists "delivery and recipient
    responses" among `CorrectionEvent`'s own narrative fields, but the
    schema never gained them (already flagged by task-packets/
    E6-T03.yaml). This task's own decision to keep the pending-delivery
    record as internal, non-schema state (derived_decisions (a)) is a
    second, independent data point toward — not a resolution of — that same
    open gap; a reviewer may eventually want a projection surfacing
    aggregate per-correction delivery status on
    `GET /v1/corrections/{id}` (docs/spec/03_API_AND_EVENTS.md section
    3.9), which would be a NEW, later, additive schema/API concern, not
    this task's.
  - >-
    docs/spec/03_API_AND_EVENTS.md section 5.2's required-events
    enumeration has no dedicated name for a retried or exhausted delivery
    outcome. This task reuses the already-enumerated
    `correction.notification_sent` event with extended `delivery_status`
    payload values (`"delivered"`, `"exhausted"`) rather than inventing new
    event type strings — mirroring task-packets/E6-T03.yaml's own identical
    stance on the receiving side's missing `correction.notification_received`
    name. Flagged in case a reviewer prefers dedicated event names added to
    section 5.2 in a future amendment.
  - >-
    the concrete retry backoff curve and `max_attempts` policy value are
    not fixed by this task, mirroring task-packets/E5-T07.yaml's own
    identical deferral of "the concrete retention grace as a policy value"
    — left to a caller/deployment policy choice, not a specification
    requirement this task can derive.
  - >-
    long-term storage growth of terminally-resolved (`delivered`/
    `exhausted`) pending-delivery records is not addressed — unlike
    `processed_ids_table`, this task deliberately provides no prune method
    (derived_decisions (c), since the record IS the durable audit fact
    MRR-FR-094 requires), leaving any future retention/archival policy for
    resolved records to a later, separate concern.
