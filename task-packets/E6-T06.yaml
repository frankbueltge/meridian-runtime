derived_decisions: >
  (a) The per-recipient pending-delivery record is INTERNAL NODE STATE — a
  new Postgres table plus a `PostgresDeliveryPendingStore` repository under
  `packages/persistence` — NOT a first-class, schema-validated MRR domain
  object. It gets no `schemas/*.schema.json`, no `mrr.contracts` model, no
  `examples/*.example.json`, and no `scripts/check_contracts.py` entry. This
  mirrors task-packets/E5-T07.yaml's own `processed_ids_table`/
  `PostgresProcessedIdStore` precedent exactly, and that packet's own
  forbidden_changes states the reasoning this task adopts verbatim: "a
  processed-id row is INTERNAL node state, not a cross-practice object, so
  it gets NO schema/contract/example". Three further, independent reasons
  confirm the same reading for THIS record: first, `schemas/
  correction-event.schema.json` deliberately never gained the "delivery and
  recipient responses" field docs/spec/02_DOMAIN_MODEL.md section 2.16
  narratively lists (confirmed absent from that schema's `properties` and
  `required`; task-packets/E6-T03.yaml already flagged this same gap and
  chose not to close it) — a second, independent packet reaching the same
  "keep it out of the schema" conclusion is corroborating, not merely
  repeating. Second, the record never itself crosses a practice trust
  boundary — only the already-signed `CorrectionNotification`/
  `NodeMessageEnvelope`/`OfflineBundle` it tracks delivery attempts for do,
  and those are already first-class, already signed, already schema-backed
  objects; the tracking record is purely this SENDING node's own
  bookkeeping about ITS OWN delivery attempts, exactly the same category as
  a processed-id row's own "did I already see this" bookkeeping. Third,
  AGENTS.md's own source-of-truth discipline ("Database state is
  authoritative for current materialized state") already names the
  mechanism for exactly this kind of fact without requiring a schema:
  materialized DB state, queried directly, is sufficient authority on its
  own.

  (b) The record's own `pending`/`delivered`/`exhausted` status is tracked
  by a NEW, narrow three-state machine, built by IMPORTING (not extending)
  the existing generic `mrr.domain.lifecycles.StateMachine` dataclass and
  reusing `mrr.domain.exceptions.InvalidTransitionError` verbatim — zero new
  exception classes are needed for the transition check itself (a
  `PendingDeliveryNotFoundError` is still new, for the "no such record"
  case, mirroring `ObjectNotFoundError`'s own precedent). This machine is
  declared in the NEW `mrr.domain.delivery_retry` module, never added as a
  fifth member alongside `RESEARCH_SCORE_LIFECYCLE`/`TASK_BUNDLE_LIFECYCLE`/
  `CLAIM_LIFECYCLE`/`CORRECTION_LIFECYCLE` inside `lifecycles.py` itself —
  that module's own docstring scopes itself explicitly to "the four MRR
  lifecycles defined in docs/spec/01_SYSTEM_SPEC.md section 6", and a
  per-recipient delivery-tracking record is an internal bookkeeping
  concept this task invents, not a fifth object with its own section-6
  diagram. Keeping `lifecycles.py` completely untouched (forbidden_changes,
  above) while still reusing its fail-closed transition discipline is the
  point of this split.

  (c) The record's `status` transitions only `pending -> delivered` and
  `pending -> exhausted`; both are terminal (no edge leads anywhere from
  either). There is no `delivered -> exhausted` or `exhausted -> delivered`
  path, and no delete/prune method — unlike `processed_ids_table`'s own
  "append-then-prune-only" discipline, this record is never pruned, because
  the record itself IS the durable audit fact MRR-FR-094 requires, not a
  transient replay cache; deleting a resolved record would defeat the
  requirement it exists to satisfy. Long-term storage growth of resolved
  records is left an open operational question (specification_gaps), not
  solved by inventing a retention sweep here.

  (d) Retry exhaustion is triggered by whichever comes first: a
  caller-supplied `max_attempts` policy value, or the evaluation instant
  reaching the wrapped notification's own `expires_at`. The latter is not a
  policy choice but a correctness observation, mirroring
  `processed_id_retention_horizon`'s own "anchored on the object's own
  expiry, not an independent policy number" reasoning applied in the
  opposite temporal direction: retrying an envelope whose own validity
  window has already closed is provably futile, because the recipient's
  OWN, unchanged `validate_inbound_envelope` would reject it as expired
  (`EnvelopeNotWithinValidityWindowError`) regardless of how many further
  attempts are made or which channel carries them. The concrete
  `max_attempts` value and the retry backoff curve between attempts are
  policy choices this task does not fix, mirroring task-packets/
  E5-T07.yaml's own identical deferral of "the concrete retention grace as
  a policy value".

  (e) Every retry attempt — whether a further `EnvelopeTransport.send` call
  or a fresh `OfflineBundle` export — reuses the IDENTICAL already-signed
  `NodeMessageEnvelope` object from the FIRST attempt; it is never re-signed
  or re-minted with a new `message_id`/`sent_at`/`expires_at`. A new
  `OfflineBundle` built for a later retry therefore has its OWN new
  `bundle_id`/`bundle_nonce` (so it is not itself mistaken for a bundle
  replay) while carrying the SAME unchanged envelope inside it (so the
  recipient's own per-`message_id` replay defense — E5-T03's
  `validate_inbound_envelope` backed by E5-T07's durable
  `PostgresProcessedIdStore` — correctly treats a genuinely-received-but-
  unacknowledged prior delivery as an idempotent duplicate rather than
  double processing it, without this task inventing any new deduplication
  logic of its own).

  (f) This task NEVER transitions `CorrectionEvent.status`/
  `CORRECTION_LIFECYCLE` out of `DELIVERY_PENDING`, even once EVERY
  per-recipient pending-delivery record this task tracks for that
  correction has resolved to `delivered` or `exhausted`. No edge is drawn
  out of `DELIVERY_PENDING` anywhere in docs/spec/01_SYSTEM_SPEC.md section
  6.4 or `packages/domain/mrr/domain/lifecycles.py`'s own
  `_CORRECTION_TRANSITIONS`, and per this task's own governing instruction
  ("flag undrawn lifecycle edges as specification_gaps rather than
  inventing"), no such edge is added. A `CorrectionEvent` therefore remains,
  at the aggregate level, permanently at `DELIVERY_PENDING` under this
  task's implementation even once delivery is fully resolved per recipient
  — flagged in specification_gaps as an open question for a future ADR or
  spec amendment, exactly the same posture task-packets/E6-T03.yaml already
  took toward the identical dead end.

  (g) Every recorded delivery outcome (opened, retried, delivered,
  exhausted) is emitted as a `correction.notification_sent` domain event —
  the only correction-delivery event name docs/spec/03_API_AND_EVENTS.md
  section 5.2 actually enumerates — carrying `attempt_number`,
  `delivery_status` (extending task-packets/E6-T03.yaml's own
  `"sent"`/`"pending"` payload values with `"delivered"` and `"exhausted"`),
  and `channel` (`"online"` or `"offline_bundle"`) in its payload, rather
  than inventing a brand-new event type string absent from that
  enumeration. This mirrors task-packets/E6-T03.yaml's own identical stance
  toward the receiving side's missing `correction.notification_received`
  name — flagged, not resolved unilaterally, in specification_gaps.
invariants:
  - >-
    a pending-delivery record is never silently dropped: once
    `open_pending_delivery` creates it, its ONLY possible next states are
    `delivered` or `exhausted`, both terminal and both requiring an
    explicit call recording a reason/outcome; there is no code path that
    lets a record simply disappear, expire un-recorded, or revert to an
    earlier state.
  - >-
    delivery exhaustion is an explicit recorded outcome, never a silent
    give-up: `mark_exhausted` requires a non-empty reason, always appends a
    `correction.notification_sent` domain event with
    `delivery_status = "exhausted"`, and is only reachable via the narrow
    `pending -> exhausted` edge — attempting to mark an already-`delivered`
    or already-`exhausted` record raises `InvalidTransitionError` rather
    than silently overwriting it.
  - >-
    composition with the E5-T06 offline bundle export is REUSE, not
    reimplementation: this task's offline retry path calls
    `mrr.domain.offline_bundle.build_outbox_bundle` with the SAME
    already-signed `NodeMessageEnvelope` unchanged, and the resulting
    `OfflineBundle` round-trips through the SAME unmodified
    `validate_inbound_bundle` exactly as any other bundle would — proving
    the retry channel is a genuine composition of two independently-built,
    independently-tested modules, not a parallel reimplementation of
    either.
  - >-
    a retry is never scheduled, and a record is never left `pending`, past
    the wrapped notification's own `expires_at`; `next_retry_at` is always
    either `<=` that instant or absent (once exhausted), and
    `is_retry_exhausted` is unconditionally true at/after it regardless of
    `attempt_count`.
  - >-
    `CorrectionEvent.status` is never transitioned by this task; no code
    path calls `CORRECTION_LIFECYCLE.assert_transition` with
    `DELIVERY_PENDING` as the source state, and `lifecycles.py` itself is
    byte-for-byte unchanged (see the dedicated regression test under
    acceptance_tests).
  - >-
    the pending-delivery record's own body carries no raw restricted or
    participant-identifiable data — only ids (`correction_id`,
    `notification_id`, `recipient_node_id`), timestamps, attempt counts,
    and a coarse status/reason string, mirroring `CorrectionNotification`'s
    own no-raw-data shape (MRR-NFR-006) one layer further in.
  - >-
    every state-changing call (`open_pending_delivery`,
    `record_retry_attempt`, `mark_exhausted`, and the online/offline retry
    dispatch methods on `CorrectionImpactService`) appends a domain event
    with full MRR-NFR-001 provenance (actor, occurred_at, policy_version,
    causation_id, correlation_id, object_id, object_revision) or, for the
    persistence-layer-only methods with no `CorrectionImpactService` call
    site yet available, is documented as requiring one once the
    service-layer wiring lands.
  - >-
    both import-linter contracts stay KEPT; the new
    `mrr.domain.delivery_retry` module and the new persistence table/
    repository import no provider SDK, no network library, and open no
    real connection.
acceptance_tests:
  - >-
    unit (no Postgres) — `next_retry_at` never returns an instant strictly
    after the wrapped notification's own `expires_at`, and is monotonically
    non-decreasing across successive calls with an increasing
    `attempt_count` for a fixed backoff policy.
  - >-
    unit (no Postgres) — `is_retry_exhausted` is `True` once
    `attempt_count >= max_attempts`, independently `True` once the
    evaluation instant is at/after `expires_at` even with `attempt_count`
    still below `max_attempts`, and `False` when neither condition holds.
  - >-
    property test — for arbitrary non-negative `attempt_count` sequences
    and arbitrary `expires_at`/`max_attempts` pairs, `is_retry_exhausted`
    is monotonic (once true for a given state, it stays true for any later
    evaluation instant or higher attempt_count) and `next_retry_at` is
    always `<= expires_at` whenever it is not `None`.
  - >-
    unit (no Postgres) — the new narrow delivery-record state machine
    accepts exactly `pending -> delivered` and `pending -> exhausted`;
    every other pair (`delivered -> pending`, `exhausted -> delivered`,
    `delivered -> exhausted`, any self-transition) raises
    `InvalidTransitionError` via the reused, unmodified
    `StateMachine.assert_transition`.
  - >-
    regression (no Postgres) — `CORRECTION_LIFECYCLE.transitions` and
    `CORRECTION_LIFECYCLE.states` are asserted byte-identical to their
    value before this task (a frozen-set equality check against a literal
    tuple mirroring the module's own current declaration), guarding against
    an accidental new edge out of `DELIVERY_PENDING` ever being introduced
    by this task or a future merge conflict.
  - >-
    integration (Postgres) — `open_pending_delivery` creates exactly one
    row for a `(recipient_node_id, notification_id)` pair with
    `status = "pending"` and `attempt_count = 1`; calling it again for the
    SAME pair is idempotent (no duplicate row, no error).
  - >-
    integration (Postgres) — `record_retry_attempt` reporting `"pending"`
    increments `attempt_count`, updates `last_attempted_at` and
    `next_retry_at`, and leaves `status = "pending"`; reporting
    `"delivered"` transitions the row to `status = "delivered"`,
    sets `resolved_at`, and clears `next_retry_at`.
  - >-
    integration (Postgres) — a retry attempt evaluated at/after the
    record's own `notification_expires_at`, or once `attempt_count` reaches
    the caller's `max_attempts`, transitions the row to
    `status = "exhausted"` with a non-null `exhausted_reason` and
    `resolved_at`, and this holds regardless of ordering between the two
    triggers.
  - >-
    adversarial (Postgres) — calling `record_retry_attempt` or
    `mark_exhausted` against an already-`delivered` or already-`exhausted`
    row raises `InvalidTransitionError` and leaves the row completely
    unchanged (no partial update, no silent reopening of a terminal
    record).
  - >-
    integration (Postgres) — the retry-due query returns exactly the rows
    with `status = "pending" AND next_retry_at <= now`, excluding
    `delivered`/`exhausted` rows and `pending` rows not yet due.
  - >-
    composition (no Postgres) — a recipient's failed-delivery
    `NodeMessageEnvelope` is wrapped, via the UNCHANGED
    `build_outbox_bundle`, into a single-entry `OfflineBundle` as a retry
    attempt; the SAME envelope object (identical `message_id` and content
    hash) is carried, proving no re-signing or re-minting occurred, and the
    resulting bundle passes the UNCHANGED `validate_inbound_bundle` exactly
    as any independently-built bundle would.
  - >-
    idempotent-redelivery demonstration (no Postgres) — the SAME
    already-signed envelope, fed twice through the UNCHANGED
    `validate_inbound_envelope` with a durable `already_processed`
    predicate backed by `PostgresProcessedIdStore` (E5-T07), is accepted
    once and rejected the second time with `EnvelopeAlreadyProcessedError`
    — demonstrating that this task's "retry with the identical envelope"
    design is safe against a genuinely-received-but-unacknowledged prior
    delivery without this task building any deduplication logic of its
    own.
  - >-
    all existing suites stay green; both import-linter contracts remain
    KEPT; no schema, contract, or example file changes anywhere in the
    diff (grep-checked in CI as part of this task's own verification, since
    derived_decisions (a) depends on this staying true).
