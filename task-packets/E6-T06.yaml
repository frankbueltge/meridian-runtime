task_id: E6-T06
title: Offline recipient delivery tracking — a durable, per-recipient pending-delivery record for a correction notification that could not be delivered online, with retry scheduling anchored to the notification's own expiry, explicit exhaustion, and composition with the existing E5-T06 OfflineBundle export as the retry's offline channel
status: draft
depends_on: [E6-T03]
derivation: >
  Derived by a planning session (not yet reviewed) per
  docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from
  docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E6 (E6-T06 "offline
  recipient delivery tracking" — sixth and last of six E6 tasks: T01
  TransferContract lifecycle, T02 caveat/obligation propagation, T03
  cross-practice correction notification, T04 local accept/adapt/reject/defer
  response TO A CORRECTION, T05 public unresolved-correction projection, T06
  THIS task), docs/spec/01_SYSTEM_SPEC.md section 4.10 line 209 (MRR-FR-094:
  "Every affected practice MUST receive a signed notification or a durable
  pending-delivery record" — the "durable pending-delivery record" half is
  this task's whole subject) and section 6.4 / packages/domain/mrr/domain/
  lifecycles.py lines 349-395 (the CORRECTION_LIFECYCLE state diagram and its
  already-declared states/transitions), docs/spec/02_DOMAIN_MODEL.md section
  2.16 (CorrectionEvent, whose narrative field list at line 381 names
  "delivery and recipient responses" — a field the schema never gained,
  already flagged by task-packets/E6-T03.yaml), docs/spec/03_API_AND_EVENTS.md
  section 4.2 (store-and-forward envelope fields) and section 5.2 (the
  required-events enumeration), docs/spec/04_SECURITY_AND_POLICY.md section
  4.1 (offline-bundle encryption, unchanged here), section 8.2 (replay and
  tampering: "Processed envelope IDs are retained for replay detection
  according to policy"), and section 8.4 (federated offline import/export
  MUST verify signatures, expiry, replay protection, and object hashes), and
  MRR-NFR-001/002/005/006/007.

  At derivation time task-packets/E6-T03.yaml (this task's own declared
  dependency) exists only as an unreviewed draft — confirmed by direct
  search: no packages/contracts/mrr/contracts/correction_notification.py, no
  packages/domain/mrr/domain/correction_notification.py, no
  `notify_affected_practices`/`receive_correction_notification` method
  anywhere under services/control_plane/mrr/services/correction/service.py
  exists yet in the repository. E6-T03's own forbidden_changes (lines
  220-225) explicitly deferred exactly this task's scope: "durable offline
  delivery tracking, retry, or acknowledgement over a DELIVERY_PENDING
  recipient (E6-T06); this task performs one synchronous online delivery
  ATTEMPT per recipient via the abstract EnvelopeTransport port and records
  the outcome — it does not build or call
  `mrr.domain.offline_bundle.build_outbox_bundle`, does not enqueue anything,
  and does not retry." This packet is that deferred scope. Its own
  `depends_on: [E6-T03]` is a real sequencing dependency for the
  service-layer wiring only (see stop_conditions and specification_gaps) —
  the pure domain/persistence pieces below carry no CorrectionNotification
  import and can be built and tested independently of whether E6-T03 has
  landed.

  Two OTHER cited dependencies are, unlike E6-T03, already fully merged on
  `main` (verified via `git log`/`git show`, not merely referenced): (1)
  task-packets/E5-T06.yaml ("offline inbox/outbox bundles", status approved)
  — `packages/contracts/mrr/contracts/offline_bundle.py` and
  `packages/domain/mrr/domain/offline_bundle.py` (`build_outbox_bundle`,
  `validate_inbound_bundle`) exist in the tree exactly as described in that
  packet, and are the EXISTING offline transport this task composes with per
  its own framing — it builds no new one. (2) task-packets/E5-T07.yaml
  ("durable federated replay/idempotency store", status approved, merged as
  commit e3a9713 "E5-T07: durable federated replay/idempotency store ...
  (#40)") — `packages/persistence/mrr/persistence/tables.py` lines 141-186
  (`processed_ids_table`) and `packages/persistence/mrr/persistence/
  repositories.py` line 529 onward (`PostgresProcessedIdStore`) exist on
  `main` now (the current Alembic head is `983751ff8bb6`, that packet's own
  migration — confirmed by the `down_revision` chain across every file under
  `migrations/versions/`). E5-T07's own forbidden_changes (line 98) states
  plainly: "a processed-id row is INTERNAL node state, not a cross-practice
  object, so it gets NO schema/contract/example and NO
  scripts/check_contracts.py entry." That precedent is the direct model this
  task's own record-shape decision follows — see derived_decisions (a).
objective: >
  Provide the durable, per-recipient tracking layer MRR-FR-094's
  "pending-delivery record" half requires once a correction notification's
  synchronous online delivery attempt has already failed (the moment
  task-packets/E6-T03.yaml's `notify_affected_practices` chains
  CORRECTION_LIFECYCLE through the already-drawn AWAITING_RESPONSES ->
  DELIVERY_PENDING edge for that recipient) — retry scheduling, explicit
  exhaustion, and eventual resolution, composed with the EXISTING,
  unmodified E5-T06 OfflineBundle export as one legitimate retry channel,
  never a new transport of its own: (1) a pure domain module
  (`mrr.domain.delivery_retry`, mirroring `mrr.domain.replay_retention`'s
  own "one pure decision function, unit-testable without Postgres" shape)
  defining a narrow three-state machine — `pending`, `delivered`,
  `exhausted` — built by IMPORTING the EXISTING generic `StateMachine`
  dataclass and reusing `InvalidTransitionError` verbatim from
  `mrr.domain.lifecycles`, never by adding a state or edge to that module's
  own four spec-drawn machines (see derived_decisions (b) on why this keeps
  `lifecycles.py` itself completely untouched); a pure `next_retry_at`
  scheduling function anchored so it can never schedule a retry past the
  wrapped notification's own `expires_at` (mirrors
  `processed_id_retention_horizon`'s own "anchored on the object's own
  expiry" reasoning, applied in the opposite temporal direction); and a pure
  `is_retry_exhausted` predicate that is true once EITHER a caller-supplied
  `max_attempts` is reached OR the evaluation instant is at/after that same
  `expires_at` — whichever comes first, since retrying past that instant is
  provably futile (the recipient's own, unchanged
  `validate_inbound_envelope` would reject the envelope as expired
  regardless of how many delivery attempts preceded it). (2) A NEW Postgres
  table (a migration chaining onto the current head `983751ff8bb6`) and a
  `PostgresDeliveryPendingStore` repository (packages/persistence) keyed by
  `(recipient_node_id, notification_id)` — mirroring `processed_ids_table`'s
  own `(recipient_node_id, id)` primary-key shape exactly, substituting the
  correction notification's own stable `notification_id`
  (task-packets/E6-T03.yaml derived_decisions (b): a notification's own id,
  independent of whichever envelope/bundle most recently wrapped it, is
  exactly the stable key multiple retry attempts across different
  envelopes/bundles must share) — exposing: opening a pending record the
  FIRST time a recipient's synchronous attempt reports "failed"; recording a
  further retry attempt's outcome (incrementing `attempt_count`,
  recomputing `next_retry_at`, or transitioning to `delivered`/`exhausted`
  via the new narrow state machine, fail closed against an already-terminal
  row); reading one record; and querying the records currently due for
  retry (`status = 'pending' AND next_retry_at <= now`) — a plain query this
  task exposes as a callable, building no scheduler, cron, or queue of its
  own (mirrors task-packets/E5-T07.yaml's own identical `prune_expired`
  stance: "who schedules it is out of scope"). (3) Additive methods on the
  EXISTING `CorrectionImpactService`
  (services/control_plane/mrr/services/correction/service.py) that open a
  pending record when a recipient's delivery attempt fails, retry a due
  record by EITHER another synchronous `EnvelopeTransport.send` call OR
  wrapping the SAME already-signed `NodeMessageEnvelope` (never re-signed,
  never re-minted) into a FRESH single-entry `OfflineBundle` via the
  UNCHANGED `build_outbox_bundle` — proving the online and offline retry
  channels compose without modifying either — and resolve a record once a
  caller-supplied "delivered" signal arrives or once
  `is_retry_exhausted` becomes true, always appending a
  `correction.notification_sent` domain event (the only correction-delivery
  event name docs/spec/03_API_AND_EVENTS.md section 5.2 actually enumerates)
  recording the outcome, never silently. This task does NOT drive
  `CorrectionEvent.status`/`CORRECTION_LIFECYCLE` out of `DELIVERY_PENDING`
  for any reason (see derived_decisions (e) and specification_gaps — no
  edge is drawn out of that state anywhere in section 6.4 or
  `lifecycles.py`, and inventing one is exactly what this task must not do).
