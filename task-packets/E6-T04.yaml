task_id: E6-T04
title: Local accept/adapt/reject/defer response to a correction notification — a new receiving-practice-only CorrectionResponse record with mandatory reason for reject/defer and a `corrects` edge for adapt, never mutating the sender's CorrectionEvent
status: approved
depends_on: [E6-T03]
derivation: >
  Derived by a planning session (not yet reviewed) per
  docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from
  docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E6 (E6-T04 "local
  accept/adapt/reject/defer response" — fourth of six E6 tasks: T01
  TransferContract lifecycle, T02 caveat/obligation propagation, T03
  cross-practice correction notification, T05 public unresolved-correction
  projection, T06 offline recipient delivery tracking),
  docs/spec/01_SYSTEM_SPEC.md section 4.9 (MRR-FR-084: "A receiving practice
  MAY reject a correction, but MUST record that it was notified and why it
  rejected or deferred it") and section 6.4 (the Correction state-machine
  diagram: OPEN -> IMPACT_ANALYSIS -> NOTIFYING -> AWAITING_RESPONSES ->
  RESOLVED, with PARTIALLY_RESOLVED, REJECTED_BY_RECIPIENT, and
  DELIVERY_PENDING all also hanging off AWAITING_RESPONSES, per
  packages/domain/mrr/domain/lifecycles.py's own verified column-reading of
  that diagram), and task-packets/E6-T03.yaml (status draft, not yet
  implemented in code — confirmed: no schemas/correction-notification.
  schema.json, no packages/contracts/mrr/contracts/correction_notification.py,
  no `resolve_trusted_correction_notification_key`/
  `notify_affected_practices`/`receive_correction_notification` anywhere in
  the tree at the time this packet was derived), whose own forbidden_changes
  explicitly assigns both response halves of MRR-FR-084 to this task ("the
  recipient's own accept/adapt/reject/defer DECISION and the 'why it
  rejected or deferred it' reason recording ... E6-T04") and whose own
  receiving-side method, `receive_correction_notification`, deliberately
  stops short of any disposition ("never deciding accept/adapt/reject/defer
  (E6-T04)"). task-packets/E6-T01.yaml's own specification_gaps item
  (recorded there specifically "to make explicit that T01 does NOT claim
  MRR-FR-084 as satisfied") independently draws the identical four-verb/
  five-verb distinction this task now implements: MRR-FR-081's transfer-side
  vocabulary is accepted/adapted/rejected/deferred/unresolved (section 4.9,
  line 193); this task's correction-side vocabulary, named verbatim in the
  implementation plan's own task title, is accept/adapt/reject/defer — no
  "unresolved" analogue, because (see derived_decisions) a correction
  response is a one-time local recording act, not a five-way transfer
  negotiation outcome. services/control_plane/mrr/services/correction/
  service.py (E3-T06, unmodified elsewhere in this packet) is the closest
  existing template: its own module docstring already anticipates this
  exact gap twice — once for CorrectionEvent's own status ("its own fate
  runs through the CorrectionEvent's own separate resolution workflow ...
  and eventually CORRECTION_LIFECYCLE's own NOTIFYING/AWAITING_RESPONSES
  states — E6, out of this task's scope") and once by literally never
  touching `status` beyond OPEN anywhere in that module. That doctrine is
  inherited here too: this task never drives CORRECTION_LIFECYCLE past
  whatever E6-T03 already reaches on the sending side, and never even
  attempts to reach RESOLVED/PARTIALLY_RESOLVED/REJECTED_BY_RECIPIENT,
  because — a load-bearing architectural fact confirmed directly against
  E6-T03's own text — the receiving practice never stores a local copy of
  the sender's CorrectionEvent at all ("never creating, storing, or
  mutating any copy of the remote CorrectionEvent"). Those three states are
  therefore states of an object this practice does not hold; recording a
  LOCAL response cannot be the same act as advancing that remote object's
  own lifecycle. See derived_decisions and specification_gaps for how this
  task resolves that tension (a new, receiving-side-only CorrectionResponse
  entity) and for the resulting epic-level gap this leaves open.
objective: >
  Provide the receiving practice's own local recording of exactly one
  disposition — accept, adapt, reject, or defer — per received
  CorrectionNotification (E6-T03), satisfying MRR-FR-084's "MUST record
  that it was notified and why it rejected or deferred it" without ever
  mutating the sending practice's CorrectionEvent, its CORRECTION_LIFECYCLE
  status, or any object E6-T03 already wrote. Concretely: (1) a new
  `CorrectionResponse` schema/contract/example entity (framework-free at the
  domain layer, CI-testable via scripts/check_contracts.py's ENTITY_MODELS,
  the same wiring every prior entity uses) — a receiving-practice-local,
  UNSIGNED, single-revision record (never signed, never transported
  cross-practice, never revised again after creation) carrying the
  responding practice's own `practice_id` (BaseObject), the addressed
  notification's own `correction_notification_id`, `notifying_practice_id`,
  `origin_correction_event_id`, `origin_correction_event_revision`, and
  `notified_object_ids` (all copied scalar fields from the CorrectionNotification
  the caller already validated via E6-T03's `receive_correction_notification`
  — never a nested $ref to that contract, so this entity's own schema/
  contract/example can be implemented independently of E6-T03 landing in
  code first), a `decision` of exactly one of accept/adapt/reject/defer, a
  `reason` that is REQUIRED (non-null, non-empty) exactly when `decision` is
  reject or defer and otherwise optional, and an `adaptations` list (each
  entry pairing one already-existing local `adapted_object_id` with the
  `notified_object_id` it addresses) that is REQUIRED (non-empty) exactly
  when `decision` is adapt and otherwise empty. (2) A new `record_response`
  method added to the EXISTING `CorrectionImpactService`
  (services/control_plane/mrr/services/correction/service.py, E3-T06/
  E6-T03's own class, additive method only) that mints and persists the
  CorrectionResponse at revision 1, verifies every `adaptations[].
  adapted_object_id` already exists locally (`ObjectRepository.get_latest`,
  `ObjectNotFoundError` if absent, aborting the whole call with nothing
  persisted), records one `corrects` edge per adaptation entry
  (source=adapted_object_id, target=notified_object_id — the
  declared-but-unused-since-E3-T06 `corrects` edge type, per
  EDGE_VOCABULARY), and appends the section-5.2-enumerated
  `correction.response_recorded` domain event with full MRR-NFR-001
  provenance — object revision, edges, and event all written atomically in
  ONE new local unit-of-work helper (mirroring `mrr.services.claim.service.
  bind_edge_unit_of_work`'s exact atomic pattern, generalized from one edge
  to zero-or-more). A caller-supplied `already_responded` predicate (keyed
  by `correction_notification_id`, mirroring E6-T03's own
  `already_processed_notification`) is checked first and rejects a
  duplicate response with a distinct typed error before anything is
  written. No signature is verified here — `record_response` trusts its
  caller to have already run E6-T03's own trust checks; no new trust
  resolver, envelope, or transport is added.
