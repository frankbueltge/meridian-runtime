derived_decisions: >
  (a) CorrectionResponse is a new, receiving-practice-only, UNSIGNED,
  single-revision entity — not a signed cross-practice value object like
  CorrectionNotification/TransferContract, and not a lifecycle-bearing
  aggregate with its own StateMachine like CorrectionEvent/Claim.
  docs/spec/02_DOMAIN_MODEL.md's own narrative gives CorrectionEvent a
  "delivery and recipient responses" field (section 2.16) that
  schemas/correction-event.schema.json never implemented (confirmed absent
  from its required/properties list; already flagged by E6-T03's own
  specification_gaps), but attaching the response THERE is impossible for
  this task's own receiving-practice side: E6-T03's own invariant is that
  the receiving practice never stores any copy of the remote CorrectionEvent
  at all. CorrectionResponse is therefore this task's own, structurally new
  answer to "where does the recipient's decision live" — a standalone
  BaseObject-shaped entity (the 22nd schema/contract/example entity,
  assuming TransferContract/Obligation/CorrectionNotification land first as
  the 19th/20th/21st per their own packets' ordinal claims;
  scripts/check_contracts.py's ENTITY_MODELS dict is keyed by name, not
  merge order, so any landing sequence is safe for that file), recorded once
  and never revised again — no new lifecycles.py StateMachine is declared,
  mirroring the "no section-6 diagram exists for this entity" gap E6-T01/
  E6-T02 already flag for TransferContract/Obligation, here without even a
  domain-model narrative field list to anchor a shape against.
  (b) The four-verb vocabulary — accept/adapt/reject/defer — is read from
  docs/spec/06_IMPLEMENTATION_PLAN.md's own task title (line 195, "E6-T04
  local accept/adapt/reject/defer response"), by direct analogy to
  MRR-FR-081's five-way transfer vocabulary (accepted/adapted/rejected/
  deferred/unresolved) minus "unresolved" — a correction response, unlike a
  transfer negotiation, is a one-time local recording act with no further
  "still pending" outcome to name (the response IS the record; there is no
  separate open/pending correction-response state to occupy). MRR-FR-084's
  own literal text mandates recording the notified-and-why fact only for
  reject/defer ("MAY reject a correction, but MUST record that it was
  notified and why it rejected or deferred it"); recording accept/adapt as
  equally first-class outcomes is this task's own reading of the
  implementation plan's task title, not a second literal FR mandate —
  flagged in specification_gaps.
  (c) `reason` is REQUIRED (non-null, minLength 1) exactly when `decision`
  is reject or defer (MRR-FR-084's own literal text), enforced at TWO
  layers exactly like Claim's own "if status == supported" precedent
  (schemas/claim.schema.json, packages/contracts/mrr/contracts/claim.py's
  `model_validator`): a JSON Schema conditional (decision in reject/defer
  implies reason required with minLength 1) plus a mirroring Pydantic
  `model_validator(mode="after")`. The OTHER direction — `reason` must be
  null/absent for accept — is Pydantic-only in this task's design, not
  schema-enforced, the same kind of implementer-latitude split flagged as
  its own specification_gaps item.
  (d) `adaptations` is REQUIRED (non-empty) exactly when `decision` is
  adapt, by the identical two-layer conditional-plus-model_validator
  pattern; each entry pairs a caller-supplied, ALREADY-EXISTING local
  `adapted_object_id` (verified via `ObjectRepository.get_latest`,
  `ObjectNotFoundError` if absent — mirroring E6-T01's own identical
  adapted-decision verification) with the `notified_object_id` it
  addresses, and every `adaptations[].notified_object_id` must be a member
  of the response's own `notified_object_ids` (Pydantic-enforced
  referential consistency; not independently re-derivable from the JSON
  Schema alone). Each pair records one `corrects` edge (source=
  adapted_object_id, target=notified_object_id) — the section-3 edge
  vocabulary's own `corrects` type, declared but left entirely unused since
  E3-T06 (confirmed by E6-T01's own derived_decisions (e): "exactly as
  `corrects` was left declared-but-unused after E3-T06"). This is the
  closest available edge semantically ("A corrects B") to what an adapt
  response to a CORRECTION is doing, and is a considered analogy to
  MRR-FR-082's TRANSFER-side "Adaptation MUST create a new local object and
  preserve the relation to the source object" — not a literal instruction,
  since MRR-FR-082's own text is scoped to transfers (E6-T01), not
  corrections. `adapted_from` (E6-T01's own claimed edge type for TRANSFER
  adaptation) is deliberately NOT reused here, to keep the two adaptation
  concepts — adapting a TRANSFERRED object versus adapting in RESPONSE TO A
  CORRECTION — distinguishable in the graph. Flagged for reviewer
  confirmation in specification_gaps.
  (e) The object revision, N `corrects` edges, and the one
  `correction.response_recorded` event are written in ONE new local
  unit-of-work helper inside services/control_plane/mrr/services/
  correction/service.py — not `mrr.persistence.unit_of_work.
  record_object_revision_with_event`, which composes only an object write
  with ONE event, and not `mrr.services.claim.service.
  bind_edge_unit_of_work`, which composes only ONE edge with ONE event — a
  locally-authored generalization from one edge to zero-or-more, opening a
  single `engine.begin()` transaction and inserting the object revision,
  every `corrects` edge row, and the event, sharing one Connection, exactly
  mirroring task-packets/E6-T02.yaml's own identical need ("one
  subject_to_obligation edge per bound object written atomically with an
  obligation.created event via a local bind_edge_unit_of_work — same
  atomic-edge-plus-event pattern"). An aborted write (e.g. a missing
  adapted_object_id, discovered before the transaction opens) leaves none of
  the three persisted.
  (f) Idempotency is caller-supplied, not internally tracked. A
  caller-supplied `already_responded` predicate, keyed by
  `correction_notification_id`, is checked BEFORE any write; if it reports
  the notification already responded to, `record_response` raises a
  distinct typed error (`CorrectionResponseAlreadyRecordedError`) and
  persists nothing — mirroring E5-T03's `already_processed`/E6-T03's
  `already_processed_notification` identical caller-supplied-predicate
  precedent rather than building a new durable processed-id store (out of
  scope, matching E6-T03's own identical stance).
  (g) `record_response` takes the CorrectionNotification's relevant fields
  as individual scalar arguments (`correction_notification_id`,
  `notifying_practice_id`, `origin_correction_event_id`,
  `origin_correction_event_revision`, `notified_object_ids`), not the
  CorrectionNotification Pydantic object itself — so CorrectionResponse's
  own schema/contract/example carry no cross-schema reference to
  `mrr.contracts.correction_notification` and can be implemented even
  before E6-T03 lands in code (see stop_conditions for the one piece that
  genuinely cannot). No signature is re-verified — this task trusts its
  caller to have already run E6-T03's `receive_correction_notification`
  (and, inside it, `resolve_trusted_correction_notification_key`);
  AGENTS.md rule 9 ("no cross-practice object may be accepted without
  signature and hash verification") is satisfied by that PRIOR call, once
  per notification, not re-satisfied here.
  (h) `correction.response_recorded` (already declared,
  docs/spec/03_API_AND_EVENTS.md section 5.2, line 307) is used verbatim —
  the one E6-T04-relevant event name the required-events enumeration
  already names, unlike every other E6 task so far, which had to add
  non-literal event names (transfer.created, obligation.propagated/
  deferred). Its `object_id`/`object_revision` reference the NEW
  CorrectionResponse's own id/revision — the only object this task's
  receiving-practice side actually creates — not the sender's remote
  CorrectionEvent id, which this practice never stores. Flagged in
  specification_gaps as an inference, not a settled mapping.
specification_gaps:
  - MRR-FR-084's own literal text mandates the notified-and-why recording only for reject/defer; accept and adapt as equally first-class recorded decisions come from docs/spec/06_IMPLEMENTATION_PLAN.md's own task title and by analogy to MRR-FR-081's five-way transfer vocabulary (derived_decisions (b)), not from a literal correction-specific FR mandate. Flagged for reviewer confirmation that both belong in the `decision` enum at all.
  - The sending practice's own CORRECTION_LIFECYCLE transitions from AWAITING_RESPONSES to RESOLVED, PARTIALLY_RESOLVED, or REJECTED_BY_RECIPIENT (docs/spec/01_SYSTEM_SPEC.md section 6.4; packages/domain/mrr/domain/lifecycles.py's own `_CORRECTION_TRANSITIONS`) remain entirely undriven by any task across the current six-task E6 epic as scoped in docs/spec/06_IMPLEMENTATION_PLAN.md section 3 — confirmed by direct reading of task-packets/E6-T01.yaml, task-packets/E6-T02.yaml, and task-packets/E6-T03.yaml, none of which claims it either. This task's own CorrectionResponse is local-only and is never transported back to the notifying practice, so nothing in the current epic plan ever aggregates multiple recipients' responses into the sender's own CorrectionEvent. This mirrors CORRECTION_LIFECYCLE's own already-documented "DELIVERY_PENDING has no drawn outgoing edge at all" open question in packages/domain/mrr/domain/lifecycles.py's module docstring — left preserved rather than resolved here; a future task or spec amendment must design the response-transport-back mechanism and the sender-side aggregation rule.
  - docs/spec/02_DOMAIN_MODEL.md section 2.16 lists "delivery and recipient responses" among CorrectionEvent's own fields, but schemas/correction-event.schema.json never gained them (already flagged by E6-T03's own specification_gaps for its sending-side scope). This task does not add them either — CorrectionResponse is a wholly separate, receiving-practice-local entity instead, since the receiving practice never holds a CorrectionEvent copy to attach a response to. Flagged in case a reviewer ultimately prefers a single unified field on CorrectionEvent once the response-transport-back mechanism above is designed.
  - Whether adapt may address only a subset of a notification's notified_object_ids (this task's own reading, via the `adaptations` list) or must address every one of them is not settled by any FR text — MRR-FR-082 ("Adaptation MUST create a new local object and preserve the relation to the source object") is textually scoped to TRANSFER adaptation (E6-T01), not a correction response. Flagged for reviewer confirmation.
  - Whether `corrects` (derived_decisions (d)) is the correct edge type for this exact use, versus reusing `adapted_from` or inventing a new one, is an interpretive choice — `corrects`'s own name and its total absence of any other claimed use anywhere in the codebase are the strongest textual support, but it is not a literal instruction.
  - Whether `correction.response_recorded`'s object_id/object_revision should reference the new CorrectionResponse (this task's reading, derived_decisions (h)) or some other object once a response-transport-back mechanism exists is unsettled.
  - Whether `reason` must be schema-enforced null/absent for accept (rather than merely Pydantic-enforced, this task's own choice per derived_decisions (c)) is left as the schema-design axis with the most implementer latitude, mirroring the analogous flag E6-T01 raised for TransferContract's own caveats/obligations structure.
  - Whether `record_response` should itself verify that `receive_correction_notification` was actually called first for the same notification is unaddressed by any FR text; this task builds no such cross-call state machine or enforcement — it only trusts its caller's own sequencing, and enforcing that ordering, if desired, is left to a future control-plane orchestration layer.
invariants:
  - exactly one CorrectionResponse is ever recorded per correction_notification_id; a second `record_response` call for the same id is rejected fail-closed via the caller-supplied `already_responded` predicate with `CorrectionResponseAlreadyRecordedError`, before any object, edge, or event is written
  - the `decision` field is exactly one of accept, adapt, reject, defer; `reason` is non-null and non-empty exactly when `decision` is reject or defer, enforced at both the JSON Schema and Pydantic layers (MRR-FR-084)
  - the `adaptations` list is non-empty exactly when `decision` is adapt; every `adaptations[].adapted_object_id` MUST already exist locally, verified via `ObjectRepository.get_latest`; a nonexistent `adapted_object_id` aborts the entire call — no object, no edge, and no event are persisted
  - every `adaptations[].notified_object_id` is a member of the response's own `notified_object_ids`
  - an adapt decision records exactly one `corrects` edge per adaptation entry (source=adapted_object_id, target=notified_object_id), written atomically with the one CorrectionResponse object revision and the one `correction.response_recorded` event, in a single transaction
  - CorrectionResponse is never mutated after creation — single revision, no lifecycle machine, no legal further transition is declared anywhere
  - this task never mutates the sending practice's CorrectionEvent, its stored status, or any CORRECTION_LIFECYCLE transition; the sending practice's own AWAITING_RESPONSES aggregation remains untouched and undriven (see specification_gaps)
  - this task never re-verifies the notifying practice's signature on the originating CorrectionNotification and adds no new trust resolver, envelope, or transport
  - every `record_response` call that succeeds records one `correction.response_recorded` domain event with full MRR-NFR-001 provenance (actor, occurred_at, policy_version, causation_id, correlation_id, object_id, object_revision)
  - both import-linter contracts stay KEPT; packages/domain and packages/contracts import no provider SDK, open no network, and persist no state outside what ObjectRepository/EdgeRepository already provide
  - no Alembic migration is added; objects.kind equal to CorrectionResponse and edges of type `corrects` are accepted by the existing schema exactly as-is
acceptance_tests:
  - happy path accept — decision accept with no reason and no adaptations records a CorrectionResponse revision 1 plus one `correction.response_recorded` event; no edge is written
  - happy path reject — decision reject with a non-empty reason records the response and event identically; an attempt to construct the same response with reason omitted or empty fails contract validation before `record_response` is ever called
  - happy path defer — identical to reject, with decision defer instead
  - happy path adapt, single adaptation — decision adapt with one notified_object_id/adapted_object_id pair (an already-existing local object) records the response, one `corrects` edge (source=adapted_object_id, target=notified_object_id), and the event, all atomically; the edge is queryable via `EdgeRepository.edges_from(adapted_object_id, "corrects")`
  - happy path adapt, multiple adaptations — an adapt response with N entries records N distinct `corrects` edges, each independently queryable, plus exactly one CorrectionResponse and one event
  - contract-tier rejection — decision reject or defer with reason null, empty, or absent fails both the JSON Schema conditional and the Pydantic model_validator
  - contract-tier rejection — decision adapt with an empty or absent adaptations list fails both layers; decision accept, reject, or defer with a non-empty adaptations list fails the Pydantic-only check (see specification_gaps for why this direction is not also schema-enforced)
  - adversarial — an adaptation entry whose notified_object_id is not a member of the response's own notified_object_ids is rejected by the Pydantic cross-field check; nothing is persisted
