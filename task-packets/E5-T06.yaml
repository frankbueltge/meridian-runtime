forbidden_changes:
  - the E5-T03 NodeMessageEnvelope contract and the E5-T03
    envelope_validation.validate_inbound_envelope / coarse_rejection_reason
    (reuse UNCHANGED; the bundle wraps and re-uses them — it does not re-model,
    re-sign, or re-validate an individual envelope)
  - the crypto sign/verify/hash primitives, hashing_policy / prepare_for_* policy,
    and mrr.crypto.keys (reuse unchanged); the E5-T02 manifest_trust, E5-T04
    task_trust, and E5-T05 crate_trust resolvers are NOT refactored here — a
    future DRY of the now-multiple near-identical signer-key resolvers
    (manifest / envelope / task / crate / bundle) is a separate, reviewed cleanup
    (keep this additive and low-risk)
  - real envelope encryption / KMS / decryption (docs/spec/04 section 4.1) —
    carry encryption metadata as a STRUCTURAL field only; building an actual
    encryption scheme is infra/KMS-dependent and deferred, exactly as E5-T03
    marked the concrete mTLS transport out of scope (section 8.4's import/export
    MUST verify "signatures, expiry, replay protection, and object hashes" — it
    does NOT list decryption, a separate section 4.1 concern)
  - the physical air-gap transport medium — file / USB / media / byte I/O to move
    a bundle between nodes — the OfflineBundle is a serializable object; the
    transfer medium is infra and out of scope (mirrors E5-T03's abstract
    transport port instead of a real socket)
  - a durable processed-id / replay store or any revocation sweep over already-
    accepted bundles (E5-T07 — replay via a caller-supplied predicate; resolve
    validity AT the evaluation instant only)
  - any new DB model, migration, repository, or service, and any new authoritative
    state; both import-linter contracts MUST stay KEPT (the export/import are
    framework-free domain code and the OfflineBundle is one Pydantic contract —
    no provider/web/network/file import)
