required_output:
  - implementation summary
  - the OfflineBundle contract, the export build_outbox_bundle and import
    validate_inbound_bundle accept rule + typed failure family, and the offline
    chain demonstration (bundle -> envelope -> crate) proving online-verification
    reuse
  - changed files, the additive domain errors, and the new schema/model/example
    (eighteenth) pair
  - tests added and exact command results (format, lint, typecheck, test,
    test-contract) proving green, plus CI for integration/e2e
  - security/privacy implications (batch integrity authenticated by the bundle
    signature, per-entry hash verified before nested deserialization, fail-closed
    matrix, verification against the ring's key, revocation at the instant, replay
    via caller predicate, encryption metadata carried but decryption deferred, no
    network/file/new state)
  - open specification questions and what is deferred (real envelope encryption /
    KMS; the physical air-gap transport medium; durable replay/revocation E5-T07;
    result-intake / run-linkage assembled at E2E-002; the DRY of the now-multiple
    signer-key resolvers)
stop_conditions:
  - the offline bundle cannot be expressed without changing the E5-T03 envelope
    contract or validate_inbound_envelope, an existing contract, the crypto
    primitives, or hashing_policy (report)
  - honoring section 8.4 "verify signatures, expiry, replay protection, and object
    hashes" would force building the durable processed-id/replay store or a
    revocation sweep (E5-T07) — keep the at-instant + caller-predicate checks and
    stop
  - honoring section 4.1 "envelope encryption for cross-practice offline bundles"
    would force building real KMS/decryption — carry encryption metadata
    structurally and stop; open a specification issue if a concrete encryption
    scheme is required for v1
  - a physical transport medium (file/USB/media I/O) or a bundle-intake service is
    unavoidable to prove verification (it is not — verify the bundle object
    directly; report if blocked)
