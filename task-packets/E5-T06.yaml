derived_decisions: >
  The OfflineBundle is the offline counterpart of E5-T03's online envelope:
  E5-T03 delivers ONE envelope point-to-point; a bundle batches MANY already-
  signed envelopes for ONE recipient into a single signed, content-addressed
  container for air-gapped import/export. The bundle carries its OWN sender-node
  signature over the ADR-0004 exclude_none form, so the batch's integrity — which
  envelopes, in which order, addressed to whom, valid until when — is itself
  authenticated: an attacker cannot add, drop, reorder, or retarget entries
  without breaking the bundle signature. Each entry's envelope_content_hash lets
  the importer verify each carried envelope's bytes BEFORE deserializing its
  nested payload beyond what verification requires (docs/spec/03 section 4.2). The
  importer does NOT re-implement per-envelope validation: once the batch verifies,
  each carried envelope flows through E5-T03's validate_inbound_envelope exactly
  as an online-delivered one would — the bundle adds a batch-integrity + replay +
  addressing layer AROUND the existing single-envelope path, nothing more. It is
  the eighteenth schema/model pair in this repository (schemas/,
  mrr.contracts model + export, examples/, and a Pydantic model that cross-
  validates against its JSON Schema). New bundle-specific typed errors —
  BundleRecipientMismatchError, BundleNotWithinValidityWindowError,
  BundleAlreadyProcessedError, BundleSignerMismatchError, BundleKeyNotValidError,
  BundleEntryHashMismatchError — live in mrr.domain.exceptions;
  UnknownKeyIdError and the mrr.crypto Signature errors are reused verbatim.
  mrr.domain.manifest_trust.practice_key_ring is reused unchanged to build the
  sender practice's ring, and the bundle-signer resolution mirrors the
  manifest/envelope/task/crate resolution exactly (signer-practice match, kid
  resolves, KeyRing.is_valid_at(at), verify against the RESOLVED descriptor's key
  decoded from the ring — never a key the bundle itself claims). Encryption stays
  metadata-only by design (see forbidden_changes). A future service maps the typed
  failures to a coarse refusal reason exactly as coarse_rejection_reason does for
  envelopes; wiring imported results into a full origin-side run record is
  assembled at E2E-002, not here.
invariants:
  - a received OfflineBundle is trusted ONLY when it is addressed to this node,
    unexpired at the evaluation instant, not already processed, its bundle
    signature resolves via the sender practice's KeyRing to a key valid at the
    instant AND verifies over the exclude_none form, AND every entry's declared
    envelope_content_hash equals the actual content hash of its carried envelope;
    any single failure is a DISTINCT typed error and the bundle is rejected fail
    closed
  - the batch's membership, order, recipient, and validity window are
    authenticated by the bundle signature — an added, dropped, reordered, or
    retargeted entry breaks verification
  - each carried envelope's bytes are hash-verified BEFORE its nested payload is
    deserialized beyond what verification requires (docs/spec/03 section 4.2)
  - bundle verification anchors to the key resolved from the sender practice's
    RING, never a key the bundle claims; a revoked/rotated/expired/unknown-kid or
    signer-mismatched bundle is rejected even if the raw Ed25519 signature is
    cryptographically valid
  - the distinct failure reasons (recipient-mismatch / not-in-window / already-
    processed / signer-mismatch / unknown-kid / key-not-valid / bad-signature /
    entry-hash-mismatch) are DISTINCT typed errors, never one generic failure
  - the E5-T03 NodeMessageEnvelope contract and validate_inbound_envelope are
    UNCHANGED; a bundle this importer accepts carries envelopes each still subject
    to the existing per-envelope validation, and a bundle build_outbox_bundle
    produces is one validate_inbound_bundle accepts round-trip
  - both import-linter contracts stay KEPT; the module imports no provider SDK,
    opens no network or file, and builds no persisted state
acceptance_tests:
  - happy path: build_outbox_bundle assembles a bundle of two already-signed
    envelopes for a recipient node with an active in-window sender key; the
    recipient resolves the sender key via the sender practice's ring, the bundle
    signature verifies, every entry hash matches, and the verified envelopes are
    returned in order
  - round-trip determinism: building the same bundle from the same envelopes and
    metadata yields a byte-identical canonical exclude_none form and the same
    bundle content hash (property test)
  - fail-closed matrix, each a distinct typed error: recipient_node_id != this
    node; evaluation instant outside [created_at, expires_at); bundle_id reported
    already-seen by the predicate; signer_practice_id != the trusted sender
    practice; kid does not resolve in the ring; resolved key revoked / rotated /
    expired / not-yet-valid at the instant; a tampered bundle whose signature no
    longer verifies; an entry whose declared envelope_content_hash != the carried
    envelope's actual hash
  - batch-tamper matrix: adding, dropping, reordering, or retargeting an entry
    after signing is rejected because the bundle signature no longer verifies over
    the mutated exclude_none form
  - replay: a bundle whose bundle_id the caller predicate reports as already-seen
    is rejected (BundleAlreadyProcessedError); the durable processed-id store is
    deferred to E5-T07
  - revocation at the instant: a bundle signed by a key valid at creation but
    REVOKED in the ring by the evaluation instant is rejected (docs/spec/04
    section 8.4), while the revoked descriptor stays resolvable
  - key-substitution attack: a bundle signed by an attacker key but claiming a
    trusted kid fails closed (SignatureVerificationError)
  - end-to-end offline chain: a sealed EvidenceCrate wrapped in an E5-T03
    NodeMessageEnvelope, carried inside an OfflineBundle, survives import —
    validate_inbound_bundle verifies the batch, then each carried envelope passes
    validate_inbound_envelope, then the carried crate verifies via
    resolve_trusted_crate_key — proving the offline path reuses every online
    verification, not just batch integrity
  - all existing suites stay green; both import-linter contracts remain KEPT; the
    new schema/model/example (eighteenth) pair cross-validates
