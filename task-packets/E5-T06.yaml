task_id: E5-T06
title: Offline inbox/outbox bundles — a signed OfflineBundle batching store-and-forward NodeMessageEnvelopes, with deterministic export/import that verifies bundle signature, expiry, replay, and per-entry object hashes, fail closed, before deserializing nested content
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E5 (E5-T06
  "offline inbox/outbox bundles"), docs/spec/01_SYSTEM_SPEC.md section 8.4
  ("Federated offline: Air-gapped or intermittent nodes use signed inbox/outbox
  bundles. Import and export MUST verify signatures, expiry, replay protection,
  and object hashes") and section 2.2 item 9 ("Optional offline store-and-forward
  transport"), docs/spec/03_API_AND_EVENTS.md section 4.2 ("Store-and-forward
  envelopes": a transport envelope carrying identifier and nonce, sender and
  intended recipient, object type and schema version, payload hash, creation and
  expiry, encryption metadata, sender signature, optional acknowledgement request;
  "A recipient MUST reject expired, replayed, misaddressed, untrusted, or
  hash-invalid envelopes before deserializing untrusted nested content beyond what
  is required for verification"), docs/spec/04_SECURITY_AND_POLICY.md section 4.1
  ("Envelope encryption for cross-practice offline bundles") and section 8.2
  (nonces/expiry/recipient/hashes/signatures; processed IDs retained for replay
  detection), and MRR-NFR-007/005/006/001. Builds additively on E5-T01
  (Practice/KeyRing/kid), E5-T02 (trust-anchored signer-key resolution), E5-T03
  (mrr.contracts.NodeMessageEnvelope + mrr.domain.envelope_validation.
  validate_inbound_envelope + coarse_rejection_reason) and the ADR-0004
  exclude_none signature form. Per this repository's standing infra-near note
  (E5-T03): the domain/crypto/protocol OBJECT layer is built CI-testable here;
  the physical air-gap transfer medium (file/USB/media byte I/O) and real
  envelope encryption / KMS are marked infra-dependent and are NOT built or
  CI-tested in this packet, exactly as E5-T03 marked the concrete mTLS transport
  out of scope while building the object layer it will carry.
objective: >
  Provide the offline store-and-forward layer's object contract plus deterministic
  export/import, framework-free and CI-testable, as the OFFLINE counterpart of
  E5-T03's online single-envelope path: (1) a new signed OfflineBundle contract —
  the docs/spec/01 section 8.4 "inbox/outbox bundle" that batches MANY already-
  signed E5-T03 NodeMessageEnvelopes destined for ONE recipient node into a single
  content-addressed container, carrying a bundle id / replay nonce, sender node +
  practice id, recipient node id, created-at and expiry timestamps, an ordered
  list of entries (each a message id + payload kind + the carried envelope's
  content hash), the carried envelopes themselves, structural encryption metadata,
  and a bundle-level signature by the SENDING node over the ADR-0004 exclude_none
  form (built/verified via the existing hashing_policy). The bundle wraps E5-T03
  envelopes unchanged; it does not re-model or re-sign them. (2) A deterministic,
  content-addressed export build_outbox_bundle(...) (framework-free domain) that
  assembles a bundle for one recipient from already-signed envelopes, computing
  each entry's envelope_content_hash over the exclude_none form and producing the
  exact canonical form the sender signs. (3) A deterministic import
  validate_inbound_bundle(...) (framework-free domain) that accepts a received
  bundle ONLY when EVERY check holds, each a DISTINCT typed error, fail closed,
  and — per docs/spec/03 section 4.2 — verifies BEFORE deserializing nested
  content beyond what verification requires: recipient_node_id == this node; the
  evaluation instant is within [created_at, expires_at); the bundle_id has not
  already been processed (a replay CHECK via a caller-supplied "already seen"
  predicate — the DURABLE processed-id store is E5-T07); the bundle signature
  resolves under the sender node's trusted key (sender practice KeyRing exactly as
  E5-T02/T03: signer-practice match, kid resolves, key valid at the instant,
  signature verifies over the exclude_none form); and EVERY entry's declared
  envelope_content_hash equals the actual content hash of its carried envelope.
  It returns the verified envelopes, or a COARSE reason category (mirroring E5-T03
  coarse_rejection_reason). It does NOT re-implement per-envelope validation:
  after the batch verifies, each carried envelope flows through E5-T03's
  validate_inbound_envelope exactly as an online-delivered one would — an
  acceptance test demonstrates the full offline chain (bundle import -> per
  entry validate_inbound_envelope -> for a carried result crate,
  resolve_trusted_crate_key), proving the offline path REUSES every online
  verification rather than bypassing it.
