task_id: E4-T03
title: Implement the Hypothesis contract and the planner/proposer role
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E4 (E4-T03),
  docs/spec/01_SYSTEM_SPEC.md section 4.2 (Stage 2 - Hypothesis Forest;
  MRR-FR-010..MRR-FR-014) and section 5 (A1 Draft = "clearly marked proposal"),
  and docs/spec/02_DOMAIN_MODEL.md section 2.4 (Hypothesis and ResearchBranch;
  the invariant "a hypothesis is not a claim of result"); building on the merged
  E4-T01 ModelAdapter port and E4-T02 structured-generation layer. Approved by
  the repository owner's standing direction to continue through E4 (2026-07-19).
  Third task of Epic E4 - the first AI ROLE: the planner produces a hypothesis
  forest of schema-valid, proposal-only branch hypotheses.
objective: >
  Provide (1) a Hypothesis contract (the 14th entity: schema + Pydantic) mirroring
  docs/spec/02_DOMAIN_MODEL.md section 2.4 - hypothesis statement, branch role,
  predicted and disconfirming observations, scope, dependencies and assumptions,
  methods, required capabilities, branch budget, stop conditions, priority
  rationale, lifecycle status - with branch_role a closed enum of exactly the
  six MRR-FR-010 roles and a status enum that has NO verified/result value; and
  (2) the planner/proposer role - a pure producer that, given a research question
  and an injected E4-T01 ModelAdapter, uses the E4-T02 structured-generation
  layer to propose a hypothesis forest (multiple branch hypotheses across the
  roles), each a schema-valid PROPOSAL (A1). A hypothesis is NOT a claim of
  result: the planner cannot mark its own hypothesis verified (MRR-FR-014),
  structurally. This task PRODUCES proposals in memory; it persists nothing and
  writes no authoritative state.
