derived_decisions:
  - >-
    (a) superseded_by lives in baseObject.labels (an existing, open
    string-map slot) rather than a new schema field — the schema stays
    frozen one packet after shipping; if labels prove too weak a home,
    promoting it to a field is a future ADR, not a T05 improvisation.
  - >-
    (b) The banner's correction test is INTERSECTION with the release's
    own exported object set, not the full transitive impact machinery —
    the release knows exactly what it shipped (its manifest); corrections
    on objects outside the shipped set are the ordinary projections'
    business (E8-T03 already shows them), not this banner's. Flagged so
    nobody mistakes the banner for an impact analysis.
  - >-
    (c) status exits 0 for every computed verdict: a superseded release
    answering "superseded" is the system working, not failing. Scripts
    branch on the JSON verdict field, not the exit code.
  - >-
    (d) No real release/supersession in this packet — unchanged from
    E8-T04 (the gate machinery ships empty; the owner acts, if ever, on
    the owner's own timing).
invariants:
  - Supersession never touches bundle bytes, the original approval block, or the manifest (AT4-proven).
  - Every verdict and banner byte derives from stored fields; no wall clock anywhere.
  - Absent release context renders byte-identical reports to E8-T03 (regression-proven).
  - The intermediate supersede state is detectable (anomaly verdict), never silent.
  - No default can produce the superseding release's approval inputs.
acceptance_tests:
  - >-
    AT1: create release A; create release B with --supersedes A (fresh
    synthetic approval); A's latest revision is status superseded with
    labels.superseded_by == B; the release.superseded event's actor is
    B's approver; status A -> verdict superseded naming B; status B ->
    current; both exit 0.
  - >-
    AT2: with a correction recorded against a claim in A's exported set
    AFTER A's created_at (and A unsuperseded), status A ->
    corrections_affect_this_release listing exactly that correction and
    the intersecting urns; a correction dated BEFORE the release, or
    affecting only objects outside the set, does not flip the verdict.
  - >-
    AT3: a report rendered with A's release context carries the banner
    block first (both formats, both disclosures; correction free text
    gated in public, verdict/urns never); rendered WITHOUT release
    context it is byte-identical to the E8-T03 output for the same graph.
  - >-
    AT4: after superseding A, `mrr release verify --bundle-dir` against
    A's untouched bundle directory still exits 0 with A's recorded
    root_hash — history unaltered, mechanically.
  - >-
    AT5: refusal matrix (already-superseded, self-supersede, non-person
    approver, unknown ids) each exit 3 with nothing persisted; the
    intermediate state's error message matches reviewer_resolution 2's
    wording; E8-T01…T04 suites pass unmodified.
