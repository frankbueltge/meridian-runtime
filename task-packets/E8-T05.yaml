specification_gaps:
  - >-
    "Correction banner" has no spec definition beyond the plan line; its
    shape (three verdicts + anomaly, banner-first rendering, shipped-set
    intersection) is fixed by this packet and recorded here — a future
    spec revision can adopt or amend it explicitly.
required_output:
  - Packet report per AGENTS "Required delivery format", embedding one
    fixture status JSON line per verdict and the banner block of one
    rendered report verbatim, plus the exact CLI invocations.
stop_conditions:
  - >-
    If carrying superseded_by in labels collides with any existing label
    convention or validator, STOP and report — promoting it to a schema
    field is ADR territory, not an in-packet swerve.
  - >-
    If the two-transaction supersede order admits an inconsistent state
    beyond the one named in reviewer_resolution (2), STOP and record it
    before choosing.
  - >-
    If rendering the banner requires changing any EXISTING
    research_report section's bytes (not merely prepending the new
    block), STOP — the byte-identity regression of R3 is the packet's
    own premise.
