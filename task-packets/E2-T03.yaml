task_id: E2-T03
title: Implement the Task Bundle service and local node decision
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/01_SYSTEM_SPEC.md stage 4 (MRR-FR-030..035),
  stage 3 (MRR-FR-022..024), the TaskBundle lifecycle in section 6.2, and
