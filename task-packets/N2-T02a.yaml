derived_decisions:
  - >-
    (a) The 47 do not exist; the honest number is 21. 47 is the records' own FETCH
    count (24+23) and those lists were never committed — they cannot be audited and the
    manifest must not imply they were. The gap between 47 fetched and 21 identified is
    itself a finding about the records, recorded in the manifest rather than smoothed
    over. Reporting a smaller, true number beats reporting a larger, unearned one.
  - >-
    (b) Network egress is a gated pipeline, never a runtime capability. Script under
    scripts/, importing nothing from mrr.*; https + hard host allowlist as a typed
    refusal; keyless (no token can leak into a note or log); run once, snapshot
    committed. The audit tool stays no-network — the separation N2-T01 established is
    strengthened here, not relaxed.
  - >-
    (c) The frozen evaluator is reused byte-for-byte; this packet changes no runtime
    code. Verified at derivation by parsing the manifest through the real
    _parse_manifest. AGENTS.md rule 8 ("no executor verifies its own result") holds
    doubly: the audit is performed by the unchanged N2-T01 evaluator this packet did not
    write, and the acceptance oracle came from an INDEPENDENT derivation-time fetch the
    built script must reproduce rather than define.
  - >-
    (d) A short system name is not a title claim. claimed_title is declared for exactly
    one citation (the only one a record puts in quotation marks). Treating "Darwin Gödel
    Machine" as a claimed title would produce title_mismatch against arXiv's registered
    "Darwin Godel Machine" — a false accusation of misattribution caused by a
    resolver-side transliteration. Existence remains the primary verdict for this
    target, as it was for N2-T01's.
  - >-
    (e) A disagreement with the oracle is a result, not a bug. If the real fetch does not
    reproduce 21/21, the committed snapshot records what the APIs returned and the packet
    report states the difference. Adjusting inputs to reach an expected number is exactly
    the fabrication this capability exists to detect.
invariants:
  - The runtime path (packages/**, services/**) is unchanged and remains no-network and no-database.
  - No API key, token, credential, or Authorization header exists anywhere in this packet.
  - Every outbound request is https and to an allowlisted host, enforced as a typed refusal before any socket is opened.
  - The test suite is fully offline; parser tests run against checked-in fixture payloads only.
  - The committed snapshot covers every manifest citation and is byte-reproducible (sorted, sort_keys, trailing newline).
  - An unresolvable identifier is recorded as resolved=false; it is never dropped, never back-filled, never "repaired".
acceptance_tests:
  - >-
    AT1: `mrr audit citations` over the committed manifest + the newly committed
    snapshot reports 21 citations with 21 resolved, 0 not_found, 0 title_mismatch,
    0 malformed, 0 unverifiable — asserted numerically, through the unchanged evaluator.
  - >-
    AT2: cross-check — for the 8 citations shared with corpora/e2e-survey, the
    resolved_title in the new snapshot equals the resolved_title in the committed
    e2e-survey snapshot; two independent fetches, same answers.
  - >-
    AT3: egress guard — a non-allowlisted host, a non-https scheme, and an unexpected
    URL each raise a typed refusal with NO socket opened (monkeypatched opener fails the
    test if it is ever called).
  - >-
    AT4: parser correctness on fixtures — a requested arXiv id absent from the Atom
    response yields resolved=false; a versioned id matches only its versioned response
    id; Crossref 404 yields resolved=false while 500 yields a typed refusal.
  - >-
    AT5: determinism — writing the snapshot twice from the same parsed input is
    byte-identical; existing suites pass unmodified; every make tier green including
    make security-check.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make security-check
specification_gaps:
  - >-
    Support-checking (does the source carry the claim it is cited for?) and
    number-consistency are N2-T03 — named, not built, and the heavy LLM/human piece.
    This packet verifies existence and, once, a title.
  - >-
    The ~26 sources the records fetched but never identified inline remain unauditable.
    Closing that gap means the research harness committing its fetch list — a separate
    question, not this packet's business, and deliberately not papered over.
  - >-
    A nightly re-run of this fetch (detecting a withdrawn or retitled paper after the
    fact) belongs to R2-T02, the gated nightly routine, which does not exist. This
    packet is run-once-commit.
required_output:
  - Packet report per AGENTS.md "Required delivery format", embedding the exact script
    invocation and the exact `mrr audit citations` invocation, the rendered Markdown
    report verbatim, the snapshot's own sha256, and an explicit statement of whether
    the real fetch reproduced the derivation oracle (21/21) or differed — and how.
stop_conditions:
  - >-
    If reproducing the expected audit result requires editing the committed manifest,
    hand-editing the snapshot, or adjusting the script's matching rules to make an
    identifier resolve, STOP — the manifest is the oracle and the snapshot is archive
    (AGENTS.md rule 3/4).
  - >-
    If any step appears to require an API key, a non-allowlisted host, a plain-http
    request, or reaching the network from packages/** or services/**, STOP — each would
    break the packet's reason for existing (AGENTS.md rule 11).
  - >-
    If a make tier can only go green by modifying the frozen N2-T01 core/service, adding
    a dependency, silencing bandit with a bare nosec, or making a test reach the
    network, STOP.
