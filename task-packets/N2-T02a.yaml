requirements:
  - >-
    R1 (gated fetch script, scripts/fetch_citation_resolutions.py — NEW, outside the
    runtime): a standalone Python module under scripts/, NOT importable from
    packages/** or services/** and importing nothing from mrr.* — the runtime must stay
    no-network by construction. Stdlib only (urllib.request, urllib.parse,
    xml.etree.ElementTree, json, argparse, hashlib); NO new dependency. It MUST enforce,
    as a typed refusal before any socket is opened, that every request URL is https AND
    its host is in a hard-coded allowlist of exactly {"export.arxiv.org",
    "api.crossref.org"} — any other URL raises, never warns, never proceeds. It MUST
    NOT read, accept, or send any API key, token, credential, or Authorization header
    (both APIs are open); it sends only a descriptive User-Agent. It MUST NOT interpret,
    score, enrich, or "repair" anything: an identifier the API does not return is
    recorded as resolved=false, never silently dropped and never back-filled from
    another source.
  - >-
    R2 (fetch behaviour, exact): read the manifest's citations[]; group by resolver —
    every entry with identifiers.arxiv goes to arXiv, every entry with identifiers.doi
    (and no arxiv) goes to Crossref; an entry with neither is written out as a typed
    refusal, never guessed at. arXiv: ONE batched request to
    https://export.arxiv.org/api/query with id_list = the comma-joined requested ids and
    max_results = their count (one round trip for all of them, not one per id), parsing
    the Atom response; a requested id ABSENT from the response is resolved=false (the
    documented not-found semantics already recorded in the e2e-survey snapshot).
    Requested ids MUST be matched INCLUDING their version suffix (2502.14297v3 comes
    back as .../abs/2502.14297v3 — verified live at derivation); the script must never
    normalise a version away or match a versioned request to an unversioned response.
    Crossref: one GET per DOI to https://api.crossref.org/works/<url-quoted doi>; HTTP
    404 is resolved=false; any other non-200 is a typed refusal naming the status, never
    a silent resolved=false. Every request has an explicit timeout.
  - >-
    R3 (snapshot output shape — must satisfy the frozen parser unchanged): write JSON in
    exactly the committed citation-resolution-snapshot.v1 shape, mirroring
    corpora/e2e-survey/verification/resolution-snapshot.json: top-level schema_version,
    manifest (relative path back to the manifest), fetched_on, resolvers (the two
    documented resolver descriptions incl. the not-found semantics), note (stating
    verbatim that this records EXISTENCE and the canonical title, and NOT that a source
    supports the claim it was cited for — N2-T03), and resolutions[]: one object per
    manifest citation with citation_id, identifier (resolver-tagged, e.g.
    "arxiv:2511.02824"), resolver, resolved (JSON boolean), resolved_title, and, where
    the API gives them, resolved_container/resolved_detail. resolutions[] MUST be sorted
    by citation_id and the JSON written with sort_keys=True and a trailing newline, so
    re-running over unchanged upstream metadata reproduces a byte-identical file. It
    MUST cover EVERY manifest citation — a manifest entry with no resolution would make
    the frozen evaluator raise MissingResolutionError, which is the correct refusal but
    must not be triggered by the script's own omission.
  - >-
    R4 (run once, commit the result): execute the script exactly once against the
    committed manifest and commit its output as
    corpora/research-records/verification/resolution-snapshot.json. The snapshot is
    ARCHIVE from that moment (CLAUDE.md/AGENTS.md: git is authoritative for committed
    bytes) — it is not hand-edited afterwards, not partially patched, and not
    regenerated to make a test pass. If the real fetch disagrees with the derivation's
    oracle (21/21 resolve), the DISAGREEMENT IS THE RESULT: commit what the APIs
    actually returned and report the difference — do not adjust the manifest, the
    script, or the snapshot to reach the expected number.
  - >-
    R5 (audit run, no code change): run `mrr audit citations` over the committed
    manifest + the new snapshot using the UNCHANGED frozen evaluator, and record the
    rendered report in the packet report. This packet changes NO file under
    packages/** or services/**. If the audit appears to require a change there, that is
    a finding to report, not a change to make.
  - >-
    R6 (tests + security-check): unit (no-network, no-DB): the allowlist/https guard
    REFUSES a non-allowlisted host, a non-https scheme, and an unexpected URL, as a
    typed error, with no socket opened (assert via a monkeypatched opener that fails the
    test if called); the arXiv Atom parser maps a response to resolutions correctly,
    including (a) a requested id ABSENT from the response becoming resolved=false and
    (b) a versioned id matching only its versioned response id; the Crossref parser maps
    a 404 to resolved=false and a 500 to a typed refusal; the snapshot writer is
    deterministic (two writes of the same parsed input are byte-identical) and covers
    every manifest citation. All parser tests run against FIXTURE payloads checked into
    tests/, never by calling the network — the test suite MUST remain fully offline.
    acceptance (offline, over the two committed files): `mrr audit citations` over the
    committed manifest + snapshot reports 21 citations, 21 resolved, 0 not_found, 0
    title_mismatch, 0 malformed, 0 unverifiable, asserted numerically; and the 8
    citations shared with the e2e-survey manifest resolve to the SAME titles in both
    committed snapshots (the cross-check). All existing suites pass UNMODIFIED. Every
    make tier green INCLUDING make security-check (the https+allowlist guard is the
    honest answer to bandit B310 — do not silence it with a bare nosec).
