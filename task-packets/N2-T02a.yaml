  Derived 2026-07-25 from docs/design/2026-07-25-n2-t02-derivation.md, which closes
  the "N2-T02 (benannt)" slot of docs/design/2026-07-24-n2-derivation.md. Fact base
  verified first-hand at derivation: the three committed research records
  (2026-07-23-recherche-e2e-research-automation.md,
  2026-07-24-nachrecherche-empirische-methoden.md,
  2026-07-24-primaerquellen-selbstoptimierung.md) carry 21 distinct inline
  identifiers — 20 arXiv ids and the Nature article id s41586-026-10265-5 — all 21 of
  which RESOLVE (one batched arXiv id_list query plus one Crossref query, keyless, run
  at derivation); 8 of the 21 are already covered by N2-T01's snapshot, 13 are new,
  and the overlap is a deliberate cross-check. Record III section B2 (AlphaEvolve)
  carries NO machine-checkable identifier and is excluded by name, never by silence.
  Versioned arXiv ids are real and echo back with their version (2502.14297v3 verified
  against the live API). No HTTP client is in the dependency tree (no httpx, no
  requests), so the fetch uses stdlib urllib.request and adds no dependency. The
  citation manifest corpora/research-records/citations.manifest.json is committed at
  the governance commit and is READ-ONLY for this build.
objective: >-
  After this packet, `python scripts/fetch_citation_resolutions.py --manifest
  corpora/research-records/citations.manifest.json --output corpora/research-records/
  verification/resolution-snapshot.json` performs exactly one gated, keyless
  resolution pass — one batched arXiv id_list request and one Crossref request per DOI,
  against an enforced https host allowlist — and writes a deterministic snapshot in the
  committed citation-resolution-snapshot.v1 shape. That snapshot is committed as
  archive. `mrr audit citations --manifest corpora/research-records/
  citations.manifest.json --snapshot corpora/research-records/verification/
  resolution-snapshot.json` then renders, through the UNCHANGED frozen evaluator, a
  report over all 21 record citations: 21 resolved, 0 not_found, 0 title_mismatch, 0
  malformed, 0 unverifiable. The script writes only its --output path; the audit tool
  remains no-network and no-database; no runtime module changes.
