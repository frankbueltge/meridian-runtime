task_id: N2-T02a
title: >-
  Reproducible gated citation-resolution fetch (`scripts/fetch_citation_resolutions.py`)
  and the audit of the three research records' own 21 inline citations: run once
  against the two open, keyless metadata APIs (arXiv, Crossref) behind a hard host
  allowlist, commit the resulting resolution snapshot as archive, and audit the
  committed record-citation manifest with the UNCHANGED frozen N2-T01 evaluator.
  Builds the pipeline N2-T02 was named for; changes no runtime code at all.
status: approved
epic: N2
reviewer_resolution: >-
  Approved 2026-07-25 by the main session as reviewing instance, under the owner's
  instruction the same day to derive and build N2-T02 (citation audit over the record
  citations + anchoring integrity, decomposed if warranted) recorded in
  docs/design/2026-07-25-n2-t02-derivation.md, and under the standing use-first
  decision (docs/design/2026-07-22-nutzungsentscheidung-e9-vertagt.md). Decomposed
  into T02a (this packet, the only half that touches the network) and T02b (offline
  anchoring integrity) because the two halves have different risk profiles and a
  single packet would blur exactly the boundary that must stay separately
  reviewable. Load-bearing choices CONFIRMED at derivation: (1) the "~47 record
  citations" DO NOT EXIST as an auditable set — 47 is a FETCH count (24+23, stated in
  the record headers) and those fetch lists were never committed; the records make
  exactly 21 distinct identifiers machine-checkable inline, and the manifest says so
  rather than implying coverage it does not have; (2) EXISTENCE is not SUPPORT still
  holds unchanged — this packet verifies references resolve and (where a title is
  actually claimed) are correctly titled, never that a source carries the claim it is
  cited for (N2-T03); (3) network egress is a GATED PIPELINE, not a runtime
  capability — the script lives outside packages/** and services/**, enforces an
  https + host allowlist (export.arxiv.org, api.crossref.org) as a typed refusal, uses
  NO key/token/credential of any kind, runs once, and commits its snapshot (git =
  archive); (4) the frozen N2-T01 evaluator is reused BYTE-FOR-BYTE — the manifest was
  verified at derivation to parse cleanly through the real _parse_manifest (21 entries,
  0 malformed, exactly 1 claimed_title), so this packet changes no runtime code; (5) a
  short system name is NOT a title claim (documented at derivation: "Darwin Gödel
  Machine" vs arXiv's registered "Darwin Godel Machine" would yield a false
  title_mismatch from a resolver-side transliteration); (6) the real fetch result
  (21/21 resolve, performed independently at derivation) is the acceptance oracle the
  built script must reproduce.
depends_on: []
