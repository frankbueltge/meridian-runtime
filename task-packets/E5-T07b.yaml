  - the key_revocations table + migration (with its down_revision), the
    PostgresKeyRevocationStore's record_revocation / get_revocation
    contract (including why no update/delete method exists), and the pure
    RevocationRecord / trust_revoked_after_creation module
  - the end-to-end demonstration that a durably-recorded revocation
    produces a True trust_revoked_after_creation result for a real signed
    object's own signed_at, and that it composes with the E5-T07 replay
    store without introducing a competing rejection reason
  - changed files and the new migration revision id (and its down_revision,
    which MUST be "983751ff8bb6", the current Alembic head)
  - tests added and exact command results (format, lint, typecheck, test,
    and test-integration) — for test-integration, either the CI run's pass
    output or, if run locally without Postgres, the VISIBLE skip with its
    reason (never a silent green)
  - security/privacy implications (an append-only, un-erasable revocation
    fact per key; no new intake-gating logic; no authorization check on who
    may record a revocation, explicitly named as the caller's
    responsibility; internal state only — no new cross-practice object, no
    network)
  - open specification questions and what is deferred (see
    specification_gaps below; a surfacing/projection service that actually
    attaches the annotation to a real API response; a domain-event trail
    for revocation notifications; node-level, as opposed to key-level,
    revocation)
stop_conditions:
  - the durable revocation fact cannot be expressed without persisting a
    full Practice/KeyRing registry, or without changing any E5-T02..T06
    resolver's accept rule (it can — this store is a narrow, additive fact
    table and predicate, exactly like E5-T07's processed_ids; report if
    genuinely blocked)
  - "once recorded, can never be un-recorded" cannot be honored without an
    application-level check that could race (it can — ON CONFLICT (kid) DO
    NOTHING at the database is sufficient, mirroring E5-T07's own
    idempotency anchor; do not add a compensating update/delete method to
    "fix" a bad revocation — report the scenario instead)
  - demonstrating the annotation predicate turns out to require building an
    actual surfacing/query service or a new API field (it does not — prove
    the predicate against a real object's own signed_at directly, exactly
    as E5-T07 proved its predicate against validate_inbound_envelope/bundle
    without an intake service; report if genuinely blocked)
  - integration coverage is impossible because the repo's Postgres harness
    cannot be reached even in CI (it can — tests/integration/conftest.py is
    the proven E1-T05/T06/E5-T07 path; report if the harness is actually
    broken)
specification_gaps:
  - docs/spec/04_SECURITY_AND_POLICY.md section 8.4 says an existing object
    "may receive" the trust_revoked_after_creation annotation (MAY, not
    MUST) and never states WHO computes/attaches it or on WHICH surfaced
    objects — this packet makes the underlying fact durable and the
    decision function deterministic, but leaves "which future service must
    call it, and on what response shape" genuinely open, same as E5-T03's
    own "flagged as an open specification question" caveat about its coarse
    rejection-reason vocabulary
  - no MRR-FR-* requirement names key/node revocation directly (it appears
    only in NFR/section-8.4 prose and in the E5/E9 backlog descriptions);
    whether a dedicated MRR-FR should be added for "a revoked key's
    already-accepted objects MUST be inspectable with an honest revocation
    annotation" is an open question for a future ADR or spec revision, not
    decided by this packet
  - docs/spec/04 section 8.4 says a practice "can revoke a node OR key" —
    this packet models only KEY-level revocation (kid-keyed), matching the
    existing KeyState vocabulary (E5-T01); NODE-level revocation (revoking
    every key of a node/practice at once, or blocking a node id outright)
    has no modeled vocabulary anywhere in the codebase yet and is out of
    this packet's scope
  - whether a revocation record itself is ever subject to a retention or
    deletion policy (e.g. an eventual data-minimization requirement) is not
    addressed by section 8.4 at all; this packet takes the conservative
    reading that a security-relevant revocation fact is never deleted by
    any mechanism this codebase provides, but the specification does not
    explicitly rule out a future, separately-decided retention policy
  - whether a "key revoked" durable fact should also raise a domain event
    (for cross-practice notification, mirroring MRR-FR-094's "every
    affected practice MUST receive a signed notification or a durable
    pending-delivery record" for corrections) is not addressed here — this
    packet's record is local, internal state only, exactly like
    processed_ids; a revocation-notification flow is a distinct, larger
    concern left for a future task
