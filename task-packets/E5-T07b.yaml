task_id: E5-T07b
title: Durable key-revocation record and the trust_revoked_after_creation annotation for already-accepted objects
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5, from exactly what task-packets/E5-T07.yaml's own scope_note
  deferred: "Durable REVOCATION state — a persisted revocation record plus
  the docs/spec/04 section 8.4 `trust_revoked_after_creation` annotation on
  ALREADY-ACCEPTED objects — is a SEPARATE behavior (annotating existing
  objects, not gating intake) and is deferred to a follow-up packet
  E5-T07b, for three reasons: (1) revocation is ALREADY enforced at intake
  by every resolver's at-instant KeyRing.is_valid_at check (E5-T02..T06) ...
  (2) bundling a second behavior would break template rules 1 and 10 ...
  (3) it mirrors this repo's own E5-T00/E5-T00b and E5-T02/E5-T02b splits."
  E5-T07 is approved and open as PR #40 (CI green; merge pending the
  owner's go-ahead) — its migration migrations/versions/983751ff8bb6_
  processed_ids_table.py becomes the Alembic head once merged, so this
  packet's own migration chains onto it (down_revision = "983751ff8bb6")
  and implementation MUST NOT start before PR #40 is merged. Source:
  docs/spec/04_SECURITY_AND_POLICY.md section 8.4 ("A practice can revoke a
  node or key. New objects are rejected after revocation. Existing objects
  remain historically attributable and may receive a
  `trust_revoked_after_creation` annotation.") and section 8.2 ("Processed
  envelope IDs are retained for replay detection according to policy" — the
  sibling durability concern E5-T07 already closed, whose composition with
  revocation this task must not disturb), docs/spec/02_DOMAIN_MODEL.md
  section 1.3 (a signature carries a `signed_at` timestamp — the exact field
  this task's annotation predicate is evaluated against), docs/spec/01_
  SYSTEM_SPEC.md section 8.4 (federated offline import/export MUST verify
  signatures, expiry, replay protection, and object hashes — the same
  federated-trust context E5-T07 cited), docs/spec/06_IMPLEMENTATION_PLAN.md
  Epic E5 (E5-T07 "replay, expiry, revocation, and idempotency hardening" —
  this packet is the "revocation" half of that same backlog line), and
  MRR-NFR-007/002/005/001 — the same four requirements E5-T07 itself cited,
  reused here because this is the other half of the same task line, not a
  new concern.

  Every E5-T02..T06 resolver ALREADY fails a NEW object closed at intake
  when its resolving key is revoked (`mrr.domain.key_management.KeyRing.
  is_valid_at` requires `state == "active"`) — that is unchanged and out of
  this task's scope. But nothing in the codebase durably records WHEN a key
  was revoked, or feeds that instant back into how an ALREADY-ACCEPTED
  object is later surfaced. `mrr.domain.key_management.revoke(ring, *,
  kid)` mutates an in-memory `KeyRing`'s descriptor to `state="revoked"`
  with NO timestamp at all — so even the in-memory model cannot answer "was
  this object's signing key already revoked when it was signed, or only
  afterward?", which is exactly the question docs/spec/04 section 8.4's
  "existing objects remain historically attributable and may receive a
  `trust_revoked_after_creation` annotation" requires an answer to. This
  packet is the first place in the codebase a revocation INSTANT is
  durably captured at all — a narrow, append-only FACT store (kid ->
  when/who/why revoked), mirroring E5-T07's own processed_ids table in
  shape and discipline, not a full persisted Practice/KeyRing registry
  (still explicitly out of scope, per E5-T02's own forbidden_changes: "a
  NEW persisted practice registry ... is a later concern").
objective: >
  Provide (1) a durable, append-only revocation-fact record — a new Alembic
  migration and a `key_revocations` table keyed by `kid` alone (a kid is
  already a global, content-derived fingerprint of one Ed25519 public key —
  `mrr.crypto.keys.derive_key_id` — so, unlike the per-recipient-node
  `processed_ids` table, there is no "per observer" scoping question here:
  a key is revoked once, globally, by the practice that owns it), recording
  `kid`, `practice_id` (the revoking practice), `revoked_at` (the instant
  the revocation takes effect — caller-supplied, never generated
  internally, mirroring `processed_ids.processed_at`), and an optional
  `reason`. (2) A `PostgresKeyRevocationStore` repository
  (packages/persistence) exposing `record_revocation(kid, *, practice_id,
  revoked_at, reason=None) -> bool` that inserts idempotently (`INSERT ...
  ON CONFLICT (kid) DO NOTHING`) and returns whether the row was newly
  recorded — so revoking the SAME kid twice, even with a different
  `revoked_at`/`reason`, is a silent no-op that PRESERVES the first-ever
  recorded fact, never an error and never a second write — plus a
  connection-accepting `record_revocation_with_connection` variant (mirrors
  `PostgresProcessedIdStore`'s split) for a future caller's own transaction,
  and `get_revocation(kid) -> RevocationRecord | None` (a read). Critically,
  NO update and NO delete method exists anywhere on this store: "a
  revocation, once recorded, can never be un-recorded by any public
  interface" is enforced by the absence of any such method, not by a
  runtime check. (3) A pure domain module
  (`mrr.domain.trust_revocation`) — unit- and property-testable WITHOUT
  Postgres — defining `RevocationRecord` (the frozen value object
  `get_revocation` returns: `kid`, `practice_id`, `revoked_at`, `reason`),
  the exact docs/spec/04 section 8.4 annotation string as a named constant
  (`TRUST_REVOKED_AFTER_CREATION_ANNOTATION = "trust_revoked_after_
  creation"`), and the pure predicate `trust_revoked_after_creation(
  signed_at, record) -> bool`: `True` iff `record is not None and signed_at
  < record.revoked_at` — an object signed strictly BEFORE its key's
  recorded revocation instant is annotated when surfaced; an object with no
  recorded revocation, or one evaluated at/after the revocation instant
  (already covered by existing at-instant intake checks, not this
  function's concern), is not. This is the whole of "annotating existing
  objects" per the scope_note: this task builds the durable fact and the
  pure decision function a future surfacing/projection service will call
  (mirrors E5-T07's own precedent of building the store and the predicate,
  leaving intake-service wiring to a later task) — it does NOT build that
  surfacing service, a new REST field, or a domain-event trail for
  revocation notifications.
