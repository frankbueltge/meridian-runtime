forbidden_changes:
  - the E5-T02..T06 resolvers' at-instant fail-closed checks
    (resolve_trusted_manifest_key, validate_inbound_envelope, task_trust,
    crate_trust, validate_inbound_bundle) and mrr.domain.key_management's
    KeyRing/PublicKeyDescriptor/rotate/revoke — reuse UNCHANGED. This task
    does NOT re-wire any resolver to consult the new durable store for an
    INTAKE decision; that would reopen "no persisted practice registry"
    (E5-T02's own forbidden_changes) and contradicts the scope_note's own
    framing ("annotating existing objects, not gating intake")
  - the E5-T07 processed_ids table, PostgresProcessedIdStore, and
    mrr.domain.replay_retention (reuse UNCHANGED) — this task ADDS a new
    table and a new repository class; it does not alter the existing ones,
    and replay/expiry retention logic is not touched or reimplemented here
  - the contract models (packages/contracts) and any JSON Schema semantics
    — a key-revocation row is INTERNAL node state, exactly like
    processed_ids (task-packets/E5-T07.yaml: "internal node state ... no
    contract/schema/example"), not a cross-practice object; it gets no
    schema/contract/example and no scripts/check_contracts.py entry
  - a persisted Practice/KeyRing/PublicKeyDescriptor registry of any kind —
    still out of scope (E5-T02's own forbidden_changes: "a NEW persisted
    practice registry ... is a later concern"). This task persists ONLY the
    revocation FACT (kid, practice_id, revoked_at, reason), never a full
    key or key-lifecycle registry, and record_revocation performs NO
    authorization check that practice_id actually owns kid — that check
    needs a persisted practice/key registry that does not exist anywhere in
    this codebase yet, so it is the CALLER's responsibility (mirrors
    record_processed: the caller decides what to record; this store only
    records it durably)
  - any domain event, outbox row, or notification for a "key revoked" fact
    — an event-log-based revocation notification (e.g. to other practices)
    is a distinct, larger concern than a local durable record and is not
    built here (see specification_gaps)
  - any service, REST endpoint, or projection that actually SURFACES an
    already-accepted object with the annotation attached — this task builds
    the durable record and the pure trust_revoked_after_creation predicate
    only; wiring it into a query/export/projection response is later
    service work, exactly as E5-T07 built the store and predicate but left
    "full validate-then-record intake transaction" to E2E-002
  - API endpoints, workflow-engine integration, external message brokers or
    delivery transports, and the physical air-gap medium (out of Epic scope
    here, as for E5-T07); no new authoritative cross-practice object
  - the E1-T06 domain_events/outbox tables and the E1-T05 objects/edges
    repositories (reuse the UnitOfWork/transaction and Alembic patterns
    unchanged; ADD a table and a repository, do not alter existing ones)
derived_decisions: >
  The table is keyed by `kid` ALONE, not `(practice_id, kid)`: unlike
  `processed_ids` (where the SAME message/bundle id delivered to two
  DIFFERENT receiving nodes is legitimately not a replay at either, which is
  why that table's key includes the recipient), a kid is already a
  content-derived, globally unique fingerprint of one specific Ed25519
  public key (`derive_key_id` = `"kid:" + base64(SHA-256(raw 32 key
  bytes))`) — the same key cannot legitimately belong to two different
  practices, so "is this kid revoked" has exactly one true answer,
  independent of who is asking. `record_revocation` uses `INSERT ... ON
  CONFLICT (kid) DO NOTHING`, exactly like `PostgresProcessedIdStore.
  record_processed`'s `ON CONFLICT (recipient_node_id, id) DO NOTHING` — the
  idempotency and immutability anchor is the database constraint, never an
  application-level "check then write" that could race. Because there is no
  UPDATE path anywhere on this store (not even to "correct" a wrong
  `revoked_at` or `reason`), the FIRST call to record a given kid's
  revocation is permanent and authoritative for the lifetime of the row —
  a second, differently-parameterized call is a silent no-op, proven by an
  acceptance test that asserts the ORIGINAL values survive a second call
  with different arguments. This is a deliberately more rigid guarantee
  than `mrr.domain.key_management.revoke`'s in-memory, freely-repeatable
  `replace(descriptor, state="revoked")` — appropriate because THIS store
  is the durable, single source of truth for "when," where the in-memory
  ring is a transient, caller-assembled view.

  `RevocationRecord` (mrr.domain.trust_revocation) mirrors `mrr.domain.
  key_management.PublicKeyDescriptor`'s discipline of validating its own
  invariants in `__post_init__` rather than trusting the caller: `kid` and
  `practice_id` must be non-empty, and `revoked_at` must be an aware
  datetime (raising `ValueError`, exactly like `PublicKeyDescriptor`'s own
  `valid_from`/`valid_until` check) — a naive datetime silently compared
  against another naive or aware datetime is exactly the class of bug
  `trust_revoked_after_creation`'s own correctness depends on avoiding.
  `trust_revoked_after_creation(signed_at, record)` takes the WHOLE
  `RevocationRecord | None` (not a bare `datetime | None`) so a future
  caller never has to unpack a record just to hand this function a
  timestamp, and so the function reads exactly like `mrr.domain.
  key_management.KeyRing.is_valid_at`'s own "never raises, fails closed on
  None" shape. The boundary is exclusive on both ends by construction:
  `signed_at < record.revoked_at` is the ONLY case that annotates; a
  signature timestamp equal to or after `revoked_at` is not (that instant
  is already the "objects signed after revocation fail closed" territory
  the E5-T02..T06 resolvers own, not this function's), so the two concerns
  never overlap or double-count the same instant.

  `PostgresKeyRevocationStore` is deliberately NOT wired to feed
  `mrr.domain.key_management.KeyRing` (no "build a ring from durable
  revocations" bridge function is built): doing so would re-invite exactly
  the re-verification question the scope_note rules out — an
  already-accepted object is never re-run through
  resolve_trusted_manifest_key/validate_inbound_envelope/etc. with "now" set
  to the current instant, because at-instant re-verification of a
  historical object is precisely what "existing objects remain historically
  attributable" (docs/spec/04 section 8.4) forbids. The composition this
  task DOES prove is with the E5-T07 replay store: an envelope already
  recorded as processed stays rejected by `EnvelopeAlreadyProcessedError`
  even after its signing key is later durably revoked — revocation
  durability and replay durability are two independent, non-competing
  mechanisms over the same accepted object, and neither task's rejection
  reason leaks into the other's.
invariants:
  - a revocation, once recorded via record_revocation(kid, ...), can never
    be un-recorded, updated, or deleted by any public interface on
    PostgresKeyRevocationStore — no such method exists, and a second
    record_revocation call for the same kid (even with different
    revoked_at/reason) is a no-op that leaves the ORIGINAL row untouched
  - get_revocation(kid) returns the RevocationRecord for kid if and only if
    record_revocation has ever been called for that kid; for any kid never
    recorded it returns None — there is no other source of "is this kid
    revoked" in this table
  - trust_revoked_after_creation(signed_at, record) is True if and only if
    record is not None and signed_at is strictly before record.revoked_at
    — an object signed BEFORE its key's recorded revocation instant is
    annotated when surfaced; a record of None, or signed_at at/after
    revoked_at, yields False
  - objects signed AFTER their key's revocation still fail closed at
    intake — UNCHANGED, because this task adds no new intake-gating logic
    and does not touch the E5-T02..T06 resolvers or mrr.domain.
    key_management; this invariant is protected by those existing suites
    staying green, not by any new code this task adds
  - replay of a pre-revocation envelope/bundle after its key is later
    durably revoked is STILL rejected by the UNCHANGED E5-T07 predicate
    (EnvelopeAlreadyProcessedError / BundleAlreadyProcessedError) — a
    later revocation never re-opens, weakens, or is conflated with the
    replay check; the two mechanisms compose without either masking the
    other's distinct typed error
  - revocation state survives process restart: a fresh Engine/connection
    against the same database sees exactly the same get_revocation(kid)
    result a prior connection recorded — durability is a property of
    PostgreSQL, not of any in-process cache this store does not keep
  - the store is internal node state: it adds no contract/schema/example,
    imports no provider SDK beyond SQLAlchemy, and both import-linter
    contracts stay KEPT; the E1-T05/E1-T06/E5-T07 tables and repositories
    are unchanged
  - a key_revocations row is append-only: it is written exactly once by
    record_revocation and never mutated or deleted by anything in this
    codebase
acceptance_tests:
  - integration (Postgres, CI): alembic upgrade head creates the
    key_revocations table
  - integration: record_revocation then get_revocation returns a
    RevocationRecord whose kid/practice_id/revoked_at/reason match exactly
    what was recorded; a kid never recorded returns None from
    get_revocation
  - integration: recording the SAME kid twice with DIFFERENT
    revoked_at/reason values leaves exactly one row, returns False (not an
    error) on the second call, and get_revocation still returns the FIRST
    call's original values unchanged — proving immutability is enforced by
    the database constraint, not by application logic that could be
    bypassed
  - integration (restart durability): record a revocation through one
    Engine/connection, then open a genuinely SEPARATE sqlalchemy.Engine
    against the identical database/schema (not the same Python object, no
    shared cache) and confirm a NEW PostgresKeyRevocationStore built on
    that second engine still returns the identical RevocationRecord via
    get_revocation — the fact is durable in PostgreSQL itself, not held in
    any process-local state
  - integration: record_revocation_with_connection participates in a
    caller's transaction — a rollback after the call leaves no row (mirrors
    tests/integration/persistence/test_processed_id_store.py's
    test_record_processed_with_connection_rollback_leaves_no_row)
  - unit (no Postgres): trust_revoked_after_creation returns True for
    signed_at strictly before record.revoked_at, False for signed_at ==
    revoked_at (exact boundary), False for signed_at strictly after
    revoked_at, and False when record is None
  - unit (no Postgres): constructing a RevocationRecord with a naive
    (non-timezone-aware) revoked_at, or an empty kid/practice_id, raises
    ValueError — mirrors PublicKeyDescriptor's own __post_init__ discipline
  - property (no Postgres): for arbitrary aware datetimes signed_at and
    revoked_at, trust_revoked_after_creation(signed_at,
    RevocationRecord(..., revoked_at=revoked_at)) equals exactly
    (signed_at < revoked_at), and is False for every signed_at when record
    is None — a total, deterministic function over every instant pair
  - integration (composition with E5-T07, end to end): using the existing
    PostgresProcessedIdStore machinery, accept and record-as-processed a
    real signed NodeMessageEnvelope; separately record_revocation for its
    signing kid with a revoked_at strictly after the envelope's own
    signature.signed_at; assert (a) trust_revoked_after_creation(envelope.
    signature.signed_at, store.get_revocation(kid)) is True (the surfaced-
    annotation case), and (b) resubmitting the SAME envelope is still
    rejected by EnvelopeAlreadyProcessedError specifically — never a new or
    competing "revoked" rejection reason for an already-processed message
  - regression: every existing E5-T02..T06 fail-closed-on-revoked-key
    acceptance test remains green, unmodified — proving intake-time
    rejection behavior is untouched by this task
  - all existing suites stay green; both import-linter contracts remain
    KEPT; the integration tier skips VISIBLY when MRR_TEST_DATABASE_URL is
    unset locally and FAILS (never skips) if unset in CI, per
    tests/integration/conftest.py
