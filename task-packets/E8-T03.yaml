derived_decisions:
  - >-
    (a) One closure, two consumers: the report deliberately shows exactly
    what the export ships — a report statement whose object is absent from
    the RO-Crate export would be a projection of nothing verifiable. The
    R2 extraction is the mechanism; divergence between report content and
    export content is a bug by definition.
  - >-
    (b) No model call, no Markdown/HTML library: both prohibitions of
    MRR-FR-104 are discharged structurally (deterministic renderer + R5's
    mechanical tests), and the HTML variant's self-containment mirrors the
    export's own no-external-reference stance.
  - >-
    (c) partner-restricted disclosure is a NAMED GAP, not a silent one:
    MRR-FR-103 lists three projections; this packet ships two. The third
    requires a partner-classification vocabulary and transfer-obligation
    integration that no spec section yet grounds — deferred with this
    paper trail rather than approximated.
  - >-
    (d) The classification attestation stays a caller-supplied input (the
    E6-T05/ADR-0010 bridge), now materialized as an explicit CLI file
    argument — the report packet does not sneak in the stored
    classification field that bridge deliberately postponed.
  - >-
    (e) Verification confidence numbers are printed with their declared
    nature: the claim-table row labels the column "reviewer confidence
    (self-declared)" — the AGENTS prohibition on treating a confidence
    number as epistemic confidence applied to typography.
invariants:
  - No model/LLM call anywhere; renderer output is a pure function of (closure, corrections, disclosure, attestation).
  - Every urn in the rendered output exists in the closure input (R5, mechanical).
  - The corrections section exists in every render; unresolved critical corrections are always visible.
  - Identifiers and hashes are never redacted; free text is fail-closed redacted in the public variant.
  - No wall-clock timestamp in the rendered bytes; byte-determinism for fixed inputs.
  - E8-T01/T02 behavior unchanged (their suites pass unmodified after the R2 extraction).
acceptance_tests:
  - >-
    AT1: the integration fixture (with a seeded pass+fail verification
    pair on one claim and one unresolved critical correction) renders in
    all four (format × disclosure) combinations via the CLI; the
    disagreement is visible and marked in all four; the correction is
    visible in all four; exit 0 each.
  - >-
    AT2: the public render with an empty attestation mapping shows
    structure (urns, statuses, hashes, counts) and redaction markers, and
    not one byte of any stored assertion/finding/summary string; with the
    claim attested PUBLIC, its assertion appears while un-attested
    finding statements stay redacted — fail-closed granularity per object
    id, exactly the E6-T05 rule.
  - >-
    AT3: rendered_urns ⊆ closure_urns holds mechanically on every fixture
    render (R5); a control assertion proves the check CAN fail (a urn
    injected into a copy of the rendered text is caught).
  - >-
    AT4: byte-determinism — two renders of the same graph/attestation are
    identical; the only date string in the output equals the crate's
    created_at.
  - >-
    AT5: refusal/dependency paths per R4, each leaving no partial output
    file; E8-T01/T02 integration suites pass unmodified.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make test-integration
specification_gaps:
  - >-
    MRR-FR-103's partner-restricted projection: deferred, see
    derived_decisions (c). MRR-FR-101's full bundle (this report PLUS the
    export PLUS approval) is E8-T04's subject; this packet ships the
    report section list so T04 bundles, not re-invents.
  - >-
    "Evidence map" (MRR-FR-101) has no spec-defined layout; this packet
    renders it as the anchors/source-records section described in R1(4) —
    the layout choice is this packet's own, noted for the report.
required_output:
  - Packet report per AGENTS "Required delivery format", embedding one
    full Markdown render (internal) and the public variant of the same
    fixture verbatim, plus the exact CLI invocations.
stop_conditions:
  - >-
    If reusing mrr.domain.public_correction_view's functions for report
    text requires MODIFYING that module (forbidden here), STOP and report
    the dependency — never fork a second redaction rule.
  - >-
    If the R2 extraction cannot be made behavior-identical (any E8-T01/T02
    test needs a change beyond imports), STOP and report — the closure
    definition may not drift inside a report packet.
  - >-
    If MRR-FR-095's "display regardless" and the fail-closed redaction
    rule conflict in a case not covered by R3's resolution (existence and
    status always shown, free text gated), STOP and record the conflict —
    do not improvise a privacy/transparency trade-off.
