task_id: E8-T03
title: >-
  Markdown/HTML research report projection (MRR-FR-100/-101/-104, MRR-FR-095):
  a deterministic, crate-rooted narrative projection of the claim graph —
  methods, claim table with verifications and their disagreements, evidence
  map, counterevidence, uncertainty, known unknowns, corrections, provenance
  summary — rendered to Markdown and HTML from stored objects only, with the
  public disclosure variant redacted fail-closed by the E6-T05 rule.
status: approved
epic: E8
reviewer_resolution: >-
  Approved 2026-07-22 by the main session as reviewing instance, under the
  owner's decision record of the same date (Entscheidung 2). Primary design
  choices CONFIRMED: (1) the "narrative generator" of MRR-FR-104 is a
  DETERMINISTIC template renderer over stored objects — no model call
  anywhere in this packet; it structurally cannot invent a citation because
  every identifier it emits is read from a stored body or typed edge (the
  same ethos as the K1 pipelines' template prose, and the reason MRR-FR-104's
  two prohibitions are satisfied by construction plus one structural test
  each, not by review vigilance); (2) the report is CRATE-ROOTED, same
  anchor as E8-T01's export, reusing the SAME closure — one definition of
  "what belongs to this run's record", not a second competing one; the
  closure logic is EXTRACTED from ExportService.export into a public,
  behavior-identical read-only method on the same class, and the export
  packet's tests must keep passing unmodified to prove the extraction
  changed nothing; (3) disclosure levels shipped here are `internal` (full
  content) and `public` (E6-T05's fail-closed PUBLIC-attestation redaction,
  reused verbatim — never a second redaction rule; plus MRR-FR-095's
  mandatory unresolved-critical-corrections display). `partner-restricted`
  (MRR-FR-103's third projection) is deliberately NOT in this packet: the
  Classification vocabulary (mrr.domain.artifacts) has no partner level and
  the partner relationship machinery lives in the transfer layer — inventing
  a mapping here would guess governance the spec has not written; recorded
  as this packet's named gap, to be closed with the E8-T04/E5-transfer
  integration or an ADR; (4) both renderers are hand-rolled and pure — no
  Markdown/HTML library dependency; HTML is minimal semantic markup with
  strict escaping of every stored string; (5) no wall-clock anywhere in the
  rendered bytes (E8-T01's invariant carried over): the report's own date
  line is the crate's created_at, and determinism is byte-level for a fixed
  graph plus fixed attestation input.
depends_on: [E8-T01, E8-T02]
derivation: >-
  Derived 2026-07-22 from: docs/spec/06_IMPLEMENTATION_PLAN.md §3/E8-T03;
  docs/spec/01_SYSTEM_SPEC.md Stage 11 — MRR-FR-100 (reports are
  projections from versioned objects), MRR-FR-101 (the section list this
  packet's report model mirrors ahead of E8-T04's bundle), MRR-FR-103
  (disclosure projections; partially deferred, see reviewer_resolution 3),
  MRR-FR-104 (no invented citations, no omitted material unresolved
  corrections) — plus MRR-FR-095 (public projections display unresolved
  critical corrections) and §7.9 (Projection Service: "reports and portable
  bundles from a fixed graph revision"); AGENTS.md source-of-truth
  ("Narrative reports are projections and are never the primary research
  record"). Fact base verified first-hand at derivation time (fact-lock):
  ProjectionService (E3-T07/E6-T05) already builds claim tables, provenance
  maps, correction discovery, and the public fail-closed redaction
  (mrr.domain.public_correction_view: caller-supplied
  classification_by_object_id attestation, PUBLIC-only-when-every-
  dependency-attested rule); ExportService.export (E8-T01/T02) holds the
  crate closure incl. VerificationResult discovery; Classification =
  PUBLIC/INTERNAL/RESTRICTED/SENSITIVE/PARTICIPANT_IDENTIFIABLE (no partner
  level); the archive's real claims carry disagreeing verifications
  (pass c / fail d) that the claim table MUST surface, not average away.
objective: >-
  After this packet, `mrr report render` produces from one sealed crate a
  deterministic Markdown or HTML research report whose sections mirror
  MRR-FR-101 — methods, claim table (with every claim's status, uncertainty,
  evidence and counterevidence, and EVERY recorded verification including
  mutually disagreeing ones), evidence map, corrections (never omissible),
  known unknowns, failures, provenance summary — in an internal variant and
  a public variant redacted by the existing fail-closed rule. A reader of
  the public variant sees every unresolved critical correction and never
  sees un-attested free text; a reader of either variant can trace every
  statement to a URN and hash that the E8-T01 export makes independently
  verifiable.
source_of_truth:
  - docs/spec/01_SYSTEM_SPEC.md                     # Stage 11; MRR-FR-095; §7.9
  - docs/spec/06_IMPLEMENTATION_PLAN.md             # §3/E8
  - packages/domain/mrr/domain/public_correction_view.py  # THE redaction rule (reused, never forked)
  - services/control_plane/mrr/services/projection/service.py
  - services/control_plane/mrr/services/export/service.py # the closure this packet extracts and reuses
  - task-packets/E6-T05.yaml                        # attestation-mapping precedent and its ADR-0010 framing
requirements:
  - >-
    R1 (report model, pure): packages/domain/mrr/domain/research_report.py
    defines the frozen report model (dataclasses) and the two renderers
    render_markdown(model) / render_html(model) — pure functions, no I/O,
    no repository types, hand-rolled output, deterministic byte-for-byte.
    Sections, fixed order, ALWAYS all present (an empty section renders an
    explicit "none recorded" line, never disappears): (1) header — crate
    urn, run urn, run_state, practice, crate created_at (the only date in
    the document), content hash, object/artifact counts; (2) methods — the
    run's declared protocol/parameters artifact urns with hashes and the
    environment block (image digest, code revision, input hashes) verbatim;
    (3) claim table — per claim: urn, type, scope, status, uncertainty,
    assertion (disclosure-gated, see R3), evidence and counterevidence
    relation targets, dependencies, and EVERY VerificationResult targeting
    it (reviewer_role, recommendation, confidence, finding count, and each
    finding's severity+statement disclosure-gated) — two disagreeing
    verifications appear as two rows under the same claim, explicitly
    marked "disagreement on record", never merged or averaged (MRR-FR-077
    read into projection); (4) evidence map — source records and anchors
    with resolution status; (5) corrections — every discovered correction
    with status; unresolved critical ones FIRST and prefixed as such
    (MRR-FR-095); the section header is emitted even when empty
    (MRR-FR-104's "MUST NOT omit" made structural); (6) known unknowns —
    crate.known_unknowns plus per-claim known_unknowns; (7) failures —
    crate.failures verbatim (MRR-FR-054); (8) provenance summary — per
    claim, the count and a sorted, compact rendering of its provenance
    edges. HTML output escapes every stored string (a stored "<script>" is
    text, never markup) and carries no external resource reference — fully
    self-contained, no CSS/JS beyond minimal inline style-free semantic
    tags.
  - >-
    R2 (closure extraction, behavior-identical): ExportService gains a
    public read-only method resolve_closure(crate_id) returning the exact
    object-bodies mapping, provenance edges, and artifact refs that
    export() computes today, and export() is refactored to call it — no
    behavior change, proven by the E8-T01/T02 test suites passing
    unmodified. ReportService (new,
    services/control_plane/mrr/services/report/) composes ExportService
    for the closure and ProjectionService for corrections discovery —
    read-only, same dependency discipline as both precedents, no
    RecordRevisionWithEvent anywhere.
  - >-
    R3 (disclosure): render is parameterized disclosure=internal|public.
    internal renders every stored string. public applies
    mrr.domain.public_correction_view's fail-closed rule VERBATIM (reused
    functions, never a reimplementation): free text (assertions, finding
    statements, correction summaries, failure messages, known-unknown
    strings) appears only when every object id it depends on is attested
    "PUBLIC" in a caller-supplied classification_by_object_id mapping;
    otherwise the structural row stays (urn, status, counts — identifiers
    and hashes are never redacted, they are the record's spine) and the
    text is replaced by the module's existing redaction marker. Unresolved
    critical corrections are displayed in BOTH variants regardless of
    attestation (MRR-FR-095 outranks redaction for their existence and
    status; their free-text summary is still attestation-gated).
  - >-
    R4 (CLI): `mrr report render` in a sibling module
    services/control_plane/mrr/services/cli/report_main.py — flags
    --database-url, --crate-id, --output (file path), --format md|html,
    --disclosure internal|public, --classification-file (JSON object
    urn->classification; REQUIRED when --disclosure public, FORBIDDEN when
    internal — an explicit governance input, never defaulted). NFR-012
    ordering: --output conflict first (existing file refuses, exit 3),
    then --classification-file read+parsed+validated (public only), then
    database reachability, then exactly one ReportService call; atomic
    write (temp file + os.replace). Exit map 0 (single JSON result line:
    crate_id, output, format, disclosure, section counts) / 2 / 3, per the
    house convention. main.py gains exactly one additive registration.
  - >-
    R5 (structural MRR-FR-104 tests): one test proves the corrections
    section cannot be omitted (rendering a graph with an unresolved
    critical correction ALWAYS emits it, in both formats and both
    disclosures); one test proves no-invented-citations structurally —
    every urn appearing in the rendered output is a member of the closure
    input (rendered_urns ⊆ closure_urns, asserted mechanically on the
    fixture render).
  - >-
    R6 (tests at every tier): unit — model building from plain bodies,
    both renderers' determinism (byte-identity across calls and dict
    orders), HTML escaping (a stored string containing markup renders
    inert), empty-section explicit lines, disagreement marking with two
    opposing verifications, fail-closed redaction incl. missing-attestation
    and non-PUBLIC levels, R5's two structural tests; integration — seed
    the E8-T01/T02 fixture graph EXTENDED by a second disagreeing
    verification (pass and fail on the same claim), render md and html in
    both disclosures via the CLI entry point, assert the disagreement is
    visible, the public variant redacts un-attested assertions while
    keeping urns/hashes, exit codes and refusals (existing output file,
    missing classification file for public, classification file supplied
    for internal, unknown crate, unreachable DB); architecture — the new
    domain module imports no repository/service/adapter type. All make
    tiers green; e2e suite unchanged-green.
