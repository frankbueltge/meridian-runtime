  - services/control_plane/mrr/services/cli/export_main.py         # the command is complete; this packet is its missing caller
  - services/**                                                    # an integration packet composes, it does not build capability
  - packages/**
  - migrations/**
  - corpora/**
  - benchmarks/**
  - .github/workflows/research-run.yml                             # its pattern is copied, not changed
  - .github/workflows/field-watch.yml
  - .github/workflows/gold-classification.yml
  - pyproject.toml
  - uv.lock
  - frankbueltge.de/.github/workflows/ci.yml                       # the check must hold as it stands; changing it to pass would defeat it
  - frankbueltge.de/src/pages/on-record*                           # the instrument keeps its single-case reading
derived_decisions:
  - >-
    (a) An INTEGRATION packet, declared as such. `mrr export ro-crate` has
    existed since E8-T01 and has never been called by anything but a human on a
    laptop. That is the fourth row of AGENTS.md's own table — a finished layer
    whose outer edge nobody owned — and the packet type exists precisely so
    this work has somewhere to live. The one composition it performs (a restore
    step in front of an existing export) is named here rather than folded into
    a passthrough.
  - >-
    (b) The requirement is the second half of the owner's sentence. "Publish
    the runs" alone would be satisfied by hand-exporting run 2 and retyping a
    paragraph. "Do NOT just add run 2, or the site is out of date again
    immediately" is the real specification, and it can only be met by making
    the page COUNT rather than ASSERT. Everything else in this packet follows
    from that one reading.
  - >-
    (c) Restore into a throwaway database, never into a durable one. The dumps
    are the archive and archive/** is untouchable. A service container that
    dies with the job cannot corrupt the record, and it is the same isolation
    research-run.yml already relies on for the forward direction.
  - >-
    (d) A pull request on both sides, never a push to main. A crate is a
    published assertion about what a run found — the same class of artefact as
    a measured number, which gold-classification.yml lands on a branch for
    exactly this reason. The watch's direct push to main is the OTHER case (an
    observation is not a claim) and does not transfer here.
  - >-
    (e) /on-record stays a single-case instrument. The view model gains totals
    but keeps its feature claim, because the page's subject is one preserved
    disagreement shown thoroughly. Turning it into a run dashboard would answer
    the currency problem by destroying the work.
  - >-
    (f) Run 3 is exported and counted although it has zero verifications. A
    claim with no verification result is a real, unfinished archive state.
    Hiding it would be the less honest option and the page is built to hold
    unfinished states. It is shown as what it is.
  - >-
    (g) `--artifact-root` is deliberately absent. export_main.py:276-296
    forbids it with `--all-claims`, since a claim-rooted export fetches no
    artifact bytes — `artifact_count: 0` in the existing crate is that rule
    already visible in the published data.
invariants:
  - archive/dumps/ is byte-identical before and after every run of the workflow.
  - No step writes to the default branch of either repository.
  - The workflow has no `schedule:` trigger.
  - export_main.py and every module under services/ and packages/ are byte-identical after this packet.
  - The restored database exists only inside the job's service container and is never persisted.
  - refresh.py performs no network call, reads no clock and loads no model; two runs over identical crates produce byte-identical outputs.
  - After delivery, `refresh.py` followed by `git diff --exit-code` on the two derived files is clean.
  - No sentence in MethodenblattOnRecord.astro states a count that is not derived from the committed export.
acceptance_tests:
  - >-
    AT1 (the operator path works end to end): the workflow, run on a branch,
    restores all three dumps, exports three crates, and opens a pull request on
    frankbueltge.de containing them. Evidence is the run id and the pull
    request — an integration packet's acceptance criterion is the path, not a
    unit test.
  - >-
    AT2 (the archive is untouched): `git diff --exit-code -- archive/` is empty
    after a full run, and the job's own steps are asserted to open the dumps
    read-only.
  - >-
    AT3 (the counts are real): the delivered crates contain 2, 4 and 1
    mrr:Claim entries and 3, 6 and 0 mrr:VerificationResult entries
    respectively. VERIFIED against the real export 2026-08-02: claims matched
    the derivation exactly; verifications did NOT, and the derivation was
    wrong — its grep counted mentioned URNs rather than object bodies, and run
    2's dump mentions three of run 1's verifications. The export is the
    authority and the derivation is corrected.
  - >-
    AT4 (the check is green and stronger): with all crates committed,
    `python pipelines/meridian/refresh.py` then
    `git diff --exit-code -- src/data/meridian/mrr-graph.ttl src/data/meridian/parallax.json`
    exits clean; deleting one crate directory and re-running makes it fail,
    proving the check now covers every crate rather than one.
  - >-
    AT5 (the page cannot go stale): a test asserts that the strings "two
    claims" and "a single run" appear nowhere in MethodenblattOnRecord.astro,
    and that the counts at :30, :81 and :83 come from the view model. Adding a
    fourth crate to a fixture and re-deriving changes the rendered numbers with
    no edit to the component.
  - >-
    AT6 (honest degradation): with ECOLOGY_TOKEN unset the job still produces
    the crates, attaches them as an artefact, emits a warning naming the
    missing delivery, and does not fail silently or pretend it delivered.
  - >-
    AT7 (no clock): the workflow file contains no `schedule:` key, and
    `date_published` in every crate remains the maximum `created_at` across
    exported objects rather than a wall-clock read.
commands:
  - make lint
  - make typecheck
  # in frankbueltge.de:
  - npm run check
  - npm run test
  - npm run build
  - python pipelines/meridian/refresh.py
specification_gaps:
  - >-
    Run 3 (e2e-claims) carries a claim with zero verification results. Nothing
    in the specification says a claim must be verified before it may be
    exported, and MRR-MTH-011 makes unfinished terminal states first-class. It
    is published as what it is; whether the site should mark it visually is a
    presentation question left to the owner (derivation section 4).
  - >-
    The crates are delivered unsigned. `mrr federation envelope sign` exists
    and MERIDIAN_SIGNING_KEY is present in the repository, so signing the
    delivery is a retrofit rather than a blocker. Named, not done.
  - >-
    Measurement run 2 (cc6df74, accuracy 0.5263, kappa 0.2792) is NOT on main —
    it sits on origin/feat/n1-t04-modellgestuetzte-einordnung, pushed after PR
    #85 merged. Anyone quoting the 1.76-point spread today quotes a branch.
    This packet does not fix that, but the site must not print an accuracy
    figure without the spread, so the two are entangled. Carried as N1-T05
    §8.7.
required_output:
  - Packet report per AGENTS "Required delivery format", embedding the exact
    psql/export invocations, the per-run claim and verification counts as
    exported (against the derivation's counts from the dumps), the workflow run
    id, the pull request URLs on both repositories, and the before/after of the
    three sentences in MethodenblattOnRecord.astro.
stop_conditions:
  - >-
    If publishing appears to require changing `mrr export ro-crate`, STOP —
    this is an integration packet and a capability change belongs in its own
    ordinary packet.
  - >-
    If any step appears to require writing into archive/, STOP — the dumps are
    the record, and a restore that writes back is a corruption path.
  - >-
    If keeping the CI check green appears to require modifying that check,
    STOP — the check is the whole point, and a check edited to pass is worse
    than a red build.
  - >-
    If the honest fix appears to be "add run 2 and retype the paragraph", STOP
    — that is the outcome the owner explicitly excluded, and the packet has
    lost its objective.
