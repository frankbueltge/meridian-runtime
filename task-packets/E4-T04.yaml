task_id: E4-T04
title: Implement the SkepticalChallenge contract and the skeptic role
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E4 (E4-T04),
  docs/spec/01_SYSTEM_SPEC.md section 4.8 (Stage 8 - Skepticism and independent
  verification; MRR-FR-074 "The skeptic MUST search for counterevidence,
  alternative explanations, scope leakage, and hidden assumptions", MRR-FR-070,
  MRR-FR-077) and section 5 (A1 = clearly marked proposal); building on the
  merged E4-T01 port, E4-T02 structured generation, and the E4-T03 planner role
  (the direct structural precedent). Approved by the repository owner's standing
  direction to continue through E4 (2026-07-19). Fourth task of Epic E4 - the
  second AI ROLE: the skeptic produces skeptical challenges as proposals, never
  a verification verdict.
objective: >
  Provide (1) a SkepticalChallenge contract (the 15th entity: schema + Pydantic)
  - one skeptical challenge against a target claim, with challenge_type a closed
  enum of exactly the four MRR-FR-074 kinds (counterevidence,
  alternative_explanation, scope_leakage, hidden_assumption), a pinned reference
  to the challenged claim (id + content hash), the challenge statement and
  rationale, and the id + hash of the ModelProfile that produced it (so
  independence lineage is recorded); and (2) the skeptic role - a pure producer
  that, given a target claim and an injected E4-T01 ModelAdapter, uses the
  E4-T02 structured-generation layer to propose challenges across the four
  types, covering every type (recording "searched, none found" for a type that
  yields nothing - MRR-FR-074's "MUST search for" is a coverage duty, not a
  find duty). A SkepticalChallenge is a PROPOSAL, never a verification verdict:
  the skeptic issues no verification decision and changes no claim status
  (MRR-FR-070/075 are the verifier's, E4-T05). This task PRODUCES proposals in
  memory; it persists nothing and writes no authoritative state.
