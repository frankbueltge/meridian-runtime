    uniformly `"supported"` outcomes across every analysis — per the
    plan's own words ("a run that can only produce supported claims fails
    the packet"), STOP, report the exact classification in full, and
    revise the ConceptCharter's own operationalization or the inclusion
    criteria rather than silently loosening what "supported" means or
    discarding contrary evidence to force a `contested` reading
  - >-
    both analyses independently trigger `stop_insufficient_evidence` (i.e.
    the run produces NO claim at all, only two `ResearchDecision`s) — this
