specification_gaps:
  - >-
    The `operationalizes` edge is object-level (`ConceptCharter ->
    QuestionModel`), not the entry-to-term granularity spec 08 section 3's
    prose literally names — `TypedEdge` has no sub-object addressing
    mechanism today; the finer correspondence is carried only by an
    ordinary, non-schema-enforced naming convention (derived_decisions (g)).
  - >-
    The capability-name pattern conflict PR #52's review flagged
    (`NodeManifest.CapabilityDefinition.name`'s pattern vs. the real,
    already-accepted `CAPABILITY_NAME`) is NOT fixed by this packet — only
    guarded locally (derived_decisions (h)). The general fix remains open,
    left for a future, dedicated task.
  - >-
    `ProtocolParameters.kill_conditions`/`eligibility_rules` apply ONE
    shared threshold table across every `applies_to_analysis` group in a
    run — a genuine limitation for two analyses of very different natural
    scale (3 theory sources vs. 15 works candidates), worked around here by
    a single, carefully chosen shared number rather than a shape change to
    the protected `synthesis_executor.py` (derived_decisions (i)).
  - >-
    No JSON Schema exists for the protocol-parameters sidecar (inherited,
    unresolved, from K1-T03's own identical specification_gaps item) —
    still validated only by `ProtocolParameters`'s own Pydantic model, not
    by `scripts/check_contracts.py` or a contract-fixture test.
  - >-
    Whether the theory atlas's own per-entry `status` (`seed`/`read`/
    `worked`) should EVER gate `verification_status`, rather than treating
    the whole atlas as uniformly provenance-verified, is a live, disclosed
    judgment call (derived_decisions (c)); a reviewer may prefer the
    rejected, stricter alternative.
  - >-
    This packet cannot prove IN ADVANCE that the real, honest classification
    of the 15 works-atlas candidates will produce a genuinely mixed (not
    uniformly supported) outcome — it can only argue, from a first direct
    reading of each work's `decisive_move` text, why this is likely
    (derived_decisions (e)/(k)). If the real classification disagrees, the
    plan's own acceptance criterion is NOT met and this packet's own
    corpus/charter design needs revision — a stop_condition (below), not a
    result to silently work around. FLAGGED PROMINENTLY (required_output):
    this is this packet's single most consequential open judgment call.
  - >-
    Output landing, projection, or any site coupling for the resulting
    claim landscape is explicitly OUT of this packet's scope (the plan's
    own words: "Frank's call") — no projection/HTML/site code is touched,
    and this packet makes no recommendation about WHERE or WHETHER the
    resulting claim landscape should ever be published.
  - >-
    `amend`/`execute` transitions on the new `MethodProtocolService` are
    not implemented (only `create`/`submit_for_review`/`lock`) — a future
    task's job if this specific `MethodProtocol` is ever amended after this
    run.
  - >-
    Whether `QuestionModel`/`ConceptCharter` acceptance genuinely NEEDS its
    own domain event is not literally required by MRR-MTH-019 (which names
    only "Profile activation, protocol lock, ruling issuance, kill
    triggers, and research decisions" explicitly) — this packet emits one
    for both anyway, for consistency with every other Layer-1 kind's own
    existing precedent (`MethodProfile.accept` already does), an additive
    choice beyond the letter of MTH-019, not itself mandated.
  - >-
    The atlas-field -> `CorpusEntry`-field mapping (derived_decisions (b))
    is this packet's own disclosed convention, not itself independently
    schema-enforced beyond `CorpusEntry`'s own field types — a reviewer may
    prefer a different mapping (e.g. a dedicated `url` field added to
    `CorpusSourceIdentifiers`, which would touch the protected
    `synthesis_executor.py` and is therefore out of this packet's own
    scope).
