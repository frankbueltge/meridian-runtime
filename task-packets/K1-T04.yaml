task_id: K1-T04
title: >-
  First real run — the model-collapse question. QuestionModel + ConceptCharter
  (the load-bearing "instantiates the mechanism" vs. "references the theme"
  distinction) + a locked systematic_evidence_synthesis MethodProtocol, run
  over pinned, content-hash-verified COPIES of the two real atlases (theory
  atlas, 87 provenance-verified sources; works atlas, 214 verified data/AI
  artworks) through the unchanged K1-T03 executor/orchestration machinery ->
  a real EvidenceMatrix, a ceiling-capped claim landscape with an honest
  per-analysis status, and a sealed EvidenceCrate a third party can follow
  end to end. Final task of epic K1. Output landing / site coupling is
  explicitly OUT of scope (the project owner's own call, per the plan).
status: approved
depends_on: [K1-T03]
derivation: >-
  Derived per docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from
  docs/design/2026-07-21-research-method-kernel-plan.md's K1 epic
  ("K1-T04 — First real run: the model-collapse question", lines 60-69:
  "QuestionModel + ConceptCharter ... + locked protocol + run over the
  pinned atlas snapshots -> evidence matrix, ceiling-capped claim landscape
  with honest statuses, and a sealed crate. This packet also defines where
  the output lands for reuse (site coupling is Frank's call, out of scope
  here). Acceptance: the produced claim landscape reproduces or improves on
  the hand-done micro-inquiry's shape ... at least one claim MUST be capable
  of ending contested or insufficient_evidence on the real material — a run
  that can only produce supported claims fails the packet.") and
  docs/spec/08_RESEARCH_METHOD_KERNEL.md section 5's own closing paragraph
  ("First corpus and first question", lines 184-190: "the profile's first
  real inputs are the two existing human-curated evidence ledgers — the
  theory atlas (87 provenance-verified sources) and the works atlas (214
  verified data/AI artworks) — and its first question is whether works
  catalogued under AI-self-consumption actually instantiate the
  model-collapse mechanism the technical literature describes, or merely
  reference it. These corpora are external, human-curated ground truth by
  construction, which is the model-collapse mitigation this architecture
  depends on."). Fourth and final task of the K1 sub-epic; K1-T01
  (governance contracts), K1-T02 (edges/ceilings/gates), and K1-T03
  (systematic_evidence_synthesis v1 executor task family) are all MERGED on
  `main` at this derivation's time (confirmed directly: `git log --oneline`
  shows `accfef0` "K1-T03: systematic_evidence_synthesis executor —
  deterministic corpus synthesis (#52)" as the current tip of the K1 line,
  preceded by `9baf96a` K1-T02/#49 and `2ec8b25` K1-T01/#47; `git status`
  reports a clean working tree on `main`) — unlike K1-T03's own derivation,
  which had to account for an approved-but-unmerged K1-T02, this packet's
  single dependency is fully satisfied on `main` already; see
  coordination_note.

  K1-T01's OWN already-accepted worked examples (`examples/question-model
  .example.json`, `examples/concept-charter.example.json`, `examples/method
  -protocol.example.json`, `examples/evidence-matrix.example.json`, `examples
  /method-ruling.example.json`, `examples/research-decision.example.json` —
  all read in full) are, confirmed by direct reading, ALREADY BUILT AROUND
  THIS EXACT QUESTION: `question-model.example.json`'s own
  `raw_question` is "Do works catalogued under AI-self-consumption actually
  instantiate the model-collapse mechanism the technical literature
  describes, or merely reference it?", its `load_bearing_terms` are
  `["model-collapse mechanism", "instantiate", "reference"]`;
  `concept-charter.example.json` already carries the two entries
  `model-collapse-mechanism-v1`/`instantiate-vs-reference-v1` with the exact
  instantiate/reference operationalization this packet's objective names;
  `method-protocol.example.json`'s `planned_analyses` is
  `["instantiation-vs-reference-classification"]` and its `kill_conditions`
  is `["fewer than 5 included sources -> stop_insufficient_evidence"]`. This
  packet therefore does not invent new example content from scratch — it
  EXTENDS and grounds K1-T01's own already-accepted sketch with the real,
  pinned atlas content and a second analysis (the theory-side sanity check,
  derived_decisions (e)), and reconciles two numeric details the example
  sketch left unexamined against the real corpus (its kill-condition
  threshold of 5 vs. this packet's own threshold of 3, derived_decisions
  (i); its single planned analysis vs. this packet's two, derived_decisions
  (e)) — both are this packet's OWN proposal, not a redesign of the already-
  accepted examples themselves (which this packet's forbidden_changes does
  not touch).

  K1-T03.yaml's own specification_gaps explicitly name three items as
  "K1-T04's own scope to add, not retroactively this packet's": (1) "This
  packet does not build QuestionModelService/ConceptCharterService/a
  WRITE-side MethodProtocolService (create/submit/lock/amend) — it only
  reads already-accepted/locked instances via the generic ObjectRepository.
  If task-packets/K1-T04.yaml ... discovers it needs one of these services,
  that is K1-T04's own scope to add"; (2) "This packet writes governed_by_
  protocol/ruled_by/decided_by edges but never operationalizes
  (ConceptCharter entry -> QuestionModel term) ... that edge is written when
  a ConceptCharter is actually authored against a QuestionModel (K1-T04's
  concern)". This packet accepts both as its own scope (derived_decisions
  (f)/(g)). PR #52's own review comment (`gh pr view 52 --json comments`,
  read in full) additionally flags a THIRD open item for this packet
  specifically: "the capability-name synonym is single-sourced with no
  silent-drift vector today — noted for K1-T04 planners that
  MethodProfile.executor_task_family is not yet cross-checked against it."
  This packet resolves that note explicitly: DEFERRED, with a narrow local
  guard added instead of the general fix (derived_decisions (h)) — a
  deliberate decision, not a silent omission.

  `mrr.services.node_runtime.synthesis_executor` (K1-T03, read in full
  again here) fixes this packet's own inbound data shapes exactly:
  `CorpusEntry` (`model_config = ConfigDict(extra="forbid")` — no field
  beyond its own declared set: `entry_id`, `applies_to_analysis`,
  `claim_type` (`Literal["observational","interpretive"]`),
  `evidence_relation` (`Literal["supports","contradicts","qualifies",
  "contextualizes"]`), `verification_status`
  (`Literal["verified","unverifiable","pending"]`), `unverifiable_reason`,
  `claim_relevant_finding`, `extraction`, `source_family_id`, plus the
  SourceRecord-shaped fields `identifiers` (`CorpusSourceIdentifiers`:
  `doi`/`repository_id`/`archive_id`/`local_asset_id` — no raw `url` field
  anywhere), `title`, `creators`, `publication_date`, `version`,
  `retrieval_timestamp`, `retrieval_method`, `source_type`,
  `primary_secondary_derived`, `derivation_evidence`, `accessibility`,
  `licensing`) and `ProtocolParameters` (`protocol_id`,
  `protocol_lock_content_hash`, `inclusion_filter: dict[str,
  _InclusionFieldPredicate]`, `eligibility_rules: dict[str,
  _EligibilityRule]` requiring exactly the two keys `"supported"`/
  `"contested"`, `kill_conditions: _KillConditions` — ONE
  `stop_insufficient_evidence.min_included_sources: int`, GLOBAL across
  every `applies_to_analysis` group in one run, confirmed by direct reading
  of `_classify_analysis`'s own single `min_included_sources` local
  variable applied identically to whichever group is being classified —
  `non_applicability_conditions: list[str]`, `Field(min_length=1)`).
  Neither shape is this packet's to modify (forbidden_changes); this packet
  designs its own real corpus and protocol-parameters content to fit them
  exactly, and discloses the one place where that is a genuine constraint
  rather than a free choice (derived_decisions (i)).

  `services/control_plane/mrr/services/method_profile/service.py`
  (K0-T01, read in full) and `services/control_plane/mrr/services/
  evidence_matrix/service.py` (K1-T03, read in full) are the direct
  structural templates for this packet's three new write-side services
  (derived_decisions (f)): `MethodProfileService`'s own `propose`/`accept`/
  `supersede` shape and event names (`method_profile.proposed`/`.accepted`/
  `.superseded`) for `QuestionModelService`/`ConceptCharterService` (whose
  lifecycles — `QUESTION_MODEL_LIFECYCLE`/`CONCEPT_CHARTER_LIFECYCLE`,
  `packages/domain/mrr/domain/lifecycles.py` lines 655-689, confirmed by
  direct reading — are the IDENTICAL two-edge `draft -> accepted ->
  superseded` shape as `METHOD_PROFILE_LIFECYCLE`); `EvidenceMatrixService`'s
  own "only implement the transitions this run's own caller actually needs,
  leave the rest for a future task" restraint for the new
  `MethodProtocolService` (`METHOD_PROTOCOL_LIFECYCLE`, five edges,
  `packages/domain/mrr/domain/lifecycles.py` lines 739-742 area, confirmed:
  `draft -> reviewed -> locked -> amended | executed`, `amended ->
  reviewed`) — this packet implements only `create`/`submit_for_review`/
  `lock` (the three transitions this run's own single, first-time
  confirmatory pass needs), leaving `amend`/`execute` undrawn-by-this-
  service for a future task, exactly mirroring `EvidenceMatrixService`'s own
  disclosed "`superseded` not needed by this run's own caller" restraint.

  `services/control_plane/mrr/services/cli/main.py` (E2-T07, read in full)
  is the direct template for this packet's own new CLI subcommand: its
  MRR-NFR-012 "explicit degradation, never a fabricated substitute"
  discipline (DB-reachability and artifact-root-writability checks before
  any service call; `code_revision` injected via `--code-revision`/
  `MRR_CODE_COMMIT`, never derived by shelling out to `git`) and its
  argparse subparser shape (`build_parser`/`_run_command`/`main`) are
  reused verbatim in spirit for the new `synthesis run` subcommand
  (derived_decisions (l)).

  The two real corpora were verified to exist and their content read in
  full at derivation time: `/Users/frankbultge/Documents/GitHub/irrtum-als
  -methode/atlas/atlas.json` (87 entries, confirmed by direct count;
  fields `id`/`author`/`work`/`year`/`type`/`url`/`tags`/`summary`/
  `relevance`/`added_by`/`status`/`session_read`, confirmed by direct
  reading of the first entry and a full field-name scan) and
  `/Users/frankbultge/Documents/GitHub/frankbueltge.de/src/data/atlas/
  werke.json` (214 entries, confirmed by direct count; fields `title`/
  `artist`/`year`/`venue_prize`/`clusters`/`axis_pole`/`form`/
  `medium_class`/`lab_renderable`/`decisive_move`/`source_url`/
  `verify_status`). `sha256sum` recomputed FRESH at derivation time against
  both files, matching the two previously-recorded hashes EXACTLY:
  theory atlas `f712ea4e9c6b9137fa180ad91e73a86d8d09862792f33174c77acd76a891
  e610`; works atlas `9d14e877efb245cc04b8451734b26285a274dda0418f5131db257
  d2e4312d373` — both recorded again in derived_decisions (a) as the pinned
  values this packet's own corpus snapshot copies are hash-bound to.

  Neither atlas carries a literal "model-collapse"/"AI-self-consumption"
  TAG value anywhere (confirmed: the theory atlas's full 87-entry tag
  vocabulary — `epistemologie`, `ästhetik`, `artistic-research`,
  `maschine/ki`, `computation`, `philosophie`, `fehler`,
  `practice-as-research`, `kybernetik`, `beobachter`, `nicht-wissen`,
  `clinamen/aleatorik`, `constraint/oulipo`, `diffraktion`, `rhizom`,
  `selbstreferenz` — has no such tag; the works atlas has no `tags` field
  at all). The task's own framing ("clusters/tags match AI-self-consumption
  themes") is satisfied precisely by `werke.json`'s numeric `clusters`
  field, cross-referenced against `/Users/frankbultge/Documents/GitHub/
  frankbueltge.de/src/data/field/clusters.json` (read in full): cluster 7 is
  named, verbatim, `"AI self-consumption"`, status `"emerging"`, blurb
  "Turning AI's own logic against itself: benchmarks eaten by the models
  they measure, fairness criteria that are mathematically impossible to
  satisfy at once." Exactly 15 of the 214 works-atlas entries carry `7` in
  their own `clusters` array (confirmed by direct count and full listing,
  derived_decisions (d)). The theory atlas has no equivalent numeric
  cluster field at all, so its own candidate set is found instead by a
  disclosed keyword match over free text (derived_decisions (d)) — three
  entries, confirmed by direct reading of their `tags`/`summary`/`work`
  fields: `shumailov-curse-of-recursion` (Shumailov, Shumaylov, Zhao, Gal,
  Papernot & Anderson, "The Curse of Recursion: Training on Generated Data
  Makes Models Forget", 2023, peer-reviewed as Nature 631 (2024), also
  arXiv), `alemohammad-self-consuming-generative-models-go-mad`
  (Alemohammad, Casco-Rodriguez, Luzi, Humayun, Babaei, LeJeune, Siahkoohi &
  Baraniuk, "Self-Consuming Generative Models Go MAD", 2023, arXiv), and
  `gerstgrasser-is-model-collapse-inevitable` (Gerstgrasser, Schaeffer et
  al., "Is Model Collapse Inevitable? Breaking the Curse of Recursion by
  Accumulating Real and Synthetic Data", 2024, also COLM 2024, arXiv) —
  three fully distinct author teams and three distinct venues, so three
  independent source families by construction.

  The task's own two named reference cases were confirmed present, verbatim,
  in the pinned works-atlas snapshot: `Hammond, Felicity | "V3: Model
  Collapse" | 2025 | clusters [4, 7] | verify_status "verified" |
  decisive_move: "Third chapter of a four-part project in which each
  exhibition's own photographs and collages are fed back as training data
  for the next - literalizes AI model collapse as a visible, physically-
  installed material process..."` — a description that, read against the
  ConceptCharter's own `instantiate-vs-reference-v1` criterion (own-output
  fed back as training data across successive generations), plainly
  describes a genuine multi-generation recursive-training loop; and
  `Kurant, Agnieszka | "Errorism" | 2024 | clusters [4, 7] | verify_status
  "verified" | decisive_move: "Kurant feeds her own writings into GPT-2 and
  GPT-3 and renders the output as a holographic animation, literally
  closing the loop of a model trained on and regurgitating one author's own
  words..."` — which trains a model on the ARTIST'S OWN (human-authored)
  prior writing, not on a PRIOR GENERATION OF THE MODEL'S OWN output; the
  atlas's own description does not establish a model-generation-to-model-
  generation loop, only an author-to-model-to-output loop — a genuinely
  different mechanism from the technical literature's own recursive-
  training definition, which is why the task's own framing marks this case
  "(assess)" rather than pre-deciding it. This packet does NOT itself
  decide whether Kurant's case ends up `supports`/`contradicts`/`qualifies`
  — that is exactly the extraction judgment call derived_decisions (j)
  leaves to implementation time, on the record, unhardcoded.

  Exactly one of the 15 works-atlas cluster-7 candidates carries
  `verify_status: "toVerify"` rather than `"verified"` (confirmed by direct
  reading: UBERMORGEN, Leonardo Impett & Joasia Krysa, "The Next Biennial
  Should Be Curated by a Machine") — a naturally-occurring, non-injected
  case for the `verification_status: "pending"`/`"unverifiable"` machinery
  MRR-MTH-015 requires this packet's corpus to actually exercise
  (derived_decisions (c)).

  No persisted "hand-done micro-inquiry" document exists anywhere in either
  this repository or the two atlas repositories (confirmed by
  `grep -ril` across all three trees for "micro-inquiry"/"Hammond"/
  "Kurant"/"Errorism"): the only textual trace is one paragraph in
  `docs/design/2026-07-21-research-method-kernel-handoff.md` section 8
  (lines 308-314, read in full): "in the originating conversation a
  micro-inquiry was done by hand — cross-verifying whether art case studies
  of 'AI model collapse' (Hammond V3: Model Collapse, Kurant Errorism)
  actually instantiate the mechanism the model-collapse papers describe —
  producing a claim table with evidence + independence check + honest
  status (SUPPORTED / PARTIAL-thematic / CONTESTED-by-own-record). That
  output IS what a systematic_evidence_synthesis profile should produce.
  Reconstruct it if useful; it's the concrete target shape." This is a
  genuine, disclosed limit on what "reproduces or improves on the hand-done
  shape" can mean as an acceptance test: there is no surviving artifact to
  diff against, only this one-paragraph description of its STRUCTURAL
  shape — see derived_decisions (k) for how this packet turns that shape
  description into a machine-checkable test without inventing or
  hardcoding the specific claim values the lost original may have reached.

  License compatibility of committing atlas COPIES into this repository
  (task's own question (1)) was checked by direct reading of all three
  repositories' own `LICENSE.md` files: `meridian-runtime/LICENSE.md`,
  `irrtum-als-methode/LICENSE.md`, and `frankbueltge.de/CLAUDE.md`'s own
  "License (all lab repos, 2026-07-12): noncommercial" note (cross-checked
  against `frankbueltge.de`'s own license framing) all carry the IDENTICAL
  license pair — code under PolyForm Noncommercial License 1.0.0, "Works,
  texts, images and data" under CC BY-NC-SA 4.0 — with the IDENTICAL
  Required Notice, "Copyright Frank Bültge (https://frankbueltge.de)", in
  both `meridian-runtime` and `irrtum-als-methode`'s own `LICENSE.md` files
  verbatim. Same rights holder, same license family, share-alike trivially
  satisfied by construction — see derived_decisions (a).
objective: >-
  Deliver the first real `systematic_evidence_synthesis` v1 research output,
  in four parts:

  (a) Pinned, hash-verified COPIES of the two complete real atlases,
  committed under a new `corpora/model-collapse/` directory, plus this
  packet's own drafted PROPOSAL content for the QuestionModel, ConceptCharter,
  MethodProtocol, and protocol-parameters sidecar — every governance-object
  proposal explicitly marked as a proposal, reviewable by the project owner
  before any publication, per the task's own instruction.

  (b) Three new, minimal, additive-only write-side services —
  `QuestionModelService`, `ConceptCharterService` (create/accept, mirroring
  `MethodProfileService` exactly), and a `MethodProtocolService` scoped to
  `create`/`submit_for_review`/`lock` only (mirroring `EvidenceMatrixService`'s
  own "implement only what this run's own caller needs" restraint) — so this
  first real run drives its own prerequisite objects through their REAL,
  event-emitting lifecycles rather than bypassing them with a raw,
  test-only `_seed_generic`-style insert.

  (c) A new composition function, `establish_and_run_synthesis`
  (`services/control_plane/mrr/services/cli/synthesis_setup.py`, new file —
  NOT a modification of `synthesis_orchestration.py`, mirroring that
  module's own "new sibling file, not a modification" discipline), which
  proposes+accepts a fresh `MethodProfile` (or reuses a caller-supplied
  accepted one), proposes+accepts the `QuestionModel` and `ConceptCharter`,
  writes the `operationalizes` edge between them, creates+reviews+locks the
  `MethodProtocol`, and then calls the EXISTING, UNCHANGED
  `run_synthesis_evidence_loop` (K1-T03) with the real corpus derived from
  the pinned atlas snapshots and the protocol-parameters sidecar.

  (d) A new CLI subcommand, `mrr synthesis run`, so the project owner can
  reproduce the real run from the committed fixtures with one command,
  mirroring `mrr run`'s own MRR-NFR-012 "explicit degradation, never a
  fabricated substitute" discipline.

  Deliberately and explicitly deferred, with reasons given: (i) the general
  fix for the capability-name pattern conflict PR #52's review flagged
  (derived_decisions (h)); (ii) per-analysis kill-condition/eligibility
  thresholds, which the existing, protected `ProtocolParameters` sidecar
  shape cannot express (derived_decisions (i)); (iii) `amend`/`execute`
  transitions on the new `MethodProtocolService`; (iv) the model-assisted
  extraction path (K1-T03's own separately-tested, optional slice is reused
  UNCHANGED, never exercised by this run's own acceptance path,
  derived_decisions (j)); (v) any output landing, projection, or site
  coupling for the resulting claim landscape (the plan's own words: "Frank's
  call", explicitly out of scope here).
