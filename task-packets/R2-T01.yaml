  - packages/domain/mrr/domain/citation_audit_report.py                 # embedded report type + honesty-header/render precedent to mirror
  - services/control_plane/mrr/services/cli/citation_audit_main.py      # CLI pattern (NFR-012 ordering, exit 0/2/3, atomic os.replace)
