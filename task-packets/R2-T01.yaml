requirements:
  - >-
    R1 (pure observation core, packages/domain/mrr/domain/field_observation.py):
    hand-rolled, no new dependency, pure and no-IO (takes already-computed hashes,
    never reads a file itself — mirrors mrr.domain.citation_audit's "takes
    already-loaded values"). Dataclasses (frozen, slots): BatchInput(role, path,
    declared_sha256), ObservationBatch(schema_version, batch_id, observation_kind,
    audit_target, manifest: BatchInput, snapshot: BatchInput). An AnchorStatus
    Literal closed set {"anchor_ok", "anchor_mismatch"} and an AnchorCheckResult
    dataclass (role, path, declared_sha256, actual_sha256, status). A pure
    check_anchor(role, path, declared_sha256, actual_sha256) -> AnchorCheckResult
    that compares the two hash strings for exact equality (both already in
    "sha256:<hex>" form; no normalisation guessed). A typed IntegrityGateError
    (subclass of a module base error) carrying the role, path, declared_sha256 and
    actual_sha256, raised by check_and_gate(results: Sequence[AnchorCheckResult]) ->
    None the moment ANY result is "anchor_mismatch" — fail-closed, naming the FIRST
    mismatch in a stable order (sorted by role). Determinism: no wall clock, no
    unordered iteration.
  - >-
    R2 (report projection, packages/domain/mrr/domain/field_observation_report.py):
    a Pydantic v2 MRRModel (extra="forbid") assembling: batch_id, observation_kind,
    audit_target, an ORDERED tuple of anchor rows (role, path, declared_sha256,
    actual_sha256, matched: bool — sorted by role), the EMBEDDED
    mrr.domain.citation_audit_report.CitationAuditReport (a domain->domain import,
    the frozen evaluator's own report unchanged), and a FIXED honesty header from a
    single module-level constant: observation_is_not_optimization = Literal[True],
    plus a note string stating verbatim that (i) this is a read-only field
    observation, (ii) the integrity anchors were verified fail-closed, (iii) NO
    self-modification proposal is emitted by this packet — that is R2-T02, behind the
    human gate, (iv) NO optimizer is run against the evaluator — that is R2-T03,
    gated on N1-T03 and a run with real per-item spread, and (v) this packet contains
    no model/LLM step. It is NOT a BaseObject, has NO schemas/*.schema.json mirror,
    and is NEVER written to the object store. Pure render_markdown/render_json
    (sort_keys=True, no wall clock) mirroring citation_audit_report's renderers, and
    a build_field_observation_report(...) factory taking already-computed values.
  - >-
    R3 (descriptor fixture already committed — read only, do NOT regenerate): the
    service reads corpora/e2e-survey/observation-batch.v1.json, committed at
    derivation with the two REAL anchors and descriptor-relative input paths. The
    build MUST NOT edit it, MUST NOT recompute/replace its anchors, and MUST NOT
    fabricate one. Input paths inside the descriptor are resolved relative to the
    descriptor file's OWN directory (so batch_dir/manifest.path and
    batch_dir/snapshot.path), never relative to the process CWD.
  - >-
    R4 (FieldObservationService,
    services/control_plane/mrr/services/field_observation/service.py): read-only,
    NO-NETWORK, NO-DATABASE orchestration. Given a --batch descriptor path it: parses
    the descriptor into R1's ObservationBatch (a wrong top-level shape / missing key /
    bad JSON is a typed FieldObservationInputError -> exit 2, mirroring
    CitationAuditInputError); resolves each input path relative to the descriptor dir;
    reads each input's bytes and computes "sha256:" + hashlib.sha256(bytes).hexdigest()
    (a missing/unreadable input file is a FieldObservationInputError -> exit 2); runs
    R1's check_anchor for each and then check_and_gate — on mismatch the
    IntegrityGateError propagates and the CitationAuditService is NEVER constructed or
    called (the gate is strictly before the evaluator); on a clean gate, calls the
    REUSED CitationAuditService().build_report(manifest_path, snapshot_path) (its own
    MissingResolutionError propagates as a refusal), and builds+returns the R2 report.
    It opens NO database connection and NO network connection and constructs no
    repository. Markdown shows the anchor table (role, matched, declared vs actual
    sha256), the embedded citation-audit report, and the honesty header verbatim.
  - >-
    R5 (CLI, services/control_plane/mrr/services/cli/field_observation_main.py + 2
    lines in cli/main.py): `mrr observe field` with --batch <descriptor path>
    (required), --format md|json (default md), --output <path> (default stdout).
    NFR-012 ordering: cheapest local checks first — (1) --output must not already
    exist; (2) FieldObservationService reads/parses the descriptor and inputs; a
    file-level problem (FieldObservationInputError) -> exit 2; a fail-closed anchor
    mismatch (IntegrityGateError) OR a manifest/snapshot structural gap
    (MissingResolutionError from the reused N2 core) -> exit 3 (a REFUSAL, never a
    crash, never a silent pass). Exit 0 success. Atomic os.replace for --output.
    A standalone build_parser()/main() enables `python -m
    mrr.services.cli.field_observation_main field ...`. main.py gains exactly one
    register_observe_subcommand(subparsers) call and one
    `if args.command == "observe": return field_observation_main.run_command(args)`
    — mirroring the N2 "audit" registration/dispatch exactly, no other line changed.
  - >-
    R6 (tests every tier + security-check). unit (DB-free, no-network): R1
    check_anchor ok and mismatch; check_and_gate raises IntegrityGateError naming the
    first mismatched role and carrying both hashes, and does NOT raise when all match;
    R2 report shape incl. the honesty header (observation_is_not_optimization is
    Literal[True], the note names R2-T02 and R2-T03 as out of scope) and the ordered
    anchor rows; determinism (two renders byte-identical, stable content hash). A
    fail-closed test proving the gate short-circuits: a descriptor whose declared
    manifest anchor is wrong makes the service raise IntegrityGateError and the reused
    CitationAuditService.build_report is provably NOT reached (e.g. monkeypatch
    CitationAuditService.build_report to raise AssertionError and assert
    IntegrityGateError is raised instead — the gate runs first). contract: the R2
    model validates its own instances (extra="forbid" rejects an unknown field).
    architecture (lint-imports): field_observation.py and field_observation_report.py
    import no framework/service module (the report may import the domain
    citation_audit_report type only); the service may import the N2 service. acceptance
    (DB-free, no-network, reads the REAL committed descriptor + fixtures): running the
    service over corpora/e2e-survey/observation-batch.v1.json reports BOTH anchors
    matched (declared == actual for manifest and snapshot), the embedded audit reports
    all eight citations resolved and zero not_found, the honesty header is present, and
    the embedded report's snapshot_sha256 equals the snapshot file's actual hash. All
    existing suites pass UNMODIFIED. Every make tier green INCLUDING make
    security-check.
