derived_decisions:
  - >-
    (a) Observation is not optimization. R2-T01 observes a hash-anchored batch
    fail-closed and runs the frozen evaluator over it; it proposes nothing (R2-T02,
    behind the human gate) and optimizes nothing (R2-T03, the GEPA loop, gated on
    N1-T03 AND a classification run with real per-item spread — neither exists). The
    report header says so. This is the packet's single most important honesty
    boundary — the R2 analogue of N1's reliability-not-validity and N2's
    existence-not-support.
  - >-
    (b) The integrity anchor is the input FILE's sha256. The batch carries no
    per-source hash; git is authoritative for the committed bytes, so the honest,
    real anchor is each file's own hash, pinned in the committed descriptor and
    checked fail-closed. This satisfies Record III's "hash-anchored sources,
    fail-closed" against the anchor that actually exists, inventing none.
  - >-
    (c) The frozen N2 evaluator is reused, never rebuilt or re-scored. R2-T01 imports
    and calls CitationAuditService.build_report; it does not re-implement citation
    auditing and does not modify the N2 core or service. AGENTS.md rule 8 ("no
    executor verifies its own result") holds because R2 composes the unchanged
    evaluator rather than re-evaluating its own output.
  - >-
    (d) No model step, by construction. There is no LLM/model call anywhere in this
    packet, so Record III's "a source failure ends deterministically before an LLM
    sees it" is structurally guaranteed. The gate is built now, while nothing
    dangerous stands behind it; R2-T02 (the proposal emitter + gated fetch) and
    R2-T03 (the optimizer) are the packets that put something behind it, each with
    its own gate.
  - >-
    (e) Report is a projection, not a persisted object. Pydantic-validated (rule 6)
    but never entering the object store (rule 7). A persisted, schema-mirrored
    observation object is out of scope and unneeded here.
  - >-
    (f) Descriptor-relative paths. The descriptor's input paths resolve against its
    own directory, not the process CWD, so the batch is location-independent and the
    acceptance test is CWD-independent — mirroring resolution-snapshot.json's own
    "../citations.manifest.json" relative convention.
invariants:
  - No network connection and no database connection are opened anywhere in the runtime path.
  - Nothing is written except the requested --output file (atomic os.replace); the archive is never touched.
  - No wall-clock timestamp in any rendered byte; identical inputs yield a byte-identical report and a stable content hash.
  - On ANY anchor mismatch the run raises IntegrityGateError and the N2 evaluator is never invoked — the gate is strictly before the evaluator (fail-closed).
  - The report always carries the observation-is-not-optimization header naming R2-T02 and R2-T03 as out of scope, and the per-input anchor rows (declared vs actual); neither can be absent.
  - No self-modification proposal is emitted and no optimizer is run; this packet contains no model/LLM step.
acceptance_tests:
  - >-
    AT1: over the committed corpora/e2e-survey/observation-batch.v1.json, the report
    reports BOTH anchors matched (declared sha256 == actual sha256 for manifest and
    snapshot), the embedded citation-audit reports all eight citations resolved and
    zero not_found, and the embedded report's snapshot_sha256 equals the actual
    sha256 of resolution-snapshot.json; asserted numerically.
  - >-
    AT2: the report header carries observation_is_not_optimization=True with the note
    that this is a read-only observation, that NO self-modification proposal is
    emitted (R2-T02), and that NO optimizer runs against the evaluator (R2-T03);
    both are named as out of scope.
  - >-
    AT3: fail-closed — a descriptor with a wrong declared manifest anchor makes the
    service raise IntegrityGateError (naming the manifest role and both hashes), and
    the reused CitationAuditService.build_report is provably NOT reached (monkeypatch
    it to raise AssertionError; IntegrityGateError is raised instead).
  - >-
    AT4: determinism and refusals — two renders of the same batch are byte-identical;
    a missing/unparseable descriptor or a missing declared input exits 2; an anchor
    mismatch and a manifest citation absent from the snapshot both exit 3; existing
    suites pass unmodified.
  - >-
    AT5: the descriptor's input paths are resolved relative to the descriptor's own
    directory, verified by pointing --batch at the committed descriptor from a
    different process CWD and getting the identical clean result.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make security-check
specification_gaps:
  - >-
    The proposal emitter (observe -> draft task-packets before the human gate) and
    the gated nightly network fetch that produces NEW batches (where N2-T02's gated
    fetch feeds in) are R2-T02 — named, not built. Only R2-T02 makes Routine 2
    actually nightly/new-source and is the first packet to put a downstream step
    behind the gate.
  - >-
    The GEPA-style prompt/criteria optimization proposal generator against the frozen
    N1 harness is R2-T03 — gated on N1-T03 (the classifier-rerun harness) AND a
    classification run with real per-item spread, neither of which exists. No
    optimizer evaluates its own evaluator; proposals only as task-packets before the
    gate; no automatic adoption; no code self-modification.
  - >-
    Per-source (not per-file) content hashing would require the sources themselves to
    carry content hashes, which this batch does not; that is a corpus-format question
    for a future batch, out of scope here.
required_output:
  - Packet report per AGENTS.md "Required delivery format", embedding the exact
    `mrr observe field` invocation, the rendered Markdown report for the committed
    e2e-survey batch verbatim (the anchor table, the embedded citation-audit summary,
    and the observation-is-not-optimization header), and both input anchors.
stop_conditions:
  - >-
    If reproducing the clean-gate result requires editing, recomputing, or
    re-fetching the committed descriptor or fixtures, STOP — they are the oracle and
    must not be regenerated in this packet (AGENTS.md rule 3 / R3).
  - >-
    If making the gate pass requires reaching the N2 evaluator before the anchor
    check, or reporting a mismatch as anything but a fail-closed refusal, STOP — the
    gate-before-evaluator invariant may not be softened.
  - >-
    If any make tier requires modifying the frozen N2 core/service, adding a
    dependency, opening a network or database connection, or introducing a model
    step to go green, STOP — each is explicitly out of scope and would break the
    packet's reason for existing.
