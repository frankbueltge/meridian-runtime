task_id: R2-T01
title: >-
  Field-observation intake + fail-closed integrity gate and `mrr observe field`
  (read-only, no-network, no-model): over a committed, hash-anchored observation
  batch descriptor, verify each declared input file's sha256 against its pinned
  anchor and HALT deterministically on any mismatch BEFORE any downstream step,
  then reuse the FROZEN N2 evaluator (CitationAuditService) to audit the batch and
  render a deterministic observation report. This is Routine 2's read-only
  observation cut only: it emits NO self-modification proposal (R2-T02) and runs
  NO optimizer against the evaluator (R2-T03); it contains no model step at all.
  First target: the committed corpora/e2e-survey batch (anchors match, 8/8
  resolved — the acceptance oracle). Opens no network and no database connection
  and writes nothing to the archive.
status: approved
epic: R2
reviewer_resolution: >-
  Approved 2026-07-25 by the main session as reviewing instance, under the owner's
  explicit delegation the same day of BOTH the first-cut decision and the
  observation occasion ("das musst du entscheiden, was sinn macht" / "musst auch du
  entscheiden"), recorded in docs/design/2026-07-25-r2-derivation.md, and under the
  standing use-first decision (docs/design/2026-07-22-nutzungsentscheidung-e9-
  vertagt.md). Routine 2 is decomposed; ONLY R2-T01 is built now, on a real,
  today-satisfiable, reflexive use case: Routine 2's first read-only field
  observation is to integrity-verify and audit the already-committed e2e-survey
  batch. Load-bearing choices CONFIRMED at derivation: (1) OBSERVATION is not
  OPTIMIZATION — R2-T01 observes a hash-anchored batch fail-closed and runs the
  frozen evaluator over it; it proposes nothing (R2-T02, behind the human gate) and
  optimizes nothing (R2-T03, the GEPA loop, gated on N1-T03 AND a run with real
  per-item spread, neither of which exists); this is the single most important
  honesty boundary of the packet; (2) the integrity anchor is the sha256 of the
  committed input FILES (the batch carries no per-source hash — git is
  authoritative for the committed bytes), pinned in a committed descriptor and
  checked fail-closed; (3) the frozen N2 evaluator is REUSED by import
  (CitationAuditService.build_report), never reimplemented and never modified —
  AGENTS.md rule 8's "no executor verifies its own result" holds because R2 does
  not re-evaluate, it composes the unchanged evaluator; (4) NO model step exists in
  this packet, so Record III's "a source failure ends deterministically before an
  LLM sees it" is structurally guaranteed — the safest time to build the gate is
  before anything dangerous stands behind it; (5) hand-rolled, no new dependency
  (hashing is stdlib hashlib, already used by the N2 service); (6) the report is a
  Pydantic-validated PROJECTION (rule 7), not a persisted object — no schemas/**,
  no migration, no object-store write.
depends_on: []
derivation: >-
  Derived 2026-07-25 from docs/design/2026-07-25-r2-derivation.md, the
  capability-roadmap draft (docs/design/2026-07-24-capability-roadmap-entwurf.md,
  §Die zwei Routinen / Routine 2) and Record III
  (docs/design/2026-07-24-primaerquellen-selbstoptimierung.md, the binding Routine-2
  governance). Fact base verified first-hand at derivation. The frozen N2 evaluator
  is live and reusable: services/control_plane/mrr/services/citation_audit/service.py
  exposes CitationAuditService().build_report(manifest_path, snapshot_path) ->
  mrr.domain.citation_audit_report.CitationAuditReport, DB-free and no-network. The
  observation batch corpora/e2e-survey/ carries NO per-source hashes — manifest and
  snapshot are two committed JSON files; the only real integrity anchor is each
  file's own sha256. Real anchors computed at derivation:
  citations.manifest.json = sha256:8a706a96500fcd8177ed048f4a81ac605fa5aabc67cea7b5fe1ef1e90855691b;
  verification/resolution-snapshot.json = sha256:32b6b74f881a73b012c1d7ccd822f1090f1e4f3ecbd4b47c3af2a4db6472dfc0.
  The N2 service formats hashes as "sha256:<hex>"; the descriptor uses the same
  convention. corpora/e2e-survey/observation-batch.v1.json was created at derivation
  (this governance commit) with those real anchors and descriptor-relative input
  paths — it is read-only for this build. No `observe`/`field`/`routine2` service or
  CLI exists (services/control_plane/mrr/services has none; cli/ has no such module);
  hashlib is stdlib and already imported by the N2 service; no new dependency needed.
objective: >-
  After this packet, `mrr observe field --batch <descriptor path>` renders a
  deterministic field-observation report (JSON and Markdown) over a committed
  observation-batch descriptor. It (a) resolves each declared input path relative to
  the descriptor's own directory, (b) reads each input's bytes and computes its
  sha256, (c) compares each against the descriptor's pinned anchor and, on ANY
  mismatch, raises a typed IntegrityGateError naming the input and both hashes and
  HALTS — before the N2 evaluator is ever invoked (fail-closed), (d) on a clean
  gate, reuses CitationAuditService.build_report over the batch's manifest+snapshot
  and embeds the resulting CitationAuditReport, and (e) assembles a report whose
  header states, in plain type: this is a READ-ONLY field observation; the integrity
  anchors were verified; NO self-modification proposal is emitted here (R2-T02) and
  NO optimizer is run against the evaluator (R2-T03); this packet contains no model
  step. Run against the committed corpora/e2e-survey batch it reports every anchor
  MATCHED and the embedded audit all eight citations resolved, zero not_found. It
  reads only committed files, opens no database and no network connection, and writes
  only to the given output path (atomic os.replace).
