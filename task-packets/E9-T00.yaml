derived_decisions:
  - >-
    (a) ITEM 1 - EVENT SHAPE AND EMISSION POINT. The new
    `_EVENT_NOTIFICATION_RECEIVED = "correction.notification_received"`
    constant reuses docs/spec/03_API_AND_EVENTS.md section 5.2's own
    enumerated name verbatim (added by commit 736b376), mirroring how
    `_EVENT_RESPONSE_RECORDED`/`_EVENT_NOTIFICATION_SENT` already reuse
    section 5.2's other pre-declared names in this same file. Because
    `receive_correction_notification` never creates, stores, or mutates any
    local copy of the remote `CorrectionEvent` (E6-T03's own load-bearing
    invariant, unchanged here), there is no locally-owned, newly-written
    object revision for this event to describe via `object_id`/
    `object_revision` the way `correction.notification_sent`'s `object_id`
    names the sender's own advancing `CorrectionEvent`. This packet's own
    decision: `object_id = notification.notification_id` (a real URN this
    practice legitimately possesses, having just verified its signature) and
    `object_revision = 1` (fixed - a `CorrectionNotification` is explicitly
    "not a first-class revisioned domain object" per its own docstring, so
    exactly one honest, non-arbitrary revision number applies, never a
    fabricated incrementing one). `payload` carries `correction_id`,
    `correction_revision`, `notifying_practice_id`, `recipient_practice_id`,
    `notified_object_ids_count` (`len(notification.notified_object_ids)` -
    the count, not the full list, to keep the event payload small and
    independent of item 2's bound), and `locally_impacted_object_ids`
    (sorted list, explicitly `[]` when empty - MRR-NFR-012, never omitted).
    An alternative keying (`object_id = notification.correction_id`,
    `object_revision = notification.correction_revision`, treating the event
    as "about" the remote correction rather than "about" this practice's own
    receipt of it) was considered and is flagged in specification_gaps for
    reviewer confirmation rather than silently preferred over this packet's
    own choice.
  - >-
    (b) ITEM 1 - FAIL-CLOSED DEPENDENCY CHECK, MIRRORING THE E6-T06
    CONVENTION. Because this event is now MANDATORY on every successful
    receipt (not an optional convenience), `receive_correction_notification`
    MUST check that a `record_event` dependency is actually configured
    BEFORE doing any work - reusing the exact `_require_record_event()`
    helper already defined in this file for the four E6-T06 methods, called
    as the very first line of the method, before `validate_inbound_envelope`
    even runs. A `CorrectionImpactService` constructed without `record_event`
    therefore now fails closed on ANY call to `receive_correction_notification`
    (a `ValueError`, matching the existing `_require_record_event`/
    `_require_delivery_pending_store` wording convention) rather than
    silently processing a notification with no way to record its own
    receipt - never mutating a claim, then discovering the required event
    cannot be appended.
  - >-
    (c) ITEM 1 - WHERE THE EVENT APPENDS RELATIVE TO PER-CLAIM TRANSITIONS,
    AND THE RESIDUAL RACE THIS ACCEPTS. The receipt event appends via
    `self._record_event(...)` (the same `RecordEventOnly` path
    `notify_affected_practices`'s own "remaining events" loop already uses)
    AFTER every `_require_review_if_needed` call for the computed impacted
    set, so its payload's `locally_impacted_object_ids` can report the REAL
    computed set. This is deliberately NOT one atomic transaction spanning
    every claim transition plus the receipt event (each
    `_require_review_if_needed`/`ClaimService.require_review` call already
    performs its OWN atomic object-revision-plus-event write per claim) -
    mirroring this same service's own `notify_affected_practices`, whose
    first recipient's event is atomic with a revision write but whose
    remaining recipients' events are separate, already-accepted calls. A
    crash between the last claim transition committing and the receipt event
    committing leaves every local claim transition durable (materialized
    state, per AGENTS.md's own source-of-truth discipline) while the event
    log momentarily lacks this notification's OWN receipt entry. This does
    NOT reopen the notification to reprocessing on its own: whether a retried
    call is even attempted depends entirely on the CALLER's own
    `already_processed_notification` durable store (caller-supplied
    infrastructure, out of this service's scope per E6-T03's own forbidden_
    changes, unchanged here) - if that store already durably recorded this
    `notification_id` before the crash, no retry happens at all (independent
    of whether the receipt event made it); if it did not, a retry safely
    reprocesses (the underlying `compute_impact`/`_require_review_if_needed`
    calls are already idempotent) and the receipt event is appended on that
    successful retry instead. No new atomicity guarantee is claimed beyond
    what already existed.
  - >-
    (d) ITEM 4 - DOCUMENT AS ACCEPTED, BOUNDED EVENTUAL CONSISTENCY (not the
    shared-connection route). Chosen over threading a shared `Connection`
    through `PostgresDeliveryPendingStore.record_retry_attempt`/
    `mark_exhausted` plus `PostgresEventLog.append`, for four stated reasons:
    (i) exact precedent already exists, already reviewed clean, in the SAME
    service class - `notify_affected_practices`'s own "remaining events"
    loop (`services/control_plane/mrr/services/correction/service.py` lines
    1040-1058) appends each event AFTER the recipient's actual
    `transport.send(...)` delivery attempt via its OWN separate
    `self._record_event` call, with the identical shape of risk (a crash
    between a real side effect and its own event append) and PR #46's review
    raised no blocking finding against it; (ii) the risk is STRICTLY confined
    to the audit trail, never to materialized state: `record_retry_attempt`/
    `mark_exhausted` each commit the `pending_deliveries` row FIRST, inside
    their own transaction, and only the (separate) event append can be lost
    to a crash - the row itself (attempt_count, status, next_retry_at,
    resolved_at) is NEVER left inconsistent, and per AGENTS.md's own
    source-of-truth split ("Database state is authoritative for current
    materialized state. The append-only domain event log is authoritative
    for audit history."), the store's row IS the authoritative operational
    state `list_due_for_retry` reads - a lost event never causes a
    double-delivery, a stuck retry, or an incorrectly-resolved record, only a
    momentary audit-trail gap for that one attempt; (iii) building true
    atomicity would require changing `record_retry_attempt`/`mark_exhausted`'s
    public signatures (an optional shared-`Connection` parameter, mirroring
    `insert_revision_with_connection`'s naming precedent) AND every one of
    the four E6-T06 service call sites AND the `FakeDeliveryPendingStore`
    test double used throughout tests/unit/services/correction/
    test_service.py - a larger-blast-radius structural change more in
    keeping with how this codebase defers such refactors as their own
    reviewed cleanup (the same reasoning already applied to the trust-
    resolver DRY exclusion above) than with a "small, well-understood
    follow-up"; (iv) docs/spec/03_API_AND_EVENTS.md section 5.3's own
    transactional-outbox MUST is read here as applying to the PRIMARY
    state-change-plus-event pairing this codebase's `record_object_revision_
    with_event`/`record_response_revision_with_edges_and_event` machinery
    already guarantees everywhere it is used (including
    `PostgresDeliveryPendingStore.open_pending_delivery`'s own single-
    statement `INSERT ... RETURNING` atomicity) - NOT as extending to every
    SUBSEQUENT retry-attempt-plus-event pairing on an already-durable row,
    which is a narrower, lower-stakes case this packet's own reading treats
    as a documented, bounded exception rather than a violation. This reading
    is flagged, not asserted as uncontestable, in specification_gaps and
    guarded by a stop_condition below.
  - >-
    (e) ITEM 2 - THE maxItems BOUND, CHOSEN AND JUSTIFIED. 512. No existing
    schema or Pydantic contract in this repository constrains an array
    field's length today (confirmed by `grep -rn "maxItems\|max_length="
    schemas/*.json packages/contracts/mrr/contracts/*.py` returning nothing
    outside `min_length`/`minItems`) - this is the first such bound, chosen
    independently rather than mirrored from an existing convention. 512 is
    sized against the concrete DoS-relevant cost this bound actually caps:
    `CorrectionImpactService._gather_local_impact_edges` (the receiving
    side's own local traversal, `services/control_plane/mrr/services/
    correction/service.py` lines 2084-2112) issues one `EdgeRepository.
    edges_to()` database query per unique node in its BFS frontier, seeded
    directly from `set(notification.notified_object_ids)` - an unbounded
    `notified_object_ids` list from a notifying practice this receiving
    practice does not control lets that ONE field alone force an unbounded
    number of seed-level queries before any further graph expansion is even
    considered (the receipt cost docs/spec/03_API_AND_EVENTS.md section
    5.2's own refresh note already names: "receipt cost scales with list
    size"). 512 is a round, generous ceiling for the legitimate case (one
    notification naming the directly-affected ids relevant to ONE recipient
    - realistically low tens to low hundreds even for a broad correction;
    the recipient-side BFS expansion via `IMPACT_EDGE_TYPES` typed edges,
    which is what can genuinely grow large, is deliberately NOT bounded by
    this same limit, and stays out of this item's scope exactly as
    `CorrectionEvent.impact_objects`/`evidence_refs` stay unbounded
    elsewhere in this codebase) while still capping the attacker-controlled
    input to a fixed, reviewable number rather than letting it scale
    unbounded. `CorrectionEvent.affected_objects`/`impact_objects` remain
    UNCHANGED and unbounded (forbidden_changes) - this bound applies only to
    the new, narrower, cross-practice `CorrectionNotification` payload.
  - >-
    (f) ITEM 3 - THE DECISION, STATED PLAINLY, FOR THE SPEC NOTE AND THE
    TIGHTENED DOCSTRING. Re-notification idempotency for
    `notify_affected_practices` is, and remains, keyed on
    `recipient_practice_id` ALONE for a given `correction_id` - once a
    recipient is recorded `"sent"` (a `correction.notification_sent` event
    with `delivery_status == "sent"`), no later call re-notifies that
    recipient for that correction, regardless of whether the correction's
    own known impact set has since grown to include object ids that
    recipient's earlier `notified_object_ids` never covered. This is a
    DECIDED specification position (to be written into docs/spec/
    03_API_AND_EVENTS.md, extending the section 5.2 refresh note rather than
    replacing it), not merely an implementation detail: re-notifying an
    already-`sent` recipient when impact discovery later grows is left as an
    explicitly named FUTURE task (not designed, not stubbed, not given a
    placeholder method here) - AGENTS.md rule 12 forbids TODO-only branches,
    so this packet adds no speculative hook for it, only the prose decision
    plus a forward pointer. The existing docstring nuance in
    `_already_sent_recipient_ids` is tightened from "a future specification
    question, not invented here" to state the decision plainly and cite the
    new spec note directly, so the code and the spec agree on wording rather
    than the code merely flagging a question the spec never actually
    answered.
  - >-
    (g) ITEM 7 - THE THREE NEW PARAMETERS' EXACT SHAPE. `seal()` gains
    `source_records: Sequence[Urn] = ()`, `evidence_anchors: Sequence[Urn] =
    ()`, `proposed_claims: Sequence[Urn] = ()` as caller-supplied,
    keyword-only parameters positioned alongside the existing `artifact_refs`
    (same `Sequence[...] = ()` shape, same "empty means nothing to report"
    reading carried over from the module docstring's own "Empty is not a
    stub... it faithfully records that no claims/anchors exist yet for this
    run" language - now read as "for THIS run" applying equally to a run that
    legitimately produces content). The draft `EvidenceCrate` construction
    replaces its hardcoded `source_records=[]`/`evidence_anchors=[]`/
    `proposed_claims=[]` with `list(source_records)`/`list(evidence_anchors)`/
    `list(proposed_claims)`. `run_synthesis_evidence_loop`'s own call to
    `evidence_crate_sealer.seal(...)` (currently NOT passing any of the
    three) is extended to pass `source_records=list(entry_ids_to_source_
    record_id.values())`, `evidence_anchors=list(entry_ids_to_evidence_
    anchor_id.values())`, `proposed_claims=list(claim_ids)` - all three
    already fully populated by the existing loop by the time `seal()` is
    called, zero new reads. The module docstring section "EvidenceCrate.
    source_records/evidence_anchors/proposed_claims stay empty" (lines
    90-118) is updated to record that this gap is now closed, rather than
    left describing a still-open gap once it no longer is one.
invariants:
