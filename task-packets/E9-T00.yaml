title: >-
  Pre-hardening batch: review-driven follow-ups from E6/K0/K1 (correction-
  notification receipt event, maxItems bound, re-notification-semantics
  decision, delivery-pending-store atomicity decision, a constructor-guard
  test, a property-strategy widening, and an EvidenceCrateSealer parameter
  extension). Sits BEFORE the roadmapped E9-T01..T07 in
  docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E9 (hardening and
  production operation) — a new first task of that epic, not one of the
  numbered seven.
status: draft
epic: E9
derivation: >-
  Derived per docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from seven small,
  independently-reviewed follow-up items that accumulated across the
  independent reviews of PR #43-#53 and were explicitly deferred rather than
  fixed in place, plus commit 736b376 ("Spec-Refresh: Section 5.2-Eventliste
  konsolidiert nach E6/K0/K1", 2026-07-21), which canonicalized
  docs/spec/03_API_AND_EVENTS.md section 5.2's required-events list and, in
  its own added "Refresh note (2026-07-21)" paragraph, explicitly assigns
  three of these seven items (the notification-received event, the maxItems
  bound, the re-notification-semantics decision) to "the E9 pre-hardening
  batch" by that exact name — this packet IS that batch. Every item below was
  independently re-verified against the CURRENT code (not just the review
  comment) before being included; none was found already fixed.

  Item provenance, each independently confirmed:
  (1) PR #46 (E6-T03, merged) review comment (`gh pr view 46`, comment
  `IC_kwDOTcACkc8AAAABK8oAeA`): "Deferred to the consolidated spec refresh
  (tracked): ... a receiving-side receipt event (currently zero durable trace
  on an empty local impact set)". Confirmed still true by direct reading of
  `services/control_plane/mrr/services/correction/service.py`'s
  `CorrectionImpactService.receive_correction_notification` (lines
  1065-1195): the method returns a `LocalNotificationImpact` in-process but
  appends NO domain event of its own in either branch (empty or non-empty
  `impacted`) - the only possible durable trace is the existing
  `claim.status_changed`/`claim.review_required` events `_require_review_if_
  needed` emits, and those fire zero times when `impacted` is empty.
  (2)/(3) Same PR #46 comment: "maxItems bound for notified_object_ids;
  re-notification semantics when a growing notified-set genuinely warrants
  re-notification". Confirmed: `schemas/correction-notification.schema.json`
  constrains `notified_object_ids` with `minItems: 1` only (no `maxItems`);
  `packages/contracts/mrr/contracts/correction_notification.py` mirrors this
  with `Field(min_length=1)` only. The re-notification nuance IS already
  documented in `_already_sent_recipient_ids`'s own docstring (lines
  1900-1921, "Reviewer-noted nuance: idempotency is keyed on recipient_
  practice_id ONLY... a future specification question, not invented here")
  but NO spec-level note exists anywhere under docs/spec/ making this an
  explicit, citable decision rather than an open question in a docstring
  (confirmed by `grep -rn "re-notif" docs/spec/` returning only the section
  5.2 refresh note itself, which frames it as still-open).
  (4)/(5) PR #51 (E6-T06, merged) review comment: "M1 - pending-delivery row
  write and its event append are separate transactions (mirrors the existing
  per-recipient record_event pattern); decide explicit-documentation vs.
  shared-connection extension. L1 - one-line ValueError test for the store
  constructor's max_attempts guard." Confirmed by direct reading of
  `packages/persistence/mrr/persistence/repositories.py`:
  `PostgresDeliveryPendingStore.record_retry_attempt`/`mark_exhausted` each
  open their OWN `with self._engine.begin() as conn:` block (lines
  1086, 1173), and the caller
  (`services/control_plane/mrr/services/correction/service.py`'s
  `retry_pending_delivery_online`/`retry_pending_delivery_offline`/
  `mark_pending_delivery_delivered`/`mark_pending_delivery_exhausted`)
  appends the `correction.notification_sent` event via a SEPARATE
  `self._record_event(event)` call afterward (`_append_delivery_event`,
  lines 2143-2186) - two independent commits, exactly as flagged. The
  constructor guard (`if max_attempts < 1: raise ValueError(...)`, line
  1002-1003) has NO test anywhere in the repository (confirmed by
  `grep -rn "PostgresDeliveryPendingStore(" tests/`: only two call sites,
  both `tests/integration/persistence/test_pending_delivery_store.py`'s
  `_store` helper and `tests/integration/services/correction/
  test_service.py`, neither ever passing `max_attempts < 1`).
  (6) PR #50 (E6-T05, merged) review comment: "Test-suite suggestion for a
  later batch (implementation already proven correct): widen the property
  strategy beyond the five canonical literals (st.text() or mutated
  near-misses) so the any-non-PUBLIC-never-unlocks property is pinned over
  arbitrary strings." Confirmed: `tests/property/
  test_public_correction_view_properties.py`'s `_ALL_CLASSIFICATIONS`/
  `_classification_map_strategy` (lines 35-66) sample ONLY the five literal
  `Classification` values via `st.sampled_from` - no `st.text()`, no
  case/whitespace near-miss of `"PUBLIC"` is ever generated. The production
  logic itself (`packages/domain/mrr/domain/public_correction_view.py`,
  `_all_ids_attested_public`, exact `== "PUBLIC"` string equality) is
  unaffected and, per the review, already correct - this is a test-only
  strengthening.
  (7) PR #52 (K1-T03, merged) review comment: "(2) EvidenceCrateSealer
  genuinely unchanged - the packet's citation pointed at contract fields,
  not sealer parameters; nothing lost, every object reachable via
  governed_by_protocol edges, now tested in BOTH directions after the
  review-driven addition." Confirmed by direct reading of
  `services/node_runtime/mrr/services/node_runtime/evidence_crate.py`'s
  `EvidenceCrateSealer.seal` (lines 278-321): it unconditionally hardcodes
  `source_records=[]`, `evidence_anchors=[]`, `proposed_claims=[]` in the
  draft it builds - there is no keyword parameter for any of the three,
  unlike `artifact_refs`/`failures`/`known_unknowns`, which ARE
  caller-supplied. `services/control_plane/mrr/services/cli/
  synthesis_orchestration.py`'s own module docstring (lines 90-118,
  "EvidenceCrate.source_records/evidence_anchors/proposed_claims stay
  empty") independently discovered and disclosed this exact gap during
  K1-T03's implementation, named it "a natural, small follow-up, explicitly
  left for a future task since this packet may not touch that file at all",
  and confirmed the run genuinely DOES already collect every id needed
  (`entry_ids_to_source_record_id`/`entry_ids_to_evidence_anchor_id`
  dicts and the `claim_ids` list, all populated during the existing loop,
  lines ~1060-1316) - discoverability today is via the `governed_by_
  protocol` edge graph only, matching K1's own exit criterion ("a third
  party can follow one sealed crate ... through recorded objects") but not
  via the crate's own three array fields, which spec 08 section 5's I/O
  contract and the crate's own schema (`schemas/evidence-crate.schema.json`,
  all three REQUIRED) both anticipate being populated.

  Explicitly NOT in this batch (verified, not merely asserted): ADR-0010's
  staged-adoption step 1 (a real `baseObject.classification` field) -
  task-packets/K1-T02.yaml's own governance note (commit `cd389b4`) stages
  this into "its own, separate, not-yet-derived task packet", and
  task-packets/K1-T03.yaml's derivation independently confirms this split is
  inherited unchanged; it is a schema/migration-bearing change, categorically
  larger than this batch's small, additive, already-scoped items, and stays
  its own packet. The DRY consolidation of the now-five near-identical trust
  resolvers (manifest_trust/task_trust/crate_trust/transfer_trust/
  correction_notification) and of the repeated per-service
  `RecordRevisionWithEvent`/`bind_unit_of_work` local-copy pattern - flagged
  as a deliberate, deferred future cleanup in task-packets/E5-T00.yaml,
  E6-T03.yaml, and K1-T03.yaml alike, every time in the same words ("a
  future, separate, reviewed cleanup") - stays its own reviewed cleanup
  packet, not folded in here (mixing a behavior-preserving refactor with
  seven independent behavioral/test changes would make this batch harder to
  review and roll back piecemeal). K1-T04's fixture-text fix is already
  handled inside PR #53 itself (still open at the time of this derivation;
  `gh pr view 53` shows zero review comments yet, so there is nothing further
  for this batch to pick up).
objective: >-
  Land seven small, independently reviewable follow-ups in one batch, ordered
  by the numbering used throughout this packet (item 1 through item 7).
  Each item is scoped so it could, in principle, be reverted independently
  without touching the others' files (see allowed_paths and each item's own
  derived_decision) - batched together because each is individually too small
  to be its own task packet, all seven were raised by the same review
  process, and E9-T01 (threat-model review and adversarial suite) is a more
  natural, cleaner starting point for the numbered hardening epic once these
  loose ends are tied off first.

  Item 1 - `correction.notification_received` domain event. Implement the
  event docs/spec/03_API_AND_EVENTS.md section 5.2 already lists (added by
  commit 736b376) and its own refresh note marks DECLARED-but-not-yet-
  implemented. `CorrectionImpactService.receive_correction_notification`
  MUST emit exactly one `correction.notification_received` event, with full
  MRR-NFR-001 provenance, on EVERY call that reaches the end of its existing
  check sequence successfully (envelope validation, notification signature,
  validity window, and the `already_processed_notification` replay check all
  pass) - whether the resulting `locally_impacted_object_ids` set is empty or
  not. It MUST NOT be emitted when any of those existing checks reject the
  call (an invalid envelope, a bad/tampered signature, an out-of-window
  notification, or a replayed `notification_id` each still raise exactly as
  today, before this new event is ever considered).

  Item 2 - maxItems bound for `CorrectionNotification.notified_object_ids`.
  Add a schema-level `maxItems` and a matching Pydantic `max_length` to bound
  this attacker-influenced (the notifying practice controls its own
  contents), currently-unbounded array, with a negative contract fixture
  proving the bound is enforced, and a documented DoS rationale.

  Item 3 - re-notification semantics: a documentation decision, not new
  machinery. `notify_affected_practices`'s existing per-recipient idempotency
  (keyed on `recipient_practice_id` alone, never on the specific `notified_
  object_ids` a prior call sent) is already correctly implemented and already
  has a docstring nuance describing it; this item promotes that into an
  explicit, citable SPECIFICATION decision (docs/spec/03_API_AND_EVENTS.md)
  plus a tightened docstring, and explicitly defers any actual re-notification
  MECHANISM (for when a growing notified-set genuinely warrants renotifying an
  already-notified recipient) to a named future task - no new code path is
  built.

  Item 4 - pending-delivery atomicity (PR #51 review M1): decide, and
  document, whether the residual crash window between a
  `PostgresDeliveryPendingStore` row write and its `correction.
  notification_sent` event append is (a) closed by threading a shared
  `Connection` through both writes (mirroring `insert_revision_with_
  connection`/`record_response_revision_with_edges_and_event`'s existing
  one-transaction precedent), or (b) accepted as a documented, bounded
  eventual-consistency window. This packet's own derived_decision (d) makes
  the call (documentation) and gives the reasoning; a reviewer who disagrees
  can redirect via stop_conditions before implementation proceeds down the
  wrong branch.

  Item 5 - one-line `ValueError` test for `PostgresDeliveryPendingStore`'s
  `max_attempts < 1` constructor guard (PR #51 review L1).

  Item 6 - widen `tests/property/test_public_correction_view_properties.py`'s
  classification-map strategy beyond the five canonical `Classification`
  literals to include `st.text()` and explicit case/whitespace near-misses of
  `"PUBLIC"` (e.g. `"public"`, `"Public"`, `" PUBLIC"`, `"PUBLIC "`,
  `"PUBLIC\n"`), so the "any non-PUBLIC value never unlocks" property is
  pinned over a wide input space, not just the five declared levels.
  Production code is NOT touched (already correct per the PR #50 review).

  Item 7 - extend `EvidenceCrateSealer.seal()` with three new, additive,
  default-empty keyword parameters (`source_records`, `evidence_anchors`,
  `proposed_claims` - mirroring `artifact_refs`'s own caller-supplied,
  default-`()` convention exactly) so a caller that already has these ids in
  hand (as `run_synthesis_evidence_loop` already does) can populate the
  sealed crate's own same-named fields instead of them being hardcoded to
  `[]`. Wire `run_synthesis_evidence_loop` to pass its own already-collected
  `entry_ids_to_source_record_id.values()`/`entry_ids_to_evidence_anchor_id.
  values()`/`claim_ids` through. Every EXISTING caller of `.seal()` (in
  particular `run_local_evidence_loop`, E2E-001) that does not pass these new
  keywords is byte-for-byte unaffected (same defaults, same behavior) -
  confirmed additive-only. The `governed_by_protocol` edge-based
  discoverability `run_synthesis_evidence_loop` already writes stays exactly
  as-is; this item makes the crate's OWN array fields ALSO carry the same
  information, redundantly but harmlessly, matching what spec 08 section 5's
  I/O contract and the crate's own required schema fields already anticipate.

  Batch-vs-split judgment on item 7 (asked for explicitly): keep it IN this
  batch. Reasoning: (i) it is purely additive - three new keyword parameters,
  each defaulting to `()`, added to one existing method's signature; no
  existing call site's behavior changes; (ii) the data it needs already
  exists in local variables inside `run_synthesis_evidence_loop` with zero
  new database reads, zero new service calls, and zero new persisted state;
  (iii) `EvidenceCrateSealer`'s own forbidden internals (signing convention,
  immutability, the "no update/unseal" invariant, `_crate_to_stored_object`)
  are untouched - this is the same category of change as adding a new
  optional constructor parameter with a safe default, not a redesign of the
  sealer; (iv) it touches E2-T06 machinery, but task-packets/E2-T06.yaml's
  OWN forbidden_changes never forbade extending the sealer's caller-supplied
  parameter list (only forbade the sealer itself deriving or computing claim-
  graph/evidence-anchor content, which this item does not do - the CALLER
  still computes and supplies the lists); (v) it is exactly as
  independently revertible as any other item here (one file's signature, one
  file's call site, plus tests) - reverting it does not entangle any of
  items 1-6. If a reviewer judges otherwise (e.g. because it is the one item
  touching a DIFFERENT epic's already-merged deliverable rather than E6/K0/K1
  code), splitting it into its own one-item packet costs nothing structural
  - the derived_decision, invariants, and acceptance tests below are already
  self-contained under item 7's own heading.
