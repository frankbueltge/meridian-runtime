task_id: E4-T02
title: Implement the structured-generation adapter with bounded schema-repair
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E4 (E4-T02),
  docs/spec/01_SYSTEM_SPEC.md section 4.5 (MRR-FR-044/045/046 and the acceptance
  "Invalid structured model output cannot enter the claim graph"), section 5
  (A1 Draft = "clearly marked proposal"), and the docs/spec/02_DOMAIN_MODEL.md
  global invariant "No model output bypasses schema and domain validation";
  building directly on the merged E4-T01 (task-packets/E4-T01.yaml) ModelAdapter
  port and ModelInvocationOutcome value object. Approved by the repository
  owner's standing direction to continue (2026-07-19). Second task of Epic E4 -
  the provider-neutral layer that turns a raw model call into a schema-valid
  PROPOSAL or an explicit failure, with a bounded repair loop.
objective: >
  Provide a provider-neutral structured-generation layer that, given the
  E4-T01 ModelAdapter port, a ModelInvocationRequest, a caller-supplied target
  schema/validator, and an explicit maximum repair count, obtains a model
  response and validates it against the target schema; on a validation failure
  it performs a BOUNDED number of repair attempts (feeding the validation error
  back into a follow-up call) and, if the bound is exhausted without a valid
  result, returns an explicit, distinct failure - never letting invalid,
  partially parsed, or coerced output pass as valid. Every underlying call
  (initial and each repair) is recorded as a ModelInvocationOutcome in an
  ordered audit trail. The successful result is a "clearly marked proposal"
  (A1) that downstream domain validation must still accept (MRR-FR-046); this
  layer performs STRUCTURAL validation only and marks nothing authoritative.
