acceptance_criteria:
  - The biconditional is enforced in the model, not merely documented - status
    "recorded" iff root is not None; both violating shapes raise on construction.
  - Both committed dumps still parse unchanged through mrr.domain.archive_dump, and the
    two existing RunManifests validate, carrying status "not_recorded" as the true
    statement about them. Asserted by a test.
  - schemas/run-manifest.schema.json is updated in step with the contract, and a test
    asserts contract and schema agree.
  - The 51-anchor acceptance oracle above is reproduced exactly, with violations 0.
  - A test with a synthetic recorded root proves all three other statuses really occur -
    a present blob, a deleted blob (artifact_missing), and a corrupted blob
    (artifact_hash_mismatch). Without this the closed set is untested at its edges.
  - Determinism - no wall clock in the domain module; explicit sorting; two runs over
    equal inputs render identical bytes.
  - Exit semantics mirror N2-T01 - 0 success, 2 input error, 3 refusal. Violations do
    NOT change the exit code.
  - make format-check, lint, typecheck, test, test-contract and security-check pass.
explicitly_not:
  - No change to EvidenceAnchor - the store is content-addressed, so root plus the
    anchor's own hash already determines the path.
  - No recovery or re-fetching of the lost bytes; no back-filling a root into the two
    existing manifests. Both would be fabrication in the archive.
  - No run-time gate that refuses a temp-directory artifact root - named in the
    derivation as a separate owner decision, out of scope here.
  - No model, no network, no database, no migration, no new dependency.
