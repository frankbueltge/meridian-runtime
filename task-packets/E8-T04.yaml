derived_decisions:
  - >-
    (a) No release against the real archive in this packet — the gate
    ships empty. The first real ReleaseRecord, if ever, is the owner's
    own act with the owner's own approval statement (reviewer_resolution
    1); nothing here schedules or suggests it.
  - >-
    (b) approval_mode "dual" is schema-valid but service-refused in this
    packet ("single_human" only) with a message naming this decision —
    recording the vocabulary the spec offers ("explicit human or dual
    approval") without pretending a second-approver workflow exists.
  - >-
    (c) The bundle embeds release-record.json verbatim so a third party
    holding only the bundle sees WHO approved and the root_hash it
    attests; the self-reference problem is resolved by the ADR's
    exclusion rule (root_hash covers content files only).
  - >-
    (d) `mrr release verify` rebuilds from the archive (fresh export +
    fresh renders in a temp dir) rather than trusting the bundle's own
    manifest — trust flows record -> archive -> bytes, never bundle ->
    bundle.
invariants:
  - No default, fallback, or inference can produce the approval inputs; absence refuses.
  - The release.approved event actor is the approving person URN, atomically with the record.
  - root_hash is recomputed, never trusted from input, at every boundary (service create, verify).
  - Existing E8 machinery is composed, byte-unchanged; their suites pass unmodified.
  - No connector, no network egress, no real release.
acceptance_tests:
  - >-
    AT1: create with full synthetic approval inputs -> exit 0; the stored
    record's approval block equals the inputs; the release.approved event
    exists with actor == approved_by; the bundle directory contains
    ro-crate/, report.md, report.html, release-manifest.json,
    release-record.json; verify (both modes: rebuild and --bundle-dir)
    exits 0 with the same root_hash.
  - >-
    AT2: create without --approved-by, or without
    --approval-statement-file, or with an agent-role URN as approver, or
    with an empty statement file -> exit 3, nothing persisted, no
    directory at the target; the refusal message names MRR-FR-102.
  - >-
    AT3: flipping one byte in one content file of a created bundle makes
    verify --bundle-dir exit 3 naming exactly that path; the rebuild mode
    still exits 0 (the archive is intact — the message distinguishes the
    two verdicts).
  - >-
    AT4: two creates of the same crate/disclosure/attestation (different
    record identities) produce byte-identical content files and equal
    root_hash; the record copies differ exactly in the identity/
    timestamp/hash-of-record fields and nowhere else.
  - >-
    AT5: E8-T01/T02/T03 integration suites pass unmodified; import-linter
    contracts stay green.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make test-integration
specification_gaps:
  - >-
    MRR-FR-101 lists "methods, claim table, evidence map, counterevidence,
    uncertainty, known unknowns, corrections, provenance summary" — all
    carried via the E8-T03 report inside the bundle; the spec does not say
    whether the bundle must ALSO carry raw artifacts; ADR-0011/E8-T01's
    RO-Crate portion does carry them, so the bundle over-fulfils rather
    than interprets.
  - >-
    Where real bundles will LIVE (site dist/, a releases/ tree in git,
    object storage) is deliberately not decided here — it belongs to the
    owner's Site-Kopplung decision; the CLI writes to an explicit
    --output-dir and nothing else.
required_output:
  - Packet report per AGENTS "Required delivery format", embedding one
    integration-fixture release-manifest.json and release-record.json
    verbatim and the exact create/verify invocations with their JSON
    result lines.
stop_conditions:
  - >-
    If the atomicity analysis of reviewer_resolution (5) turns out to
    have a second inconsistent state not named there, STOP and record it
    before choosing an order — never discover-and-shrug mid-implementation.
  - >-
    If registering a new schema breaks the contract-test harness's
    assumptions (e.g. it requires a domain-model section reference that
    does not exist for this kind), STOP and report — the harness's
    conventions outrank this packet's convenience, and ADR-0011 is the
    citation to wire in, not to work around.
