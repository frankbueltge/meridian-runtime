task_id: E5-T02
title: Trust-anchored signed NodeManifest exchange (resolve signer key via the sender practice's KeyRing, fail closed)
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E5 (E5-T02
  "signed manifest exchange"), docs/spec/01_SYSTEM_SPEC.md section 7.3 (the
  Capability Registry stores signed node manifests and does NOT grant
  permission) and MRR-FR-020, docs/spec/02_DOMAIN_MODEL.md section 1.3
  (a signature carries signer practice id, key id, algorithm, signed-at) and
  section 2.1/2.2 (Practice keys; NodeManifest public_keys + signature),
  docs/spec/04_SECURITY_AND_POLICY.md section 8.1 (trust is per practice and
  capability), section 8.3 (a refusal returns a coarse reason and retains detail
  locally), and section 8.4 (a practice can revoke a key; new objects are
  rejected after revocation; existing objects remain historically attributable).
  Builds directly on E5-T01 (Practice, PublicKeyDescriptor, KeyRing, kid
  derivation) and the ADR-0004 unified exclude_none signature form (E5-T00). It
  closes the trust-anchoring gap E2-T02 deliberately left open: today
  CapabilityRegistry.register verifies a manifest against a CALLER-SUPPLIED bare
  public key, with no resolution of the manifest's own claimed signer/kid against
  a trusted key set. This is the OBJECT-layer exchange only: no network, no mTLS
  (E5-T03), no durable replay store or cross-runtime revocation enforcement sweep
  (E5-T07), and no new persisted practice registry (the trusted sender Practice
  is caller-supplied, exactly as E2-T02 supplied the verifying key). Fully
  CI-testable without PostgreSQL at the domain layer; the registry's existing
  Postgres-backed paths run in CI.
objective: >
  Make a receiving practice accept another practice's signed NodeManifest ONLY
  after anchoring it to that sender practice's trusted keys, fail-closed at every
  step. (1) A framework-free domain resolver that, given a received NodeManifest
  and the sender practice's trusted KeyRing (built from its Practice.keys),
  resolves the manifest's signature to a trusted verifying key: it requires
  signature.signer_practice_id to equal the sender practice's id, resolves
  signature.key_id (kid) to a PublicKeyDescriptor in the ring, requires that
  descriptor to be valid at the evaluation instant (KeyRing.is_valid_at(now):
  active AND in its validity window - so a revoked, rotated, expired, or unknown
  kid fails closed), requires the resolved descriptor's public key to be one of
  the manifest's own declared public_keys, and only THEN returns the decoded
  Ed25519 public key. (2) A small helper to build a KeyRing from a Practice's
  keys. (3) An ADDITIVE trust-anchored accept path on CapabilityRegistry (e.g.
  `receive`) that runs the resolver, verifies the signature over the ADR-0004
  exclude_none form using the resolved key, and on success registers the manifest
  via the EXISTING register mechanism; on any failure it raises a typed error and
  records a manifest-rejected research event carrying only a COARSE reason
  category (docs/spec/04 section 8.3), persisting nothing. The existing
  register(verifying_key=...) primitive and all its tests stay unchanged.
