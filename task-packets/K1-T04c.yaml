derived_decisions:
  - >-
    (a) TASK-ID — ALREADY RESERVED, JUSTIFIED AGAINST ALTERNATIVES FOR THE
    RECORD ONLY. See derivation: `K1-T04c` is named directly by
    `task-packets/K1-T04b.yaml`'s own `reviewer_resolution` and already
    cited in that packet's own `depends_on`. `K1-T03c` was considered and
    rejected (this packet touches zero lines of K1-T03/K1-T03b's own
    protected executor/orchestration files); a fresh epic-numbered slot was
    considered and rejected (K1 closed, K2 wrong epic, E9 wrong provenance
    shape) — both for the same structural reasons the two precedent
    packets already gave for themselves. Unlike `K1-T04b`'s own flagged
    "softer" deliverable-ownership anchor, this packet's own anchor is the
    sharper, unambiguous CODE-ownership kind: the two files in
    `allowed_paths` are literally the two files `task-packets/K1-T04.yaml`'s
    own `allowed_paths` names.
  - >-
    (b) THE PROTOCOL_ID/PROTOCOL_LOCK_CONTENT_HASH FILL-IN IS NOT OPTIONAL
    POLISH — IT IS THE MECHANISM THAT MAKES THE PASSTHROUGH USABLE. Every
    caller-supplied `SensitivityVariationParameters` body MUST carry
    `protocol_id`/`protocol_lock_content_hash` (both `Field(min_length=1)`,
    `synthesis_executor.py` lines 385-386-ish, re-verified), checked against
    the resolved protocol via the SAME `_check_protocol_lock` a stale base
    sidecar already fails against. No caller (CLI operator or test) can
    know the real, minted `MethodProtocol` id or its real `content_hash`
    BEFORE `establish_and_run_synthesis` itself creates, reviews, and locks
    that exact object (steps 1-5 of its own six-step choreography) — so
    every supplied variation-parameters file necessarily carries
    placeholder strings for these two fields, exactly mirroring
    `task-packets/K1-T04b.yaml`'s own base-sidecar placeholder convention
    ("protocol_id": "placeholder-overwritten-at-run-time..."). This
    packet's own implementation of (a) in `objective` therefore MUST
    overwrite both fields unconditionally, for every supplied
    `variation_entry_id`, at the SAME point in `establish_and_run_synthesis`
    where the base `protocol_parameters` dict already receives the
    identical treatment (its own existing lines ~571-573,
    `final_protocol_parameters["protocol_id"] =
    resolved_method_protocol_id` / `[...]["protocol_lock_content_hash"] =
    locked_content_hash`) — a new, adjacent block performing the SAME two
    assignments per variation dict, before the resulting mapping is handed
    to `run_synthesis_evidence_loop`. Without this, the passthrough would
    only work for a caller who already knew the protocol's real id/hash in
    advance — which is never true, defeating the entire point of the
    mandate.
  - >-
    (c) THE CLI OPTION DESIGN — ONE FILE HOLDING THE WHOLE MAPPING, NOT A
    REPEATABLE FLAG. `sensitivity_variation_parameters` is already shaped
    as `Mapping[str, dict[str, Any]]` one level up — a plain JSON object
    (`{"entry-id-1": {...}, "entry-id-2": {...}}`) expresses this shape
    directly and completely in ONE file, exactly like the existing
    `--protocol-parameters-file`/`--corpus-file` flags already hold a
    single JSON document each. REJECTED ALTERNATIVE, considered and
    disclosed: a repeatable flag (argparse `action="append"`, e.g.
    `--sensitivity-variation-file entry_id=path`, invoked once per
    variation) — this would require inventing a new
    key-equals-path-pairing convention this codebase has no precedent for
    anywhere in `synthesis_main.py`'s existing five fixture flags, for zero
    added expressiveness over a single JSON object, and would need its own
    parsing/validation code this packet's own `allowed_paths` would then
    have to justify separately. The single-file design needs no new
    argparse machinery at all — `_load_json_file`, already used five times,
    is reused verbatim a sixth time.
  - >-
    (d) THE NEW FLAG'S DEFAULT IS `None`, NOT A COMMITTED FIXTURE PATH —
    UNLIKE THE OTHER FIVE. The five existing fixture flags
    (`--question-model-file` etc.) all default to a real, committed file
    under `corpora/model-collapse/`, because run 1's own fixture set
    already exists there. No such fixture exists for
    `sensitivity_variation_parameters` — run 1's own locked protocol
    declares `sensitivity_variations: ["model-collapse-mechanism-v1"]` with
    no authored sidecar (the still-open gap `task-packets/K1-T03b.yaml`'s
    own amendment named), and inventing one here would be exactly the
    "rushing a rival operationalization" `task-packets/K1-T03b.yaml`'s own
    `reviewer_resolution` already rejected. Defaulting the new flag to
    `None` means a bare `mrr synthesis run --database-url ... --artifact-
    root ...` (no further flags) resolves `sensitivity_variation_parameters
    = None`, reproducing run 1's own fixture set and its own still
    fail-closed outcome EXACTLY as before this packet — proven by
    `tests/e2e/test_k1_t04_first_real_run.py`'s own two tests passing
    completely unmodified (forbidden_changes; invariants).
  - >-
    (e) WHY EVERY EXISTING CALLER IS BYTE-FOR-BYTE UNAFFECTED, BY
    CONSTRUCTION, NOT MERELY BY INTENT. `establish_and_run_synthesis`'s new
    parameter is keyword-only with a `None` default, so every EXISTING
    caller (`tests/e2e/test_k1_t04_first_real_run.py`'s direct call at its
    own call site, `tests/integration/services/cli/test_synthesis_setup.py`
    's two calls) that does not name this new keyword resolves to `None`
    automatically — Python's own keyword-only-argument default-binding
    rule, not this packet's own runtime logic. `synthesis_main.py`'s new
    flag defaults to `None` in the same way, and `run_command`'s existing
    `kwargs` dict already includes every OTHER fixture key unconditionally
