task_id: K1-T04c
title: >-
  CLI/composition passthrough for MRR-MTH-018 sensitivity-variation
  parameters — add an additive, default-`None`
  `sensitivity_variation_parameters` keyword to
  `establish_and_run_synthesis` and a matching
  `--sensitivity-variation-parameters-file` flag to `mrr synthesis run`,
  so a real run can supply variation parameters through the standard
  composition/CLI path instead of a test file re-implementing that path's
  own choreography locally.
status: approved
epic: K1
reviewer_resolution: >-
  Approved 2026-07-21 by the main session as reviewing instance, under the
  owner's documented same-day delegation. All primary choices CONFIRMED:
  (1) the mandated id `K1-T04c` (reserved by K1-T04b's own depends_on);
  (2) the additive keyword on `establish_and_run_synthesis` positioned
  after `protocol_parameters`, with the unconditional
  `protocol_id`/`protocol_lock_content_hash` overwrite from the
  just-locked protocol — reviewer independently verified this mirrors the
  function's OWN existing step-6 treatment of the base sidecar
  (synthesis_setup.py docstring lines 39-40 and 402-405, fill-in at line
  568): callers genuinely cannot pre-know the hash, so the overwrite is
  what makes the passthrough usable, and pinning is established at
  fill-in time exactly as run 1's own base parameters already do;
  (3) the single-JSON-file CLI flag (`--sensitivity-variation-parameters-
  file`, default None, no committed fixture default) over repeatable
  flags; (4) the documented no-new-schema-flag conclusion — the durable
  named schema for K1-T04b's archival run goes through the EXISTING
  `--database-url` search_path mechanism; (5) new sibling test files
  rather than edits to existing tests, with the two fail-closed
  real-corpus tests staying byte-unmodified (absent variation input keeps
  failing run 1's coverage check — correct and intended). Implementation
  may start immediately; K1-T04b implements only after this packet
  merges.
depends_on: [K1-T04, K1-T03b]
derivation: >-
  Derived per docs/spec/07_AGENT_TASK_TEMPLATE.md section 5, on `main` at
  commit `a2066a1` (confirmed: `git log --oneline -1` on a clean working
  tree — `git status` reports "nothing to commit, working tree clean").

  MANDATE, quoted verbatim from `task-packets/K1-T04b.yaml`'s own
  `reviewer_resolution` (the REDIRECTED ruling, approved 2026-07-21):
  "derived_decisions (f)/(g)'s workaround — a new e2e test locally
  re-implementing `establish_and_run_synthesis`'s choreography because the
  CLI cannot pass `sensitivity_variation_parameters` through — is REJECTED
  as the execution mechanism. It would make run 2 a second-class citizen
  relative to run 1 (not CLI-reproducible, no durable named schema, results
  surviving only in test assertions and PR prose) and would reintroduce
  exactly the local-copy pattern this same day's E9-T00b consolidation
  retired. RULING: a new micro code packet, **K1-T04c** (to be derived
  next), first adds the additive, default-None
  `sensitivity_variation_parameters` passthrough to
  `establish_and_run_synthesis` and the `mrr synthesis run` CLI (mirroring
  `run_synthesis_evidence_loop`'s own new-keyword precedent from K1-T03b
  derived_decisions (j) — byte-identical behavior for every existing
  caller). K1-T04b's implementation WAITS for K1-T04c's merge (depends_on
  updated accordingly)..." This packet answers that ruling directly and
  ONLY that ruling — it does not touch run 2's own fixture content, its own
  new e2e test, or the archival schema question beyond documenting what
  already exists (below); those remain `task-packets/K1-T04b.yaml`'s own
  scope, unaffected by this packet's own `allowed_paths`.

  TASK-ID: already RESERVED, not chosen fresh here. The mandate's own text
  names the id directly ("a new micro code packet, **K1-T04c**") and
  `task-packets/K1-T04b.yaml`'s own `depends_on: [K1-T04, K1-T03b, K1-T04c]`
  already cites it. Briefly justified against the alternatives for the
  record anyway, mirroring the discipline `task-packets/K1-T03b.yaml`/
  `task-packets/K1-T04b.yaml` both already applied to their own id choices:
  - **A fresh epic-numbered slot** (`K1-T05`/`K2-T00`/`E9-T00c`-style) —
    REJECTED, for the identical reasons those two precedent packets already
    rejected them for themselves: epic K1 is closed at "4 tasks"
    (`docs/design/2026-07-21-research-method-kernel-plan.md` line 35,
    reaffirmed by `docs/design/2026-07-21-k2-gate-decision.md`); K2 is
    deferred and categorically unrelated subject matter; E9's own seven
    items are ALL PR-review-comment follow-ups on already-merged PRs, a
    different provenance shape from a reviewer ruling embedded inside an
    approved packet's own text.
  - **`K1-T03c`** — REJECTED. This packet touches ZERO lines of
    `synthesis_executor.py`/`synthesis_orchestration.py` (K1-T03/K1-T03b's
    own protected files) — it only CALLS the already-merged, UNCHANGED
    `run_synthesis_evidence_loop` exactly as K1-T03b already exposes it,
    passing one more keyword through. The b/c-suffix convention this
    repository already uses four times (`E1-T03b`, `E5-T00b`, `E5-T02b`,
    `E5-T07b`, and now `K1-T03b`) anchors on CODE ownership — the files
    this packet actually edits, `services/control_plane/mrr/services/cli/
    synthesis_setup.py` and `services/control_plane/mrr/services/cli/
    synthesis_main.py`, are named VERBATIM in `task-packets/K1-T04.yaml`'s
    own `allowed_paths` (not K1-T03's).
  - **`K1-T04c`** — CHOSEN (and mandated). Extends K1-T04's OWN two files
    unambiguously. Worth stating plainly, since `task-packets/K1-T04b.yaml`
    itself flagged its OWN id choice as resting on a "softer,
    deliverable/directory-ownership" anchor (touching no production code
    file K1-T04 or K1-T03 owns): THIS packet's anchor is the SHARPER,
    unambiguous CODE-ownership kind `task-packets/K1-T03b.yaml`'s own
    `derived_decisions (k)` used for itself — the two files in
    `allowed_paths` below are literally the two files
    `task-packets/K1-T04.yaml`'s own `allowed_paths` lists
    (`services/control_plane/mrr/services/cli/synthesis_setup.py`,
    `services/control_plane/mrr/services/cli/synthesis_main.py`).

  CODE VERIFICATION (fresh, not merely trusted from `task-packets/
  K1-T04b.yaml`'s own derivation, which already did this once): both files
  read IN FULL again at this derivation.
  `services/control_plane/mrr/services/cli/synthesis_setup.py`'s
  `establish_and_run_synthesis` signature (lines 354-382) confirms NO
  `sensitivity_variation_parameters` parameter anywhere, and its
  `loop_kwargs` dict (lines 575-598) confirms that key is never constructed
  or passed to `run_synthesis_evidence_loop` (line 600). `services/
  control_plane/mrr/services/cli/synthesis_main.py`'s `_add_run_subparser`
  (lines 90-193) confirms no `--sensitivity-variation-parameters-file` flag
  and no code path in `run_command` (lines 211-335) that could populate
  one. `services/control_plane/mrr/services/cli/synthesis_orchestration.py`
  's `run_synthesis_evidence_loop` (K1-T03b, merged, UNCHANGED by this
  packet) already accepts, at line 637,
  `sensitivity_variation_parameters: Mapping[str, dict[str, Any]] | None =
  None`, and its own module docstring (lines 137-162) documents the
  contract this packet's passthrough must hand over EXACTLY: "each
  variation's own parameters dict is stored via the SAME
  `artifact_store.put(...)` pattern already used for the corpus/
  protocol-parameters/method-protocol artifacts... and one new
  `instructions["sensitivity_variation_artifact_ids"]` key is added." When
  `None`/empty, confirmed by direct reading of the guard at line 875
  (`if sensitivity_variation_parameters:`), the function mints ZERO
  artifacts and adds ZERO `instructions` keys — `None` passed explicitly is
  byte-for-byte indistinguishable from the parameter being omitted
  entirely, since both fail this same truthiness check identically.

  `SensitivityVariationParameters` (`services/node_runtime/mrr/services/
  node_runtime/synthesis_executor.py` lines 356-386, re-read) confirms each
  per-variation dict MUST itself carry `protocol_id`/
  `protocol_lock_content_hash` (both `Field(min_length=1)`, reusing the
  IDENTICAL `_check_protocol_lock` every base run already uses) — the EXACT
  same two fields `establish_and_run_synthesis` already overwrites,
  unconditionally, on the base `protocol_parameters` dict at its own step 6
  (`final_protocol_parameters["protocol_id"] =
  resolved_method_protocol_id`; `...["protocol_lock_content_hash"] =
  locked_content_hash`, lines 571-573) — because NO caller can know the
  protocol's real id/content_hash before this SAME function creates and
  locks it. This is a genuine, load-bearing finding this derivation confirms
  directly, not merely inherited from `task-packets/K1-T04b.yaml`'s own
  derived_decisions (d), which already anticipated it for run 2's own
  sidecar ("the placeholder strings mirror run 1's own base sidecar's
  identical convention... overwritten at run time by the new e2e test's own
  composition helper with the just-locked MethodProtocol's real id and
  content_hash — the IDENTICAL values the same helper fills into the base
  `protocol_parameters` dict it also passes to
  `run_synthesis_evidence_loop`"). Without this SAME fill-in inside
  `establish_and_run_synthesis` itself, the CLI passthrough this packet adds
  would be unusable by exactly the caller it exists to unblock: a
  CLI-supplied variation-parameters file necessarily carries placeholder
  `protocol_id`/`protocol_lock_content_hash` strings (there is no way to
  author real ones in advance), so the composition function must overwrite
  them the SAME way it already overwrites the base sidecar's own
  placeholders — see derived_decisions (b).

  SCHEMA-NAMING VERIFICATION (Required Reading item 2's own instruction —
  "verify what exists; if schema naming is already caller-controlled...
  document that instead of inventing anything"): `tests/e2e/conftest.py`
  (lines 62-96, re-read) confirms schema targeting for this whole codebase
  is an ORDINARY PostgreSQL connection-string feature, not anything
  MRR-specific — `_schema_scoped_url` appends
  `options=%2Dc%20search_path%3D<schema>` (URL-encoded `-c
  search_path=<schema>`) to a base `--database-url`-shaped string, and
  `postgres_engine` runs one `CREATE SCHEMA`/`alembic upgrade head`/
  `sa.create_engine(scoped_url)` sequence before yielding. `services/
  control_plane/mrr/services/cli/synthesis_main.py`'s own `run_command`
  (re-read) does nothing more than `sa.create_engine(args.database_url)` —
  it never inspects, parses, or hardcodes a schema/search_path anywhere.
  This means a durable, human-chosen schema for `task-packets/
  K1-T04b.yaml`'s own archival run (e.g. `mrr_run2_corroboration_floor_v1`,
  named in that packet's own specification_gaps) requires NO new code in
  either file this packet touches — only three already-possible, purely
  operational steps: (1) `CREATE SCHEMA mrr_run2_corroboration_floor_v1;`
  once (by hand, or via `psql`); (2) one `alembic upgrade head` invocation
  against a `--database-url` scoped to that schema (mirroring
  `_run_alembic_upgrade_head`); (3) pass that SAME scoped URL as `mrr
  synthesis run --database-url "<base>&options=-c%20search_path%3Dmrr_run2_
  corroboration_floor_v1"`. Documented here per the Required Reading's own
  instruction, not implemented as new code — there is nothing to add.
objective: >-
  Two additive, default-`None`/default-absent changes, strictly mirroring
  `task-packets/K1-T03b.yaml` derived_decisions (j)'s own "one new,
  additive, default-empty keyword parameter, ZERO behavior change for every
  existing caller" discipline, applied one composition layer further out:

  (a) `services/control_plane/mrr/services/cli/synthesis_setup.py`'s
  `establish_and_run_synthesis` gains one new keyword-only parameter,
  `sensitivity_variation_parameters: Mapping[str, dict[str, Any]] | None =
  None`, inserted immediately after `protocol_parameters` in the signature
  (mirroring `run_synthesis_evidence_loop`'s own parameter order exactly —
  that function's `protocol_parameters` is immediately followed by its own
  `sensitivity_variation_parameters` at line 637). When `None`/absent
  (every existing caller, unmodified), `establish_and_run_synthesis` passes
  `sensitivity_variation_parameters=None` into its `loop_kwargs` dict —
  byte-for-byte equivalent to the key not existing there at all, since
  `run_synthesis_evidence_loop`'s own default is also `None` and its own
  truthiness guard (`if sensitivity_variation_parameters:`) treats an
  explicit `None` and an omitted argument identically. When supplied (a
  non-empty mapping), `establish_and_run_synthesis` builds a NEW mapping —
  one shallow-copied dict per `variation_entry_id`, with `protocol_id`/
  `protocol_lock_content_hash` OVERWRITTEN from the just-locked
  `MethodProtocol`'s own real id/content_hash — mirroring, one-for-one, the
  IDENTICAL treatment its own step 6 already gives the base
  `protocol_parameters` dict (derived_decisions (b)) — before handing that
  new mapping to `run_synthesis_evidence_loop` under the SAME parameter
  name.

  (b) `services/control_plane/mrr/services/cli/synthesis_main.py`'s `mrr
  synthesis run` gains one new, optional flag,
  `--sensitivity-variation-parameters-file` (type `Path`, default `None` —
  deliberately NOT a committed `corpora/model-collapse/*.json` default,
  unlike the five existing fixture flags: run 1 has no such fixture, and
  this packet mints none — a bare `mrr synthesis run --database-url ...
  --artifact-root ...` continues to reproduce run 1 with ZERO declared
  variations passed, byte-identical to today). When given, the file is
  parsed ONCE via the SAME `_load_json_file` helper the other five fixture
  flags already use; its top-level content — a plain JSON object mapping
  each declared `MethodProtocol.sensitivity_variations` entry_id to its own
  `SensitivityVariationParameters`-shaped body dict, i.e. exactly the
  `Mapping[str, dict[str, Any]]` shape (a) above expects — is passed
  through UNCHANGED as the new `sensitivity_variation_parameters` keyword
  argument to `establish_and_run_synthesis`. When omitted (the default),
  `sensitivity_variation_parameters=None` is passed, matching that
  function's own default exactly.

  Both changes are strictly additive: every existing caller of either
  function (`tests/e2e/test_k1_t04_first_real_run.py`'s two calls — one
  direct, one via the CLI; `tests/integration/services/cli/
  test_synthesis_setup.py`'s two calls; `tests/unit/services/cli/
  test_synthesis_main.py`'s CLI-parsing tests) supplies neither the new
  keyword nor the new flag, so every one of them resolves to the SAME
  `None` default this packet introduces and is byte-for-byte unaffected —
  see invariants and derived_decisions (e) for why this is true by
  construction, not merely asserted.

  Deliberately and explicitly OUT of scope, named, not designed here: (i)
  any new fixture content under `corpora/model-collapse/` (that is
  `task-packets/K1-T04b.yaml`'s own scope entirely); (ii) `task-packets/
  K1-T04b.yaml`'s own new e2e test, which this packet's merge unblocks but
  does not write; (iii) actually minting a durable, named Postgres schema
  for that run (documented above as an already-possible, purely
  operational sequence — nothing to build); (iv) any change to
  `run_synthesis_evidence_loop`, `SystematicEvidenceSynthesisExecutor`, or
  any K1-T01 contract/schema (forbidden_changes).
