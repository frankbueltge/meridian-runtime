objective: >-
  Deliver five things, precisely scoped: (a) extend `EDGE_VOCABULARY` by the
  four spec-08-section-3 edge types (`operationalizes`,
  `governed_by_protocol`, `ruled_by`, `decided_by`) plus ONE hand-written
  Alembic migration widening the `edges.edge_type` CHECK constraint from
  nineteen to twenty-three values — the FIRST such migration this repository
  has ever needed; (b) a new, pure, framework-free domain function
  (`mrr.domain.claim_ceiling.ceiling_violation_reason`) implementing
  MRR-MTH-004/005/006's ceiling gate over the narrow, honestly-disclosed
  mapping this packet derives (claim_type "causal" requires a `ruled_by`
  MethodRuling whose ceiling is `causal_local`/`causal_bounded`; EVERY ruling
  regardless of claim_type must never license a ceiling above its governing
  MethodProfile's own declared `max_claim_ceiling`), wired into
  `ClaimService` at THREE checkpoints — a new `attach_ruling` method (the
  "at submission" gate, MTH-004), a new conditional inside the existing
  `_transition` helper that re-verifies the gate whenever an already-ruled
  claim moves into a language-asserting status (defense in depth, mirroring
  `_write_edge`'s own "belt and braces" precedent), and an additive
  extension of the existing `mrr.domain.projection.build_claim_table_row`
  plus `ProjectionService.build_claim_table` (the "at ... projection
  rendering" gate, MTH-004's second half) — MRR-MTH-005 satisfied
  STRUCTURALLY (the gate function accepts no confidence/significance/
  fluency-shaped parameter at all, proven by a signature-introspection test,
  not merely asserted in prose); (c) a new, pure domain function
  (`mrr.domain.synthetic_fixture.assert_not_synthetic_fixture_evidence`)
  implementing MRR-MTH-012's decision rule over a plain `classification: str
  | None` parameter — buildable and fully unit-testable TODAY with no
  dependency on ADR-0010 — but its WIRING to any REAL stored object's
  classification is explicitly BLOCKED and NOT delivered by this packet,
  because `schemas/common.schema.json#/$defs/baseObject`/`BaseObject` carry
  no `classification` field today (confirmed by direct reading) and ADR-0010
  — the proposal that would add exactly that field — is still status
  PROPOSED, not accepted by the project owner (confirmed: no later commit
  changes its status) — see the dedicated "ADR-0010 dependency" section
  below and stop_conditions; (d) kill-condition transition PLUMBING
  (MRR-MTH-010) as a new `ClaimService.apply_kill_condition` method reusing
  the EXISTING, already-drawn `CLAIM_LIFECYCLE` "any nonterminal status ->
  withdrawn" edge (no new Claim status is invented; killed branches "remain
  addressable" is therefore true by construction, inherited unchanged from
  the existing append-only `ObjectRepository`) with a distinctly-typed
  domain event and a new `decided_by` edge to the licensing
  `ResearchDecision(decision_type="kill_branch")` — NOT any evaluation logic
  that decides WHETHER a `MethodProtocol`'s free-text `kill_conditions`
  entry is currently satisfied (that requires real `EvidenceMatrix` data and
  is explicitly task-packets/K1-T03.yaml's/K1-T04.yaml's job); (e) the four
  v0.2.0 Gherkin acceptance behaviors re-pinned as plain pytest tests (no
  BDD harness exists here) using spec 08 section 3's six canonical error
  codes — three of the four map cleanly onto this packet's own MTH-004/
  005/006/010/012 scope and are delivered as real, running tests; the
  fourth (protocol lock, MTH-007/008, canonical codes `PROTOCOL_NOT_LOCKED`/
  `PROTOCOL_LOCK_VIOLATION`) is explicitly OUTSIDE this packet's requirement
  list and is re-pinned as DOCUMENTATION ONLY (a code-correction reference
  for whichever future task implements TaskBundle-negotiation-time protocol-
  lock enforcement), not as a test file — see derived_decisions for the full
  four-way mapping table and required_output for how this is reported.

  Deliberately and explicitly deferred, with reasons stated in
  derived_decisions rather than left silent: NO new `MethodProtocolService`,
  `MethodRulingService`, or `ResearchDecisionService` of any kind is
  introduced by this packet (the task framing's own "method-protocol service
  bits if needed (or defer service to K1-T03 — decide and state)" is
  resolved here as DEFER, IN FULL) — every `MethodRuling`/`MethodProtocol`/
  `MethodProfile`/`ResearchDecision` object this packet's own tests need is
  constructed directly and inserted via the generic, already-existing
  `ObjectRepository.insert_revision`, bypassing any service, exactly
  mirroring how this codebase's own tests already seed cross-referenced
  prerequisite objects directly wherever the object under test is not the
  System Under Test. This keeps this packet's own `services/**` footprint to
  exactly two files, both already-existing services being extended
  (`claim`, `projection`), zero new service directories.
