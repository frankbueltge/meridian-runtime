    (it takes a plain `classification: str | None` parameter — no schema
    dependency to CALL it with a literal string in a unit test). BLOCKED
    (NOT delivered by this packet): wiring that function against any REAL
    stored object's classification anywhere (there is no real classification
    to read yet), and therefore the `SYNTHETIC_FIXTURE_NOT_EVIDENCE`
    acceptance behavior is pinned at the UNIT tier only, using synthetic
