task_id: K1-T02
title: >-
  Edges, ceilings, and gates — EDGE_VOCABULARY + CHECK-constraint migration
  for `operationalizes`/`governed_by_protocol`/`ruled_by`/`decided_by`;
  claim-service enforcement of MRR-MTH-004/005/006 (`CLAIM_CEILING_EXCEEDED`);
  kill-condition transition plumbing (MRR-MTH-010, `KILL_CONDITION_TRIGGERED`)
  on Claim via the existing `withdrawn` state; the MRR-MTH-012 synthetic-
  fixture gate (`SYNTHETIC_FIXTURE_NOT_EVIDENCE`) shipped as a pure,
  ADR-0010-independent decision function, with its WIRING to any real stored
  object explicitly BLOCKED pending ADR-0010's acceptance; the four v0.2.0
  Gherkin acceptance behaviors re-pinned with spec 08 section 3's canonical
  error codes as plain pytest integration/unit tests (no BDD harness exists
  in this repository).
status: approved
depends_on: [K1-T01]
