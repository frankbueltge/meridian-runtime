  - >-
    The claim-ceiling gate's exact, narrowly-scoped mapping (MRR-MTH-004/
    005/006), and its honestly-disclosed limits. `Claim.claim_type`
    (`observational`/`causal`/`statistical`/`methodological`/
    `interpretive`/`normative`/`speculative`, docs/spec/02_DOMAIN_MODEL.md
    section 2.11) and `ClaimCeiling`
    (`insufficient_evidence`/`mechanism_hypothesis`/`descriptive`/
    `associational_unadjusted`/`associational_adjusted`/`causal_local`/
    `causal_bounded`, spec 08 section 4) are two DIFFERENT, orthogonal
    vocabularies — the former names the KIND of claim, the latter the
    STRENGTH of language a ruling licenses. Spec 08 section 4's own text
    ("the claim service MUST reject claim language above the ruled ceiling")
    presumes some way to read a claim's own "language" against the ceiling
    ladder, but neither spec 08 nor the existing `Claim` contract defines
    that mapping. This packet implements EXACTLY TWO checks, both fully
    machine-checkable with data already on hand, and declares the rest
    explicitly unmapped rather than inventing a full 7x7 correspondence with
    no real use case to validate it against:

    (1) UNIVERSAL (every claim_type): the attached `MethodRuling.ruled_ceiling`
    MUST NOT exceed its governing `MethodProtocol.profile_id`-resolved
    `MethodProfile.max_claim_ceiling`, per `CLAIM_CEILING_ORDER`'s declared
    order. This is, precisely read, MRR-MTH-003's own text ("no claim
    produced under a profile may exceed [the profile's declared maximum
    ceiling]") — MTH-003 is NOT itself in this packet's assigned requirement
    list, but this same mechanism is exactly what makes MRR-MTH-006 true FOR
    THE FIRST REAL PROFILE: spec 08 section 5 commits
    `systematic_evidence_synthesis`'s `max_claim_ceiling` to
    `associational_unadjusted` in the spec text itself, so THIS check,
    applied to a correctly-declared instance of that profile, structurally
    enforces MTH-006's "its maximum ceiling is associational_unadjusted" for
    every claim ruled under it. What this check does NOT do (flagged,
    specification_gaps): verify that a profile claiming to be "a synthesis
    or descriptive design" (MTH-006's own antecedent) actually IS one —
    `MethodProfile.protocol_form` is free text (K0-T01), not a closed,
    machine-checkable design-kind taxonomy, so a HYPOTHETICAL future profile
    that mis-declares its own `max_claim_ceiling` too high for its true
    design kind would pass this check regardless — this packet enforces "no
    ruling exceeds its OWN profile's declared max," not "this profile's
    declared max is itself correct for its design kind" (the latter would
    need a design-kind taxonomy that does not exist anywhere in this
    codebase).

    (2) CAUSAL-SPECIFIC (only claim_type == "causal"): the attached
    `MethodRuling.ruled_ceiling` MUST be one of `{"causal_local",
    "causal_bounded"}` — the only two ceiling tiers whose NAME denotes causal
    language, per `CLAIM_CEILING_ORDER`'s own ordering (both above
    `associational_adjusted`). Every OTHER claim_type value
    (`observational`/`statistical`/`methodological`/`interpretive`/
    `normative`/`speculative`) is subject to check (1) ONLY — no
    claim-type-specific floor/ceiling correspondence is implemented for any
    of the other six values, since spec 08 gives no textual basis for one
    and inventing a full mapping now, with no real profile driving the need,
    risks encoding made-up epistemology the spec never asked for. Flagged
    prominently (specification_gaps) as this packet's own narrowest-
    defensible reading, for reviewer confirmation before K1-T03 builds
    against it.

    MRR-MTH-005 ("statistical significance, model confidence, or output
    fluency MUST NOT raise a ceiling") is satisfied STRUCTURALLY, not by
    policy prose: `mrr.domain.claim_ceiling.ceiling_violation_reason`'s own
    signature is `(*, claim_type: str, ruled_ceiling: str,
    profile_max_ceiling: str) -> str | None` — no parameter exists anywhere
    for a p-value, a confidence score, or a fluency/quality metric, so
    nothing could enter this decision even if a caller wanted it to. Proven,
    not merely asserted, by `inspect.signature` introspection in a unit test
    (acceptance_tests).
  - >-
    Three enforcement checkpoints for MRR-MTH-004's "at submission and at
    projection rendering", deliberately layered (mirroring
    `ClaimService._write_edge`'s own already-documented "belt and braces"
    precedent — checked once in code, once again by the database, neither
    trusted alone):

    (i) `ClaimService.attach_ruling(claim_id, method_ruling_id, *, actor,
    policy_version, correlation_id) -> TypedEdge` — the "at submission" gate
    and the ONLY place a `ruled_by` edge is ever written. Resolves
    `method_ruling_id` via `self._object_repository.get_latest` (the
    already-existing, fully generic dependency — works for ANY object kind),
    then `ruling.body["protocol_id"]` -> `MethodProtocol`, then
    `protocol.body["profile_id"]` -> `MethodProfile`, reading
    `max_claim_ceiling` from its CURRENT latest revision regardless of that
    profile's own lifecycle status (flagged, specification_gaps: this does
    NOT require the profile to be `status == "accepted"` — checking that
    would need either a new dependency on `MethodProfileService` or a raw
    event-log scan neither MTH-004/005/006's literal text nor this task's
    scope clearly demands; deferred). Calls
    `mrr.domain.claim_ceiling.ceiling_violation_reason` against the resolved
    claim's own `claim_type`; on a non-`None` result, raises
    `ClaimCeilingExceededError` BEFORE writing anything (mirrors
    `to_supported`'s "checked first, nothing persisted on failure"
    discipline) — no edge, no event. On success, writes the `ruled_by` edge
    via the existing `_write_edge` helper (event_type
    `"claim.ruling_attached"`), reusing its already-atomic
    edge-plus-event composition unchanged.

    (ii) A new conditional inside the EXISTING `_transition` helper (not a
    new method): when `to_status` is one of `{"supported", "contested",
    "contradicted", "unsupported"}` (the four CLAIM_LIFECYCLE targets that
    assert some claim language — `unresolved`/`review_required`/`withdrawn`/
    `superseded` do not, per their own existing names), look up
    `self._edge_repository.edges_from(claim_id, "ruled_by")`. If EMPTY (no
    ruling ever attached — a legacy or non-profile claim), skip entirely:
    ZERO behavior change for every claim created before this packet and for
    the existing `to_supported`/`to_contested` etc. unit/integration tests
    that seed no `ruled_by` edge — this is a deliberate, disclosed choice
    NOT to retroactively enforce MTH-004's blanket "every claim produced
    under a profile MUST carry a ruled_by edge" MUST-clause (see
    specification_gaps: `Claim` carries no field distinguishing "produced
    under a profile" from "not," so this packet cannot structurally tell
    the two apart — enforcing the MUST-clause universally would either
    break every pre-existing claim or require guessing; deferred to
    task-packets/K1-T03.yaml, the first real profile-claim producer, which
    DOES know at construction time that it is producing a profile claim).
    If ONE OR MORE `ruled_by` edges exist, re-resolve EACH target
    `MethodRuling`/`MethodProtocol`/`MethodProfile` chain and re-run the
    SAME gate; if ANY of them reports a violation, raise
    `ClaimCeilingExceededError` and persist nothing (fail-closed direction:
    a claim with multiple, possibly-conflicting rulings attached — never
    itself deduplicated or prevented by this packet, flagged,
    specification_gaps — is rejected if ANY attached ruling would license a
    violation, not accepted if ANY ONE happens to pass).

    (iii) `packages/domain/mrr/domain/projection.py`'s existing
    `build_claim_table_row` gains two NEW, fully OPTIONAL keyword parameters
    (`ruled_ceiling: str | None = None`, `profile_max_ceiling: str | None =
    None`, both defaulting to `None` — zero change to any EXISTING call
    site's behavior) and `ClaimTableRow` (a frozen dataclass, additive) gains
    two new fields: `ceiling_checked: bool` (`True` iff both new parameters
    were supplied) and `ceiling_violation: str | None` (the SAME
    `ceiling_violation_reason` string when checked-and-violating, `None`
    otherwise — including when NOT checked at all; the two "no violation"
    and "not checked" cases are DELIBERATELY not distinguished by a third
    field, flagged as a disclosed limitation mirroring
    `EvidenceMatrixRow.verification_status`'s own three-state "pending"
    precedent, though here realized as two booleans-worth of information
    rather than a three-value enum — a reviewer may prefer a single
    `Literal["not_checked", "licensed", "violated"]` field instead;
    flagged for reviewer scrutiny). `ProjectionService.build_claim_table`
    (the I/O-performing half) is extended to look up each claim's own
    `ruled_by` edge(s) via its ALREADY-HELD `self._edge_repository`, resolve
    the SAME `MethodRuling` -> `MethodProtocol` -> `MethodProfile` chain via
    its ALREADY-HELD `self._object_repository` (no new constructor
    dependency), and pass the resolved values into `build_claim_table_row`
    — reusing `mrr.domain.claim_ceiling.ceiling_violation_reason` directly
    (never re-implementing the gate logic a second time). This re-derives
    the SAME verdict at render time rather than trusting the claim's own
    stored status, consistent with `mrr.domain.projection`'s own established
    "narrative reports are projections, never authoritative" discipline
    (AGENTS.md) — a claim marked `supported` under a ruling that was LATER
    superseded to a stricter ceiling surfaces `ceiling_violation` at render
    time even though its own stored object was valid when it was written.
  - >-
    Kill-condition transition plumbing (MRR-MTH-010) reuses the EXISTING
    `withdrawn` `CLAIM_LIFECYCLE` state rather than inventing a new one — a
    considered, disclosed judgment call, not a spec-drawn certainty.
    `CLAIM_LIFECYCLE`'s already-declared "any nonterminal status ->
    withdrawn" edge set (`packages/domain/mrr/domain/lifecycles.py`,
    confirmed by direct reading) is REUSED, not duplicated, for exactly the
    reason MTH-010's own text gives: "killed branches remain addressable and
    inspectable" is EXACTLY `withdraw()`'s own already-documented behavior
    ("a withdrawn claim remains addressable — docs/spec/01_SYSTEM_SPEC.md
    section 6.3"). A NEW public method, `ClaimService.apply_kill_condition
    (claim_id, research_decision_id, *, actor, policy_version,
    correlation_id) -> tuple[StoredObject, TypedEdge]`, does two SEQUENTIAL,
    each independently atomic writes (mirroring the module's own established
    "object fields and graph edges are two independent writes with one
    required consistency point, not a single auto-derived projection of
    each other" precedent — see the module docstring's "Field-vs-edge
    consistency" section — NOT wrapped in one combined multi-table
    transaction, since no persistence primitive in this codebase's
    `allowed_paths` composes an object-revision write AND an edge write
    atomically together, only each with its OWN event):

    (1) resolves `research_decision_id` via `self._object_repository.get_latest`
    and calls a new pure function, `mrr.domain.kill_condition.
    assert_licenses_kill(decision_kind=..., decision_type=...)`, raising a
    new `InvalidKillDecisionError` (carrying `research_decision_id`,
    `actual_kind`, `actual_decision_type`) if the resolved object is not a
    `ResearchDecision` with `decision_type == "kill_branch"` — checked FIRST,
    nothing persisted on failure;

    (2) transitions the claim via the EXISTING `_transition` helper to
    `"withdrawn"`, but with `event_type="claim.kill_condition_triggered"`
    (a NEW, distinctly-named event type — NOT the existing plain
    `"claim.withdrawn"` a voluntary researcher withdrawal produces via the
    existing `withdraw()` method, kept as a separate call) whose `payload`
    carries `{"code": "KILL_CONDITION_TRIGGERED", "research_decision_id":
    ..., "from_status": ..., "to_status": "withdrawn"}` — this is how the
    packet makes spec 08's literal, canonical, SCREAMING_SNAKE_CASE string
    `KILL_CONDITION_TRIGGERED` a real, greppable, directly-assertable fact
    on the persisted event, WITHOUT breaking this codebase's own uniform
    `"<noun>.<past_tense_verb>"` lowercase-dotted `event_type` naming
    convention (every existing `DomainEvent.event_type` in this codebase
    follows it; breaking it for one new event type would surprise any
    generic event-type-pattern-matching code) — a considered, disclosed
    judgment call (specification_gaps), not the only shape a reviewer might
    prefer;

    (3) writes a NEW `decided_by` edge, `claim_id -> research_decision_id`,
    via the EXISTING `_write_edge` helper (event_type
    `"claim.kill_decision_recorded"`), reusing its already-atomic
    edge-plus-event composition unchanged.

    `apply_kill_condition` is deliberately scoped to CLAIMS ONLY — it does
    NOT write a `decided_by` edge from the `MethodProtocol`/branch itself,
    any `EvidenceMatrix`, or any other non-Claim object kind possibly
    associated with the killed branch, because no service in this packet's
    scope (or anywhere on `main`) owns persistence for those OTHER object
    kinds yet — flagged (specification_gaps) as deferred to whichever future
    service (likely task-packets/K1-T03.yaml) manages `MethodProtocol`/
    `EvidenceMatrix` persistence and can extend `decided_by` edge-writing to
    those kinds symmetrically. `MethodProtocol` itself gains NO new
    lifecycle state or transition for "killed" — deliberately: a single
    protocol may have MULTIPLE `planned_analyses` ("branches"), and killing
    ONE via a `kill_branch` decision must not imply the WHOLE protocol is
    dead; `METHOD_PROTOCOL_LIFECYCLE` (K1-T01) is untouched (also
    `forbidden_changes`).
  - >-
    The four v0.2.0 Gherkin behaviors, re-pinned: exact mapping table.
    (1) `method-causal-claim-gate.feature` — drifted
    `METHOD_CLAIM_CEILING_EXCEEDED` -> canonical `CLAIM_CEILING_EXCEEDED`;
