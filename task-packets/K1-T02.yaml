derived_decisions:
  - >-
    ADR-0010 dependency — the crisp answer this packet's own instructions
    demanded. MRR-MTH-012's fail-closed synthetic-fixture gate, AS SPECIFIED
    (a "machine-checkable marker that test fixtures can never become
    empirical evidence" that "propagates to derivatives"), genuinely
    requires a real, stored, propagating classification field on first-class
    objects — exactly what ADR-0010 proposes adding to
    `baseObject`/`BaseObject`. Confirmed by direct reading:
    `schemas/common.schema.json#/$defs/baseObject` (lines 18-33) and
    `packages/contracts/mrr/contracts/common.py`'s `BaseObject` (lines
    135-155) carry NO `classification` field today — `classification` exists
    ONLY on `$defs/artifactRef`/`ArtifactRef` (schema lines 46-58, contracts
    lines 90-99), which is a REFERENCE-shaped nested value (an artifact
    pointer), not a property of the `SourceRecord`/`EvidenceAnchor`/`Claim`/
    `EvidenceMatrixRow` objects MRR-MTH-012 actually needs classified. Every
    narrower alternative was considered and rejected, for the SAME reasons
    ADR-0010 itself already gives (its own "Alternatives considered"
    section): (1) a brand-new, K1-T02-local marker field on ONLY the method-
    kernel objects would fork classification into two parallel, drifting
    mechanisms — exactly what ADR-0010's own Consequences section warns
    against ("keeping one vocabulary prevents two parallel marker mechanisms
    from drifting"); (2) `labels.classification` (already available on every
    `BaseObject` TODAY, no schema change needed) was considered and REJECTED
    for the identical reason ADR-0010 itself rejects it: "labels are
    unsigned-adjacent, weakly typed, and deliberately non-semantic; policy
    MUST NOT hang on them" — building this packet's OWN real gate on a
    foundation ADR-0010's own governance record already found unsound would
    be worse than deferring, even though ADR-0010 itself is not yet accepted;
    (3) a side-table keyed by object id was considered and rejected as
    inventing exactly the kind of ad hoc, non-canonical classification store
    ADR-0010 exists to prevent, and as scope no task packet should take on
    unilaterally for a single narrow consumer.

    CONCLUSION: this packet is SPLIT into an unblocked part and a blocked
    part, delivered honestly as such rather than either (a) silently
    building on `labels` against the ADR's own already-documented reasoning,
    or (b) unilaterally implementing ADR-0010's schema change itself (a task
    packet accepting a PROPOSED, owner-pending ADR on its own authority would
    violate this repository's own established discipline — every other
    K-epic task so far was implemented only AFTER a separate, explicit
    "Governance: ... approved" commit, never by the same commit/PR that
    proposed the design). UNBLOCKED (delivered by this packet, no ADR-0010
    dependency): (a) edges+migration, (b) the ceiling gate (MTH-004/005/006),
    (d) kill-condition plumbing (MTH-010), and the pure decision FUNCTION for
