specification_gaps:
  - >-
    ADR-0010 is PROPOSED, not ACCEPTED, at derivation time (confirmed: no
    commit after `1bdf394` changes its status) — this packet's MRR-MTH-012
    slice is therefore genuinely incomplete by design (pure function only,
    no real-object wiring), not merely deferred out of laziness. See the
    dedicated derived_decisions entry for the full reasoning and the
    recommendation delivered alongside this packet.
  - >-
    The claim-ceiling gate's mapping (claim_type "causal" <-> {causal_local,
    causal_bounded}; every other claim_type checked ONLY against the
    universal profile-max cap) is this packet's own narrowest-defensible
    reading of MTH-004's "claim language above the ruled ceiling", not
    literal spec text — spec 08 nowhere spells out a claim_type-to-ceiling
    correspondence. A reviewer may want a fuller mapping for the other six
    claim_type values once real claims exist to validate one against
    (K1-T03/K1-T04).
  - >-
    MTH-006's own antecedent ("a synthesis or descriptive design") has no
    machine-checkable representation anywhere in this codebase —
    `MethodProfile.protocol_form` is free text. This packet's universal
    profile-max check enforces "no ruling exceeds ITS OWN profile's declared
    max," which is EXTENSIONALLY equivalent to MTH-006 for a correctly
    self-declared `systematic_evidence_synthesis` profile, but does not
    itself verify a profile's design-kind classification is correct.
  - >-
    `attach_ruling` does not require the resolved `MethodProfile.status ==
    "accepted"` (nor the resolved `MethodProtocol.status == "locked"`,
    MTH-007, explicitly out of this packet's scope) — it reads whatever the
    CURRENT latest revision of each declares, regardless of lifecycle state.
    Flagged for reviewer confirmation; tightening this would need either a
    new cross-service dependency or an event-log scan.
  - >-
    MRR-MTH-004's blanket "every claim produced under a profile MUST carry a
    ruled_by edge" is NOT structurally/retroactively enforced by this
    packet — `Claim` carries no field distinguishing a profile-produced
    claim from a legacy/non-profile one, so a claim with NO `ruled_by` edge
    at all is never rejected by this packet's own checks (only a claim that
    HAS one, but whose ruling violates the ceiling, is rejected). Deferred
    to task-packets/K1-T03.yaml, the first real profile-claim producer,
    which knows at construction time whether a claim is profile-produced.
  - >-
    A claim may accumulate MULTIPLE `ruled_by` edges over time — this packet
    neither prevents nor deduplicates this. The `_transition` re-check
    treats "any attached ruling reports a violation" as fail-closed
    rejection, which is conservative but not itself validated against a
    "which ruling is authoritative when more than one is attached" policy —
    no such policy exists anywhere in spec 08. Flagged for reviewer scrutiny.
  - >-
    `ClaimTableRow`'s new `ceiling_checked`/`ceiling_violation` pair does not
    distinguish "checked, no violation" from "not checked at all" via a
    single field — both read `ceiling_violation=None`, disambiguated only by
    the SEPARATE `ceiling_checked` boolean. A reviewer may prefer a single
    three-value `Literal["not_checked", "licensed", "violated"]` field
    instead; flagged, not resolved unilaterally.
  - >-
    Reusing the EXISTING `withdrawn` `CLAIM_LIFECYCLE` state for
    kill-condition termination (rather than a new, dedicated status, e.g.
    `"killed"`) conflates two domain concepts — voluntary researcher
    withdrawal and involuntary kill-condition termination — under one
    `Claim.status` value, distinguished only by which `event_type`/edge
    accompanies the SAME transition. A reviewer may instead want a distinct
    `ClaimStatus` value, which would require touching
    `schemas/claim.schema.json`/`claim.py` (this packet's own
    `forbidden_changes`, unless genuinely required) — flagged as the single
    most consequential open judgment call in this packet's own design,
    alongside the ADR-0010 split.
  - >-
    `apply_kill_condition` writes a `decided_by` edge from the CLAIM only,
    never from the killed `MethodProtocol`/branch itself or any associated
    `EvidenceMatrix` — no service in this packet's scope owns persistence
    for those other object kinds. Deferred to task-packets/K1-T03.yaml.
  - >-
    `KILL_CONDITION_TRIGGERED`'s canonical string is carried in the
    persisted event's `payload["code"]`, not as the literal `event_type`
    string itself (which stays lowercase-dotted,
    `"claim.kill_condition_triggered"`, per this codebase's own uniform
    naming convention). A reviewer may prefer the literal canonical string
    AS the `event_type` instead, breaking the established convention for
    this one case; flagged, not resolved unilaterally.
  - >-
    The new `error_code: ClassVar[str]` attribute on
    `ClaimCeilingExceededError`/`SyntheticFixtureNotEvidenceError` is a NEW
    convention with no precedent among this file's ~40 existing exception
    classes (none carry one). This departure is deliberately narrow (only
    the two exceptions bound to spec-08-canonical strings carry it) rather
    than retrofitted onto every existing exception; flagged for reviewer
    confirmation that this is the right place to introduce the convention.
  - >-
    This packet's own `services/**` footprint (two files: `claim`,
    `projection`, both extensions of already-existing services) assumes
    task-packets/K1-T03.yaml will be the FIRST task to introduce
    `MethodProtocolService`/`MethodRulingService`/`ResearchDecisionService`.
    If K1-T03 is derived with a different scope than currently sketched in
    docs/design/2026-07-21-research-method-kernel-plan.md, this assumption
    should be re-checked, not silently carried forward.
