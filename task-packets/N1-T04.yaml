requirements:
  - >-
    R1 (the proposal set as data,
    packages/domain/mrr/domain/relation_proposal.py): a Pydantic-validated
    PROJECTION — never persisted, never authoritative (rule 7) — carrying, per
    case: `case_id`, `proposed_relation` (one of the declared categories, or
    None when undecidable), `rationale`, `decided_by`, `tie_with`,
    `undecidable` + `undecidable_reason`, `verification_disposition`, the
    attempt statuses in order, and the response hash of the deciding attempt.
    Globally: `system_id`, `model_profile_id`, `model_profile_hash`,
    `prompt_hash`, `commission_sha256`, `criteria_sha256`, `criteria_version`,
    `categories`, and a `limitations` block naming, in plain type, that the
    excerpts may have been in the model's training data. It renders to JSON
    whose top level carries `system_id` and `predictions` so that
    `mrr validate gold --predictions` reads it directly (gold_service.py
    :488-511 tolerates the additional keys; the majority-baseline file already
    relies on that).
  - >-
    R2 (`verified` unreachable, MRR-MTH-016): `verification_disposition` uses
    MTH-016's CLOSED vocabulary unchanged and this path emits ONLY
    `"downgraded-to-proposal"`. No new value is added — "schema-valid" is
    refused under rule 4. `"verified"` is unreachable because this packet
    performs no verification against the anchored source, which is what that
    specification line defines the word to mean; `"rejected"` is likewise
    unreachable, being reserved for a caller-side verification step this packet
    does not build (the existing arm's own docstring says so). A test asserts
    that no code path in this packet can produce either value.
  - >-
    R3 (label isolation, structural): the classifier's per-case input type
    carries ONLY `case_id`, `title`, `claim_text`, `excerpt` and
    `excerpt_sha256` — it has no field able to hold an expected relation, so a
    label cannot reach the prompt even by mistake. This mirrors E4-T07's
    BenchmarkCase/SystemUnderTest guarantee (harness.py:38-63) and N1-T02's
    AT5: the isolation is a property of the type, not of the caller's care. The
    loader reads the COMMISSION file, whose union of case keys is label-free,
    and MUST refuse a cases file carrying any key from a stated forbidden set
    (`expected_relation`, `expected_rationale`, `decided_by`, `tie_with`,
    `undecidable`) rather than ignoring it — silently accepting a
    label-carrying input is how a blind run stops being blind.
  - >-
    R4 (the classifier,
    services/control_plane/mrr/services/classification/relation_service.py):
    takes an INJECTED `ModelAdapter` (never constructs one), the criteria, and
    the cases; calls `generate_structured` (E4-T02, unchanged) once per case
    against a small Pydantic target model with `extra="forbid"`; and returns
    the proposal set. The prompt carries the claim under classification, the
    four category definitions and the rules verbatim from the criteria file,
    plus the case's title and excerpt — nothing else. Every distinct failure
    status E4-T02 surfaces (`schema_invalid`, `refused`, `content_filtered`,
    `error`, `timed_out`) is recorded AS ITSELF and never collapsed into one
    generic error (AGENTS prohibited shortcut). An optional injected sleep hook
    throttles between calls; it is a parameter, never a wall-clock read inside
    the domain.
  - >-
    R5 (`mrr classify relations`,
    services/control_plane/mrr/services/cli/classification_main.py): a new
    top-level `classify` group with one subcommand, mirroring
    `mrr validate gold`'s ordering, exit-code map and atomic `os.replace`
    write. Exit 2 for a missing/unparseable input (a DEPENDENCY problem);
    exit 3 for a refusal that is a RESULT — a cases file carrying labels, an
    output path that already exists, or incomplete coverage after the run.
    `--adapter none` is the default and REFUSES with a named message rather
    than doing anything by halves; `--adapter gemini` constructs the concrete
    adapter with `UrllibHTTPTransport` and the model name given by
    `--model-name`, which is required and never defaulted, because "Gemini" is
    not a measurable object. `main.py` gains exactly one registration and one
    dispatch branch.
  - >-
    R6 (the freeze gap, benchmarks/meridianbench/fixtures/FROZEN.json — K1):
    register `mb-cls-ulysses-v1-restamped` with the sha256 of its bytes, so
    `scripts/check_gold_freeze.py` — which CI already runs (ci.yml:71) — holds
    the standard this packet is measured against. The script itself is NOT
    modified; only its registry gains an entry. This is a deliberate,
    argued-for reach into N1-T02's artefact, declared here rather than folded
    in silently.
  - >-
    R7 (the online path, .github/workflows/gold-classification.yml): on
    `workflow_dispatch` (with `model_name` and a `dry_run` input) AND on push
    when one of its own inputs changes — the classifier, the commission, the
    criteria, or the gold set. NEVER on a schedule: the handoff's standing
    rules "kein Nightly, das dasselbe neu rechnet" and "keine dritte nächtliche
    Routine" bind, and re-sending sixty frozen cases to a model every night
    would burn quota and manufacture noise indistinguishable from a finding.
    The job classifies, then measures with `mrr validate gold --expect-sha256`
    against the registered hash, then commits predictions and report as a
    machine identity at an `@meridian-runtime.invalid` address. It never
    pushes to `main`: the result lands on the branch the run belongs to, and
    the merge is an owner act. Absent `GEMINI_API_KEY` it fails loudly and
    writes nothing.
