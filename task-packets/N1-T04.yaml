task_id: N1-T04
title: >-
  Model-assisted evidence-relation classification: the first system that can be
  measured against the frozen gold standard. A `ModelAdapter`-driven classifier
  over the blind commission's sixty cases, emitting a schema-validated proposal
  set that is simultaneously a `mrr validate gold --predictions` input and its
  own audit trail — every proposal `downgraded-to-proposal` and never
  `verified`, on a NEW path that leaves `CorpusEntry.evidence_relation` and the
  synthesis executor untouched, offline-testable against a scripted fake
  adapter, and run end to end online by a workflow that classifies, measures
  against a hash-pinned standard, and commits both.
status: approved
epic: N1
reviewer_resolution: >-
  Approved 2026-08-02 by the main session as reviewing instance, under the
  owner's ordering of 2026-08-01 ("1. Maßstab -> 2. modellgestützte Einordnung
  -> 3. Literaturkanal -> 4. Kopplung"), his epistemic decision of the same day
  ("nie überschreiben, nie verified"), and his operating decision of 2026-08-02
  ("ich will NIX lokal, alles läuft online und automatisch"). Load-bearing
  choices CONFIRMED at derivation: (a) this completes a step the specification
  already declares — docs/spec/08_RESEARCH_METHOD_KERNEL.md section 5 names
  "extraction AND classification proposals" as the profile's model-assisted
  steps, so this is an ordinary capability packet under rules 2/3 and needs no
  integration-packet exemption; (b) "verified" is unreachable on this path BY
  CONSTRUCTION, because MTH-016 defines it as verified against the anchored
  source and this packet performs no such verification — the owner's "never
  verified" is what the specification already says, not an added house rule;
  (c) NO new disposition value is introduced: "schema-valid", as the handoff
  and the N1-T02 derivation both proposed it, would extend MTH-016's closed
  vocabulary and is refused under rule 4; (d) the system under test receives
  the byte-identical blind commission and the byte-identical criteria the gold
  labels were made under, generality fence and all, because a system judged
  under different criteria than its standard measures nothing; (e) the gold
  standard is registered in the freeze registry as part of this packet — the
  first packet to produce a real measurement against it must not rest on a file
  CI does not hold still; (f) online and automatic, but anlassgetrieben: a new
  input triggers a new measurement, never a clock.
depends_on: [N1-T02, E4-T02, E4-T08]
derivation: >-
  Derived 2026-08-02 from
  docs/design/2026-08-02-n1-t04-ableitung-modellgestuetzte-einordnung.md, which
  fact-locks the 2026-08-02 handoff against the code. Every claim in that
  handoff that could be checked was RE-EXECUTED rather than re-read: the three
  test tiers were run (2565 unit, 600 contract + 2 skipped, 48 benchmark, all
  pass), scripts/check_gold_freeze.py was run (6 versions verified), the first
  measurement was reproduced byte-for-byte from the committed files (accuracy
  0.4211 = majority floor 0.4211, Cohen's kappa 0.0000, Krippendorff's alpha
  -0.2662, false-support 0/56, n=57 with 3 undecidable), and research-run.yml's
  selection logic was re-executed against the live tree (pending = []). Three
  corrections, each a line that was read:
  (K1) the gold standard ITSELF is not frozen. FROZEN.json's six entries are
  the three criteria versions and the three SYNTHETIC fixtures;
  mb-cls-ulysses-v1-restamped — the standard the first measurement used — is
  absent, so the CI check built for exactly this does not cover it, and
  --expect-sha256 is optional (validation_main.py:164-172), so nothing forces a
  caller to pin it either. The handoff's "alle eingefroren ... 6 Versionen" is
  literally true and reads as though the standard were held.
  (K2) this step is specification-backed and neither the handoff nor the N1-T02
  derivation says so. docs/spec/08_RESEARCH_METHOD_KERNEL.md section 5:
  "Model-assisted steps (each per MTH-016): extraction AND CLASSIFICATION
  PROPOSALS against protocol-declared fields, verified against the anchored
  source or downgraded to marked proposals." The executor built the extraction
  half (synthesis_executor.py:431-488); the classification half was never
  built.
  (K3) "die Disposition heißt schema-valid" would break MTH-016, whose
  vocabulary is closed (verified / downgraded-to-proposal / rejected) and typed
  as such (synthesis_executor.py:421). The real defect is the mirror image: the
  existing arm stamps "verified" on a merely schema-valid response (:483),
  which is the MTH-016 violation, since the same specification line defines
  verified as verified AGAINST THE ANCHORED SOURCE.
  Fact base confirmed unchanged: GeminiModelAdapter has zero production call
  sites; evidence_relation is structurally unreachable from the extraction path
  (CorpusEntry :247, extraction dict :251, ExtractionOutcome :413-421);
  _verification_disposition is write-only (constant :202, write :611, no
  reads); gold_service.py:488-511 tolerates extra top-level keys in a
  predictions file and :525-529 propagates MismatchedRatersError unchanged; the
  commission's union of case keys carries no label; GEMINI_API_KEY exists as a
  meridian-runtime repository secret.
objective: >-
  After this packet, `mrr classify relations --cases <commission> --criteria
  <criteria> --output <proposals>` drives an injected ModelAdapter over every
  case of a blind commission and writes ONE schema-validated file that is both
  a `mrr validate gold --predictions` input (`system_id` + `predictions`) and
  the run's own audit trail (per case: rationale, decided_by, tie_with,
  undecidable flag, verification disposition, response hash and per-attempt
  status; globally: model profile id and hash, prompt hash, the commission's
  sha256 and the criteria's sha256). Every proposal carries
  verification_disposition == "downgraded-to-proposal"; "verified" is
  unreachable on this path by construction. A case whose structured generation
  does not yield a schema-valid proposal receives NO prediction and its
  distinct failure status is recorded verbatim, never collapsed; the command
  then REFUSES with a named non-zero exit listing the affected cases, rather
  than emitting a partial set that would measure as though it were whole. A
  case the model marks undecidable under R-undecidable-is-a-finding likewise
  yields no prediction, is counted and reported, and is NOT a run failure. And
  `.github/workflows/gold-classification.yml` runs the whole path online —
  classify, then measure with `mrr validate gold --expect-sha256` against the
  now-registered frozen standard, then commit predictions and report — on
  workflow_dispatch and whenever one of its own inputs changes, never on a
  clock.
