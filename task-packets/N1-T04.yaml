derived_decisions:
  - >-
    (a) An ordinary capability packet, not an integration packet. The
    specification declares the step ("extraction and classification
    proposals", 08_RESEARCH_METHOD_KERNEL.md section 5), so rule 3 is satisfied
    directly and no exemption is claimed. The distinction matters: an
    integration packet may add one concrete port implementation and nothing
    else, which would have been the wrong licence for a packet that adds a
    domain projection and a service.
  - >-
    (b) No fourth disposition value. Both the handoff and the N1-T02
    derivation proposed naming the disposition "schema-valid". That extends a
    closed MUST vocabulary and is refused. The owner's intent — never call an
    unverified proposal verified — is achieved by using MTH-016's own
    "downgraded-to-proposal", which is exactly what an unverified proposal is.
    The stronger result: "nie verified" needed no rule of its own, because the
    specification already said it.
  - >-
    (c) The existing extraction arm is left broken on purpose. It stamps
    "verified" without verifying (synthesis_executor.py:483) — a real MTH-016
    violation, today without data consequence because the key is write-only and
    claim prose comes from the curated field. Fixing it here would mix two
    packets and touch services/node_runtime, which this packet forbids itself.
    It is handed on as a named open finding, not quietly repaired and not
    quietly ignored.
  - >-
    (d) The criteria go to the model WITH their known asymmetry. Ulysses'
    finding 4.1 — a generality fence on `supports` and none on `contradicts` —
    stands unrepaired by owner decision, because changing a definition
    retroactively devalues sixty blind labels. A system classifying under
    different criteria than its standard measures nothing, so the fence is part
    of the task for as long as this standard is the standard. What this packet
    adds is evidence about it: where a second independent reader hits the same
    fences, the fence is the problem; where it does not, the reading was.
  - >-
    (e) Undecidable is a first-class outcome, not a failure. R-undecidable-is-
    a-finding governs the standard; a system applying the same criteria must
    have the same move available, or its coverage cannot be compared with the
    standard's. An undecidable case yields no prediction, is counted, and does
    not fail the run. The comparison of the two undecidable SETS is itself a
    finding about the criteria.
  - >-
    (f) Incomplete coverage refuses. A case with no schema-valid proposal
    yields no prediction and the command exits non-zero naming it, rather than
    writing a shorter predictions file. `build_report` would otherwise raise
    MismatchedRatersError anyway (gold_service.py:525-529) — refusing at the
    point the gap is created reports it where it is diagnosable, and never lets
    a partial run look like a whole one.
  - >-
    (g) One output file, two readers. The proposal set IS the predictions file.
    Splitting them would create two artefacts that must be kept in agreement,
    and the format already tolerates the extra keys — the majority-baseline
    file uses that tolerance today for its `note`.
  - >-
    (h) No wall-clock byte in the artefact. N1-T02's invariant holds, and the
    reason is on the record: a hand-typed timestamp inside something that
    gates on time blocked its own gate within hours (handoff section 5). When
    the run happened is a property of the commit and the workflow run, not of a
    field that can drift away from the act it describes.
  - >-
    (i) Automatic means anlassgetrieben, not nightly. The owner asked for
    everything online and automatic; the standing rules forbid a third nightly
    routine and any nightly that recomputes the same thing. Both hold at once
    by triggering on changed inputs, which is the philosophy research-run.yml
    already runs on ("only a new question starts anything").
  - >-
    (j) The model name is required, never defaulted. A measurement whose system
    under test is recorded as "Gemini" names no object that could be
    re-measured. It is a workflow input and it is written into the artefact.
invariants:
  - No database connection is opened and no repository is constructed anywhere in this packet's runtime path.
  - The domain projection module constructs no adapter, reads no environment variable, and performs no I/O.
  - The service NEVER constructs a ModelAdapter; the adapter is injected, exactly as generate_structured requires of its own caller.
  - No test in any tier performs a network call or reads GEMINI_API_KEY; every test drives a scripted fake adapter.
  - verification_disposition is "downgraded-to-proposal" on every emitted proposal; "verified" and "rejected" are unreachable on this path.
  - The per-case input type has no field capable of carrying an expected relation, and a cases file carrying one is refused rather than ignored.
  - Nothing is written except the requested --output file (atomic os.replace); corpora, archive, criteria and the gold set are never touched.
  - No wall-clock timestamp in any written byte; identical inputs and identical adapter responses yield a byte-identical artefact.
  - Every distinct model failure status is recorded as itself; none is collapsed into a generic error.
  - A run with any case lacking a schema-valid proposal exits non-zero and writes no predictions file.
  - agreement.py, agreement_report.py, gold_validity_report.py, gold_service.py and synthesis_executor.py are byte-identical before and after this packet.
  - The workflow has no `schedule:` trigger.
acceptance_tests:
  - >-
    AT1 (the disposition is structurally honest): a test asserts that the
    string "verified" appears in no emitted disposition across the whole
    module, that the emitted value is always "downgraded-to-proposal", and that
    the disposition type is MTH-016's three-value Literal — unextended. A
    second assertion pins the reason in the test name: this path performs no
    verification against the anchored source.
  - >-
    AT2 (label isolation survives, mirroring N1-T02 AT5): the per-case input
    type has no field carrying an expected relation (asserted over its declared
    fields, not by inspection of one instance); the value handed to the prompt
    builder is that type; and loading a cases file that carries
    `expected_relation` REFUSES with the offending key named, rather than
    dropping it. Loading the real commission.v2.json succeeds and yields
    exactly sixty cases.
  - >-
    AT3 (every failure kind survives as itself): a scripted fake adapter drives
    one case into each of `schema_invalid`, `refused`, `content_filtered`,
    `error` and `timed_out`; the artefact records five DISTINCT statuses, no
    prediction is emitted for any of them, and the command exits 3 naming all
    five case ids. A sixth case succeeding in the same run does not rescue the
    exit code.
  - >-
    AT4 (undecidable is not a failure): a scripted adapter returns a
    schema-valid proposal marked undecidable with a reason; the case yields no
    prediction, is counted in the artefact's undecidable list, and the run
    exits 0 provided every other case decided. This is the assertion that keeps
    coverage comparable with the standard's own three undecidables.
  - >-
    AT5 (the artefact is a predictions file): the rendered JSON loads through
    `GoldValidityService.load_predictions` unchanged and yields the system id
    and the case-to-relation mapping — asserted by calling that method, not by
    re-describing its format. On a synthetic gold set the whole chain then
    produces a GoldValidityReport, proving the operator path end to end without
    a model or a network.
  - >-
    AT6 (determinism and non-interference): two runs over identical inputs with
    an identical scripted adapter render byte-identical artefacts and contain
    no timestamp; `git diff --exit-code` over agreement.py, agreement_report.py,
    gold_validity_report.py, gold_service.py and synthesis_executor.py is empty
    after the packet; the existing unit, property, contract and meridianbench
    tiers pass unmodified.
  - >-
    AT7 (the standard is now held): `scripts/check_gold_freeze.py` verifies
    seven versions including `mb-cls-ulysses-v1-restamped`, and flipping one
    byte of the re-stamped set makes it fail naming that set — asserted by
    running the script, not by reading its registry.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - uv run python scripts/run_test_tier.py meridianbench
  - uv run python scripts/check_gold_freeze.py
  - make security-check
specification_gaps:
  - >-
    MRR-MTH-016 also requires that a model-assisted step "records a
    ModelInvocation". The persisted `mrr.contracts.model_invocation
    .ModelInvocation` is a BaseObject requiring the database this packet is
    forbidden to touch, and the node runtime already leaves
    `run_manifest.model_invocations` empty as a declared E4 scope note
    (run_manifest.py:223, :314). This packet therefore records the invocation
    DATA — model profile id and hash, prompt hash, per-attempt status, response
    hash — in its own artefact, and does not mint a persisted ModelInvocation.
    Named as a dated hole, not as done.
  - >-
    Cryptographic attributability of this run is not built. The artefact is
    attributed by commit and workflow run id, as the returned label sheet was.
    Signing it through `mrr federation envelope sign` is possible today (the
    payload is free-form and carries its own content hash) and is a retrofit,
    not a blocker.
  - >-
    Training-data contamination cannot be excluded and is not estimated. The
    sixty excerpts are arXiv abstracts that may have been in the model's
    training corpus. This is stated in the artefact's own `limitations` block
    and must be stated wherever a number from this run is reported. Measuring
    it would need held-out material the pool does not contain.
  - >-
    The thresholds remain absent by design (N1-T02 R5) and their checks fail
    closed. Nothing in this packet sets one, and a measured value clearing no
    threshold is not a pass.
required_output:
  - Packet report per AGENTS "Required delivery format", embedding the exact
    `mrr classify relations` and `mrr validate gold` invocations, the rendered
    validity report for the model run verbatim (confusion matrix, accuracy
    beside its majority baseline, kappa, per-category PRF, false-support rate,
    below_power flag), the artefact's model profile and prompt hashes, the
    gold-set sha256 it was measured against, and the undecidable and
    tie-break counts beside the standard's own.
stop_conditions:
  - >-
    If emitting an honest disposition appears to require a fourth value beyond
    MTH-016's three, STOP and report — that vocabulary is a MUST and the packet
    premise (b) says an unverified proposal is already exactly
    "downgraded-to-proposal".
  - >-
    If satisfying any requirement appears to need a change to
    synthesis_executor.py, evidence_relation, or the measurement side, STOP —
    this is a new path by construction, and such a reading means the scope has
    drifted into the repair packet described in the derivation's section 8.
  - >-
    If label isolation appears to need care from the caller rather than a
    property of the type, STOP — E4-T07's structural guarantee is the precedent
    and a convention that can be forgotten is not the same object.
  - >-
    If the run cannot complete without a schedule trigger or a local API key,
    STOP — both are excluded by the owner's operating decision and by the
    standing rules on nightly routines.
