task_id: E6-T02
title: Caveat and obligation propagation — materialize a TransferContract's structural obligation/caveat stubs into persisted Obligation objects, bind them to the transferred (and later adapted/derived) objects via subject_to_obligation edges deterministically and idempotently, and record resolve/defer responses
status: approved
depends_on: [E6-T01]
derivation: >
  Derived by a planning session (not yet reviewed) per
  docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from
  docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E6 (E6-T02 "caveat and
  obligation propagation" — second of six E6 tasks, after T01 TransferContract
  lifecycle, and before T03 cross-practice correction notification, T04 local
  accept/adapt/reject/defer response TO A CORRECTION, T05 public
  unresolved-correction projection, T06 offline recipient delivery
  tracking), docs/spec/01_SYSTEM_SPEC.md section 4.9 (MRR-FR-083 —
  "Obligations, caveats, disclosure limits, attribution, and correction
  subscriptions MUST travel with the transfer") and section 2.15 of
  docs/spec/02_DOMAIN_MODEL.md ("Obligation"). task-packets/E6-T01.yaml (this
  planning session's own sibling, now present in the repository as a draft,
  not yet approved or implemented in code) defines the TransferContract
  object this task consumes — it carries `transferred_objects`
  ({id, content_hash} pairs), `caveats`, and `obligations` as STRUCTURAL
