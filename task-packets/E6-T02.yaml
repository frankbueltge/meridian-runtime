  'obligations ... MUST travel with the transfer' is found to require the
  persisted Obligation aggregate and its propagation machinery (E6-T02)
  rather than structural fields alone". This task is that persisted
  aggregate and machinery. Because E6-T01 exists only as an unreviewed draft
  packet with no TransferContract schema/contract/service yet in the
  repository (confirmed — no schemas/transfer-contract.schema.json, no
  packages/contracts/mrr/contracts/transfer_contract.py,
  no services/control_plane/mrr/services/transfer/ anywhere in the tree at
  the time this packet was derived), this packet's own `depends_on` field
  (below) is a real sequencing dependency, not a formality — see derived_decisions
  and stop_conditions for exactly which parts of this task can and cannot
  proceed before E6-T01 is implemented. The closest analog for the
  propagation LOGIC itself is task-packets/E3-T06.yaml and its
  implementation, packages/domain/mrr/domain/correction_impact.py
  (`compute_impact`/`IMPACT_EDGE_TYPES`) and
  services/control_plane/mrr/services/correction/service.py
  (`CorrectionImpactService`) — a deterministic, cycle-safe, idempotent
  transitive-closure traversal over the same typed edge graph, paired with a
  record()/propagate() service split. This task reuses that traversal
  function directly rather than re-implementing a second, divergent notion
  of "what an object built on X inherits from X" (see derived_decisions).
  Obligation becomes the twentieth schema/contract/example entity (assuming
  E6-T01's TransferContract lands first as the nineteenth per its own
  packet; `scripts/check_contracts.py`'s `ENTITY_MODELS` dict is keyed by
  name, not merge order, so either sequencing is safe for that file).
objective: >
  Provide the persisted Obligation object (docs/spec/02_DOMAIN_MODEL.md
  section 2.15) and the machinery that (1) MATERIALIZES it from an
  accepted/adapted TransferContract's structural obligation stubs and
  non-empty `caveats` field, (2) PROPAGATES it — via `subject_to_obligation`
  edges — onto the transferred object(s) and every object later found to be
  built on them (adaptation, further derivation, citation, dependency, or
  projection), deterministically, cycle-safe, and idempotently on repeated
  runs, and (3) records the two verified response actions,
  `resolve`/`defer` (docs/spec/03_API_AND_EVENTS.md section 3.8), each with
  full MRR-NFR-001 provenance. An obligation, once bound to an object, is
  never silently dropped — its binding edges are append-only and are never
  rewritten or deleted by a later `resolve`/`defer`, and propagation is a
  correct, callable-anytime recomputation (not a one-shot event) so that a
  new derivative created after materialization can still be discovered by a
  later `propagate` call. Framework-free at the domain layer, CI-testable,
  reusing the generic ObjectRepository/EdgeRepository and the existing
  `subject_to_obligation` EDGE_VOCABULARY member (no migration — see
  derived_decisions).
