task_id: E6-T03
title: Cross-practice correction notification — a signed, replay-protected CorrectionNotification payload (reusing the E5-T03 envelope transport unchanged), the sending practice's NOTIFYING/AWAITING_RESPONSES/DELIVERY_PENDING lifecycle drive, and the receiving practice's LOCAL-ONLY impact re-computation on receipt
status: draft
derivation: >
  Derived by a planning session (not yet reviewed) per
  docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from
  docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E6 (E6-T03
  "cross-practice correction notification" — third of six E6 tasks: T01
  TransferContract lifecycle, T02 caveat/obligation propagation, T04 local
  accept/adapt/reject/defer response TO A CORRECTION, T05 public
  unresolved-correction projection, T06 offline recipient delivery
  tracking), docs/spec/01_SYSTEM_SPEC.md section 4.10 (MRR-FR-094: "Every
  affected practice MUST receive a signed notification or a durable
  pending-delivery record") and section 4.9 (MRR-FR-084: "A receiving
  practice MAY reject a correction, but MUST record that it was notified
  and why it rejected or deferred it"), docs/spec/02_DOMAIN_MODEL.md
  section 2.16 (CorrectionEvent), and MRR-NFR-007. At derivation time,
  task-packets/E6-T01.yaml exists (status: draft — TransferContract
  lifecycle; NOT yet implemented in code: no schemas/transfer-contract.
  schema.json, no packages/contracts/mrr/contracts/transfer_contract.py
  exist anywhere in the repository, confirmed by direct search) and
  task-packets/E6-T02.yaml does not exist at all yet (caveat/obligation
  propagation — no draft, no code, no persisted Obligation aggregate or
  `correction_subscription` machinery anywhere). This task packet therefore
  treats "which practices/nodes to notify for a given correction" (the
  MRR-FR-083 `correction_subscription` question) as an explicit,
  caller-supplied input rather than something this task resolves — see
  derived_decisions and specification_gaps. It depends on E6-T01/E6-T02
  ONLY for that future wiring, not for anything built in this packet's own
  scope (confirmed below: the receiving side needs no TransferContract code
  at all, only the `transferred_from`/`adapted_from` edge types, which
  already exist in `mrr.domain.repositories.EDGE_VOCABULARY` and are
  already consulted by `mrr.domain.correction_impact.IMPACT_EDGE_TYPES`,
  both reused unchanged).
objective: >
  Provide the object layer that carries a correction across the trust
  boundary and triggers a receiving practice's own local review — building
  on, but not re-implementing, three already-shipped pieces: (1)
  `mrr.contracts.correction_event.CorrectionEvent` (E3-T06) — confirmed to
  have NO `signature` field of its own (only the eight BaseObject fields
  plus its own body; schemas/correction-event.schema.json's `required` list
  has no `signature` entry, unlike schemas/task-bundle.schema.json's, which
  does) — so a CorrectionEvent cannot itself travel cross-practice as a
  self-authenticating signed object the way TaskBundle/EvidenceCrate do;
  (2) `mrr.domain.correction_impact.compute_impact`/`IMPACT_EDGE_TYPES`
  (E3-T06) — the pure, cycle-safe traversal, reused verbatim, never
  modified; (3) the E5-T03/E5-T06 online+offline transport
  (`mrr.contracts.node_message_envelope.NodeMessageEnvelope`,
  `mrr.domain.envelope_validation.validate_inbound_envelope`,
  `mrr.domain.envelope_transport.EnvelopeTransport`) — a payload-agnostic,
  already-signed-and-validated carrier, reused verbatim, never modified.

  This task adds exactly the missing middle layer: (a) a new
  `CorrectionNotification` contract — a standalone, non-BaseObject signed
  value object (deliberately mirroring `NodeMessageEnvelope`'s own
  "one delivery attempt's worth of information, not a first-class
  revisioned domain object" shape, per that module's own docstring,
  rather than `TaskBundle`'s full-BaseObject shape) carrying a reference to
  one already-recorded `CorrectionEvent` revision plus the specific
  `notified_object_ids` relevant to ONE recipient practice, self-contained
  (correction_type/severity/reason/requested_action/replacement_object_id
  copied in, so the recipient never has to cross-practice-fetch the
  originating CorrectionEvent to act on the notification), its own
  `content_hash` (needed ONLY so the existing, UNCHANGED
  `validate_inbound_envelope`'s payload-hash consistency check — comparing
  `envelope.payload.get("content_hash")` to `envelope.payload_content_hash`
  — continues to hold for this new payload kind; see derived_decisions),
  its own `nonce`/`sent_at`/`expires_at` (a second, independent
  replay/validity layer at the PAYLOAD level, distinct from the wrapping
  envelope's own — mirroring `TaskBundle`'s and `OfflineBundle`'s identical
  "own nonce/expiry, separate identifier namespace from the envelope"
  precedent), and a `signature` by the NOTIFYING practice (verified by a
  new, fifth trust resolver, `resolve_trusted_correction_notification_key`,
  a fourth-condition, fail-closed clone of
  `mrr.domain.task_trust.resolve_trusted_task_key`). (b) Sending-side
  wiring, added to the EXISTING `CorrectionImpactService`
  (services/control_plane/mrr/services/correction/service.py, additive
  methods only): `notify_affected_practices` mints+signs one
  `CorrectionNotification` per CALLER-supplied recipient, wraps each in a
  `NodeMessageEnvelope` (payload_kind="CorrectionNotification"), attempts
  delivery via the existing abstract `EnvelopeTransport` port, and drives
  the ALREADY-DECLARED (E1-T04, unmodified)
  `mrr.domain.lifecycles.CORRECTION_LIFECYCLE` forward along its
  already-drawn edges: OPEN -> IMPACT_ANALYSIS -> NOTIFYING ->
  AWAITING_RESPONSES, continuing on to the also-already-drawn
  AWAITING_RESPONSES -> DELIVERY_PENDING edge within the SAME call when any
  recipient's synchronous delivery attempt reports "failed" — recording a
  `correction.notification_sent` domain event (section 5.2's own
  enumerated name) per recipient with the delivery outcome in its payload,
  which is the durable record MRR-FR-094 requires for a recipient who could
  not be reached; no new lifecycle edge is declared, and no new
  CorrectionEvent schema field is added (see derived_decisions on why the
  existing status + domain events already satisfy "signed notification or
  a durable pending-delivery record" without touching the schema). (c)
  Receiving-side wiring, added to the same service:
  `receive_correction_notification` validates the inbound envelope
  (`validate_inbound_envelope`, UNCHANGED), verifies the notification's OWN
  signature (`resolve_trusted_correction_notification_key`, new), checks a
  caller-supplied replay predicate over the notification's OWN
  `notification_id` (a separate namespace from the envelope's own
  `message_id`), then treats `notified_object_ids` exactly as
  `CorrectionImpactService.propagate_impact` already treats a LOCAL
  correction's own `affected_objects`: gathers this practice's OWN local
  edges via the existing `EdgeRepository`, runs the UNCHANGED
  `compute_impact` over them, and calls the existing
  `ClaimService.require_review` on every locally-impacted claim not already
  at least that strict — never creating, storing, or mutating any copy of
  the remote CorrectionEvent, and never deciding accept/adapt/reject/defer
  (E6-T04). "Local autonomy" is the operative constraint throughout: a
  received notification only ever triggers a LOCAL, independently
  re-derived impact computation over THIS practice's own graph — it is
  never itself treated as authoritative fact to be copied in.
