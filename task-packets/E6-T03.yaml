specification_gaps:
  - MRR-FR-084's "why it rejected or deferred" half, and the MRR-FR-081-
    style five-way response vocabulary applied to a correction, are NOT
    claimed by this task — only "MUST record that it was notified" is
    addressed (via `correction.notification_sent` on the sending side and
    the reuse of `claim.status_changed` on the receiving side); the
    response content itself is E6-T04.
  - CorrectionEvent's `DELIVERY_PENDING` state has no drawn outgoing edge
    anywhere in docs/spec/01_SYSTEM_SPEC.md section 6.4 (already flagged as
    an open question in packages/domain/mrr/domain/lifecycles.py's own
    module docstring). This task preserves that dead end rather than
    inventing a resolution path; a future E6-T06 or a spec amendment must
    decide how a correction ever leaves DELIVERY_PENDING.
  - derived_decisions (c)'s reading of "NOTIFYING always advances through
    AWAITING_RESPONSES before an optional continuation to
    DELIVERY_PENDING within the same call" is inferred from the fixed
    transition set and the diagram's column layout, not stated in prose
    anywhere in the specification. Flagged for explicit reviewer
    confirmation rather than treated as settled.
  - docs/spec/03_API_AND_EVENTS.md section 5.2's required-events
    enumeration has no event name for the RECEIVING side's own act of
    processing a notification (only `correction.opened`/
    `impact_computed`/`notification_sent`/`response_recorded`, all
    sender-side). This task reuses the existing `claim.status_changed`
    event as the only observable trace and does not invent a new
    `correction.notification_received`-shaped event name — flagged in case
    a reviewer prefers an explicit one added to section 5.2 in a future
    amendment.
  - how a sending practice discovers WHICH practices/nodes to notify
    (TransferContract.correction_subscription, MRR-FR-083) is not yet
    implemented anywhere in code (E6-T01 is still draft-only,
    E6-T02 does not exist yet). This task's `notify_affected_practices`
    takes the recipient list as a caller-supplied argument; wiring it to
    real transfer/obligation data is necessarily a follow-up once E6-T01/
    E6-T02 land.
  - docs/spec/02_DOMAIN_MODEL.md section 2.16 lists "delivery and recipient
    responses" among CorrectionEvent's fields, but
    schemas/correction-event.schema.json never gained them (confirmed —
    absent from its `required` list and its `properties`). This task
    deliberately does not add them (see forbidden_changes) and instead
    treats CORRECTION_LIFECYCLE status plus the append-only domain event
    log as the durable record, per AGENTS.md's own source-of-truth
    discipline — flagged in case a reviewer prefers an explicit schema
    field once E6-T04/E6-T06 are further along and the full shape of
    "recipient responses" is known.
  - whether CorrectionNotification needs a schema-level cap on
    `notified_object_ids`' length is unspecified; left unbounded, mirroring
    CorrectionEvent's own unbounded `evidence_refs`/`impact_objects` lists.
