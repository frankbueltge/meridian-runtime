derived_decisions: >
  (a) CorrectionNotification is a standalone signed value object, NOT a
  BaseObject. Unlike TaskBundle (a full first-class, revisioned,
  cross-practice object per docs/spec/02_DOMAIN_MODEL.md section 1),
  a correction notification is "one delivery attempt's worth of
  information" — structurally the same category NodeMessageEnvelope's own
  docstring already draws for itself ("it carries no practice_id/revision/
  created_at/created_by/content_hash of its own ... it is a transport
  message describing one delivery attempt, not a first-class, revisioned
  MRR domain object"). This task follows that precedent rather than
  TaskBundle's: no `revision`/`supersedes`/`labels`, no `api_version`/`kind`
  BaseObject scaffolding. It still needs its OWN `content_hash` field
  (unlike NodeMessageEnvelope, which never carries one) for one specific,
  narrow reason: the EXISTING, unmodified
  `validate_inbound_envelope`'s condition 3 does
  `envelope.payload.get("content_hash") == envelope.payload_content_hash`
  — a literal dict-key lookup against whatever payload dict is nested
  inside, with no special-casing per payload_kind. For this new payload
  kind to pass that unmodified check, it MUST literally carry a
  `content_hash` key. This is not a stylistic echo of BaseObject; it is a
  hard interoperability requirement of reusing E5-T03's validator verbatim
  (confirmed by inspecting examples/node-message-envelope.example.json's
  own TaskBundle-shaped payload, whose nested payload dict's only
  reason for carrying `content_hash` is exactly this check).
  (b) CorrectionNotification additionally carries its own
  `notification_id`/`nonce`/`sent_at`/`expires_at`, independent of the
  wrapping envelope's `message_id`/`sent_at`/`expires_at`. This mirrors
  the already-established "a bundle id and a message id are different
  identifier spaces" precedent from `mrr.domain.offline_bundle`'s own
  module docstring (there, for OfflineBundle vs. the envelopes it carries)
  applied one layer further in: a CorrectionNotification might, in a later
  task (E6-T06), be re-carried inside a freshly-built OfflineBundle/
  NodeMessageEnvelope pair after an earlier online attempt failed, and its
  OWN replay/validity state must not depend on which specific envelope
  most recently wrapped it.
  (c) The sending side reuses the ALREADY-DECLARED CORRECTION_LIFECYCLE
  (packages/domain/mrr/domain/lifecycles.py, E1-T04, unmodified) exactly as
  drawn: `_CORRECTION_TRANSITIONS` contains
  `("OPEN","IMPACT_ANALYSIS")`, `("IMPACT_ANALYSIS","NOTIFYING")`,
  `("NOTIFYING","AWAITING_RESPONSES")`, and
  `("AWAITING_RESPONSES","DELIVERY_PENDING")` (verified directly in that
  module) — there is NO drawn `NOTIFYING -> DELIVERY_PENDING` edge. This
  task's `notify_affected_practices` therefore ALWAYS advances through
  AWAITING_RESPONSES first (via `CORRECTION_LIFECYCLE.assert_transition`
  at each hop, one new persisted revision covering the whole hop-chain
  once all hops individually validate — mirroring `_write_impact_objects`'s
  existing "one revision, one event" economy rather than one revision per
  hop, since section 5.2's required-events list has no per-hop event name
  for IMPACT_ANALYSIS/NOTIFYING), and continues on to the also-legal
  AWAITING_RESPONSES -> DELIVERY_PENDING edge WITHIN THE SAME CALL only if
  at least one recipient's synchronous EnvelopeTransport attempt reports
  "failed" — reading DELIVERY_PENDING as "notification attempts were made
  to everyone, but delivery is still outstanding for someone", consistent
  with the diagram's own column layout (DELIVERY_PENDING is drawn as a
  branch hanging directly off AWAITING_RESPONSES, not off NOTIFYING).
  If every recipient's attempt reports "delivered", the correction stops at
  AWAITING_RESPONSES. This reading is a considered inference from the
  already-fixed transition set, not a re-derivation of the diagram — flagged
  for reviewer confirmation in specification_gaps.
  (d) The receiving side's LOCAL seed translation reuses
  `mrr.domain.correction_impact.compute_impact` and its full,
  UNCHANGED `IMPACT_EDGE_TYPES` (not a hand-picked subset restricted to
  `transferred_from`/`adapted_from`) — a notification's
  `notified_object_ids` are fed as `seed_ids` into the exact same
  gather-then-compute shape `CorrectionImpactService._gather_impact_edges`/
  `propagate_impact` already uses for a LOCAL correction's own
  `affected_objects`, over THIS practice's own `EdgeRepository`. A remote
  object id that this practice never locally stored is not an error
  (`EdgeRepository` has no foreign-key existence constraint on edge
  endpoints, confirmed in `mrr.domain.repositories.EdgeRepository`'s own
  docstring and exploited identically by E3-T06's
  `_require_review_if_needed`) — it simply may or may not be the TARGET of
  a local `transferred_from`/`adapted_from` edge, and if it is not, the
  computed local impact set for that seed is legitimately empty. This
  duplicates a small (~15-line) gather-loop already private to
  `CorrectionImpactService._gather_impact_edges`, rather than exporting or
  refactoring that private method — a deliberate, documented duplication
  in the same spirit `mrr.services.claim.service.bind_edge_unit_of_work`'s
  own docstring already flags for reviewer scrutiny in this codebase, kept
  small and side-by-side rather than force-sharing across two services with
  different callers and different seed provenance (local correction vs.
  received notification).
  (e) The receiving side records NO new CorrectionEvent-shaped object and
  emits NO new event type of its own; the only observable trace of a
  processed notification is (i) whatever the caller's own
  already-processed-notification-id predicate records (infrastructure, out
  of this task's scope, mirroring E5-T03's identical stance on envelope
  replay) and (ii) the EXISTING `claim.status_changed` events
  `ClaimService.require_review` already emits, UNCHANGED, for each
  genuinely-impacted local claim. Inventing a
  `correction.notification_received`-shaped event is deliberately NOT done
  (section 5.2's required-events enumeration has no such name) — flagged in
  specification_gaps as a question for the reviewer, not resolved
  unilaterally.
invariants:
  - a received CorrectionNotification triggers LOCAL impact computation
    ONLY — it never creates, stores, or mutates any local copy of the
    remote CorrectionEvent, and the only local mutation it may cause is the
    EXISTING, unchanged `ClaimService.require_review` transition on a claim
    already resolvable in THIS practice's own object repository
  - the local disposition (accept/adapt/reject/defer) toward a received
    correction is explicitly out of scope (E6-T04); this task's receiving
    side never records, infers, or defaults to any such decision
  - CorrectionNotification is signed by the notifying practice and is
    accepted only when `resolve_trusted_correction_notification_key`'s four
    conditions all hold (signer-practice match, kid resolves in the
    recipient's trusted view of the notifying practice's KeyRing, that
    descriptor valid at the evaluation instant, signature verifies over the
    exact ADR-0004 exclude_none form) — each a DISTINCT typed error, fail
    closed, mirroring `resolve_trusted_task_key` exactly
  - a CorrectionNotification is replay-protected at TWO independent levels
    — the wrapping envelope's own `message_id` (existing, unchanged
    predicate) and the notification's own `notification_id` (new, separate
    caller-supplied predicate) — and both must pass before any local
    impact computation runs
  - a tampered CorrectionNotification (any field altered after signing,
    including `notified_object_ids`, `severity`, or `requested_action`)
    fails `resolve_trusted_correction_notification_key`'s signature check
    and is rejected before any local claim is touched; nothing partial is
    persisted
  - only the already-drawn CORRECTION_LIFECYCLE edges are used
    (OPEN -> IMPACT_ANALYSIS -> NOTIFYING -> AWAITING_RESPONSES, optionally
    continuing to DELIVERY_PENDING); an attempt to reach any state via an
    undrawn edge raises `InvalidTransitionError` and persists nothing
  - a notification whose `notified_object_ids` include an id with zero
    matching local edges is handled explicitly — the computed
    locally-impacted set for that id is legitimately empty, returned as
    such (never silently dropped, never treated as an error, never
    fabricated into a false-positive impact) — MRR-NFR-012, explicit
    degradation
  - outbound notification is idempotent per recipient — calling
    `notify_affected_practices` again for a correction/recipient set
    already fully recorded as delivered does not re-transition an
    already-past-NOTIFYING correction and does not re-send to a recipient
    already recorded `sent` for the current impact set
  - no raw restricted or PARTICIPANT_IDENTIFIABLE object content crosses
    the practice boundary in a CorrectionNotification's body — only ids,
    hashes, correction_type, severity, reason, requested_action, and
    optional replacement_object_id (MRR-NFR-006), mirroring
    CorrectionEvent's own no-raw-data shape
  - every notify/receive call that mutates a CorrectionEvent revision or
    triggers a claim transition records a domain event with full
    MRR-NFR-001 provenance (actor, occurred_at, policy_version,
    causation_id, correlation_id, object_id, object_revision)
  - both import-linter contracts stay KEPT; the new domain/contracts
    modules import no network library, no provider SDK, and open no real
    connection
acceptance_tests:
  - contract tier — schemas/correction-notification.schema.json is valid
    Draft 2020-12; the committed example round-trips losslessly through
    the Pydantic model and back; scripts/check_contracts.py's ENTITY_MODELS
    cross-validates schema<->model<->example for the new entity
  - outbound happy path — two recipients, both `delivered` via the in-test
    EnvelopeTransport fake, produce OPEN -> IMPACT_ANALYSIS -> NOTIFYING ->
    AWAITING_RESPONSES (stopping there), one `correction.notification_sent`
    event per recipient with delivery_status `"sent"`, no
    DELIVERY_PENDING transition attempted
  - outbound partial failure — one recipient `delivered`, one `failed` ->
    the same call chains through to DELIVERY_PENDING as its final status
    within one atomic sequence; the failed recipient's
    `correction.notification_sent` event payload records
    delivery_status `"pending"`
  - outbound idempotency — calling `notify_affected_practices` twice with
    the same correction id and the same fully-delivered recipient set does
    not raise `InvalidTransitionError`, does not append a second
    `correction.notification_sent` event per already-`sent` recipient, and
    does not write a redundant CorrectionEvent revision
  - CORRECTION_LIFECYCLE conformance (adversarial) — an attempt to persist
    a status transition NOT in `_CORRECTION_TRANSITIONS` (e.g. a direct
    NOTIFYING -> DELIVERY_PENDING, or OPEN -> AWAITING_RESPONSES skipping
    intermediate hops) raises `InvalidTransitionError` and persists nothing
    — guards that no new illegal edge was accidentally introduced
  - inbound happy path — a validly-signed, in-window, hash-consistent,
    unseen CorrectionNotification carried inside a validly-signed,
    in-window, hash-consistent, unseen NodeMessageEnvelope is accepted;
    `receive_correction_notification` correctly marks exactly the local
    claims downstream (via local `transferred_from`/`adapted_from` and
    further IMPACT_EDGE_TYPES edges) of the notified object ids
    `review_required`, and leaves unrelated local claims untouched
  - adversarial — tampered notification — any single field of an
    otherwise-valid CorrectionNotification altered after signing (severity,
    requested_action, a notified_object_id, sender_practice_id) is rejected
    by `resolve_trusted_correction_notification_key`'s signature check with
    a distinct typed error; no local claim is touched
  - adversarial — replayed notification — a caller-supplied
    `already_processed_notification` predicate reporting the
    `notification_id` as already-seen is rejected before any local impact
    computation runs, distinctly from (and in addition to) the envelope's
    own separate replay check
  - adversarial — notification about an unknown object — a
    CorrectionNotification whose `notified_object_ids` contains an id with
    zero local `edges_to` entries of any kind yields an explicit, empty
    locally-impacted set and zero claim transitions — verified as a
    legitimate outcome distinguishable from an error path, not a crash and
    not silently ignored
  - signer/key fail-closed matrix (adversarial), each a distinct typed
    error, mirroring `resolve_trusted_task_key`'s own four-condition test
    matrix exactly — notification signer_practice_id != the trusted
    notifying practice; key_id does not resolve in the recipient's KeyRing
    for that practice; resolved key revoked/rotated/expired/not-yet-valid
    at the evaluation instant; a bad/tampered Ed25519 signature
  - property test — the receiving-side local impact computation is
    order-independent and idempotent over arbitrary local edge graphs
    (re-verifies `compute_impact`'s existing guarantees hold at this new
    call site, seeded from notification data rather than a local
    correction's own affected_objects)
  - integration test (real PostgreSQL) — a full outbound
    record -> propagate_impact -> notify_affected_practices sequence
    persists atomically with its events; a separate practice's database
    receiving the resulting notification via `receive_correction_notification`
    produces `claim.status_changed` events with full provenance for the
    correct local claims only
  - all existing suites stay green; both import-linter contracts remain
    KEPT
