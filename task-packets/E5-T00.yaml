task_id: E5-T00
title: Unify the canonical signed form to ADR-0004 (exclude_none) across all cross-practice sign/verify paths
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 as the accepted ADR-0004 federation gate, from ADR-0004
  (canonical object serialization, ACCEPTED 2026-07-19), ADR-0003 (signature
  value encoding), docs/spec/02_DOMAIN_MODEL.md sections 1.2-1.3 (content hash
  over canonical JSON with signatures excluded; the signature covers the
  canonical payload and content hash), docs/spec/04_SECURITY_AND_POLICY.md
  section 8 (federated security), and docs/spec/06_IMPLEMENTATION_PLAN.md
  section 3 Epic E5 exit criteria ("compromised signatures and replay fail
  closed"); approved by the repository owner's standing direction to continue
  and the ADR-0003 delegation precedent. This is a PRECURSOR to E5-T01..T07,
  not a new federation feature: it makes the single canonical signed form real
  BEFORE any object crosses a real node boundary, so every E5 feature task
  builds on one byte-definition of "the object". It introduces NO new entity,
  NO key management, NO schema, NO network, and NO authoritative state.
objective: >
  Make signing use the SAME canonical pre-canonicalization form the codebase
  already uses for content hashing and persistence: schema-conformant JSON with
  absent/None optional fields OMITTED (`exclude_none=True`), then RFC 8785.
  Concretely: flip every live sign and verify call site from the null-including
  `obj.model_dump(mode="json")` form to the `exclude_none=True` form, for the
  three cross-practice signed objects — NodeManifest (sign in the CLI
  orchestration helper, verify in the capability registry), TaskBundle (sign in
  the CLI orchestration helper, verify in the task-bundle service), and
  EvidenceCrate (sign in the node-runtime evidence-crate builder; its verify
  path is E5-T05 and is out of scope). After the flip, for every signed object
  the bytes the signature covers MUST equal the bytes the persisted `body`
  canonicalizes to, minus the `signature` field. Add a property test that
  proves exactly that equality, plus per-object round-trip and fail-closed
  tests. Do NOT touch the crypto primitives, the `prepare_for_*` field-selection
  policy, or the content-hash computation (already `exclude_none` and must stay).
