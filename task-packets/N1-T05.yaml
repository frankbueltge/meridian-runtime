task_id: N1-T05
title: >-
  The literature channel: new sources become a stated question. A deterministic
  draw from the committed backlog (or a field-watch observation), anchored
  through the existing keyless fetch, classified by N1-T04's measured
  classifier, and converted into a corpus that hits `CorpusEntry` exactly —
  plus the four sibling inputs `research-run.yml` requires, so the nightly run
  finds `pending != []` for the first time since 2026-08-01. Offline-testable
  end to end against committed fixtures; run online by an event-driven
  workflow that never lands on `main` and never runs on a clock.
status: proposed
epic: N1
reviewer_resolution: >-
  PROPOSED 2026-08-02, awaiting the owner's approval. Under his ordering of
  2026-08-01 ("1. Maßstab -> 2. modellgestützte Einordnung -> 3. Literaturkanal
  -> 4. Kopplung") and his operating decision of 2026-08-02 ("nichts lokal,
  alles läuft online in GitHub Actions und automatisch — aber anlassgetrieben,
  nie auf einer Uhr"). Two load-bearing choices were put to the owner on
  2026-08-02 with their costs stated, and he decided both:
  (i) MATERIAL — the field watch has produced NOTHING (two successful runs,
  `"new": 0` each, `corpora/field-watch/observations/` empty on main), so the
  first corpus is drawn DELIBERATELY from the committed backlog. This is the
  path `corpora/field-watch/seen.json` itself names as the only honest one:
  "backlog is drawn deliberately (as the candidate pool was), never dribbled in
  by a nightly pretending it is fresh."
  (ii) CLASSIFICATION — the model proposal DRIVES DIRECTLY: the channel commits
  the corpus and `research-run.yml` runs it, with no human classification gate
  in between. Chosen by the owner over a proposal-plus-merge-gate alternative,
  with the objection stated in the choice itself. Its cost is recorded, not
  softened: at Cohen's kappa 0.3084 and accuracy 0.5439 against a majority
  floor of 0.4211, roughly every second proposed relation is wrong, and
  `_classify_analysis` computes the supported/contested thresholds from exactly
  those relations (synthesis_executor.py:709-724). The resulting claim inherits
  that error rate. See derived_decisions (c) and specification_gaps.
depends_on: [N1-T02, N1-T04, N2-T03a, E4-T02, E4-T08]
derivation: >-
  Derived 2026-08-02 from
  docs/design/2026-08-02-n1-t05-ableitung-literaturkanal.md, which fact-locks
  both handoff documents against the code. Every checkable claim was
  RE-EXECUTED: research-run.yml's selection logic was re-run against the live
  tree (pending = [], with e2e-claims and model-collapse skipped as answered
  and five directories skipped for missing inputs); the two measurement reports
  were read from their commits (run 1 accuracy 0.5439 / kappa 0.3084; run 2
  cc6df74 accuracy 0.5263 / kappa 0.2792 — a 1.76 percentage-point spread over
  byte-identical frozen inputs); `gh secret list` confirmed ECOLOGY_TOKEN
  (2026-08-01T22:22:28Z); export_main.py's `--database-url required=True` was
  read at :185 and its reachability check at :316-327.
  Four corrections, each a line that was read:
  (K1) THE CHANNEL HAS NO MATERIAL. The owner's premise "die neuen Quellen
  kommen von dort" does not hold today: field-watch.yml ran twice (30721188911,
  30732647866), both succeeded, both reported `{"new": 0, "note": "sweep
  completed, nothing new — no observation written"}`, and
  corpora/field-watch/observations/ is empty on origin/main. Checked for the
  failure mode that would look identical: watch_field.py:219-228 queries with
  sortBy=submittedDate&sortOrder=descending, so the watch is NOT structurally
  blind to new papers — the field was genuinely quiet, and watch_from
  ("2026-08-01", :247/:261) is thirty hours old.
  (K2) A CORPUS ENTRY IS A CLASSIFIED SOURCE, NOT A BARE ONE. CorpusEntry
  requires evidence_relation (:247), claim_relevant_finding (:250) and
  claim_type (:246); its own docstring calls it "human-curated" (:224). That is
  WHY step 3 follows step 2 in the owner's ordering: the channel's missing
  organ is exactly what N1-T04 built.
  (K3) verification_status IS THE SOURCE-ANCHORING AXIS, NOT THE
  CLASSIFICATION AXIS. MRR-MTH-015, quoted at
  packages/contracts/mrr/contracts/evidence_matrix.py:8-11: "every EvidenceMatrix
  row MUST anchor a resolvable source with a verification status and a source
  family". The existing corpora confirm the reading in their own
  retrieval_method ("direct read of the pinned, hash-verified abstract
  snapshot"). So an entry may be `verified` on the strength of its anchored
  excerpt while its relation is a model proposal — that is what the field
  means, not a workaround.
  (K4) MIXING THOSE AXES FAILS SILENTLY. synthesis_executor.py:688-707 gates on
  `verification_status == "verified"` against min_included_sources (3 in the
  e2e-claims sidecar) and returns `insufficient_evidence` below it — but
  :709-714 builds supporting/contradicting rows from ALL group_rows, verified or
  not. A corpus that confuses the two axes produces a wrong verdict without
  any diagnostic.
  Fact base confirmed unchanged: there is NO JSON schema for CorpusEntry
  (31 files under schemas/, none for a corpus entry) — the Pydantic model with
  extra="forbid" (:242) is the only definition, and
  tests/unit/corpora/test_model_collapse_fixtures.py:121 is the only existing
  precedent for asserting a fixture hits it; candidate-pool.v1.json holds 353
  candidates of which 60 are drawn and 293 are not; gold-classification.yml
  carries the default-branch bolt at :222-235 and the stage-then-ask guard at
  :243-248; field-watch.yml still carries the unfixed diff guard at :98-106.
objective: >-
  After this packet, one `workflow_dispatch` produces a complete, committed
  corpus directory `corpora/<batch>/` containing all five files
  `research-run.yml:63-70` requires, whose `corpus-entries.json` validates
  entry-for-entry against `CorpusEntry` with zero errors under `extra="forbid"`
  — asserted by calling `CorpusEntry.model_validate`, never by re-describing
  the field list. Each entry's excerpt is anchored: fetched through the
  existing keyless two-host allowlist, hashed, and committed as a
  `source-content-snapshot.v1` beside the corpus, so `verification_status`
  states an anchoring fact and nothing else. Each entry's `evidence_relation`
  is N1-T04's model proposal, and each entry's `extraction` dict carries the
  proposal's rationale AND its provenance — model name, prompt hash, the
  proposal artefact's path, and the measured accuracy beside its majority floor
  — so no reader of the corpus can mistake a proposal for a finding. The batch
  lands as a pull request, never on `main`; `research-run.yml` then finds
  `pending = ["<batch>"]` on its next nightly and answers it without anyone
  pressing anything.
