derived_decisions:
  - >-
    (a) The backlog is drawn, not awaited. The owner's premise that the sources
    come from the watch does not hold today (K1) and the honest substitute was
    already named by the watch's own register: backlog is drawn deliberately.
    The draw rule is reproducible and judgement-free, copied in shape from the
    gold set's own, so nobody can later ask whether the batch was picked to
    produce an answer. The sixty already-drawn ids are excluded, because a
    corpus built from the blind commission's own material would entangle the
    standard with what is measured against it.
  - >-
    (b) Two inputs, one converter. The deliberate draw and a field-watch
    observation produce the same thing — a list of arXiv ids — so they meet at
    the batch manifest and everything downstream is shared. The watch trigger is
    wired now even though it cannot fire today: wiring it later would mean
    touching a workflow that by then has run, and the cost of an unreachable
    branch here is one `on: push` path.
  - >-
    (c) The model proposal drives directly — OWNER DECISION, 2026-08-02, taken
    with the objection in front of him. The alternative offered was a draft
    corpus behind a merge gate; he chose the direct path. What this packet does
    NOT do is make it look cheaper than it is: the error rate is stated in the
    derivation, in this packet, in every entry's `classification_provenance`,
    and in the method protocol's own text. At kappa 0.3084 roughly every second
    relation is wrong and `_classify_analysis` computes its verdict from those
    relations. That is the accepted cost of the chosen shape, recorded so that
    the first surprising verdict is not a mystery.
  - >-
    (d) `verified` is set on the SOURCE axis and only there (K3). MTH-015 makes
    verification_status a statement about anchoring a resolvable source, and the
    existing corpora use it that way. An entry whose excerpt was fetched and
    hashed IS verified in that sense, whatever its relation's standing. This is
    deliberately NOT the same move as synthesis_executor.py:483, which stamps
    `verified` on a merely schema-valid model response — there the word describes
    the model output, here it describes the fetch. The distinction is the whole
    reason K3 is written down.
  - >-
    (e) No JSON schema, therefore a test. CorpusEntry has no schema file, so
    "hits it exactly" can only be asserted by validating against the model
    itself. `extra="forbid"` makes that assertion sharp in both directions: a
    missing field and a surplus field both fail. The precedent is
    test_model_collapse_fixtures.py:121 and it is followed rather than invented.
  - >-
    (f) Undecidable cases leave the corpus rather than acquire a default.
    `CorpusEntry.evidence_relation` has four values and none of them means
    "undecidable". Mapping an undecidable proposal onto `contextualizes` would
    manufacture a reading the model refused to give. The case is counted in the
    manifest and excluded — the same treatment the gold standard gives its own
    three (n=57 of 60).
  - >-
    (g) `source_family_id` is the arXiv base id. Two versions of one paper are
    one family, so a revision cannot double as independent corroboration —
    MTH-015 forbids counting copies as independent evidence, and the
    independence calculation downstream trusts this field.
  - >-
    (h) The default-branch bolt and the stage-then-ask guard are built in, not
    retrofitted. Both were learned the expensive way in N1-T04: one workflow
    claimed "never lands on main" while its push target on main WAS main, and
    one guard threw away a completed sixty-case measurement and reported
    success. A new corpus is entirely new files, so the second bug would destroy
    every run rather than none.
  - >-
    (i) No wall-clock byte in any written file. N1-T02's invariant, and its
    reason is on the record: a hand-typed timestamp inside something that gates
    on time blocked its own gate within hours. When the batch was drawn is a
    property of the commit and the workflow run.
invariants:
  - synthesis_executor.py is byte-identical before and after this packet.
  - Every entry of the produced corpus validates against CorpusEntry under extra="forbid" with zero errors.
  - No entry carries verification_status "verified" without a matching hashed excerpt in the committed snapshot.
  - No entry's excerpt text differs from the snapshot's excerpt for the same id; the sha256 is recomputed at build time and compared.
  - The converter opens no socket, reads no clock, constructs no ModelAdapter and opens no database connection.
  - No test in any tier performs a network call or reads GEMINI_API_KEY.
  - Identical inputs produce a byte-identical corpus directory; no written byte is a wall-clock timestamp.
  - No id marked `drawn` in candidate-pool.v1.json appears in a produced corpus.
  - The workflow has no `schedule:` trigger and no step that can commit while GITHUB_REF_NAME is the default branch.
  - corpora/field-watch/, corpora/gold-classification/ and benchmarks/ are untouched by any code path in this packet.
acceptance_tests:
  - >-
    AT1 (the corpus hits the model exactly): every entry of a corpus built from
    committed fixtures passes `CorpusEntry.model_validate` with zero errors —
    asserted by calling it, following
    tests/unit/corpora/test_model_collapse_fixtures.py:121. Two negative
    assertions make it sharp: adding one surplus key to an entry fails under
    `extra="forbid"`, and removing `claim_relevant_finding` fails on
    `min_length`.
  - >-
    AT2 (the two axes stay apart): an entry whose excerpt was anchored carries
    `verification_status: "verified"` even when its proposal's disposition is
    `downgraded-to-proposal`; an entry whose fetch failed carries
    `"unverifiable"` WITH a non-empty reason and is rejected by the model's own
    validator when the reason is blanked. A test asserts that no code path sets
    `verification_status` from any field of the proposal artefact.
  - >-
    AT3 (the run would not silently under-read): a fixture corpus with fewer
    anchored entries than the sidecar's `min_included_sources` makes
    `mrr literature build` exit 3 naming the shortfall, rather than writing a
    corpus that `_classify_analysis` would answer with `insufficient_evidence`
    two nights later. The number is read from the sidecar, never hard-coded.
  - >-
    AT4 (the question is complete): the produced directory satisfies
    research-run.yml's own five-file test — asserted by RE-EXECUTING that
    workflow's selection logic against a tree containing the fixture corpus and
    an `answered.json` without it, and checking that `pending` contains exactly
    the new batch. Not by re-describing the file list.
  - >-
    AT5 (the draw is reproducible and excludes the standard): the same salt and
    size over the committed pool yield the same ids twice, byte-identically; no
    produced id has `drawn: true`; and a batch size exceeding the undrawn
    remainder (293) refuses rather than wrapping or repeating.
  - >-
    AT6 (undecidable does not acquire a default): a scripted proposal artefact
    marking one case undecidable produces a corpus WITHOUT that entry, a
    manifest that counts it, and no entry anywhere whose relation was
    substituted.
  - >-
    AT7 (determinism and non-interference): two builds over identical inputs
    produce byte-identical directories and contain no timestamp;
    `git diff --exit-code` over synthesis_executor.py, the contracts package,
    scripts/fetch_source_content.py, scripts/watch_field.py and
    corpora/field-watch/ is empty after the packet; the existing unit,
    contract, property and meridianbench tiers pass unmodified.
  - >-
    AT8 (the workflow cannot land on main): a test over the workflow file
    asserts there is no `schedule:` key, that the commit step is guarded on
    `GITHUB_REF_NAME` against the default branch, and that `git add` precedes
    `git diff --cached`. Cheap, and both of these were real incidents rather
    than hypotheticals.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - uv run python scripts/check_gold_freeze.py
  - make security-check
specification_gaps:
  - >-
    RULE 7 IS IN TENSION HERE AND IS NOT RESOLVED. "No model output may
    directly become authoritative state." A corpus in git is an INPUT — the
    stated question — and AGENTS' own source-of-truth table makes git
    authoritative for inputs while the database holds the authoritative claim.
    But the model-proposed `evidence_relation` flows through
    `_classify_analysis` (synthesis_executor.py:709-724) into whether that claim
    is `supported`, `contested` or `unsupported`. Model output therefore
    co-determines authoritative state. The owner decided this shape on
    2026-08-02 with the objection stated. It is recorded here, in the
    derivation, in every entry's `classification_provenance` and in the method
    protocol's own text — named as an accepted cost, never as solved.
  - >-
    The classification's error rate is known and large: accuracy 0.5439 against
    a majority floor of 0.4211, Cohen's kappa 0.3084, and a second run over
    byte-identical frozen inputs returned 0.5263 (kappa 0.2792). Any claim this
    corpus produces inherits that. Wherever a number from such a run is
    reported, the floor and the spread are reported beside it.
  - >-
    Training-data contamination cannot be excluded and is not estimated. The
    excerpts are arXiv abstracts that may have been in the model's training
    corpus — the same limit N1-T04 names, inherited unchanged.
  - >-
    An abstract is not a paper. scripts/fetch_source_content.py anchors the
    ABSTRACT only, measured at roughly 28 percent of this corpus family's
    numeric-token claims (docs/design/2026-07-25-n2-t03-derivation.md). The
    snapshot names its own narrowness and this packet does not widen it; a
    full-text channel is a different packet with a different egress argument.
  - >-
    The model declared zero of sixty cases undecidable where the gold standard
    declared three, although R-undecidable-is-a-finding is in the prompt. AT6
    ensures the channel handles undecidability correctly; it cannot make the
    model use it. Carried forward as N1-T04's open finding.
required_output:
  - Packet report per AGENTS "Required delivery format", embedding the exact
    `scripts/draw_backlog.py`, `scripts/fetch_source_content.py`,
    `mrr classify relations` and `mrr literature build` invocations; the batch
    manifest verbatim (drawn ids, anchored count, unverifiable count with
    reasons, undecidable count); the distribution of proposed relations beside
    the gold standard's own distribution; and the re-executed research-run.yml
    selection logic showing `pending` before and after.
stop_conditions:
  - >-
    If hitting CorpusEntry appears to require changing CorpusEntry, STOP — the
    objective is to hit it exactly, and a change to synthesis_executor.py is
    forbidden by this packet and belongs to the repair packet named in N1-T04
    §8.1.
  - >-
    If anchoring appears to require a new host, a key, or a second egress path,
    STOP — scripts/fetch_source_content.py is reused unchanged, and a new
    network capability is its own packet with its own gate argument.
  - >-
    If an entry cannot be honestly marked `verified` or `unverifiable` on the
    strength of the fetch alone, STOP — that means the two axes of K3 have been
    mixed, which is the failure this packet exists to avoid.
  - >-
    If the batch cannot reach the sidecar's min_included_sources, STOP and
    report — a corpus that answers `insufficient_evidence` two nights later is
    a question nobody asked, and the shortfall is diagnosable now.
  - >-
    If the run appears to need a schedule trigger, a local API key, or a
    commit on the default branch, STOP — all three are excluded by the owner's
    operating decision and by the standing rules.
