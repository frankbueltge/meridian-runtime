requirements:
  - >-
    R1 (the draw, scripts/draw_backlog.py): OUTSIDE the runtime, stdlib-only,
    importing nothing from `mrr.*` — the placement `fetch_source_content.py`
    established and argued for. Produces a batch of arXiv identifiers from one
    of exactly two inputs: `--pool` (the committed candidate pool) or
    `--observation` (a field-watch observation file). From the pool it draws by
    a REPRODUCIBLE, JUDGEMENT-FREE rule modelled on the gold set's own
    (`sorted by sha256(<batch-salt> + arxiv_id)`, first N taken), EXCLUDING
    every id already marked `drawn` — the sixty gold cases must not reappear in
    a corpus, because a run over the blind commission's own material would
    entangle the standard with the thing measured against it. The script writes
    the batch manifest and mutates nothing it read.
  - >-
    R2 (the anchoring, scripts/fetch_source_content.py — REUSED UNCHANGED): the
    batch is anchored through the EXISTING script and its existing two-host
    https allowlist. No new egress path, no new host, no key, no header. Its
    output is a `source-content-snapshot.v1` committed beside the corpus. An id
    for which no excerpt could be fetched does NOT silently vanish: it becomes
    an entry with `verification_status: "unverifiable"` and a non-empty
    `unverifiable_reason` (the model's own validator, :268-280, requires the
    reason), or it is dropped with a named count in the batch manifest — never
    both silently.
  - >-
    R3 (the classification, `mrr classify relations` — REUSED UNCHANGED): the
    anchored excerpts are classified by N1-T04's command against the same
    criteria file, producing its ordinary proposal artefact — every proposal
    `downgraded-to-proposal`, per case a rationale, `decided_by`, `tie_with`,
    undecidable flag and response hash. This packet adds NO classification
    logic and NO prompt; it calls the built command and commits its artefact.
    A case the model marks undecidable yields an entry classified
    `contextualizes` ONLY if the model said so — never a substituted default;
    an undecidable case is recorded as such in the manifest and excluded from
    the corpus, because `CorpusEntry.evidence_relation` has no undecidable
    value and inventing one would be a fabricated reading.
  - >-
    R4 (the converter,
    services/control_plane/mrr/services/literature/corpus_builder.py): joins
    snapshot and proposals into `corpus-entries.json`. DETERMINISTIC and
    OFFLINE — no network, no clock, no model, no database. Per entry it sets:
    `evidence_relation` from the proposal; `verification_status: "verified"`
    exactly when the excerpt was fetched and hashed, `"unverifiable"` with a
    reason otherwise, and NEVER `"pending"` for an anchored excerpt (K3/K4);
    `retrieval_method` naming the pinned snapshot and its hash; and an
    `extraction` dict carrying `classification_basis` (the proposal's rationale,
    the key the existing corpora already use) AND `classification_provenance` —
    model name, prompt hash, proposal artefact path, and the measured accuracy
    beside its majority floor. `source_family_id` is the arXiv base id, so two
    versions of one paper never count as independent evidence (MTH-015's
    prohibition on counting copies).
  - >-
    R5 (the four siblings): the converter also writes
    `question-model.proposal.json`, `concept-charter.proposal.json`,
    `method-protocol.proposal.json` and `protocol-parameters.sidecar.json` from
    committed templates, so the directory satisfies `research-run.yml`'s
    five-file test (:63-70) and the batch becomes a STATED QUESTION rather than
    a folder of sources. The method protocol declares in its own text that this
    corpus's classifications are model-proposed and unverified; the sidecar's
    `min_included_sources` is set with K4's gate in view.
  - >-
    R6 (`mrr literature build`,
    services/control_plane/mrr/services/cli/literature_main.py): a new
    top-level `literature` group with one subcommand, mirroring `mrr classify
    relations`'s ordering, exit-code map and atomic `os.replace` write. Exit 2
    for a missing or unparseable input (a DEPENDENCY problem); exit 3 for a
    refusal that is a RESULT — an output directory that already exists, a batch
    whose anchored count would fall below the sidecar's
    `min_included_sources`, or a proposal artefact that does not cover every
    anchored id. `main.py` gains exactly one registration and one dispatch
    branch.
  - >-
    R7 (the online path, .github/workflows/literature-channel.yml): NO
    `schedule:` trigger — two nightly routines exist and the standing rules
    forbid a third and forbid any nightly that recomputes the same thing. Fires
    on `workflow_dispatch` (batch name, batch size, model name, `dry_run`) AND
    on `push` to `corpora/field-watch/observations/**`, which is a real trigger
    because the watch commits straight to `main`. It NEVER commits on the
    default branch — the bolt `gold-classification.yml:222-235` needed after the
    fact is built in from the start. It stages BEFORE it asks
    (`git add` then `git diff --cached --quiet`): a new corpus consists
    entirely of new files, so the untracked-file guard bug of N1-T04 §8.6 would
    not be harmless here but fatal. Absent `GEMINI_API_KEY` it fails loudly and
    writes nothing. The batch is laid before a human as a pull request.
