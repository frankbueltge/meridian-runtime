derived_decisions:
  - >-
    (a) Claim-rooted output carries NO artifact bytes and no crate. This
    is faithful: artifacts are run inputs; the research output is the
    claim graph. A researcher who also wants the input artifacts uses the
    crate root (once Befund 1 makes the bytes durable). The two roots are
    complementary, not redundant.
  - >-
    (b) Claim enumeration reuses ProjectionService.build_claim_table
    verbatim (it already scans claim.created events); no new "list claims"
    logic is written. --all-claims exports the whole schema because each
    archival schema is exactly one run's world. The per-kind reference-
    field map (R1) is the ONLY new traversal logic, and every field in it
    was verified present-and-load-bearing in the real K1-T04 schema at
    derivation — it is a fact-locked map, not a guessed vocabulary
    (AGENTS rule 3). A future kind gaining a reference field is a one-line
    addition to that documented map, never an implicit behavior change.
  - >-
    (c) datePublished with no crate = max(created_at) over exported
    objects — deterministic, honest, wall-clock-free. Documented at the
    point of use.
  - >-
    (d) resolve_closure keeps its exact public signature and behavior;
    the refactor is internal (shared private core). E8-T01/T02/T03 tests
    proving the crate path are the behavior-identity bar.
  - >-
    (e) Release (E8-T04) is deliberately NOT made claim-rootable here: a
    release bundle is a published, A4-approved artifact; whether one may
    publish a claim graph with no sealed crate is a governance question
    for a later packet, not an export-convenience change.
invariants:
  - The per-claim BFS and verification discovery are the SAME engine for both roots (one core).
  - Every crate-rooted export and report is byte-identical to its pre-E8-T06 output.
  - Claim-rooted output touches no ArtifactStore and no sealed bytes; writes nothing to the archive.
  - No wall-clock timestamp in any rendered/exported byte; determinism for fixed inputs.
  - A zero-claim claim-rooted export refuses, never ships an empty bundle.
acceptance_tests:
  - >-
    AT1: the R5 real-shaped fixture — crate-rooted export = crate only
    (Befund 2 reproduced); --all-claims export = the full claim graph incl.
    both verifications; asserted as exact URN-set membership.
  - >-
    AT2: the claim-rooted report renders the pass/fail disagreement marked
    "disagreement on record" in both formats and both disclosures; the
    header shows root = claim graph with the run urn and claim count and
    the max-created_at date.
  - >-
    AT3: crate-rooted byte-identity — for a graph whose crate DOES
    reference its claims, the E8-T01/T02 export bytes and the E8-T03/T05
    report bytes are byte-identical before and after this packet.
  - >-
    AT4: two claim-rooted exports of the same schema are byte-identical
    trees; the only date equals max(created_at) of the exported objects.
  - >-
    AT5: refusals — --claim-id naming a non-Claim (exit 3), zero-claim
    --all-claims (exit 3), --artifact-root supplied with a claim root or
    absent with --crate-id (usage refusal); E8-T01..T05 suites unmodified.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make test-integration
  - make security-check
specification_gaps:
  - >-
    Befund 1 (artifact-byte durability) is NOT closed here — a crate-rooted
    export of the real run still needs the ephemeral artifact root until
    the blobs are committed/dumped. Named, separate, next.
  - >-
    Whether the run pipeline should ALSO populate crate.proposed_claims
    going forward (Richtung 1) remains open — this packet makes the
    existing runs exportable without deciding it.
required_output:
  - Packet report per AGENTS "Required delivery format", embedding the
    exact --all-claims CLI invocation and JSON result line, and the
    claim-rooted report's claim-table section for the Hammond claim
    (showing the pass/fail disagreement) verbatim.
stop_conditions:
  - >-
    If the two-seed refactor cannot keep resolve_closure(crate_id)
    behavior-identical (any E8-T01/T02/T03 test needs a change beyond
    imports), STOP and report — the crate path may not drift.
  - >-
    Already fact-locked at derivation (do NOT re-assume the finding's first
    wording): build_provenance_map from a real claim reaches ONLY
    ruling/protocol, never the anchors; all 17 real anchors have empty
    run_id. R1's declared-reference-field map is the resolution. If, on a
    DIFFERENT real schema, a claim's evidence is reachable by yet another
    field not in R1's map, STOP and report it as a one-line map addition
    rather than silently widening the traversal.
  - >-
    If a claim-rooted export would require touching a sealed artifact or
    writing to the archive to be useful, STOP — that is not this packet.
