  sharp_cases:
    - >-
      deeptrace-citation-accuracy MUST be figure_supported_in_excerpt. The abstract
      carries it verbatim ("citation accuracy ranging from 40--80% across systems"). This
      is the case that proves the audit does not simply answer "absent" to everything -
      and it is the very figure four design documents misattributed as a gap until the
      correction of 2026-07-25.
    - >-
      kosmos-synthesis-accuracy MUST be figure_absent_from_checked_excerpt. The 57.9 %
      the capability roadmap's whole staging rests on is NOT in the Kosmos abstract. The
      report must say so as an observation, not as a refutation.
    - >-
      No run may count an absent status as a violation. Violation and observation totals
      appear separately in the report.
