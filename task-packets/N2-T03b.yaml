acceptance_criteria:
  - The gate is fail-closed and provably ordered - a test corrupts one input's bytes and
    asserts the typed IntegrityGateError names that input and both hashes, and that NO
    claim was evaluated.
  - The two closed status sets are never collapsed; a test asserts the report's violation
    total is 0 and its observation total is 18 on the real committed inputs.
  - The full 34-entry acceptance oracle above is reproduced exactly.
  - Every resolved figure renders its matched excerpt window in both report formats.
  - The report header states the checked excerpt is the abstract, that presence is not
    substantive support, and that absence is not refutation.
  - Determinism - no wall clock anywhere in the domain module; sorting is explicit, never
    dict or set iteration order; two runs over equal inputs render identical bytes.
  - Exit semantics mirror N2-T01 - 0 success, 2 input error, 3 refusal. Found violations
    do NOT change the exit code; the audit reports, it does not judge the run.
  - make format-check, lint, typecheck, test, test-contract and security-check all pass.
explicitly_not:
  - No model, no LLM, no provider adapter, no network, no database, no new dependency,
    no persisted object, no schemas/** mirror, no migration.
  - No figure_contradicted status - not decidable against an abstract; deferred to N2-T03c.
  - No widening of R2-T01's BatchRole closed set.
  - No tolerance band on numeric comparison - exact match after German decimal-comma
    normalisation only; a tolerance would be invented domain behaviour (AGENTS rule 3).
  - No edit to any committed corpus artifact, including the claim manifest this packet
    reads.
