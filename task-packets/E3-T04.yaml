forbidden_changes:
  - the independence VALIDATOR (E3-T05 checks that declared independence
    dimensions are actually independent and that repeated same-model judgments
    do not count as independent, MRR-FR-076); THIS task records the declared
    independence profile and enforces only the basic self-verification
    prohibition (verifier identity != proposer/executor)
  - correction events (E3-T06)
  - model/LLM invocation (E4; verification here runs deterministic checks and
    records human/other-agent findings structurally)
  - changing existing schemas' semantics
  - HTTP/FastAPI endpoints
derived_decisions: >
  One new entity schema (verification-result) derived faithfully from domain
  2.13, mirroring existing conventions, added to check_contracts (eleventh
  entity). It records: the reviewed claim/run/artifact id, reviewer identity
  and role, the declared independence profile (the six MRR-FR-071 dimensions:
  principal, model_family, prompt_family, retrieval_path, code_path,
  data_access_path), checks performed, evidence inspected, numeric
  recomputation details, findings by severity, recommendation (pass/fail/
  inconclusive), rationale, conflicts of interest, and adjudication relation.
  A VerificationService.record() enforces the SELF-VERIFICATION PROHIBITION
  (MRR-FR-070 / AGENTS.md rule 8): it fails closed if the reviewer identity
  equals the claim's proposer_id or the producing run's executor identity.
  On a failed verification it drives the claim's status by a DETERMINISTIC
  rule (MRR-FR-075) via the E3-T02 ClaimService transitions (e.g. -> contested
  or review_required), never silently. Reviewer disagreement and adjudication
  rationale are preserved as append-only records, never overwritten
  (MRR-FR-077). The record is unsigned (no signature in 2.13); lifecycle is
  plain revisions. Independence is only DECLARED and the basic self-check
  enforced here; validating that the declared dimensions are genuinely
  independent, and that repeated same-model judgments are not counted twice,
  is E3-T05.
invariants:
  - the claim proposer and the run executor cannot be the reviewer that issues
    the final verification decision for that claim - such a record fails
    closed and persists nothing (MRR-FR-070, AGENTS.md rule 8)
  - the record declares all six independence dimensions (MRR-FR-071); a record
    missing the independence profile fails validation
  - numeric verification either records the recomputed value or an explicit
    reason recomputation is impossible (MRR-FR-073); source verification
    records the inspected evidence/anchor (MRR-FR-072) - neither is left blank
  - a failed verification changes or blocks the claim status by a documented
    deterministic policy (MRR-FR-075); it never leaves a failed-verification
    claim in `supported`
  - reviewer disagreement and adjudication rationale are preserved as
    append-only records; a later review never overwrites an earlier one
    (MRR-FR-077)
  - recording a verification writes exactly one domain event with full
    NFR-001 provenance, atomically with the revision
acceptance_tests:
  - a verification whose reviewer is the claim's proposer is rejected (self
    verification); likewise the run executor - the headline gate
  - an independent reviewer's verification records successfully with its
    independence profile
  - a record missing an independence dimension fails validation
  - a failed verification drives the claim out of any supported/into a
    contested-or-review-required status by the deterministic rule; a claim
    with an unresolved hard verification failure cannot be supported
  - two conflicting reviews are both preserved (no overwrite) with their
    adjudication rationale
  - malformed fixtures (bad urn, unknown recommendation) fail both validators
  - recording persists one revision + one event atomically (integration, real
    PostgreSQL)
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make test-integration
required_output:
  - implementation summary
  - the derived verification-result schema and how it maps to domain 2.13
  - the deterministic failed-verification-to-claim-status policy, documented
  - changed files and any additive domain errors
  - tests and command results, including the CI integration run
  - security implications (self-verification prohibition)
  - open specification questions
stop_conditions:
  - domain 2.13 cannot be represented without inventing semantics
  - the self-verification prohibition cannot be enforced with the available
    identity fields (proposer_id on the claim, executor on the run)
  - implementation requires changes outside allowed paths
