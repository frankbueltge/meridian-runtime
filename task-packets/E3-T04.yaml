task_id: E3-T04
title: Implement Review/VerificationResult records and the self-verification gate
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/02_DOMAIN_MODEL.md section 2.13 (Review and
  VerificationResult), stage 7 requirements MRR-FR-070..077, section 7.7, and
  MRR-NFR-001; approved by the repository owner's direction to continue
  (2026-07-19). Fourth task of Epic E3. Authorizes a NEW entity schema
  (verification-result) derived faithfully from the domain model. AGENTS.md
  rule 8 ("No executor may approve or verify its own result") is the heart of
  this task.
objective: >
  Provide the verification record and its recording service: a schema and
  contract for a review/verification (what was checked, by whom, its declared
  independence profile, findings, recommendation, adjudication), and a service
  that records it while enforcing the self-verification prohibition - the
  claim's proposer and the run's executor MUST NOT issue the final
  verification decision for their own claim - and drives a failed verification
  into the claim's status by a deterministic rule.
source_of_truth:
  - AGENTS.md
  - docs/spec/02_DOMAIN_MODEL.md#213-review-and-verificationresult
  - docs/spec/01_SYSTEM_SPEC.md#47-stage-7--claim-graph
  - docs/spec/01_SYSTEM_SPEC.md#77-review-and-verification-service
  - schemas/claim.schema.json
  - schemas/common.schema.json
requirements:
  - MRR-FR-070
  - MRR-FR-071
  - MRR-FR-072
