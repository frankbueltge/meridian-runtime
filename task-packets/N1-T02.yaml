requirements:
  - >-
    R1 (gold set as data, benchmarks/meridianbench/fixtures/
    gold-label-set.schema.json): a gold label set is an externally visible data
    structure and MUST be schema-validated (AGENTS rule 6).
    CORRECTED DURING THE BUILD, 2026-08-01: this requirement originally placed
    the schema under `schemas/`. It does not belong there, and the repository
    said so itself — tests/contract/test_examples.py::
    test_every_schema_has_an_example_and_a_model asserts
    `schema_entities == example_entities == set(ENTITY_MODELS)`, i.e. every file
    in schemas/ must have a matching examples/*.example.json AND a
    mrr.contracts Pydantic model. A gold label set is deliberately none of
    those: no lifecycle, no object store, and this packet forbids
    packages/contracts/** on purpose. Adding an example and a contract model to
    satisfy the test would have made a governed entity out of something that
    must stay an input file. The schema therefore lives beside the fixtures it
    describes, following the CorpusEntry precedent
    (synthesis_executor.py:205-208: "validated only here (not schematized under
    schemas/)"), and is kept as JSON Schema — rather than only as Python —
    because another practice has to produce one of these and needs a spec it
    can check its own output against. Rule 6 is satisfied by EXECUTING it:
    benchmarks/meridianbench/tests/test_mb_cls.py validates the committed
    fixture against it and asserts it rejects a set with no label_provenance.
    Required: `set_id` (e.g. "mb-cls-v1"), `criteria_version`,
    `criteria_locked_at`, `criteria_lock_content_hash`, `label_provenance`
    (who produced the labels, under which act — free text plus a machine field
    naming the producing practice), `categories` (the declared label space),
    and `cases[]`. Each case: `case_id`, `excerpt` (verbatim source text),
    `excerpt_sha256`, `source_identifiers`, `claim_text`, `expected_relation`
    (one of `categories`), `expected_rationale`, and free-text `metadata`.
    `labelled_at` MUST be strictly after `criteria_locked_at` — a set that
    violates this is REFUSED at load, not warned about.
  - >-
    R2 (MB-CLS suite, benchmarks/meridianbench/suites/mb_cls.py): expose the
    gold set as `BenchmarkCase[MbClsInput, MbClsExpected]` values built by a
    loader, where `MbClsInput` carries ONLY excerpt/claim/criteria and
    `MbClsExpected` carries the relation and rationale. Label isolation is
    inherited from harness.py and MUST NOT be re-implemented or worked around:
    no scorer state on the input, no relation in `metadata`.
  - >-
    R3 (freeze, verifiable not asserted): `EvaluationProfile.fixture_set_id`
    for an MB-CLS evaluation is the string `<set_id>@sha256:<hex>` where the
    hex is the sha256 of the gold-set file's bytes. A loader recomputes it and
    refuses on mismatch. A registry file records, per set_id, the sha256 that
    version froze at; `scripts/check_gold_freeze.py` fails when a registered
    version's bytes have changed, and CI runs it.
  - >-
    R4 (validity metrics, packages/domain/mrr/domain/gold_validity_report.py):
    a Pydantic-validated PROJECTION (never a persisted object, never
    authoritative — rule 7) computed ENTIRELY from agreement.py's existing
    functions with gold as rater "a" and the system under test as rater "b",
    reference="a" throughout. It carries: confusion matrix, observed agreement,
    majority baseline, Cohen's/weighted kappa, Krippendorff's alpha,
    per-category PRF, per-category n, below_power, the gold sha256, the
    criteria version, and the label provenance. It carries
    `measures_validity_against_gold: Literal[True]`, mirroring N1-T01's
    inverse invariant. The ONLY new mathematics is `false_support_rate`,
    derived from the confusion matrix: of all items whose gold label is not
    `supports`, the share the system labelled `supports`; `None` with a stated
    reason when no such item exists, never a fabricated 0.0.
  - >-
    R5 (thresholds from outside, targets.py + promotion.py): add
    `GOLD_CLASSIFICATION_KAPPA_TARGET`, `GOLD_CLASSIFICATION_MACRO_F1_TARGET`
    and `FALSE_SUPPORT_ON_MB_CLS_TARGET` as `float | None` constants, each
    documented as set by the encounter and changeable only by an accepted
    record of that encounter. They are `None` until the encounter delivers
    them. `MetricsReport` gains the three matching fields; the existing
    fail-closed rule then applies unchanged — a `None` metric fails its check.
    A `None` TARGET must likewise fail its check, with a distinct stated
    reason ("no threshold set by an encounter yet"), never pass by default.
  - >-
    R6 (`mrr validate gold`, services/control_plane/mrr/services/cli/): a
    read-only, DB-free, network-free, model-free subcommand taking
    `--gold-set`, `--predictions`, `--format {md,json}` and `--output` (must
    not already exist). Ordering, exit codes and atomic write mirror
    `mrr validate agreement`. Exit 2 for a missing/unparseable input; exit 3
    for a refusal that is a RESULT (hash mismatch, order-gate violation,
    misaligned item sets) with the reason named on stderr.
  - >-
    R7 (synthetic fixture only): `benchmarks/meridianbench/fixtures/
    mb-cls-v1.synthetic.json` is a small, clearly-named SYNTHETIC set for
    testing the apparatus. It is NOT the gold standard and MUST NOT be
    promoted into one: its `label_provenance.producing_practice` is
    `"synthetic-fixture"`, and the loader refuses to use a set with that
    provenance for anything but tests, naming the refusal.
