task_id: N1-T02
title: >-
  The frozen gold standard and its validity measurement: a hash-pinned,
  version-immutable evidence-classification gold set (MB-CLS) with structural
  label isolation, a criteria-finalization-before-labelling order gate, and
  `mrr validate gold` rendering a deterministic VALIDITY report against it —
  confusion, accuracy beside its majority-class floor, Cohen's and weighted
  kappa, Krippendorff's nominal alpha, per-category precision/recall/F1 and a
  false-support rate — reusing the N1-T01 metric core unchanged, touching no
  database, invoking no model, and refusing to report at all when the gold set
  is absent or its hash does not match.
status: approved
epic: N1
reviewer_resolution: >-
  Approved 2026-08-01 by the main session as reviewing instance, under the
  owner's explicit ordering the same day ("Zuerst der MASSSTAB ... Springe
  nicht") and his two recorded decisions of that date: (1) a model proposal may
  NEVER overwrite the curated justification and may never be called "verified"
  — bears on N1-T03/step 2, recorded here because it constrains what this
  packet's measured "system under test" is allowed to be; (2) the gold labels
  AND the thresholds are set by an ENCOUNTER with another practice via The
  Middle, not by the owner, not by the literature, and above all not by Meridian
  itself. Load-bearing choices CONFIRMED at derivation: (a) VALIDITY, not
  reliability — the reference rater is a gold standard set outside the measured
  practice; a distinct report type is required because AgreementReport's
  `measures_reliability_not_validity: Literal[True]` cannot be False by
  construction and N1-T01's honesty boundary must not be weakened; (b) the gold
  set is a committed, hash-pinned INPUT, never code, and never edited — a change
  is a new version; (c) label isolation is inherited STRUCTURALLY from
  E4-T07's BenchmarkCase/SystemUnderTest typing, not re-implemented; (d) the
  metric core (packages/domain/mrr/domain/agreement.py) is reused UNCHANGED —
  this packet adds no metric mathematics, only one derived rate; (e) thresholds
  arrive from the encounter and stay `None` until then, and a `None` threshold
  FAILS its check rather than passing provisionally; (f) fail-closed on a
  missing or hash-mismatched gold set — a refusal, never a partial report.
depends_on: [N1-T01, E4-T07]
derivation: >-
  Derived 2026-08-01 from docs/design/2026-08-01-n1-t02-ableitung-goldstandard.md,
  which fact-locks four claims of the 2026-08-01 handoff against the code and
  corrects them. Fact base verified first-hand at derivation, every citation a
  line that was read:
  (K1) `mrr federation envelope sign` is payload-agnostic
  (federation_main.py:466 "no --payload-kind is special-cased", :483
  "free-form, non-empty tag") — the handoff's and the 2026-07-31 review's claim
  that the federation can carry only CorrectionNotification is OUTDATED since
  E5-T10 + I1-T01, so the owner's encounter route is not transport-blocked.
  (K2) the model-assisted step is synthesis_executor.py:431-488, NOT :710/713
  (which is `_classify_analysis`), and its field set is data-driven from
  MethodProtocol.extraction_fields (:974, :491-503) rather than fixed at two;
  `evidence_relation` is nonetheless structurally unreachable for it, being a
  top-level CorpusEntry field (:247) outside the `extraction` dict (:251) that
  ExtractionOutcome (:413-421) cannot carry.
  (K3) verification_disposition="verified" replaces the WHOLE extraction dict
  and drops model-null fields (:478-482); the key is write-only (only :202
  and :611 in the entire tree); it is a different field from
  CorpusEntry.verification_status, and only that second one gates independence
  counting (source_independence.py:98); claim prose is built from the curated
  top-level field (:929-943). The live hazard is a name collision, not data
  corruption.
  (K4) the nightly research-run selection logic (research-run.yml:57-109) was
  re-executed against the live tree and yields `pending = []` — both complete
  corpora are in archive/answered.json, so the routine currently runs empty.
  Reuse base verified: harness.py:38-63 (label isolation), promotion.py:63-91
  and :119-134 (EvaluationProfile, fail-closed MetricsReport), targets.py
  (ADR-updatable constants incl. an existing false-support target),
  agreement.py:157/191/241/258/289/326/390/432/451 (the full metric core
  including per-category PRF against a NAMED reference rater).
objective: >-
  After this packet, `mrr validate gold --gold-set <path> --predictions <path>`
  renders a deterministic validity report (JSON and Markdown) of a set of
  evidence-relation classifications against a frozen gold standard, computing:
  the confusion matrix over {supports, contradicts, qualifies, contextualizes},
  observed agreement (accuracy) ALWAYS printed beside the majority-class floor,
  Cohen's kappa, linear- and quadratic-weighted kappa, Krippendorff's nominal
  alpha, per-category precision/recall/F1 against gold as the named reference,
  and the false-support rate (share of non-`supports` gold items read as
  `supports`). The report header states in plain type: (a) this is VALIDITY
  against a gold standard, naming that standard's provenance; (b) the gold
  set's sha256 and version id; (c) the criteria version the labels were made
  under, together with the order-gate evidence that criteria were locked BEFORE
  labelling; (d) each category's n and a below-power flag when n/category < 20.
  It reads only committed files, opens no database connection, invokes no
  model, performs no network access, and writes only the given output path
  (atomic os.replace). With no gold set present, or with a gold set whose bytes
  do not hash to its declared id, it REFUSES — a named non-zero exit, never a
  partial or provisional report.
