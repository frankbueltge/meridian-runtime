derived_decisions:
  - >-
    (a) Validity, not reliability — and a SEPARATE type, not a flag.
    AgreementReport's `measures_reliability_not_validity: Literal[True]` is
    N1-T01's central honesty boundary and cannot become False. Making validity
    a second value of the same field would silently reopen exactly the claim
    N1-T01 closed. Two types, one shared metric core.
  - >-
    (b) The gold set is a committed, hashed INPUT, not code — the same choice
    N1-T01 made for its crosswalk, for the same reason: the standard against
    which everything is judged must itself be contestable, citable and
    diff-able, not compiled in.
  - >-
    (c) Four categories in the label space, two in the targets.
    `_classify_analysis` counts only supports/contradicts
    (synthesis_executor.py:192-197); qualifies/contextualizes move nothing. But
    they stay in the label space because the most consequential error a
    classifier can make is reading a `qualifies` as a `supports`, which inflates
    corroboration and lifts the ceiling meant to cap the claim. Dropping them
    would make the benchmark blind to its own worst failure.
  - >-
    (d) The order gate is data, not discipline. `labelled_at` after
    `criteria_locked_at`, both carried in the set and checked at load. Without
    it "frozen beforehand" is an assertion in a document; with it, a moved goal
    post is a refused run.
  - >-
    (e) Thresholds absent means FAIL, not PASS. The encounter has not yet
    delivered numbers. The alternative — a provisional default — would let a
    self-modification claim success against a threshold nobody set, which is
    precisely the failure mode the whole ordering exists to prevent.
  - >-
    (f) ~60 cases is below the roadmap's own >=20-30/category and is REPORTED as
    below_power, following N1-T01's derived_decision (g). An under-powered
    honest measurement is worth more than a well-powered fictional one, and the
    flag prevents the number from being read as publication-grade.
  - >-
    (g) The synthetic fixture is quarantined by provenance, not by filename
    convention alone. A filename can be copied; a provenance field the loader
    refuses to accept for real evaluation cannot be promoted by accident.
invariants:
  - No database connection is opened and no repository is constructed anywhere in the runtime path.
  - No model adapter is constructed and no network call is made, on any path.
  - Nothing is written except the requested --output file (atomic os.replace); corpora and archive are never touched.
  - No wall-clock timestamp in any rendered byte; identical inputs yield a byte-identical report and a stable content hash.
  - A gold set whose recomputed sha256 differs from its declared id is REFUSED; no metric is computed from it.
  - A gold set whose labelled_at is not strictly after criteria_locked_at is REFUSED at load.
  - Accuracy is never rendered without the majority-class baseline beside it, in the same block.
  - A target that is None fails its check with a stated reason; it never passes and is never omitted.
  - A gold set with label_provenance.producing_practice == "synthetic-fixture" is refused for real evaluation, by name.
  - agreement.py and agreement_report.py are byte-identical before and after this packet.
acceptance_tests:
  - >-
    AT1 (hand-computed oracle, worked at derivation without importing the code
    under test). The fixed 20-item matrix, rows = gold, columns = system, in
    category order [supports, contradicts, qualifies, contextualizes]:
    [[8,1,1,0], [1,3,1,0], [1,0,2,0], [1,0,0,1]].
    Gold marginals [10,5,3,2]; system marginals [11,4,4,1]; diagonal 14.
    Asserted as literals: observed agreement = 7/10 = 0.70 exactly; majority
    baseline = 10/20 = 0.50 exactly; p_e = 144/400 = 9/25 = 0.36 exactly;
    Cohen's kappa = (7/10 - 9/25)/(1 - 9/25) = 17/32 = 0.53125 EXACTLY — an
    exact rational, so the assertion is equality, not a tolerance
    (agreement.py computes in fractions.Fraction). False-support rate: of the
    10 gold items that are not `supports`, 3 were labelled `supports`, so
    exactly 3/10 = 0.30. Kappa here also lands just above the 0.5 the field
    literature calls reachable for criterial classification, which makes this
    fixture a useful shape for the apparatus without being a claim about any
    real system.
  - >-
    AT2 (freeze is real): the loader accepts the fixture when its declared
    `<set_id>@sha256:<hex>` matches the file bytes; flipping a single byte of
    the fixture makes the loader refuse with exit 3 and the mismatch named;
    `scripts/check_gold_freeze.py` fails for a registered version whose bytes
    changed and passes when they did not.
  - >-
    AT3 (order gate): a gold set with labelled_at == criteria_locked_at is
    refused; one with labelled_at before criteria_locked_at is refused; one
    strictly after is accepted. All three asserted, the refusals naming the
    violated order rather than a generic parse error.
  - >-
    AT4 (fail-closed on absence): invoking `mrr validate gold` with no
    `--gold-set` path present exits non-zero and prints a reason naming the
    missing standard; NO report file is created. With all three thresholds
    None, `decide_promotion` returns `hold` and each TargetCheck carries the
    "no threshold set by an encounter yet" reason — never `promote`.
  - >-
    AT5 (label isolation survives): a test asserts that `MbClsInput` has no
    field carrying the expected relation, and that the value passed to a system
    under test in the MB-CLS suite is an `MbClsInput` — mirroring
    benchmarks/meridianbench/tests/test_harness_label_isolation.py, which must
    continue to pass unchanged.
  - >-
    AT6 (determinism and non-interference): two renders of the same inputs are
    byte-identical; `git diff --exit-code` over agreement.py and
    agreement_report.py is empty after the packet; the existing meridianbench,
    unit, property and contract tiers pass unmodified.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - uv run python scripts/run_test_tier.py meridianbench
  - make security-check
specification_gaps:
  - >-
    The gold labels themselves are NOT produced by this packet. They arrive from
    an encounter with another practice via The Middle (owner decision
    2026-08-01). Until then the apparatus runs on a synthetic fixture and
    refuses to treat it as a standard. This is a declared, dated hole, not an
    oversight.
  - >-
    The threshold values are likewise absent by design and their checks fail
    closed. Setting them is an act of the encounter, recorded, not a code change
    a builder may make.
  - >-
    Cryptographic attributability of the returned label sheet (a signed envelope
    from Ulysses' own practice identity) requires Ulysses' node id and trust
    declaration, which do not exist yet (Wegkarte 2026-07-26, points 8/9). The
    first round therefore attributes by commit and journal entry. Named as a
    retrofit, not as done.
  - >-
    Prompt-stability across paraphrases (Krippendorff's alpha over prompt
    variants) remains N1-T03 and is untouched here; it needs a model arm, which
    step 2 has not built.
required_output:
  - Packet report per AGENTS "Required delivery format", embedding the exact
    `mrr validate gold` invocation, the rendered Markdown report for the
    synthetic fixture verbatim (confusion matrix, accuracy beside its majority
    baseline, kappa, per-category PRF, false-support rate, below_power flag,
    validity header), the gold-set sha256, and the `hold` promotion decision
    with its three "no threshold set" reasons.
stop_conditions:
  - >-
    If computing any required metric would need a change to agreement.py, STOP
    and report — the metric core is reused unchanged by construction, and a
    needed change means this packet's premise is wrong.
  - >-
    If satisfying label isolation would need a change to harness.py, STOP —
    E4-T07's structural guarantee is inherited, never renegotiated.
  - >-
    If any plausible reading requires invoking a model or reaching the network to
    produce the report, STOP — this packet is model-free and offline by
    invariant, and such a reading means the scope has drifted into step 2.
