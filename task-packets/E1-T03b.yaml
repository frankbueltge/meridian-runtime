derived_decisions:
  - >-
    (a) `BaseObjectClassification` is a NEW, separate six-value `Literal` —
    not a widening of the existing `Classification`. Concretely:
    `BaseObjectClassification = Literal["PUBLIC", "INTERNAL", "RESTRICTED",
    "SENSITIVE", "PARTICIPANT_IDENTIFIABLE", "SYNTHETIC_TEST_FIXTURE"]`
    (module-level, `packages/contracts/mrr/contracts/common.py`, placed
    immediately after the existing `Classification` declaration, with a
    docstring cross-referencing ADR-0010 and explaining why it is not
    `Classification` itself), and
    `BaseObject.classification: BaseObjectClassification | None = None`
    (placed after `labels` in the field list, matching the schema's own
    property ordering). REASON, evidenced: `Classification` is imported and
    reused verbatim by `TaskBundle.classification` (required) and
    `ResearchScore.data_classes` (a list). If `Classification` itself grew a
    sixth value, `TaskBundle(classification="SYNTHETIC_TEST_FIXTURE", ...)`
    would VALIDATE at the Pydantic layer (since the shared type now accepts
    it) while `schemas/task-bundle.schema.json`'s own hand-written,
    UNCHANGED, five-value inline `enum` (line 60) would still REJECT the
    identical document — a live schema/Pydantic drift this repository's own
    `scripts/check_contracts.py` exists specifically to prevent between
    committed EXAMPLES, but would not catch for a hand-constructed
    out-of-band document, since nothing round-trips every theoretically
    constructible instance. Keeping `BaseObjectClassification` separate
    avoids this drift by construction: `TaskBundle`'s own field continues to
    validate ONLY against the ORIGINAL five values at BOTH tiers, unaffected
    by anything this packet does to `BaseObject`. The two-tier interaction
    for `TaskBundle` specifically: at the JSON Schema level, `allOf`
    combines `common.schema.json#/$defs/baseObject` (now offering a
    six-value `classification` property) with `task-bundle.schema.json`'s
    own fragment (an UNCHANGED five-value `classification` property) — JSON
    Schema's `allOf` requires the instance to satisfy BOTH subschemas
    simultaneously, so the EFFECTIVE constraint for a `TaskBundle` document
    is the intersection (five values, `SYNTHETIC_TEST_FIXTURE` excluded); at
    the Pydantic level, `TaskBundle`'s own already-existing
    `classification: Classification` field (required, no default) is a
    subclass re-declaration that fully overrides `BaseObject`'s newly-added
    optional field for `TaskBundle` specifically — the SAME mechanism
    `BaseObject`'s own docstring already documents for `kind` ("Entity
    modules subclass this and narrow `kind` to a `Literal` of the entity's
    own name"), applied here to a field Pydantic v2 supports overriding by
    ordinary subclass re-declaration. Net effect, both tiers agreeing: every
    OTHER `BaseObject`-derived entity (27 of the 29 total; the two
    exceptions, per derivation (1)'s schema-reference count, are
    `TaskBundle` itself, handled above, and none other declares its own
    `classification` today) automatically and for free gains the new,
    six-value, OPTIONAL field via the unmodified `allOf`/Python-inheritance
    mechanism already in place — zero per-entity schema or model edits
    required, confirmed by the `unevaluatedProperties: false` +
    `allOf: [{"$ref": "common.schema.json#/$defs/baseObject"}, ...]` pattern
    already uniform across every entity schema that references `baseObject`
    (`source-record.schema.json` lines 6-7/68 read as the representative
    example).
  - >-
    (b) No Alembic migration; no persistence-layer code change; the
    acceptance test that PROVES this rather than merely asserting it.
    `objects_table.c.body` (`packages/persistence/mrr/persistence/tables.py`
    line 60) is `postgresql.JSONB()`, unconstrained by any CHECK on its
    internal keys (unlike `edges.edge_type`, the one genuine
    migration-requiring precedent in this repository, per K1-T02's own
    migration). `PostgresObjectRepository.insert_revision`/`get_latest`
    (`packages/persistence/mrr/persistence/repositories.py`) pass `body`
    through as an opaque dict — no field-by-field mapping, no allowlist.
    Therefore a `StoredObject` whose `body` dict happens to carry a
    `"classification"` key round-trips today, on the CURRENT migration head,
    with ZERO code change, exactly as `TransferService`'s own
    already-shipped `.body.get("classification")` read
    (services/control_plane/mrr/services/transfer/service.py line 559)
    already proves for `TaskBundle` bodies specifically. This packet's own
    integration-tier acceptance test (below) inserts a `StoredObject` (via
    the existing `_stored_object` helper pattern already established in
    `tests/integration/persistence/test_postgres_repositories.py` lines
    68-83) whose `body` includes `"classification": "SYNTHETIC_TEST_FIXTURE"`
    against the CURRENT, UNMODIFIED migration chain and asserts it reads
    back byte-identical — proving the "no migration needed" claim by
    running it, not merely by asserting it in prose, and giving a concrete
    stop_condition if that assumption turns out to be wrong for some reason
    not yet discovered.
  - >-
    (c) No creating service gains a `classification` parameter; the field is
    real and settable today only via direct document/`StoredObject`
    construction. Motivation for deferring, stated plainly: ADR-0010's own
    staged-adoption list names step 1 as "Schema/contract addition" only;
    wiring roughly fifteen distinct `.create()`-style service methods
    (`SourceRecordService`, `EvidenceAnchorService`, `PracticeService`,
    `ClaimService`, `MethodRulingService`, `EvidenceMatrixService`,
    `ResearchDecisionService`, and others) to each accept and thread through
    an optional `classification` keyword would multiply this packet's own
    blast radius by an order of magnitude for a capability nothing yet
    reads (steps 2/3 are the actual consumers, and neither is in scope
    here) — directly contradicting docs/spec/07_AGENT_TASK_TEMPLATE.md
    section 5's own compiler rule 1 ("select no more than one cohesive
    domain behavior") and rule 10 ("keep tasks small enough for independent
    review and rollback"). This is a genuine, disclosed judgment call, not a
    silent omission — flagged again in specification_gaps for a reviewer who
    might prefer bundling at least ONE representative service (e.g.
    `SourceRecordService`, the nearest eventual MRR-MTH-012 consumer) into
    this same packet.
  - >-
    (d) `docs/spec/02_DOMAIN_MODEL.md` section 1's own field list (the
    fenced code block reading `id / api_version / kind / practice_id /
    revision / created_at / created_by / content_hash / supersedes
    (optional) / labels (optional)`) is amended to append a new line,
    `classification (optional)`, immediately after `labels (optional)` —
    keeping the spec's own normative field inventory honest and in sync
    with the schema it describes, exactly as the schema/contract change it
    documents. Section 4 ("Data classification") gains one short new
    paragraph AFTER its existing table (which stays otherwise unchanged —
    see specification_gaps for why `SYNTHETIC_TEST_FIXTURE` is NOT added as
    a sixth table row), reading approximately: "A sixth value,
    `SYNTHETIC_TEST_FIXTURE`, marks fixture-derived objects that MUST never
    be treated as empirical evidence (ADR-0010). Every first-class object
    MAY carry this vocabulary via the optional `baseObject.classification`
    field; absence means unclassified, and unclassified MUST NOT satisfy
    any classification-gated check." — wording MAY be lightly copyedited by
    the implementer, but MUST preserve the fail-closed-on-absent claim
    verbatim in substance, since it is the ADR's own load-bearing safety
    property.
