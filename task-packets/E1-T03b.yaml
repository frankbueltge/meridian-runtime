task_id: E1-T03b
title: >-
  ADR-0010 staged-adoption step 1 — optional `classification` field on
  `baseObject`/`BaseObject` (schema + Pydantic contract only; no migration,
  no consumer wiring, no creating-service change)
status: approved
epic: E1
reviewer_resolution: >-
  Approved 2026-07-21 by the main session as reviewing instance, under the
  owner's same-day merge delegation (see the approval commit's own message).
  All four primary choices are CONFIRMED as derived: (1) task id `E1-T03b`
  per the established b-suffix convention; (2) the NEW, separate six-value
  `BaseObjectClassification` Literal rather than widening the shared
  `Classification` — the TaskBundle schema/Pydantic drift argument in
  derived_decisions (a) is decisive; (3) no Alembic migration, proven by the
  round-trip acceptance test rather than asserted (derived_decisions (b));
  (4) full deferral of creating-service wiring (derived_decisions (c)) —
  wiring a setter before steps 2/3 provide any reader would add surface
  with no consumer; and the section-4 prose footnote rather than a seventh
  table row (derived_decisions (d)) — SYNTHETIC_TEST_FIXTURE is a
  "not-empirical" marker, not a sixth rung of the disclosure ladder.

  Two reviewer annotations, both binding on implementation and on the
  future follow-up tasks: (i) specification_gaps' fifth entry suggests
  `mrr.domain.synthetic_fixture` could "now import
  `BaseObjectClassification` from `mrr.contracts.common`" — reviewer
  verification shows that import would be ILLEGAL, not merely deferred:
  the established layering direction is contracts -> domain
  (`mrr.contracts.common` already imports `URN_PATTERN` from
  `mrr.domain.identity`, common.py line 29), so domain importing contracts
  would create exactly the package cycle `mrr.domain.artifacts`'s own
  docstring warns about. The deferral is therefore structurally required;
  the future wiring task must resolve the constant question by another
  route (e.g. hosting the vocabulary in `mrr.domain` with contracts
  importing it, mirroring the URN_PATTERN precedent, or keeping the local
  literal) — decided THEN, not now. (ii) A prose-consistency nit, not a
  design change: derived_decisions (a)'s "27 of the 29" parenthetical and
  the invariants' "every one of the 29 entities except `TaskBundle`" imply
  slightly different counts; the OPERATIVE rule is the invariant's — every
  `baseObject`-derived entity except `TaskBundle` gains the optional field
  via inheritance — and the implementation should verify the actual entity
  count empirically in its own test rather than trusting either number.

  AMENDMENT (2026-07-21, after PR #55's independent review): annotation
  (i)'s legality claim is WITHDRAWN as factually wrong. The independent
  reviewer found, and the reviewing session re-verified by direct grep,
  that `mrr.domain` modules ALREADY import from `mrr.contracts` in twelve-
  plus files (`task_trust.py`, `manifest_trust.py`, `crate_trust.py`,
  `correction_notification.py`, `offline_bundle.py`, `independence.py`,
  `claim_ceiling.py`, `envelope_validation.py`, `envelope_transport.py`,
  among others), and neither import-linter contract forbids that
  direction — both directions coexist because Python resolves cycles at
  MODULE granularity, not package granularity, and no specific module
  pair forms a loop. `mrr.domain.artifacts`'s own docstring rationale is
  therefore a LOCAL constraint of that module's own import graph, not the
  repo-wide rule annotation (i) claimed. What REMAINS binding from
  annotation (i): the deferral itself (this packet still does not touch
  `synthetic_fixture.py` — a scope decision, unaffected by the legality
  question). The future step-2/3 wiring task MAY therefore use a direct
  `from mrr.contracts.common import BaseObjectClassification` import in
  `synthetic_fixture.py` if its own module-level import graph stays
  acyclic — decided then, on this corrected record, not on the withdrawn
  claim. The empirical entity count, per annotation (ii)'s instruction,
  came out at 29 entities / 26 BaseObject subclasses / 25 plain
  inheritors + TaskBundle narrowing + 3 deliberate non-subclasses —
  neither of the packet prose's two numbers was right, vindicating the
  count-empirically instruction.
  Derived per docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from
  docs/spec/adr/ADR-0010-OBJECT-LEVEL-DATA-CLASSIFICATION.md (Status:
  ACCEPTED 2026-07-21, `docs/spec/adr/ADR-0010-OBJECT-LEVEL-DATA-CLASSIFICATION.md`
  line 3), whose own "Decision" section commits to exactly this scope: "Add
  one **optional** `classification` property to
  `common.schema.json#/$defs/baseObject` ... (and `BaseObject` in
  `packages/contracts/mrr/contracts/common.py`), with the §4 vocabulary plus
  one new value" (`PUBLIC | INTERNAL | RESTRICTED | SENSITIVE |
  PARTICIPANT_IDENTIFIABLE | SYNTHETIC_TEST_FIXTURE`), and whose own "Staged
  adoption" list names step 1 as "Schema/contract addition (additive; all
  existing examples/fixtures stay valid)", explicitly distinct from step 2
  ("E6-T05's projection consumes the stored field"), step 3 ("a follow-up
  task hardens `TransferService.create()`") and step 4 ("K1-T02 uses
  `SYNTHETIC_TEST_FIXTURE` for the kernel's fixture-isolation gate" — already
  landed as the pure, unwired function this task's own forbidden_changes
  protects, see below).

  This task packet is the one the governance commit `cd389b40eed2`
  ("Governance: ADR-0010 ACCEPTED + K1-T02 approved") itself anticipated
  when it wrote: "Feld bleibt optional und fail-closed, Einfuehrung gestuft,
  Schritt 1 wird ein eigenes Task-Packet" ("the field stays optional and
  fail-closed, introduction is staged, step 1 becomes its own task packet").
  `task-packets/K1-T02.yaml`'s own `derived_decisions` ("ADR-0010
  dependency") states this even more explicitly: "a small follow-up slice
  (either a K1-T02 continuation or a new micro-task) wires the
  already-built, already-tested pure function against real
  `SourceRecord.classification`/... — no new design work required at that
  point, only wiring" — but that same section is unambiguous that step 1
  (the field's existence) is a PRECONDITION for that follow-up, not part of
  it, and `task-packets/K1-T03.yaml`'s own derivation independently
  re-confirms the exact same split is inherited unchanged ("K1-T02's own
  governance note ... stages this into 'ein eigenes Task-Packet' ... NOT
  K1-T02 itself and NOT this packet"). `task-packets/E9-T00.yaml`'s own
  derivation, in its "Explicitly NOT in this batch" paragraph, independently
  verified the identical split a third time and explicitly excluded it from
  E9's pre-hardening batch: "ADR-0010's staged-adoption step 1 (a real
  `baseObject.classification` field) ... is a schema/migration-bearing
  change, categorically larger than this batch's small, additive,
  already-scoped items, and stays its own packet" — this task packet is
  that packet, and (per the migration-question evidence below) the
  "migration-bearing" characterization in that sentence turns out, once
  actually investigated against this codebase's persistence layer, to be
  not quite accurate: no migration is in fact required (see derived_decisions
  (b)). `docs/design/2026-07-21-session-handoff-first-real-run.md` section 4
  ("Nächste Arbeit, in empfohlener Reihenfolge") lists, as item 3 of the
  recommended next-work order (after PR #53 and E9-T00): "**ADR-0010
  Schritt 1** (eigenes Packet ableiten): optionales `classification`-Feld
  auf baseObject + Contract; danach Schritt 2/3 ... und MTH-012-Gate-
  Verdrahtung" — this is the literal instruction this packet answers.

  Task-id and epic placement, decided and justified (the repository has no
  standing convention that names this exact case, so this packet reasons
  from the two precedents it DOES have): `docs/spec/06_IMPLEMENTATION_PLAN.md`
  section 3 assigns `common.schema.json`/`packages/contracts/**` to Epic E1
  ("E1 — Contracts and domain kernel"), specifically task "E1-T03 JSON
  Schemas and Pydantic models" (`task-packets/E1-T03.yaml`, `allowed_paths:
  packages/contracts/**, schemas/**, examples/**, tests/contract/**,
  scripts/check_contracts.py, pyproject.toml` — an exact superset of what
  this task also needs). E1-T03 is long since merged, so this is not a
  continuation of open work but a small, additive completeness follow-up to
  an already-closed task — exactly the shape this repository already has a
  named convention for: `task-packets/E5-T00b.yaml` ("completeness follow-up
  to E5-T00"), `task-packets/E5-T02b.yaml` ("completeness follow-up to
  E5-T02"), and `task-packets/E5-T07b.yaml` ("Derived ... from exactly what
  task-packets/E5-T07.yaml's own scope_note deferred ... mirrors this repo's
  own E5-T00/E5-T00b and E5-T02/E5-T02b splits") all use a `b`-suffix on the
  originating task's own id for a small, later, independently-reviewable
  addition to that SAME task's own deliverable, never claiming a fresh
  epic-numbered slot. Two alternatives were considered and rejected: (1)
  `K1-T05` — rejected because `docs/design/2026-07-21-research-method-kernel-plan.md`
  line 35 titles K1 explicitly "`systematic_evidence_synthesis` v1 on the
  atlases (4 tasks)", a closed, already-fully-delivered count (K1-T01..T04,
  all merged per `git log --oneline -5` showing `9afcbd5 K1-T04: first real
  run` and `d49cb7d`/later commits with no further K1 task); this packet is
  cross-cutting contracts infrastructure, not part of that specific
  synthesis-pipeline deliverable, and both K1-T02 and K1-T03 explicitly
  disclaim ownership of it in their own text (quoted above). (2) `E9-T00b`
  — rejected because `task-packets/E9-T00.yaml`'s own derivation explicitly
  and by name excludes this exact work from E9's pre-hardening batch
  (quoted above), so folding it in under an E9-T00 suffix would contradict
  the very packet whose exclusion this task packet is honoring. `E1-T03b`
  is therefore the id and epic this packet uses: the smallest deviation from
  established convention, naming the exact originating task whose own
  `allowed_paths` this work stays inside.

  Every load-bearing claim below was verified directly against the CURRENT
  code on `main` (commit `b07d1ab`, after the E9-T00 merge — E9-T00's own
  seven items are LANDED, not pending):

  (1) `schemas/common.schema.json#/$defs/baseObject` (lines 18-33, read in
  full) declares exactly ten properties (`id, api_version, kind,
  practice_id, revision, created_at, created_by, content_hash, supersedes,
  labels`) and a `required` list of eight — `supersedes`/`labels` are the
  only two optional ones. No `classification` property exists anywhere on
  this `$def`. `packages/contracts/mrr/contracts/common.py`'s `BaseObject`
  class (lines 135-155) mirrors this exactly: ten fields, `supersedes: Urn |
  None = None` and `labels: dict[str, str] | None = None` the only two
  defaulted/optional ones, no `classification` field. This confirms the ADR's
  own "Context" premise is still true today: `classification` exists ONLY
  on `$defs.artifactRef` (schema lines 46-58, contracts lines 90-99, the
  `ArtifactRef.classification: Classification | None = None` field — a
  REFERENCE-shaped nested value, not a property of the referencing object
  itself) and, separately, as `TaskBundle`'s own required top-level field
  (`packages/contracts/mrr/contracts/task_bundle.py` line 112,
  `classification: Classification`; `schemas/task-bundle.schema.json` line
  9's `required` list and line 60's inline `enum`). A repository-wide search
  (`grep -rn "\"classification\":" schemas/*.json`) across all 30 files
  under `schemas/` returns EXACTLY these two hits and no others — confirming
  the ADR's "only two places in the contracts can carry it today" claim is
  still accurate, and that this task's design must specifically account for
  exactly one collision candidate (`TaskBundle`, see derived_decisions (a)),
  not an open-ended set.

  (2) `packages/contracts/mrr/contracts/common.py`'s existing `Classification`
  module-level `Literal` (lines 43-53, five values, no `SYNTHETIC_TEST_FIXTURE`)
  is imported and reused, UNCHANGED, by exactly three existing call sites
  (confirmed by `grep -n "from mrr.contracts.common import" ... | grep
  Classification` plus direct reads): `ArtifactRef.classification` (common.py
  itself), `TaskBundle.classification` (task_bundle.py line 112, required),
  and `ResearchScore.data_classes: list[Classification]` (research_score.py
  — a LIST of "which data classes this research touches", a different
  cardinality/semantics from a single object's own classification, and a
  field name that is NOT `classification`, so no collision there either).
  A SEPARATE, structurally identical five-value `Classification` Literal
  also exists in `packages/domain/mrr/domain/artifacts.py` (lines 62-68,
  for `ArtifactDescriptor.classification`) — its own docstring (lines 43-61)
  explains this is a DELIBERATE third copy of the same enum, not an
  oversight ("A classification enum appearing in a third place (here) is
  consistent with a pattern that already appears in two"), because
  `mrr.domain` cannot import `mrr.contracts` without creating a package
  cycle. ADR-0010's own Decision text names only `baseObject`/`BaseObject`
  as the target of the new value — it does not ask to touch `ArtifactRef`,
  `TaskBundle`, `ResearchScore.data_classes`, or
  `mrr.domain.artifacts.Classification`, and this packet's own design
  (derived_decisions (a)) deliberately does not widen any of them, to avoid
  a Pydantic-vs-JSON-Schema drift risk explained there.

  (3) `packages/contracts/mrr/contracts/source_record.py` (read in full,
  lines 1-60 excerpted) was checked specifically because ADR-0010's own
  Context section names `SourceRecord` as a future consumer
  (MRR-MTH-012's eventual wiring target). Its own `classification`-adjacent
  concept is named `primary_secondary_derived: SourceClassification`
  (line 90, `SourceClassification = Literal["primary", "secondary",
  "derived"]` at line 46) — a DIFFERENT field name for a DIFFERENT concept
  (docs/spec/02_DOMAIN_MODEL.md's "primary/secondary/derived classification",
  about a source's own evidentiary role, not disclosure sensitivity). No
  field-name collision exists on `SourceRecord` either — confirmed, not
  assumed, given both use the English word "classification" in their own
  documentation.

  (4) `packages/domain/mrr/domain/synthetic_fixture.py` (K1-T02, already
  landed, read in full) is the pure, already-tested
  `assert_not_synthetic_fixture_evidence(*, source_classification: str |
  None)` gate function MRR-MTH-012 needs. Its own module docstring (lines
  6-45, "ADR-0010 dependency: this function is unblocked; its WIRING is
  not") states precisely what this packet must NOT do: "wiring it against
  any REAL stored object's classification ... is explicitly BLOCKED and NOT
  delivered here. The recommended next step, once the schema/contract field
  lands in its own future task, is a small follow-up slice that reads a
  resolved source's stored `classification` field and calls this
  already-built, already-tested function — no new design work, only
  wiring." This packet IS the "schema/contract field lands in its own
  future task" step this docstring anticipates; the wiring itself stays out
  of scope (forbidden_changes) and is left for the follow-up this docstring
  already names.

  (5) `services/control_plane/mrr/services/transfer/service.py`'s
  `_ensure_no_participant_identifiable_object` (lines 532-560, E6-T01,
  read in full) already reads `referenced.body.get("classification") ==
  "PARTICIPANT_IDENTIFIABLE"` (line 559) generically off the stored body
  dict — not through any dedicated `StoredObject` field or database column.
  Its own docstring (lines 538-552) already discloses: "Only object KINDS
  that carry a top-level `classification` field on their own stored body
  (today: `TaskBundle` ...) can ever be flagged by this check." This is the
  exact practical no-op ADR-0010's Context section 1 describes, and it is
  step 3 ("a follow-up task hardens `TransferService.create()`") — this
  packet changes NOTHING about this method's behavior (forbidden_changes):
  adding the schema/contract field does not by itself make any NEW object
  carry a real classification value (no creating service is changed either,
  derived_decisions (c)), so this check's practical scope is unaffected
  until a later task both wires real values onto more object kinds AND
  updates this gate's own scope note.

  (6) `packages/domain/mrr/domain/public_correction_view.py` (E6-T05, read
  relevant excerpts) documents its own attestation-map bridge explicitly as
  provisional: "pending a future stored-classification-field step" (module
  docstring). This is step 2. Untouched here (forbidden_changes).

  (7) The migration question, resolved with direct evidence, not assumed.
  `packages/persistence/mrr/persistence/tables.py`'s `objects_table` (lines
  47-63, read in full) declares individual columns for every `baseObject`
  field EXCEPT `body` is also present as one generic `postgresql.JSONB()`
  column carrying the object's full serialized form; `PostgresObjectRepository.
  _insert_revision_core` (`packages/persistence/mrr/persistence/repositories.py`
  lines 186-226, in particular the `.values(...)` call at lines 203-216)
  writes `id, revision, api_version, kind, practice_id, created_at,
  created_by, content_hash, supersedes, labels, body` — eleven columns,
  covering the ten `baseObject` fields (nine of them ALSO duplicated into
  `body`) plus `body` itself. `packages/domain/mrr/domain/repositories.py`'s
  `StoredObject` docstring (lines 79-84) explains WHY: "The base fields are
  duplicated into dedicated columns ... so they stay queryable and indexable
  without unpacking JSONB; `body` is the authoritative full payload." No
  `classification` column exists, and this task's own consumers (schema
  validation, Pydantic round-trip, and any FUTURE step-2/3 reader) all
  resolve an object via `ObjectRepository.get_latest(id).body["classification"]`
  — confirmed this is EXACTLY how `TransferService`'s own already-existing
  `_ensure_no_participant_identifiable_object` already reads `TaskBundle`'s
  OWN required `classification` field TODAY (line 559, cited above), with
  ZERO dedicated column or `StoredObject` field for it — proving, by
  existing, already-shipped precedent, that `classification` living purely
  inside `body` (never promoted to its own column) is a fully sufficient,
  already-working pattern in this exact codebase, not a hypothetical. No
  entry under `EDGE_VOCABULARY`-style CHECK-constraint enforcement exists
  for `body`'s own keys (`body` is unconstrained JSONB, unlike
  `edges.edge_type`, which DOES carry a real CHECK constraint
  `packages/domain/mrr/domain/repositories.py`/`K1-T02`'s migration widened
  — the one genuine precedent in this repository for "adding a value
  requires a migration", and it does not apply here because no CHECK
  constraint targets object body contents anywhere). CONCLUSION: no Alembic
  migration, and no change to `packages/persistence/mrr/persistence/tables.py`
  or `packages/domain/mrr/domain/repositories.py`'s `StoredObject`, is
  needed — see derived_decisions (b) for the acceptance test that proves
  this by direct round trip rather than merely asserting it.

  (8) Back-compat / no re-signing, evidenced, not merely promised.
  `services/control_plane/mrr/services/evidence/service.py` (lines 147-163,
  representative of every creating service checked) builds a new object's
  `body` via `json.loads(source_record.model_dump_json(exclude_none=True))`
  — the universal, ADR-0004-unified convention (`task-packets/E5-T00.yaml`)
  confirmed by `grep`-ing "ADR-0004 ... exclude_none" across
  `packages/domain/mrr/domain/{correction_notification,crate_trust,
  envelope_validation,manifest_trust,offline_bundle,transfer_trust,
  task_trust}.py`. Since Pydantic's `exclude_none=True` drops any field
  whose value is `None`, and the new `classification` field defaults to
  `None`, EVERY EXISTING creation path — unchanged by this packet — will
  continue to omit `classification` from `body` entirely for every object
  that does not explicitly set it (which is every object today, since no
  creating service exposes a `classification` parameter to set it with —
  confirmed by `grep -n "classification"
  services/control_plane/mrr/services/task_bundle/service.py` returning only
  one unrelated comment, not a parameter). `packages/domain/mrr/domain/
  hashing_policy.py`'s `compute_content_hash` (lines 80-85) excludes fields
  by NAME (`_HASH_EXCLUDED_FIELDS = frozenset({"content_hash", "signature"})`,
  line 55) — a field-agnostic, generic exclusion, not a fixed allowlist —
  so a `body` dict that never gains a `classification` key hashes IDENTICALLY
  before and after this change, for every object that does not set it. This
  is the concrete mechanism behind ADR-0010's own promise ("Absence is
  compatible with every existing stored object (no migration, no
  re-signing)") — this packet's acceptance_tests prove it directly rather
  than relying on the ADR's own prose alone.
objective: >-
  Land ADR-0010's staged-adoption step 1, and step 1 ONLY: add one optional
  `classification` property to `schemas/common.schema.json#/$defs/baseObject`
  and a mirroring `classification: BaseObjectClassification | None = None`
  field to `BaseObject` in `packages/contracts/mrr/contracts/common.py`,
  where `BaseObjectClassification` is a NEW, separate six-value Literal
  (`PUBLIC | INTERNAL | RESTRICTED | SENSITIVE | PARTICIPANT_IDENTIFIABLE |
  SYNTHETIC_TEST_FIXTURE`) — deliberately NOT a widening of the EXISTING
  five-value `mrr.contracts.common.Classification` (see derived_decisions
  (a) for why keeping them separate, rather than reusing/extending
  `Classification`, is this packet's own load-bearing design choice, not an
  oversight). The field lands additively: no existing example, fixture, or
  persisted object changes shape, content hash, or signature (derivation
  (8), acceptance_tests). No Alembic migration is added and no persistence
  table/column changes (derivation (7), derived_decisions (b)). No consumer
  reads the field for any enforcement decision (`TransferService`'s
  `_ensure_no_participant_identifiable_object`, `public_correction_view.py`'s
  attestation bridge, and `synthetic_fixture.py`'s pure gate function all
  stay byte-for-byte unmodified — forbidden_changes). No creating service
  gains a new `classification` constructor/creation-time parameter
  (derived_decisions (c)) — this packet makes the field POSSIBLE to carry on
  any first-class object's stored body, proves it round-trips honestly
  end-to-end (schema tier, Pydantic tier, persistence tier, hashing tier),
  and stops there. Steps 2 (E6-T05 projection reads the stored field), 3
  (TransferService gate hardening), and the MRR-MTH-012 gate's real wiring
  are explicitly, deliberately NOT this packet's job — each is a distinct,
  separately-derivable future task, per ADR-0010's own staged-adoption text
  and per K1-T02/K1-T03/E9-T00's own independent, converging confirmations
  of the same split (derivation).
