acceptance_criteria:
  - THE SHARP CASE - each of the five terminal statuses is produced from its OWN
    recorded provider response. A safety-filtered response (finishReason SAFETY or a
    promptFeedback blockReason) yields content_filtered, NOT error. A timeout yields
    timed_out, NOT error. A model's own in-content refusal yields refused. An HTTP or
    parse failure yields error. A normal response yields completed. Five distinct
    assertions, no generic error bucket.
  - THE KEY NEVER LEAKS - across ALL FIVE paths, not only the happy one, the API key
    appears in no assembled URL, no exception message, no returned field, and nothing
    written to stdout or stderr. Asserted by scanning the actual strings, not by
    inspecting the code.
  - The key is read from the environment only - the adapter exposes no parameter, no
    file path and no config entry for it, and a missing environment variable is a typed
    refusal raised BEFORE the transport is called at all (asserted with a transport
    double that fails the test if invoked).
  - isinstance(adapter, ModelAdapter) holds against the UNCHANGED runtime_checkable
    Protocol, and the port itself is not modified.
  - response_hash is present exactly for completed and absent for every other status,
    demonstrated per status.
  - The caller's redaction policy is applied unchanged - under raw_permitted the raw
    prompt and response text are carried; under hashes_only both are None while the
    hashes are still present. The adapter never chooses the policy itself.
  - Token usage is taken from the provider's own usage metadata; when the provider
    reports none, the recorded usage is explicit rather than silently zero-filled.
  - The default transport disables redirects and sets a timeout, proven by a test that
    hands it a redirect response and asserts it is not followed.
  - NO automated test performs real network I/O - every test drives an injected
    transport double.
  - No new dependency - pyproject.toml is untouched and only the standard library plus
    existing packages are imported.
  - make format-check, lint, typecheck, test, test-contract and security-check pass.
explicitly_not:
  - NO WIRING INTO ANY ORCHESTRATION. No run performs a model call as a result of this
    packet. Wiring is a separate packet and REQUIRES the network-policy honesty package
    first, because a run whose manifest records deny_all must not make a network call.
  - No change to the ModelAdapter port, to structured_generation.py, to ModelProfile or
    to any contract or schema.
  - No real model call from any automated test; the first real call is a separate,
    documented owner-run step.
  - No SDK, no new dependency, no migration, no change to pyproject.toml.
  - No fix for the scripts/ redirect gap - this adapter follows no redirects and does
    not inherit it; that gap remains a separate, dated, open defect.
  - No decision about raw-text retention inside the adapter - the policy comes from the
    caller, per call.
  - No secret written to any file, any log, or any recorded object.
