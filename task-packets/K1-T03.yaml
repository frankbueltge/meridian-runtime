      completely) — a reviewer may instead want a real, distinct
      `partially_supported` `ClaimStatus` value, which would require
      touching `claim.schema.json`/`claim.py` (forbidden here without
      explicit sign-off; see stop_conditions).
    - `contested` -> `Claim.status = "contested"`, verbatim, no mapping
      needed.
    - `unsupported` -> `Claim.status = "unsupported"`, verbatim, no mapping
      needed.
    - `insufficient_evidence` -> realized as the ABSENCE of a `Claim`
      entirely, not as any `Claim.status` value: when the corpus, after
