  - >-
    (g) PROTOCOL_NOT_LOCKED / PROTOCOL_LOCK_VIOLATION — K1-T03 IS THE FIRST
    REAL ENFORCEMENT SITE. K1-T02's own `derived_decisions`/`specification_
    gaps` explicitly punt MTH-007/008 enforcement ("TaskBundle-negotiation-
    time protocol-lock enforcement is out of ClaimService's own domain
    entirely... re-pinned as DOCUMENTATION ONLY"). This packet is the FIRST
    task that actually reads a `MethodProtocol` at all, so it is the
    natural, first real site for MTH-007's "Executor tasks for confirmatory
    branches MUST reference the lock hash and fail with PROTOCOL_NOT_LOCKED
    otherwise". `execute()`'s own first substantive step (after parsing its
    two input artifacts) resolves the referenced `MethodProtocol` (via the
    generic `ObjectRepository`, from the protocol-parameters sidecar's own
    `protocol_id`) and checks, in order: (1) `protocol.status == "locked"`
    (NOT `"amended"` — an amended protocol has returned to `"reviewed"` per
    `METHOD_PROTOCOL_LIFECYCLE`'s own re-review-cycle edges and must pass
    back through `locked` again before further confirmatory work; NOT
    `"executed"` either, reserved for a protocol a run has already fully
    consumed — flagged, specification_gaps, since spec 08 does not itself
    define what transitions a protocol TO `"executed"`, a K1-T04-or-later
    concern) — else raise a NEW `ProtocolNotLockedError`
    (`packages/domain/mrr/domain/exceptions.py`, `error_code =
    "PROTOCOL_NOT_LOCKED"`, mirroring K1-T02's own `error_code: ClassVar[str]`
    convention); (2) the protocol-parameters sidecar's own declared
    `protocol_lock_content_hash` equals the resolved protocol's ACTUAL
    `content_hash` (which, per `method_protocol.py`'s own docstring, IS the
    lock hash the moment `status` first became `"locked"` — "Lock hash IS
    baseObject.content_hash, not a new field") — else raise a NEW
    `ProtocolLockViolationError` (`error_code = "PROTOCOL_LOCK_VIOLATION"`)
    — a stale or tampered sidecar reference, caught BEFORE any further
    deterministic step runs. Both checks raise from PURE, in-memory
    comparison — `execute()` still performs no I/O of its own beyond the
    `inputs` mapping it was already handed (the `MethodProtocol` body itself
    arrives as a THIRD small input artifact, resolved by the caller exactly
    like the corpus/protocol-parameters artifacts — added to
    `TaskBundle.instructions` as `"method_protocol_artifact_id"`).
  - >-
    (h) KILL CONDITIONS -> stop_insufficient_evidence — A SUCCESSFUL
    TERMINAL RESULT, NEVER A FAILURE. `execute()` NEVER returns a
    non-`completed` `TerminalOutcome` because of insufficient evidence —
    `insufficient_evidence`/`stop_insufficient_evidence` are DOMAIN outcomes
    carried INSIDE a `completed` `ExecutionResult`'s own JSON `output`
    (MRR-MTH-011: "successful terminal results... MUST NOT be silently
    omitted", read together with MRR-FR-043's `TerminalOutcome` vocabulary,
    which has no "insufficient evidence" value of its own — conflating the
    two would misrepresent an honest, complete finding as an execution
    failure). Concretely: after inclusion filtering, if the number of rows
    reaching `verification_status == "verified"` for a given
    `applies_to_analysis` is STRICTLY below the protocol-parameters
    sidecar's own `kill_conditions.stop_insufficient_evidence.
    min_included_sources` threshold, `execute()`'s JSON output records
    `"decision": {"decision_type": "stop_insufficient_evidence",
    "applies_to_analysis": "...", "rationale": "<n> included source(s),
    below the declared minimum of <min_included_sources>", "claim_candidates":
    []}` — no claim candidate, no `MethodRuling`, for that analysis.
    `run_synthesis_evidence_loop` then persists ONLY a `ResearchDecision`
    (`ResearchDecisionService.create`, `decision_type=
    "stop_insufficient_evidence"`) plus the (possibly zero-row, `frozen`)
    `EvidenceMatrix` — no `Claim`, no `MethodRuling`, no `decided_by`
    kill-condition transition on any claim (there is no claim to kill; K1-T02's
    `ClaimService.apply_kill_condition` is for withdrawing an EXISTING claim
    via a `kill_branch` decision, a DIFFERENT scenario from "no claim was
    ever eligible to be proposed" — flagged, specification_gaps, as the
    precise boundary between the two: `apply_kill_condition` handles a
    branch killed AFTER a claim exists; this packet's own
    `stop_insufficient_evidence` path handles a branch that never produced
    one). The Run Manifest/Evidence Crate seal EXACTLY as for any other
    `completed` outcome (MTH-020 unchanged chain) — `run_state ==
    "completed"` throughout, honestly recording that the RUN succeeded even
    though its FINDING is "not enough evidence", per MTH-011's own text read
    literally.
  - >-
    (i) SEALED CRATE CONTENTS. `EvidenceCrateSealer.seal()` itself is called
    UNCHANGED (forbidden_changes) by `run_synthesis_evidence_loop`, exactly
    as `run_local_evidence_loop` already calls it, but with THREE of its
    caller-supplied lists populated for the first time with real content
    (`evidence_crate.py` lines 62-73, confirmed by direct reading: `source_
    records: list[Urn]`, `evidence_anchors: list[Urn]`,
    `proposed_claims: list[Urn]` — E2-T06's own docstring already
    anticipated this: "Empty is not a stub for the deterministic reference
    run... it faithfully records that no claims/anchors exist YET for THIS
    RUN", i.e. a DIFFERENT run's crate is expected to populate them, and
    this is that run): `source_records` <- every `SourceRecord.id` this
    run's corpus ingestion persisted; `evidence_anchors` <- every
    `EvidenceAnchor.id` created per matrix row (via the EXISTING, UNCHANGED
    `EvidenceAnchorService.create`, `evidence/service.py` lines 240-289);
    `proposed_claims` <- every `Claim.id` this run proposed (regardless of
    its final status — a `contested`/`unsupported` claim is still a
    PROPOSED claim). `artifacts` carries the crate's own `ArtifactRef` list
    exactly like the reference loop (the corpus/protocol-parameters/
    protocol-body input artifacts plus, per E2-T06's own convention, the
    executor's own raw JSON `output` stored and referenced). `failures`/
    `known_unknowns` stay empty for a `completed` outcome including a
    `stop_insufficient_evidence` decision (that decision is a FINDING, not a
    failure — MTH-011, derived_decisions (h)). The `EvidenceMatrix`/
    `MethodRuling`(s)/`ResearchDecision`'s own ids are NOT separate
    `EvidenceCrate` fields (the schema has none for them) — they are
    discoverable via the typed edge graph instead: the crate's own
    `governed_by_protocol` edge names the locked `MethodProtocol`; from
    there, `EvidenceMatrix.protocol_id`/`MethodRuling.protocol_id`/
    `ResearchDecision.protocol_id` (all already-existing K1-T01 fields) let
    a third party resolve every object this run produced by following
    typed edges from the one sealed crate, per K1's own stated exit
    criterion ("a third party can follow one sealed crate from question to
    claim landscape entirely through recorded objects").
  - >-
    (j) NEW SERVICES MIRROR `SourceFamilyService` EXACTLY. Each of
    `EvidenceMatrixService`/`MethodRulingService`/`ResearchDecisionService`
    (b) has its OWN local `RecordRevisionWithEvent` type alias and its OWN
    `bind_unit_of_work` (NOT a shared import across the three — the same
    "local copy... across separate service modules" precedent
    `source_family/service.py`'s own docstring already states verbatim for
    this exact pattern), and persists via the SAME
    `mrr.persistence.unit_of_work.record_object_revision_with_event`
    primitive every other object-owning service in this codebase already
    uses. No new SQLAlchemy table, no new migration (forbidden_changes) —
    all three kinds are ordinary rows in the generic `objects` table.
  - >-
    (k) THE ONE-LINE `build_dispatch_table` DEDUP FIX (PR #45 review).
    `dispatch.py`'s first pass (`build_dispatch_table`, lines 161-166)
    currently reads
    `for profile in accepted_profiles: for capability_name in
    profile.executor_task_family: factory = executor_factories.get
    (capability_name); if factory is not None: table[capability_name] =
    factory()` — invoking `factory()` once per (profile, capability_name)
    PAIR, not once per DISTINCT capability name. This packet changes this to
    collect the SET of distinct capability names across ALL
    `accepted_profiles` entries first (a plain `set[str]` comprehension over
    the existing nested iteration, still filtered through
    `executor_factories` exactly as before), then call `factory()` at most
    ONCE per distinct name — preserving every existing observable behavior
    (`build_dispatch_table`'s own docstring/invariants, K0-T02's acceptance
    tests) for the case that made it unreachable before (a single profile,
    or multiple profiles with disjoint capability names) while fixing the
    now-reachable case this packet's own `systematic_evidence_synthesis`
    profile could otherwise trigger (e.g. if a profile is re-derived to a
    new semver revision that supersedes the old accepted id — per
    `method_profile.py`'s own "a later semver revision... mints a NEW id"
    design — and BOTH the old and new accepted-looking revisions are
    momentarily passed to `build_dispatch_table` by a caller that has not
    yet filtered strictly to "currently accepted", both would declare the
    identical capability name `"mrr.method.systematic_evidence_synthesis/1"`).
    This is the ONLY change this packet makes to `dispatch.py` — no other
    line, and no change to `dispatch()` itself (already exactly-two-outcomes,
    unaffected).
  - >-
    (l) SELF-VERIFICATION FOR `to_supported`, RESOLVED VIA THE LOOP'S
    ALREADY-EXISTING ORIGIN/NODE SPLIT. `run_synthesis_evidence_loop` reuses
    the SAME two distinct identities `run_local_evidence_loop` already
    threads through the loop: an ORIGIN identity (`resolved_actor` —
    the practice that proposed the Research Score/Task Bundle,
    `Claim.proposer_id`) and a NODE identity (`resolved_node_id` — the
    executing node, `run_executor_id` at `VerificationService.record` time).
    For each candidate reaching `"supported"`, `run_synthesis_evidence_loop`
    constructs ONE `VerificationResult` (`verification_type="source"`,
    `evidence_inspected` <- the candidate's own included `EvidenceAnchor`
    ids, `recommendation="pass"`, `reviewer_id = resolved_node_id`,
    `independence_profile` naming the executor's own deterministic identity
    — e.g. `model_family="none"`, `prompt_family="none"`,
    `code_path="mrr.method.systematic_evidence_synthesis/1"` — and records
    it via the EXISTING, UNCHANGED `VerificationService.record`, whose
    self-verification gate (`reviewer_id == claim.proposer_id` /
    `== run_executor_id`) passes structurally because `resolved_node_id !=
    resolved_actor` by construction in this loop, exactly as it already does
    for every OTHER object this loop signs with two distinct keys. HONESTLY
    FLAGGED, NOT SILENTLY DECIDED (specification_gaps): is a machine-authored
    `VerificationResult`, produced by the SAME deterministic run as the claim
    it verifies (merely under the NODE's identity rather than the ORIGIN's),
    a legitimate satisfaction of MRR-FR-070's self-verification prohibition
    for a claim reaching `"supported"` — or does `supported_within_scope`
    categorically require a LATER, human-attributed review before ANY claim
    may reach it? This packet adopts the FORMER reading, since it is the
    ONLY one that keeps "the deterministic path is provable ALONE" (the
    plan's own words) achievable end to end without a human in the loop —
    flagged prominently for reviewer confirmation before this path is relied
    upon for a real run (K1-T04).
  - >-
    (m) MODEL-ASSISTED EXTRACTION IS PACKET-ISOLATED AND NEVER REQUIRED.
    `execute()` accepts an OPTIONAL, injected extraction callable of the
    shape `Callable[[CorpusEntry, list[str]], ExtractionOutcome] | None`
    (mirroring `ReferenceTaskExecutor`'s own injectable `transform`/
    `policy_gate`/`is_cancelled` pattern exactly) — when `None` (v1's own
    default, and the ONLY configuration this packet's own acceptance tests
    exercise for the full end-to-end loop), every row's `extraction` dict is
    populated ENTIRELY from whatever the corpus snapshot artifact already
    supplied (human-curated, per spec 08 section 5's `MethodProtocol.
    extraction_fields`-shaped keys) — genuinely model-free, exactly like
    `default_reference_transform` requires no model. When a caller injects
    the model-assisted callable (a SEPARATE, dedicated set of unit tests,
    NOT part of the model-free acceptance path), it wraps
    `generate_structured` (E4-T02, unchanged) per corpus row and downgrades
    to the row's own human-supplied fields (marked via the reserved
    `extraction["_verification_disposition"] = "downgraded-to-proposal"`
    key, derived_decisions (c)) on any non-`"proposal"` `StructuredGeneration
    Result.status`. Because this callable is INJECTED, not hard-wired,
    `execute()`'s own control flow, timeout bound, and idempotency memo are
    completely unaffected by whether it is ever supplied — a call that
    never receives one can never depend on model availability, satisfying
    the plan's own "its failure cannot sink the epic" framing verbatim.
  - >-
    NATURAL SPLIT, FLAGGED PROMINENTLY BUT NOT TAKEN. This task genuinely
    has three separable slices: (I) the deterministic executor core plus
    its three new persistence services plus the new orchestration
    composition (parts (a)-(b)-(c) above, plus (d)-(l)) — REQUIRED for v1's
    own "runs model-free" acceptance; (II) the model-assisted extraction
    callable (m) — separately testable, never required; (III) the one-line
    dispatch dedup fix (k) — a small, independent, unrelated correction that
    could equally well have been its own micro-task. The plan doc itself
    (docs/design/2026-07-21-research-method-kernel-plan.md line 56-59)
    explicitly requires the model-assisted slice to be "packet-isolated
    (K1-T03)... with a required model-free path" — i.e., isolated WITHIN
    this one task, not split OUT into a separate task-packet — so slice (II)
    stays here by the plan's own explicit design, delivered as a genuinely
    optional, independently-testable code path rather than a hard
    dependency. Slice (III) is small enough (one collection change in one
    existing function) that spinning it into its own packet would be
    disproportionate paperwork for a one-line, already-reviewed fix; it
    rides along with this packet since this is the first task that makes it
    reachable. If a reviewer judges parts (a)-(l) still too large for one
    PR/review cycle despite this, the cleanest further split would be:
    K1-T03a (executor core + EvidenceMatrixService/MethodRulingService/
    ResearchDecisionService + orchestration + source_independence.py + the
    dispatch fix, i.e. everything the model-free path needs) and K1-T03b
    (the injected model-assisted extraction callable alone, part (m)) — but
    this packet is written as ONE, per instruction, with that split named
    here for the record.
invariants:
