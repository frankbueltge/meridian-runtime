  transform, `source_independence.py`, the corpus/protocol-parameters
  artifact handling, the PROTOCOL_NOT_LOCKED/PROTOCOL_LOCK_VIOLATION checks)
  has NO dependency on K1-T02 at all and can be implemented, unit-tested, and
  reviewed independently and in parallel — only the FULL orchestration
  (`run_synthesis_evidence_loop`'s calls into `ClaimService.attach_ruling`
