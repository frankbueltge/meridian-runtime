      on the attached `MethodRuling.scope_of_validity`/
      `non_applicability_conditions` (MTH-017, already a K1-T01 field) —
      "supported" plus a `ruled_by` edge to a ruling with an explicit scope
      IS "supported within scope", read this way deliberately so no new
      `Claim` field is needed.
    - `partially_supported` -> `Claim.status = "contested"` (the EXISTING
      value), used for a candidate whose evidence rows include BOTH
      supporting and contradicting/qualifying findings above the
