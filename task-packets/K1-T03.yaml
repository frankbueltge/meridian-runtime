    one of the six K1-T01 contracts), this packet defines a SEPARATE,
    versioned, content-hash-pinned sidecar artifact —
    `{"protocol_id": "...", "protocol_lock_content_hash": "sha256:...",
    "applies_to_analysis": "...", "inclusion_filter": {<field>: <predicate>,
    ...}, "eligibility_rules": {"<claim outcome>":
    {"min_independent_source_families": <int>}, ...}, "kill_conditions":
