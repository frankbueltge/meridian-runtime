task_id: K1-T03
title: >-
  systematic_evidence_synthesis v1 executor task family — deterministic
  snapshot ingestion, machine-checkable inclusion filtering, matrix assembly,
  source-family independence counting, eligibility/ceiling rules,
  deterministic MethodRuling issuance, ResearchDecision (incl.
  stop_insufficient_evidence), crate sealing through the unchanged E2/E5
  machinery. Model-assisted extraction (MTH-016) is a separately-testable,
  NOT-required add-on; v1 MUST complete the full loop model-free.
status: approved
depends_on: [K1-T01, K1-T02]
reviewer_resolution: >-
  Approved 2026-07-21 with two overriding resolutions, both anchored in a
  same-day spec-08 section-5 amendment (finding statuses vs. claim
  statuses): (1) The packet's proposed partially_supported -> contested
  mapping is REJECTED — partial support and conflicting evidence are
  different epistemic situations. A supported_within_scope or
  partially_supported finding yields a claim NARROWED to what the
  evidence actually supports (mandatory MTH-017 scope plus
  non-applicability naming the unsupported portion); contested stays
  reserved for genuinely conflicting evidence; insufficient_evidence
  yields no claim plus ResearchDecision(stop_insufficient_evidence),
  as the packet already decided. (2) The self-verification question is
  resolved conservatively: the synthesis run mints claim candidates in
  proposed status only and MUST NOT author its own supporting
  VerificationResults — claims advance through the unchanged
  claim/verification lifecycle afterwards (AGENTS rule 8). The packet's
  crate shape (proposed_claims) already matches this. Where the packet
  body says otherwise, this resolution and the amended spec 08 section 5
  take precedence. The protocol-parameters sidecar is accepted as a
  packet-defined shape, to be schematized when experience stabilizes it.
derivation: >-
  Derived per docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from
  docs/design/2026-07-21-research-method-kernel-plan.md's K1 epic ("K1-T03 —
  Synthesis executor task family", lines 50-59) and
  docs/spec/08_RESEARCH_METHOD_KERNEL.md section 5 ("Profile:
  systematic_evidence_synthesis v1", lines 142-178, the I/O contract at
  lines 150-160) and section 4's MRR-MTH-007/010/011/013/015/016/020 (lines
  98-112, 117-119, 126-131, 139-140). Third task of the K1 sub-epic; the two
  preceding tasks are K1-T01 (governance contracts, MERGED — commit `2ec8b25`,
  PR #47, with a governance follow-up `79dc70d`) and K1-T02 (edges, ceilings,
  gates — APPROVED but UNIMPLEMENTED at this derivation's time: commit
  `cd389b4` "Governance: ADR-0010 ACCEPTED + K1-T02 approved" records the
  approval; `git log main..task/K1-T02-edges-ceilings-gates` is EMPTY
  (confirmed by direct inspection) — the branch exists but has not diverged
  from `main` at all, and `gh pr list --search "K1-T02"` returns no open PR.
  Every K1-T02 capability this packet consumes (`EDGE_VOCABULARY`'s four new
  members, `ClaimService.attach_ruling`/`apply_kill_condition`,
  `mrr.domain.claim_ceiling`, the three new exception classes) is therefore
  PROSPECTIVE, not yet present on `main`, as of this derivation — see the
  dedicated coordination_note below for exactly how this packet's own
  allowed_paths/sequencing account for that.

  ADR-0010 (docs/spec/adr/ADR-0010-OBJECT-LEVEL-DATA-CLASSIFICATION.md line 3:
  "Status: ACCEPTED (2026-07-21)") was accepted in the SAME commit `cd389b4`
  that approved K1-T02, but K1-T02's own governance note (commit message,
  confirmed by `git show cd389b4`) states the classification field's actual
  introduction is staged into "ein eigenes Task-Packet" (its own, separate,
  not-yet-derived task packet) — NOT K1-T02 itself and NOT this packet. This
  packet therefore inherits K1-T02's ADR-0010 split UNCHANGED: no real
  `baseObject.classification` field exists anywhere yet, so MRR-MTH-012
  (`SYNTHETIC_FIXTURE_NOT_EVIDENCE`) wiring against any object this packet
  touches is out of scope here too, exactly as it was for K1-T02 — this
  packet's own corpus `SourceRecord`s carry no real/wired synthetic-fixture
  marker, and none is invented locally (see forbidden_changes).

  The six K1-T01 contracts were read in full, on `main`
  (`packages/contracts/mrr/contracts/{question_model,concept_charter,
  method_protocol,evidence_matrix,method_ruling,research_decision}.py`) and
  cross-checked against their lifecycle state machines
  (`packages/domain/mrr/domain/lifecycles.py` lines 632-829:
  `QUESTION_MODEL_LIFECYCLE`/`CONCEPT_CHARTER_LIFECYCLE` both `draft ->
  accepted -> superseded`; `METHOD_PROTOCOL_LIFECYCLE` five edges `draft ->
  reviewed -> locked -> amended | executed`, `amended -> reviewed`;
  `EVIDENCE_MATRIX_LIFECYCLE` `draft -> active -> frozen -> superseded`;
  `METHOD_RULING_LIFECYCLE` `pending -> issued -> superseded`;
  `RESEARCH_DECISION_LIFECYCLE` one state `issued`, zero transitions) and
  against the already-ACCEPTED K0-T01 `MethodProfile` worked example,
  `examples/method-profile.example.json` (confirmed present on `main`,
  `profile_key: "systematic_evidence_synthesis"`,
  `executor_task_family: ["mrr.method.systematic_evidence_synthesis/1"]`,
  and the exact seven `executor_steps` this packet's MTH-016 declaration
  reuses verbatim — see derived_decisions (c)). This packet reuses that
  EXACT capability name and step list rather than inventing new ones — the
  example is already-accepted content this packet must remain consistent
  with, not free to redesign.

  `packages/contracts/mrr/contracts/claim.py` (lines 24-35: `ClaimStatus =
  Literal["draft","under_review","supported","contested","contradicted",
  "unsupported","unresolved","review_required","withdrawn","superseded",
  "legacy_unverified"]`) was read in full and compared against spec 08
  section 5's own prose ("Claim statuses produced:
  supported_within_scope, partially_supported, contested, unsupported,
  insufficient_evidence", line 168-169): only TWO of the five spec-08 names
  (`contested`, `unsupported`) appear verbatim in the actual, existing,
  UNCHANGED `ClaimStatus` enum; `supported_within_scope`,
  `partially_supported`, and `insufficient_evidence` do not exist as
  `Claim.status` values anywhere in this repository, and `claim.schema.json`/
  `claim.py` are outside this packet's forbidden_changes (a foundational
  E1-T03/E3-T02 contract, not one of the six K1-T01 kinds, but still not
  this packet's to redesign without explicit reviewer sign-off) — this
  mismatch is a genuine, load-bearing specification gap, resolved by a
  disclosed mapping in derived_decisions (d), not silently assumed away.

  `packages/domain/mrr/domain/independence.py` (E3-T05, the "existing
  validator" spec 08 section 5 names for the "independence validation"
  deterministic step) was read in full: its two public functions,
  `is_independent_of_producer`/`distinct_independent_reviews`, operate
  EXCLUSIVELY over `mrr.contracts.verification_result.IndependenceProfile`
  (six reviewer-identity dimensions: principal, model_family, prompt_family,
  retrieval_path, code_path, data_access_path) — a REVIEWER/verification
  independence concept (E3-T04/T05, "who verified a claim and how
  independently of its producer"), structurally unable to accept an
  `EvidenceMatrixRow`/`SourceFamily` value (no shared shape). Cross-checked
  against `packages/contracts/mrr/contracts/source_family.py`'s own docstring
  claim ("The independence CALCULATION that actually consumes a
  SourceFamily ... is E3-T05") and `services/control_plane/mrr/services/
  source_family/service.py`'s identical claim (line 40: "The independence
  CALCULATION that consumes a SourceFamily is E3-T05") — BOTH assertions are
  now confirmed, by direct reading of the actual E3-T05 module, to be
  imprecise: E3-T05 never imports, references, or computes over
  `SourceFamily` anywhere; it is scoped, by its own governing packet
  (task-packets/E3-T05.yaml, read in full), to reviewer/verification
  independence only. Spec 08 section 5's "independence validation (existing
  validator)" therefore cannot mean literal reuse of E3-T05's two functions
  for "minimum independent source families per status" — see derived
  decisions (e) for the new, small, analogous module this packet adds
  instead, and specification_gaps for the two-sentence correction this
  packet flags against `SourceFamily`'s/`SourceFamilyService`'s own existing
  docstrings.

  `packages/contracts/mrr/contracts/claim.py`'s `_supported_requires_evidence_
  and_verification` validator (line 94: "if status == 'supported':
  evidence_relations and verification_ids both non-empty") and
  `services/control_plane/mrr/services/verification/service.py`'s
  self-verification gate (lines 264-275: `verification.reviewer_id ==
  claim.proposer_id` or `== run_executor_id` both raise
  `SelfVerificationError`) were read in full: moving a claim to `"supported"`
  (this packet's realization of `supported_within_scope`, derived_decisions
  (d)) structurally requires at least one real `VerificationResult`, whose
  `reviewer_id` differs from the claim's `proposer_id` and from the run's
  `executor_id`. Resolved in derived_decisions (l) using this loop's own
  ALREADY-EXISTING origin/node identity split (`run_local_evidence_loop`'s
  `resolved_actor` vs. `resolved_node_id`, `services/control_plane/mrr/
  services/cli/orchestration.py` lines 564-577) rather than inventing a new
  identity concept or requiring a human in the loop for v1 to complete.

  `services/node_runtime/mrr/services/node_runtime/executor.py` (E2-T04,
  `Executor` Protocol + `ReferenceTaskExecutor`, read in full) and
  `services/node_runtime/mrr/services/node_runtime/dispatch.py` (K0-T02,
  MERGED PR #45, read in full) are this packet's direct structural
  templates for the new `Executor` implementation and its dispatch-table
  registration. `services/control_plane/mrr/services/cli/orchestration.py`'s
  `run_local_evidence_loop` (E2-T07, read in full, all 830 lines) is the
  template for the new composition function threading Research Score ->
  capability registration -> Task Bundle -> execute -> Run Manifest ->
  Evidence Crate — MTH-020 requires this SAME chain, unmodified, for the
  synthesis run too.

  PR #45's own review comment (`gh pr view 45 --json comments`, comment
  `IC_kwDOTcACkc8AAAABK8c7dA`, confirmed verbatim) reads: "Follow-up for
  K1-T03 (non-blocking, latent): de-duplicate declared capability names in
  build_dispatch_table before invoking factories — with two accepted
  profiles sharing a capability name, a factory is currently invoked once
  per profile with one instance silently discarded; unreachable until a
  second real profile exists." `build_dispatch_table`
  (`dispatch.py` lines 121-170) confirmed: its first pass iterates
  `for profile in accepted_profiles: for capability_name in
  profile.executor_task_family: ... table[capability_name] = factory()` with
  NO deduplication of `capability_name` across profiles/entries before
  calling `factory()` — if two currently-accepted `MethodProfile` revisions
  (e.g. a profile mid-supersession, or two distinct profiles that happen to
  declare the same capability name) both name
  `"mrr.method.systematic_evidence_synthesis/1"`, `factory()` is invoked
  twice and one constructed `Executor` instance is silently discarded. This
  packet is the "second real capability" the review flagged as the trigger
  condition (`reference.deterministic-transform` was the first,
  grandfathered, ungoverned entry; `mrr.method.systematic_evidence_synthesis/1`
  is the first capability actually DECLARED BY an accepted `MethodProfile`)
  — see derived_decisions (k) for the one-line fix this packet includes.

  Corpus scope, per the plan doc (docs/design/2026-07-21-research-method-
  kernel-plan.md lines 50-59 and the K1-T03/K1-T04 boundary at lines 60-69):
  this packet's OWN test fixtures are SMALL, synthetic/sample corpus
  excerpts sized to exercise every deterministic branch (zero eligible
  sources, exactly-at-threshold, above-threshold, mixed
  supporting/contradicting evidence, an unverifiable row) — NOT the two real
  atlases (87/214 sources). Loading and running against the real atlases is
  explicitly task-packets/K1-T04.yaml's job ("First real run"); this
  packet's acceptance does not depend on the real atlas files existing or
  being reachable.
objective: >-
  Deliver the `systematic_evidence_synthesis` v1 executor task family end to
  end, in FIVE parts, precisely scoped:

  (a) `SystematicEvidenceSynthesisExecutor`
  (`services/node_runtime/mrr/services/node_runtime/synthesis_executor.py`,
  new, sibling to `executor.py`/`dispatch.py`) — an `Executor` Protocol
  implementation satisfying the IDENTICAL contract `ReferenceTaskExecutor`
  does (explicit `ExecutionResult` for every terminal outcome, MRR-FR-035
  per-`(task_id, revision, execution_attempt)` idempotency via an in-memory
  memo, a wall-clock `timeout_seconds` bound, an injectable `policy_gate`/
  `is_cancelled`, `is_deterministic=True` unconditionally). Its `execute()`
  body is a PURE, DB-free, in-process transform (no SQLAlchemy import, no
  network) over already-resolved `inputs: Mapping[str, bytes]` — see
  derived_decisions (a) for why this is a hard boundary, not a convenience:
  it performs the six deterministic steps (snapshot loading + hash
  verification is a NO-OP here beyond parsing, since `ArtifactStore.get()`'s
  own content-addressing already guarantees byte-identity to the declared
  hash — ArtifactStore never returns bytes that don't hash to the requested
  key; inclusion/exclusion filtering against a pinned, machine-parseable
  filter spec; matrix-row assembly; source-family independence counting via
  a NEW pure domain function, not E3-T05's; eligibility/ceiling
  determination; and packaging its own result into one canonical,
  deterministic JSON blob) and returns that blob as `ExecutionResult.output`.
  It does NOT itself construct or persist any `EvidenceMatrix`/
  `MethodRuling`/`Claim`/`ResearchDecision`/`EvidenceCrate` object, exactly
  mirroring `ReferenceTaskExecutor`'s own "does not persist a RunManifest,
  does not seal a crate" scope note (`executor.py` lines 9-21).

  (b) Three new, minimal, additive-only persistence services — mirroring
  `services/control_plane/mrr/services/source_family/service.py`'s EXACT
  shape (one `bind_unit_of_work`, one `RecordRevisionWithEvent`-typed local
  callable, one service class) — for the three K1-T01 object kinds THIS RUN
  PRODUCES: `EvidenceMatrixService`
  (`services/control_plane/mrr/services/evidence_matrix/service.py`:
  `create` [draft, revision 1] + `activate` [draft -> active] + `freeze`
  [active -> frozen], driving `EVIDENCE_MATRIX_LIFECYCLE`);
  `MethodRulingService`
  (`services/control_plane/mrr/services/method_ruling/service.py`: `create`
  [pending, revision 1] + `issue` [pending -> issued], driving
  `METHOD_RULING_LIFECYCLE`); `ResearchDecisionService`
  (`services/control_plane/mrr/services/research_decision/service.py`:
  `create` only [issued, revision 1, append-only — mirrors
  `SourceFamilyService`'s own single-method shape exactly, since
  `RESEARCH_DECISION_LIFECYCLE` has zero legal transitions]). `QuestionModel`/
  `ConceptCharter`/`MethodProtocol` get NO new service here — this packet
  only READS already-accepted/locked instances via the generic
  `ObjectRepository`, exactly like K1-T02's own tests already do for THEIR
  prerequisite objects; driving those three kinds through their OWN
  draft/lock/amend lifecycles is out of this packet's scope (see
  specification_gaps and the K1-T03/K1-T04 boundary in derivation).

  (c) A new orchestration composition function,
  `run_synthesis_evidence_loop`
  (`services/control_plane/mrr/services/cli/synthesis_orchestration.py`,
  new file — NOT a modification of `orchestration.py`, to keep this
  packet's diff isolated from any other in-flight work touching that file;
  see derived_decisions (a)), mirroring `run_local_evidence_loop`'s EXACT
  choreography (Research Score -> capability registration -> Task Bundle ->
  `dispatch()` -> `execute()` -> `RunManifestRecorder.record` (UNCHANGED) ->
  `EvidenceCrateSealer.seal` (UNCHANGED)) but inserting, between `execute()`
  returning and `RunManifestRecorder.record`, the deserialization of the
  executor's JSON output into real, persisted `EvidenceMatrix`/
  `MethodRuling`/`Claim`(s)/`ResearchDecision` objects plus the
  `governed_by_protocol`/`ruled_by`/`decided_by` typed edges spec 08 section
  3 names — see derived_decisions (i) for the exact sequencing and crate
  contents.

  (d) A new pure domain module,
  `packages/domain/mrr/domain/source_independence.py` — NOT a modification
  of `packages/domain/mrr/domain/independence.py` (E3-T05, forbidden_changes)
  — implementing "minimum independent source families" counting over
  `EvidenceMatrixRow`-shaped data (dedup key: `source_family_id` when
  present, else a singleton key derived from `source_record_id`), mirroring
  E3-T05's OWN "dedup-key-then-count" pattern and its "additive,
  non-destructive, pure, deterministic" invariants, but over a genuinely
  different data shape E3-T05 cannot accept — see derived_decisions (e).

  (e) The one-line `build_dispatch_table` dedup fix PR #45's review flagged
  (derived_decisions (k)), delivered here since this packet introduces the
  second real, profile-declared capability that makes the latent bug
  reachable for the first time.

  Deliberately and explicitly deferred, with reasons given rather than left
  silent: real model-assisted extraction (MTH-016's `model_assisted` step,
  "extraction_and_classification_proposal") is IMPLEMENTED as a genuinely
  separate, independently-testable code path (see derived_decisions (m)) but
  is NEVER required for `execute()` to reach a terminal outcome — v1's own
  acceptance tests exercise the FULL loop (ingestion through sealed crate)
  with `MethodProtocol.extraction_fields` left semantically unused (rows'
  `extraction: dict[str, str]` populated only from HUMAN-SUPPLIED corpus
  fixture data, never from a model call) — mirroring exactly how E2E-001
  runs with no LLM dependency anywhere (docs/spec/06 E2 exit criteria, cited
  by `orchestration.py`'s own module docstring).
