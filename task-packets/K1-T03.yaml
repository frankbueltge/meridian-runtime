    execution_attempt)` exactly like `ReferenceTaskExecutor` (MRR-FR-035): a
    second call with the same triple returns the memoized `ExecutionResult`
    without recomputing the deterministic pipeline or re-invoking any
    injected extraction callable
  - >-
    every `ExecutionResult` this executor returns has `is_deterministic ==
    True`, INCLUDING when its own JSON output records a
    `stop_insufficient_evidence` decision — a "not enough evidence" finding
