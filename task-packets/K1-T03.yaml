specification_gaps:
  - >-
    The five spec-08 claim-status names do not all exist as `ClaimStatus`
    values (derived_decisions (d)); this packet's mapping
    (`supported_within_scope -> supported`, `partially_supported ->
    contested`, `insufficient_evidence -> no Claim at all`) is a disclosed,
    narrowest-defensible reading, not literal spec text. `partially_supported
    -> contested` in particular conflates two genuinely different concepts
    this codebase's OWN existing vocabulary distinguishes elsewhere (a claim
    that IS supported but incompletely, vs. a claim under genuine dispute) —
    flagged as this packet's single most consequential open judgment call,
    alongside K1-T02's own analogous `withdrawn`-for-kill-condition
    conflation.
  - >-
    `SourceFamily`'s and `SourceFamilyService`'s own existing docstrings
    both assert "the independence calculation is E3-T05" — confirmed
    imprecise by this packet's own direct reading of E3-T05 (scoped to
    reviewer/verification independence, not source-family independence).
    This packet does not correct those docstrings (outside its own
    `allowed_paths`) — flagged here so a future housekeeping task can.
  - >-
    The protocol-parameters sidecar (derived_decisions (b)) is a NEW,
    packet-invented artifact shape with no schema of its own anywhere in
    this repository (not one of the seven JSON Schemas under `schemas/`) —
    it is validated only by this packet's own Pydantic model inside
    `synthesis_executor.py`, not by `scripts/check_contracts.py` or any
    contract-fixture test. A reviewer may prefer promoting it to a real,
    versioned schema; this packet does not, to avoid schema-proliferation
    for a single first consumer with no second use case yet to generalize
    against.
  - >-
    Nothing machine-checks that the protocol-parameters sidecar's
    `inclusion_filter`/`eligibility_rules`/`kill_conditions` correspond to
    the free-text prose a human reviewer read in `MethodProtocol.
    inclusion_criteria`/`kill_conditions` etc. before locking it — that
    correspondence is asserted to be the reviewer's own responsibility at
    lock time, not verified by any code this packet adds.
  - >-
    MTH-016's "verification disposition" for a model-assisted step has no
    dedicated contract field (`ModelInvocation` carries none;
    `VerificationResult.target_kind` cannot even target a
    `ModelInvocation`); this packet records it at a reserved
    `extraction["_verification_disposition"]` key instead — a disclosed
    workaround, not a clean fit, flagged for reviewer scrutiny before the
    model-assisted slice (m) is genuinely relied upon.
  - >-
    Whether a machine-authored, node-identity `VerificationResult` (derived_
    decisions (l)) is a legitimate, non-self verification for a claim
    reaching `"supported"`, or whether that status categorically requires a
    later, human-attributed review, is NOT settled by MRR-FR-070's text
    either way — this packet adopts the reading that keeps the model-free
    path completable end to end, flagged prominently for reviewer
    confirmation before K1-T04 relies on it for the real atlases.
  - >-
    `"crate_sealing"` as a named step in the ALREADY-ACCEPTED K0-T01
    `MethodProfile` example (`examples/method-profile.example.json`) reads,
    taken literally, as if the EXECUTOR itself seals the crate — this
    packet reads it instead as "package output into the sealer's expected
    input shape", since the executor calling `EvidenceCrateSealer` directly
    would violate this packet's own framework-free boundary (derived_
    decisions (a)) and MTH-020's unchanged-machinery requirement. Flagged
    for reviewer confirmation that this reading, not a literal one, is
    correct; the already-accepted example is not redesigned either way by
    this packet.
  - >-
    This packet does not build `QuestionModelService`/`ConceptCharterService`/
    a WRITE-side `MethodProtocolService` (create/submit/lock/amend) — it
    only reads already-accepted/locked instances via the generic
    `ObjectRepository`. If task-packets/K1-T04.yaml (the first real run,
    which must actually CREATE and LOCK a real `MethodProtocol` for the
    model-collapse question) discovers it needs one of these services, that
    is K1-T04's own scope to add, not retroactively this packet's.
  - >-
    This packet writes `governed_by_protocol`/`ruled_by`/`decided_by` edges
    but never `operationalizes` (`ConceptCharter` entry -> `QuestionModel`
    term) — that edge is written when a `ConceptCharter` is actually
    authored against a `QuestionModel` (K1-T04's concern, since this packet
    only reads already-accepted instances of both), not by this executor
    task family.
  - >-
    `"pending"`-verification-status rows count toward neither the
    `"verified"` nor the excluded-from-independence bucket in a clearly
    stated way beyond "not yet counted" (derived_decisions (e)) — a
    reviewer may prefer an explicit rule for a matrix frozen while rows
    remain `"pending"` (arguably itself a form of insufficient evidence);
    this packet does not resolve when the whole matrix must reach a
    terminal per-row verification status before freezing, if ever.
