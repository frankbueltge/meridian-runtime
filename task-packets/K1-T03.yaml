derived_decisions:
  - >-
    (a) EXECUTOR PLACEMENT AND THE "execute() STAYS PURE" BOUNDARY.
    `SystematicEvidenceSynthesisExecutor` lives in
    `services/node_runtime/mrr/services/node_runtime/synthesis_executor.py`
    — a new sibling module to `executor.py`/`dispatch.py`, NOT a new
    top-level package — because (i) it must satisfy the exact same
    `Executor` Protocol declared in that module, which every other
    executor-family concern (`ReferenceTaskExecutor`, the dispatch table)
    already lives alongside; (ii) K0-T02's own PR #45 body already
    establishes the "two `services/` roots, neither import-linter contract
    draws a boundary between them" precedent for exactly this kind of
    placement question; (iii) a new top-level package would need a new
    import-linter contract entry for zero structural benefit, since nothing
    this module does requires importing `mrr.persistence`/SQLAlchemy or any
    `mrr.services.control_plane` service.

    That last point is the packet's central, load-bearing design decision,
    stated precisely: neither import-linter contract in `pyproject.toml`
    (lines 135-172, read in full) actually LISTS `mrr.services.node_runtime`
    in contract 1's framework-free `source_modules`, so nothing would
    machine-STOP this module from importing SQLAlchemy directly — but doing
    so would abandon the SAME discipline `ReferenceTaskExecutor`/`dispatch.py`
    already establish by CONSTRUCTION (their own docstrings' repeated
    "framework-free by construction", "no DB call inside it"), and would
    break three concrete things: (1) MRR-FR-035 idempotency — the executor's
    own in-memory memo (mirroring `ReferenceTaskExecutor._memo`) only
    prevents re-running side effects WITHIN one process instance; if
    `execute()` itself performed durable multi-object writes, a second call
    with the SAME `(task_id, revision, execution_attempt)` triple after a
    process restart would either double-write or need its OWN separate
    durable idempotency mechanism duplicating what `RunManifestRecorder`
    already provides at the RUN level; (2) testability — "v1 MUST be able to
    run model-free... so the deterministic path is provable ALONE" (the
    plan's own words) is most directly satisfied by a pure, `Mapping[str,
    bytes] -> bytes` transform a unit test can exercise with ZERO Postgres
    dependency, exactly like `default_reference_transform`'s own unit tests;
    (3) MRR-FR-041's honesty boundary — `ReferenceTaskExecutor` is
    explicitly "not a security sandbox"; layering ad hoc persistence inside
    a SECOND `Executor` implementation would create two different, silently
    diverging models of what "executing a task" is allowed to touch.

    CONCRETE SHAPE: `execute()` performs, purely in memory, over
    `inputs: Mapping[str, bytes]` (keyed by `ArtifactRef.artifact_id`,
    exactly like `ReferenceTaskExecutor`): (1) parse the two declared input
    artifacts (corpus snapshot, protocol-parameters sidecar — derived_
    decisions (b)); (2) verify `MethodProtocol` lock/hash preconditions
    (derived_decisions (g)); (3) apply the machine-checkable inclusion
    filter; (4) assemble matrix rows; (5) count distinct independent source
    families per candidate claim (derived_decisions (e)); (6) determine
    eligibility/ceiling per candidate (derived_decisions (d)/(f)); (7)
    determine the overall `ResearchDecision` (derived_decisions (h)); (8)
    serialize ALL of the above into one canonical (sorted-key, UTF-8) JSON
    blob as `ExecutionResult.output`. `ExecutionResult.output_hash` is
    `mrr.crypto.hashing.content_hash(output)` — computed by `execute()`
    exactly like `ReferenceTaskExecutor` already does, never by the caller.
    A SECOND, NEW composition function,
    `run_synthesis_evidence_loop` (`services/control_plane/mrr/services/cli/
    synthesis_orchestration.py`, new file, mirroring `run_local_evidence_
    loop`'s exact choreography), calls `execute()`, deserializes its JSON
    output, and is the ONLY place that constructs/persists real
    `EvidenceMatrix`/`MethodRuling`/`Claim`/`ResearchDecision` objects and
    edges — exactly where every OTHER persisting step of the existing loop
    already lives (`ResearchScoreService`, `CapabilityRegistry`,
    `TaskBundleService`, `RunManifestRecorder`, `EvidenceCrateSealer` are
    ALL called from `orchestration.py`, never from inside
    `ReferenceTaskExecutor.execute()`). FLAGGED, not silently assumed:
    `mrr.services.node_runtime` is not machine-added to import-linter
    contract 1 by this packet (out of scope, no genuine need), so this
    remains a DISCIPLINE, not (yet) an enforced boundary — the same open
    question PR #45 already flagged (its own point 5) and left unresolved;
    a future task MAY want to close this gap once two independently-authored
    `Executor` implementations exist to prove the discipline is worth
    enforcing.
