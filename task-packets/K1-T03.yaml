    checkably, from the eligibility-rules table in the pinned protocol-
    parameters sidecar (derived_decisions (b)) and the distinct independent
    source-family count (derived_decisions (e)) computed per claim
    candidate:

    - `supported_within_scope` -> `Claim.status = "supported"` (the EXISTING
