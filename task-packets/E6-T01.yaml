stop_conditions:
  - honoring MRR-FR-083's full "obligations ... MUST travel with the
    transfer" is found to require the persisted Obligation aggregate and its
    propagation machinery (E6-T02) rather than structural fields alone — keep
    obligation data structural-only and stop; report for reviewer decision
  - a reviewer determines TransferContract genuinely needs a second,
    recipient-side signature field — stop rather than inventing a
    two-signature schema shape; raise it as a candidate ADR addendum
    alongside ADR-0007/ADR-0003
  - the undrawn TRANSFER_LIFECYCLE transition set (no section-6 diagram) is
    judged unacceptable to build against without a specification amendment —
    stop and request one rather than guessing further transitions
  - implementation requires any change to packages/persistence/**,
    migrations/, or a new import-linter contract — the generic tables and
    existing EDGE_VOCABULARY were confirmed sufficient at planning time;
    report if that assumption turns out false
