task_id: E6-T01
title: TransferContract lifecycle — a versioned, sender-signed cross-practice object binding exact source object ids/hashes with structural caveats/obligations, an event-only offer/respond decision (ADR-0007), and adaptation's new-object relation edge
status: approved
derivation: >
  Derived by a planning session and reviewed in-session per
  docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from
  docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E6 (E6-T01 "TransferContract
  lifecycle" — first of six E6 tasks: T02 caveat/obligation propagation, T03
  cross-practice correction notification, T04 local accept/adapt/reject/defer
  response TO A CORRECTION, T05 public unresolved-correction projection, T06
  offline recipient delivery tracking), docs/spec/01_SYSTEM_SPEC.md section 4.9
  ("Stage 9 — Transfer and obligations": MRR-FR-080..084) and section 2.14 of
  docs/spec/02_DOMAIN_MODEL.md ("TransferContract"). This is a NEW object kind
  with no existing schema/contract/service anywhere in the repository
  (confirmed: no schemas/transfer-contract.schema.json, no
  packages/contracts/mrr/contracts/transfer_contract.py, no `TransferContract`
  reference anywhere under packages/ or services/ or tests/). It is the
  nineteenth schema/contract/example entity, additive to the existing
  eighteen. Builds on E1 (identity/hashing/signatures, StateMachine), E5
  (Practice/KeyRing, trust-anchored signer-key resolution pattern — E5-T04
  task_trust, E5-T05 crate_trust), and ADR-0007 (Task Bundle lifecycle
  transitions are events, not new signed revisions) — TransferContract is, like
  TaskBundle and UNLIKE Claim/CorrectionEvent/ResearchScore, a cross-practice,
  origin-signed, lifecycle-bearing object, so the same asymmetry ADR-0007
  documents for TaskBundle applies here (see derived_decisions).
objective: >
  Provide the TransferContract object and its create/offer/respond lifecycle,
  framework-free at the domain layer, CI-testable, reusing the generic
  ObjectRepository/EdgeRepository (no migration — see derived_decisions):
  (1) schemas/transfer-contract.schema.json + a mirroring
  packages/contracts/mrr/contracts/transfer_contract.py Pydantic model +
  examples/transfer-contract.example.json, wired into
  scripts/check_contracts.py's ENTITY_MODELS exactly like every other entity.
  Required fields per docs/spec/02_DOMAIN_MODEL.md section 2.14's narrative
  list: sender_practice_id/receiver_practice_id (both Urn; practice_id from
  BaseObject duplicates sender_practice_id, mirroring TaskBundle's
  practice_id==origin_practice_id precedent), transferred_objects (list of
  {id, content_hash} pairs, minItems 1, shaped like CorrectionEvent's
  affected_objects), purpose, permitted_uses, disclosure_rules,
  attribution_rules, caveats, correction_subscription, obligations (STRUCTURAL
  stubs only — kind + optional deadline, drawn from the section 2.15 Kinds
  list; NOT persisted Obligation aggregates, which are E6-T02), nonce,
  expires_at, signature (singular — see specification_gaps item 2), and status
  (schema-level creation-time snapshot only, per ADR-0007 — see
  derived_decisions). (2) A `TRANSFER_LIFECYCLE` StateMachine in
  packages/domain/mrr/domain/lifecycles.py alongside the existing four,
  covering only the transitions MRR-FR-080/081 and the section 3.8/5.2
  API+event enumeration actually license: created -> offered -> {accepted,
  adapted, rejected, deferred, unresolved} (lowercase — see derived_decisions),
  documented with the same "open specification questions" discipline the
  existing four machines use for undrawn edges (there is no section-6 diagram
  for this entity — see specification_gaps item 1). (3) A
  `resolve_trusted_transfer_key` resolver in a new
  packages/domain/mrr/domain/transfer_trust.py, mirroring
  mrr.domain.task_trust.resolve_trusted_task_key /
  mrr.domain.crate_trust.resolve_trusted_crate_key exactly (four-condition,
  fail-closed, distinct typed errors, verifying against the SENDER practice's
  KeyRing). (4) A `TransferService` under
  services/control_plane/mrr/services/transfer/service.py providing `create`
  (mints + sender-signs revision 1, rejects any referenced object classified
  PARTICIPANT_IDENTIFIABLE), `offer` (event-only ADR-0007-style transition,
  no new revision), and `respond` (verifies the sender's signature via
  resolve_trusted_transfer_key BEFORE recording ANY of the five outcomes —
  including reject/defer/unresolved, not just accept; for `adapted`, takes a
  caller-supplied already-existing local object id and atomically records an
  `adapted_from` edge — source=the adapted object, target=the referenced
  transferred object — alongside the `transfer.responded` event, per
  MRR-FR-082's "preserve the relation to the source object").
