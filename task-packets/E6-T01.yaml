derived_decisions: >
  (a) ADR-0007 applies. TransferContract is cross-practice (MRR-NFR-007: "must
  be authenticated, authorized, signed, hashed") and lifecycle-bearing
  (MRR-FR-081), exactly TaskBundle's structural situation and UNLIKE
  ResearchScore/Claim/CorrectionEvent (unsigned — see E3-T02's own
  derived_decisions making this same call for Claim, the other direction).
  Therefore: revision 1 is created once, sender-signed over the ADR-0004
  exclude_none form, and never mutated again in this task's scope (no
  propose_modification analog exists for a transfer); `offer` and `respond`
  are event-only transitions (mirroring TaskBundle's `_advance` helper) that
  append a domain event without writing a new object revision, so the sender's
  origin signature always verifies directly against the current (only)
  content record. The schema's own `status` field is, per ADR-0007's language
  for TaskBundle, "that record's creation-time snapshot" — it will read
  "created" for every stored TransferContract in this task's scope; the LIVE
  status is event-derived (latest `transfer.offered`/`transfer.responded`
  event, falling back to the body's own status).
  (b) Status/decision casing is lowercase, taken verbatim from MRR-FR-081's
  own prose ("accepted", "adapted", "rejected", "deferred", "unresolved") —
  the same discipline lifecycles.py already applies ("State names match the
  owning schema's status enum exactly, including casing, where one exists").
  Unlike TaskBundle (whose ALL-CAPS states are anchored in the section 6.2
  diagram, which does not exist for TransferContract), the FR text itself is
  the only available anchor here, and it is lowercase.
  (c) `respond` verifies the sender's signature (via
  resolve_trusted_transfer_key, mirroring resolve_trusted_task_key/
  resolve_trusted_crate_key's four-condition fail-closed discipline) BEFORE
  recording any of the five outcomes, including reject/defer/unresolved — a
  forged or tampered offer must not become recordable as "rejected" any more
  than as "accepted."
  (d) Adaptation (MRR-FR-082) does not genericize construction of the adapted
  object's own content — this service takes an ALREADY-EXISTING local object
  id from the caller (verified via ObjectRepository.get_latest, raising
  ObjectNotFoundError if absent) and records an `adapted_from` edge
  (source=adapted object id, target=the transferred object id being adapted),
  atomically with the `transfer.responded` event — mirroring the
  source-verb-target edge-direction convention already established for
  `derived_from` in tests/integration/persistence/test_postgres_repositories.py
  ("a derived_from hub" == edge(source=a, target=hub)).
  (e) `transferred_from` and `subject_to_obligation` (both already in
  EDGE_VOCABULARY) are declared-but-UNUSED by this task, exactly as
  `corrects` was left declared-but-unused after E3-T06 (grep-confirmed: the
  correction service tracks affected_objects/impact_objects as body fields
  only, never a `corrects` edge). A future task decides their exact
  semantics; inventing a use here would be exactly the kind of undrawn
  behavior AGENTS.md rule 3 forbids.
  (f) A referenced transferred object classified PARTICIPANT_IDENTIFIABLE is
  rejected at `create` — docs/spec/02_DOMAIN_MODEL.md section 4's
  classification table states PARTICIPANT_IDENTIFIABLE is "never exported by
  default," and no consent-override machinery exists in this task's scope
  (that is E7 field-research policy); MRR-NFR-006 ("Raw restricted data MUST
  remain local unless a specific approved transfer permits export") is read
  as licensing INTERNAL/RESTRICTED/SENSITIVE transfer via an approved
  TransferContract, but NOT overriding PARTICIPANT_IDENTIFIABLE's stricter
  "never by default."
  (g) `create` additionally emits a `transfer.created` domain event — see
  specification_gaps item 4 for why this is a judgment call, not a literal
  requirement.
specification_gaps:
  - No section-6 state-machine diagram exists for TransferContract (unlike
    ResearchScore/TaskBundle/Claim/Correction, each with an ASCII diagram in
    docs/spec/01_SYSTEM_SPEC.md section 6). The TRANSFER_LIFECYCLE transitions
    this task declares (created -> offered -> one of five terminal outcomes)
    are grounded only in MRR-FR-080/081's prose and the section 3.8 API /
    section 5.2 event enumeration, not a verified diagram — flag for the same
    reviewer scrutiny lifecycles.py already documents as "open specification
    questions" for its four existing machines, and treat as a candidate for a
    future spec amendment adding an explicit section 6.5 diagram.
  - docs/spec/02_DOMAIN_MODEL.md section 2.14 lists "signatures" (plural) as
    a field with no further elaboration of cardinality or shape; every
    existing schema's `signature` field (common.schema.json `$defs.signature`)
    is singular. This task defaults to ONE sender-origin signature (mirrors
    TaskBundle), with the recipient's response authenticated only via its own
    domain-event actor/practice_id fields (section 5.1's event envelope),
    NOT a second object-level signature slot. If a reviewer determines a
    genuine recipient-side cryptographic countersignature is required, that
    is a new schema shape needing its own ADR (no existing schema has ever
    needed two signature fields).
  - Whether `respond` may be called more than once for the same
    TransferContract (e.g., DEFERRED later followed by a terminal decision,
    or UNRESOLVED later resolved) is not addressed by MRR-FR-081 or any
    drawn diagram. This task treats OFFERED -> respond(exactly one of five
    outcomes) as the only drawn edge — a single terminal response event; a
    later revisit is out of scope pending a specification decision.
  - The section 5.2 "Required events" enumeration lists only
    `transfer.offered`/`transfer.responded` for this entity — unlike every
    sibling first-class object, which has a distinct create-time event
    (task.created, claim.created, correction.opened). This task defaults to
    additionally emitting `transfer.created` (reading "Required events" as a
    floor, not an exhaustive ceiling, for MRR-NFR-001 provenance parity with
    every sibling entity) — flagged in case a reviewer prefers strict literal
    conformance to the enumerated list instead (i.e., no creation-specific
    event, only offered/responded).
  - The exact structured JSON shape of `caveats`/`obligations`/
    `disclosure_rules`/`attribution_rules` is given only as unstructured
    prose in docs/spec/02_DOMAIN_MODEL.md sections 2.14/2.15 — no schema-level
    detail exists anywhere in the spec. This is the schema-design axis with
    the most implementer latitude, bounded only by the stage-9 acceptance
    criterion that caveats remain visible/queryable and are not silently
    dropped.
  - MRR-FR-084 ("A receiving practice MAY reject a correction, but MUST
    record that it was notified and why it rejected or deferred it") sits
    textually inside stage 9 alongside MRR-FR-080..083, but its two response
    verbs (reject/defer, matching E6-T04's title "local accept/adapt/reject/
    defer response") concern a CORRECTION notification, not the transfer's
    own MRR-FR-081 five-way decision. Recorded here only to make explicit
    that T01 does NOT claim MRR-FR-084 as satisfied — it belongs to E6-T03/
    T04, and this packet's `requirements:` list omits it deliberately.
invariants:
  - a TransferContract's `transferred_objects` are exact {id, content_hash}
    pairs bound at creation (MRR-FR-080) inside the one immutable,
    sender-signed content record; no later event or (nonexistent) revision
    ever rewrites a bound hash — "the recipient cannot silently replace the
    source hash" (section 4.9 acceptance criterion)
  - caveats, obligations, disclosure/attribution rules, and the correction
    subscription travel with the transfer as fields on that SAME immutable
    signed record (MRR-FR-083, structural scope only per derived_decisions
    (a)); they are never silently dropped by a later `respond` event
  - the `respond` operation records exactly one of {accepted, adapted,
    rejected, deferred, unresolved} (MRR-FR-081); recording ANY of the five first requires the
    sender's signature to resolve via resolve_trusted_transfer_key against
    the sender practice's KeyRing at the evaluation instant — a revoked,
    rotated, expired, unknown-kid, signer-mismatched, or tampered offer is
    rejected fail-closed with a distinct typed error, before any response is
    recorded
  - an `adapted` decision additionally requires a caller-supplied, already-existing local
    object id; recording it creates an `adapted_from` edge (source=adapted
    object, target=transferred object) atomically with the `transfer.
    responded` event (MRR-FR-082); a nonexistent adapted object id aborts
    both the edge and the event
  - only a legal TRANSFER_LIFECYCLE transition may be recorded
    (created -> offered -> exactly one terminal outcome); an illegal one
    raises InvalidTransitionError and persists/appends nothing
  - a TransferContract referencing any object classified
    PARTICIPANT_IDENTIFIABLE is rejected at `create`, fail-closed, with a
    distinct typed error (MRR-NFR-006, section 4 classification table)
  - every create/offer/respond call records a domain event with full
    MRR-NFR-001 provenance (actor, occurred_at, policy_version, causation_id,
    correlation_id, object_id, object_revision), written atomically with its
    object revision or via the event-only path, through the transactional
    outbox
  - the `transferred_from` and `subject_to_obligation` edge types remain declared in
    EDGE_VOCABULARY but are not created by this task (see derived_decisions
    (e)); only `adapted_from` is used
  - both import-linter contracts stay KEPT; packages/domain and
    packages/contracts import no provider SDK, open no network, and persist
    no state outside what ObjectRepository/EdgeRepository already provide
  - no Alembic migration is added; `objects.kind="TransferContract"` and
    edges of type `adapted_from` are accepted by the existing schema exactly
    as-is
acceptance_tests:
  - happy path, accepted: create (sender-signed, PUBLIC-classified
    transferred object, an active in-window sender key) -> offer -> respond
    "accepted"; the sender's signature resolves via the ring and both events
    (transfer.offered, transfer.responded) are appended with no new object
    revision after creation
  - happy path, adapted: respond "adapted" with a pre-existing local object
    id records an `adapted_from` edge (source=adapted object, target=the
    transferred object) atomically with `transfer.responded`; the edge is
    queryable via EdgeRepository.edges_from(adapted_object_id, "adapted_from")
  - rejected / deferred / unresolved paths each record `transfer.responded`
    with the matching `decision` payload value and no edge
  - illegal-transition matrix, each fails closed with no event appended:
    respond before offer; a second respond after a terminal outcome already
    recorded; offer called twice
  - a create referencing an object classified PARTICIPANT_IDENTIFIABLE is
    rejected with a distinct typed error; nothing is persisted
  - signature fail-closed matrix at `respond`, each a distinct typed error:
    signer_practice_id != the trusted sender practice; kid does not resolve
    in the ring; resolved key revoked/rotated/expired/not-yet-valid at the
    evaluation instant; a tampered content record whose signature no longer
    verifies — mirrors the E5-T05 crate-verification matrix exactly
  - adaptation with a nonexistent adapted object id is rejected; no edge and
    no `transfer.responded` event are persisted (adversarial)
  - hash-pinning property test: for any sequence of create -> offer ->
    respond, the stored content record's `transferred_objects` content
    hashes are byte-identical to what `create` was called with — never
    rewritten
  - property test: random invalid TRANSFER_LIFECYCLE transition sequences
    never succeed (mirrors the Claim lifecycle property test's own
    discipline)
  - contract tier: the new schema is valid Draft 2020-12; the new example
    validates against both the JSON Schema and the Pydantic model and
    round-trips (the nineteenth entity, via scripts/check_contracts.py's
    ENTITY_MODELS)
  - integration test (real PostgreSQL): create -> offer -> respond persist
    atomically with their events; querying the generic objects/edges tables
    directly confirms no migration was needed (kind="TransferContract" rows
    exist; the adapted_from edge satisfies the existing CHECK constraint)
  - all existing suites stay green; both import-linter contracts remain KEPT
