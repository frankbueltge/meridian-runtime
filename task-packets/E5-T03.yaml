task_id: E5-T03
title: Online node protocol — signed message envelope, deterministic inbound validator, and an abstract transport port (mTLS marked infra-dependent)
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E5 (E5-T03
  "online node protocol and mTLS"), docs/spec/04_SECURITY_AND_POLICY.md section
  4.1 ("mTLS between federated nodes") and section 8.2 ("Task and result
  envelopes include nonces, expiry, recipient identity, content hashes, and
  signatures. Processed envelope IDs are retained for replay detection according
  to policy") and section 8.3 (a refusal returns only a coarse reason code),
  docs/spec/01_SYSTEM_SPEC.md section 2.2 (the data plane's "Task inbox and
  decision interface" and "Signed result outbox"), and MRR-NFR-004/007. Builds
  on E5-T01 (Practice/KeyRing/kid) and E5-T02 (trust-anchored signer-key
  resolution) and the ADR-0004 exclude_none signature form. Per this
  repository's standing note, E5-T03 is INFRA-NEAR: the domain/crypto/protocol
  OBJECT layer is built CI-testable here; the real network/TLS/mTLS transport is
  marked infra-dependent and is NOT built or CI-tested in this packet (no local
  PostgreSQL/containers/sockets on this machine). It defines the online-exchange
  message + its fail-closed validation + an ABSTRACT transport port, exactly as
  E4-T01 defined the ModelAdapter port (a Protocol + value objects + an in-test
  fake) without any concrete provider.
objective: >
  Provide the online node protocol's object layer, framework-free and
  CI-testable: (1) a signed NodeMessageEnvelope contract — the docs/spec/04
  section 8.2 "envelope" that wraps ONE already-signed application payload for
  point-to-point online delivery, carrying a message id / replay nonce, sender
  node + practice id, recipient node id, sent-at and expiry timestamps, the
  payload's content hash, a payload-kind tag, the payload itself, and a
  transport signature by the SENDING node over the envelope (built/verified over
  the ADR-0004 exclude_none form via the existing hashing_policy). It is
  payload-agnostic: it references its payload by content hash and kind, so it
  carries a TaskBundle outbound or a result inbound without hard-coding either
  (the task-decision flow is E5-T04, the result flow E5-T05). (2) A deterministic
  inbound validator (framework-free domain) that accepts an envelope ONLY when
  every check holds, each a DISTINCT typed error, fail closed: recipient id ==
  this node, the evaluation instant is within [sent_at, expires_at), the carried
  payload's own content hash equals the declared payload_content_hash, the
  message id has not already been processed (a replay CHECK via a caller-supplied
  "already seen" predicate — the DURABLE processed-id store is E5-T07), and the
  transport signature verifies under the sender node's trusted key (resolved from
  the sender practice's KeyRing exactly as E5-T02 does — signer-practice match,
  kid resolves, key valid at the instant, signature verifies). A rejection yields
  only a COARSE reason category (docs/spec/04 section 8.3). (3) An ABSTRACT
  transport port (a Protocol plus frozen request/result value objects and an
  in-test fake, mirroring mrr.domain.model_adapter.ModelAdapter) — NO real
  socket, TLS, or mTLS. The concrete mTLS client/server is explicitly infra-
  dependent and out of scope; this packet builds only the port it will implement.
