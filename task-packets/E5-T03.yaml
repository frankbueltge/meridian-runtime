forbidden_changes:
  - any real network, socket, TLS, mTLS, certificate handling, HTTP client/server,
    or FastAPI endpoint — the transport port stays ABSTRACT (a Protocol + an
    in-test fake); the concrete mTLS transport is infra-dependent and explicitly
    deferred (mark it clearly, build none of it)
  - the node's DECISION on a received task (accept / modify / defer / reject) —
    that is E5-T04; this packet validates and authenticates an envelope, it does
    not decide the task
  - the result CONTENT flow (EvidenceCrate result envelope handling) — E5-T05 —
    and offline store-and-forward bundles — E5-T06; the envelope is payload-
    agnostic and does not special-case task vs result payloads
  - a DURABLE processed-message-id / replay store and any expiry/revocation
    ENFORCEMENT sweep over already-accepted messages — E5-T07; this packet does a
    per-message expiry check and a replay CHECK via a caller-supplied predicate,
    and builds no persistence
  - modifying existing contracts/schemas (NodeManifest, TaskBundle, EvidenceCrate,
    Signature, Practice, ...) or the E5-T02 manifest_trust resolver — E5-T03 is
    ADDITIVE (a new envelope + validator + port); reuse the Signature type,
    KeyRing, and hashing_policy unchanged
  - the crypto sign/verify/hash primitives and hashing_policy / prepare_for_*
    policy, and encode/decode_public_key (reuse unchanged); both import-linter
    contracts MUST stay KEPT (core stays framework-/provider-free, no network SDK)
  - any new authoritative state, DB model, migration, repository, or service —
    a NodeMessageEnvelope is a contract, its validator a pure function, and the
    transport a port; wiring them into a running node is E5-T04/T05
derived_decisions: >
  The envelope is a schema-backed signed message registered like the existing
  entities (JSON Schema in schemas/, a Pydantic v2 model in packages/contracts
  exported from its __init__, a valid example in examples/, and the pair
  registered in scripts/check_contracts.py so tests/contract cross-validates
  schema<->model<->example) — no new pyproject root (it lives in packages/
  contracts). It reuses the existing mrr.contracts.common.Signature type for its
  transport signature and is signed/verified over the ADR-0004 exclude_none form
  via mrr.domain.hashing_policy (sign_object/verify_object_signature) — never a
  second signing recipe. It carries its payload by (payload_kind, payload_content
  _hash, payload) so the validator can bind the envelope to its payload (the
  payload's own content_hash must equal payload_content_hash) without the
  envelope knowing any payload's internal shape — keeping task (E5-T04) and
  result (E5-T05) flows out of this packet. The inbound validator is a pure
  framework-free domain function returning None/raising, mirroring
  mrr.domain.manifest_trust: it resolves the sender node's key exactly as E5-T02
  resolves a manifest signer (signer-practice match, kid in the sender practice's
  KeyRing, KeyRing.is_valid_at at the evaluation instant, signature verifies) —
  the manifest-specific "key declared in public_keys" check (E5-T02 condition d)
  does NOT apply to an envelope and is omitted. Replay is a CHECK only: the
  validator takes a caller-supplied `already_processed(message_id) -> bool`
  predicate (default: treat none as processed) and fails closed when it returns
  True; the durable processed-id store that backs it in production is E5-T07. The
  transport port mirrors mrr.domain.model_adapter.ModelAdapter precisely: a
  runtime_checkable Protocol with frozen, self-validating request/result value
  objects and an in-test fake — no concrete implementation, no import of any
  network library. The real mTLS transport is named in docstrings as infra-
  dependent and deferred, never stubbed with fake network behavior.
invariants:
  - the NodeMessageEnvelope, its validator, and the transport port import NO
    network/TLS library and NO web/workflow framework; both import-linter
    contracts stay KEPT and the core stays framework-free (MRR-NFR-004)
  - the envelope is signed and verified over the ADR-0004 exclude_none form using
    the EXISTING hashing_policy; a tampered envelope field or payload fails
    verification; no second signing/hashing implementation is introduced
  - the inbound validator accepts an envelope ONLY when ALL hold — recipient ==
    this node, sent_at <= now < expires_at, payload.content_hash ==
    payload_content_hash, message id not already processed, and the transport
    signature verifies under the sender node's trusted (resolved, valid-at-instant)
    key — and otherwise raises a DISTINCT typed error per failing check, never a
    generic one, persisting/echoing only a coarse reason category
  - replay is a CHECK via a caller-supplied predicate; NO durable processed-id
    store is built (E5-T07), and NO real transport/mTLS is built (infra-dependent)
  - the transport port is abstract: it opens no network, and only an in-test fake
    implements it; no secret or private key is recorded anywhere
  - E5-T03 adds only new modules; NodeManifest/TaskBundle/EvidenceCrate/Signature/
    Practice and the E5-T02 resolver are unchanged
acceptance_tests:
  - the NodeMessageEnvelope validates against its JSON Schema and round-trips
    losslessly; the committed example validates and tests/contract cross-validates
    schema<->model<->example
  - a validly-signed envelope addressed to this node, within its validity window,
    whose carried payload's content_hash matches payload_content_hash, whose
    message id is unseen, and whose transport signature verifies under the sender's
    valid trusted key, is ACCEPTED
  - fail-closed matrix, each a distinct typed error and a coarse reason, nothing
    accepted: wrong recipient; before sent_at / at-or-after expires_at; payload
    content_hash != payload_content_hash (payload tampered); message id reported
    already-processed by the predicate; sender signature invalid / signer-practice
    mismatch / kid unknown / sender key not valid at the instant
  - a tampered envelope field (any signed field changed after signing) fails the
    transport-signature check
  - an in-test fake transport implements the abstract port and round-trips an
    envelope with no network; property/unit tests show the validator returns for
    all-hold and raises for every single failing precondition
  - both import-linter contracts remain KEPT and the new modules import no network
    library or provider SDK
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
required_output:
  - implementation summary
  - the NodeMessageEnvelope shape, the inbound validator's accept rule + typed
    failure family, and the abstract transport port surface (with the in-test fake)
  - changed files, the new schema, the new example, the check_contracts
    registration, and any additive domain errors/enums
  - tests added and exact command results (format, lint, typecheck, test,
    test-contract) proving green
  - security/privacy implications (envelope authenticity + replay check +
    fail-closed matrix + coarse reason; no real network/mTLS; no durable replay
    store; no secrets; abstract port only)
  - open specification questions and what is explicitly deferred (real mTLS
    transport = infra; task decision = E5-T04; result flow = E5-T05; offline
    bundles = E5-T06; durable replay/expiry/revocation enforcement = E5-T07)
stop_conditions:
  - the object-layer protocol cannot be expressed without a real network/TLS
    library or a concrete transport (that is the infra-dependent part; build the
    abstract port and stop there, reporting the boundary)
  - envelope authenticity cannot be represented without changing the Signature
    type, the hashing_policy, or the E5-T02 resolver (report rather than change)
  - representing replay/expiry would force building the durable processed-id store
    (E5-T07) — keep the per-message check + predicate and stop at that boundary
