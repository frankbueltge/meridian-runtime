derived_decisions:
  - >-
    (a) The gap is an outer edge, not an occasion. 17 federation packets built the
    object and port layer and no concrete adapter — each deferral explicitly documented
    at the time. Naming that honestly changes the next step from "wait for a partner"
    to "build the missing edge", which is small, testable, and available today.
  - >-
    (b) The file path is the right medium here, not a fallback. These practices
    exchange via git repositories — the one exchange that already happened was carried
    by hand out of the other repo. Building mTLS instead would serve a deployment that
    does not exist; building the file adapter mechanises what is actually done.
  - >-
    (c) Transport is not trust. Acceptance proves the bundle was signed by a key the
    receiver already declared trusted, addressed here, in-window and unseen — never
    that the sender is who they claim to be in the world. The trust decision stays an
    explicit operator input (--trusted-sender-practice), never a default.
  - >-
    (d) No database. The core takes a caller-supplied already_processed predicate, so
    replay protection is a committed, reviewable JSON ledger — consistent with "git is
    the archive" and with this repo's habit of committing what it relies on.
  - >-
    (e) No invented identity. Meridian may not mint a key for another practice; doing
    so would forge exactly the independence the system asserts. The real exchange
    therefore waits on E5-T09, a governance act between two practices, and this packet
    stops cleanly short of it rather than simulating it.
  - >-
    (f) Parse and validate stay separate. read_bundle performs no trust evaluation, so
    no caller can mistake a parsed bundle for an accepted one — the same discipline
    R2-T01 established with its gate-before-evaluator ordering.
invariants:
  - No network connection, no socket, no TLS/mTLS, no HTTP client or server, and no database connection anywhere in this packet.
  - The E5-T06 core is imported and called unchanged; no signing, hashing, expiry or accept rule is re-implemented.
  - A written bundle read back is byte-identical and its signature still verifies.
  - Each of the five accept conditions surfaces its OWN distinct typed error; they are never collapsed into one generic rejection.
  - After ANY refusal the replay ledger file is byte-identical to before; an id is recorded only after full acceptance.
  - A malformed ledger raises; it never defaults to "nothing processed yet".
  - No payload is acted on; the output states plainly that accepted envelopes are not yet envelope-validated.
  - No key or identity is generated for any practice; no key material is written into corpora/ or any committed path.
acceptance_tests:
  - >-
    AT1: round-trip — a bundle built by the unchanged core, written by the adapter and
    read back, is byte-identical and re-verifies; asserted on bytes and on signature.
  - >-
    AT2: five refusals, five distinct errors — wrong recipient, outside validity window,
    already in ledger, untrusted sender practice, tampered byte; each raises its own
    typed error and exits 3, and none is reported as a generic failure.
  - >-
    AT3: ledger discipline — after each of the five refusals the ledger file is
    byte-identical to before; a successful acceptance appends exactly one id, sorted and
    byte-stable; a malformed ledger raises instead of defaulting to empty.
  - >-
    AT4: the second stage is not faked — the CLI output states that accepted envelopes
    are bundle-verified but NOT yet envelope-validated, and no code path deserialises a
    nested payload.
  - >-
    AT5: boundaries — an architecture test proves nothing in this packet imports a
    socket/TLS/HTTP/FastAPI module or sqlalchemy, and that the adapter imports no
    service module; existing suites pass unmodified; every make tier green including
    make security-check.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make security-check
specification_gaps:
  - >-
    The key/identity exchange with the other practice is E5-T09 — a governance act
    between two practices, not a build step, and deliberately not performed here.
    Until the other practice publishes its own public key, no real exchange can or
    should happen.
  - >-
    The first real joint inquiry over this edge (on the open, preserved Hammond dissent)
    is R1-T01 — named, requiring both E5-T08 and E5-T09.
  - >-
    Envelope encryption / KMS remains deferred as E5-T06 marked it. Between two public
    repositories confidentiality is not the protection goal; integrity and authorship
    are, and those the signature already carries. If a future exchange carries
    restricted material, that is its own packet.
  - >-
    The concrete mTLS online transport remains unimplemented behind
    mrr.domain.envelope_transport's port, exactly as E5-T03 left it.
required_output:
  - Packet report per AGENTS.md "Required delivery format", embedding the exact
    `mrr federation outbox write` and `mrr federation inbox accept` invocations, the
    round-trip evidence (bundle sha256 before and after), and one refusal transcript per
    accept condition showing the distinct typed reason.
stop_conditions:
  - >-
    If making the round-trip verify requires hand-rolling a second serialisation instead
    of the canonical form the core signs over, STOP — the mismatch is the bug, not the
    core.
  - >-
    If any step appears to require generating or committing a key or identity for a
    practice that has not published it, STOP — that is forgery of independence, and the
    packet is designed to stop short of it (R6).
  - >-
    If a tier can only go green by opening a socket or a database connection, by
    modifying the frozen E5-T06 core, by adding a dependency, or by collapsing two
    accept-condition errors into one, STOP.
