required_output:
  - implementation summary
  - the exact change to `_finalize_content_hash` and the docstrings updated
  - tests added and exact command results (format, lint, typecheck, test,
    test-contract) proving green, plus CI result for integration/e2e
  - security/privacy implications (content_hash now equals hash of persisted
    body for every first-class object; no signature/secret/fixture change)
  - open specification questions (if any)
stop_conditions:
  - aligning ResearchScore would require changing the crypto primitives, the
    prepare_for_* policy, the ResearchScore schema, or any signature path
  - the research_score service turns out to depend on the null-including initial
    hash in a way a simple alignment would break (report the exact coupling)
