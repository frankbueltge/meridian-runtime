acceptance_criteria:
  - THE SHARP CASE - a 302 from an allowlisted host to a NON-allowlisted host is refused
    with a typed error, and no body is returned. Driven through the real urllib opener
    with a monkeypatched connection layer, not by asserting on a mock of the script's
    own helper.
  - A 302 from an allowlisted host to ANOTHER ALLOWLISTED host is ALSO refused - the
    guarantee is "no redirect", not "no redirect off the allowlist", so the recorded url
    and the fetched document can never diverge.
  - The refusal names the status code and the target host, and is distinct from
    EgressRefusedError (which means "we never opened a socket") - the two failure modes
    stay separate, never collapsed.
  - No body is read on a refused redirect - asserted by a connection double that fails
    the test if a body read is attempted after the 30x.
  - The existing guarantees are demonstrably intact - the allowlist still refuses a
    non-allowlisted host and a non-https scheme before any socket, the MAX_RESPONSE_BYTES
    bound still caps a bounded read, and the timeout is still passed.
  - Both scripts are covered - the same four assertions hold for each, with each script's
    own handler and its own tests; neither imports the other.
  - NO automated test performs real network I/O.
  - make format-check, lint, typecheck, test, test-contract and security-check pass, and
    the bandit nosec justifications on the urlopen lines are updated to state that
    redirects are refused as well.
explicitly_not:
  - No shared egress module for scripts/ - the deliberate duplication is kept and named.
  - No change to ALLOWED_HOSTS, to the size bound, to the timeout, or to any parsing.
  - No follow-and-recheck strategy - refusing is the chosen guarantee, see
    reviewer_resolution (1).
  - No touching of the network-policy/RunManifest question - these scripts run outside
    the run machinery, verified, and that question is prospective.
  - No new dependency, no migration.
