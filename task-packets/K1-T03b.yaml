task_id: K1-T03b
title: >-
  Execute MRR-MTH-018 sensitivity variations — extend the
  systematic_evidence_synthesis v1 executor and orchestration to actually RUN
  declared MethodProtocol.sensitivity_variations and report their results on
  the EvidenceMatrix, closing the gap K1-T04's own review identified
  ("populated, never consumed").
status: approved
epic: K1
reviewer_resolution: >-
  Approved 2026-07-21 by the main session as reviewing instance, under the
  owner's documented same-day delegation. All primary design choices are
  CONFIRMED: (1) the task id `K1-T03b` — code ownership (this packet
  extends K1-T03's own executor/orchestration files) is the right anchor
  for the b-suffix, not provenance-of-discovery (K1-T04's review merely
  surfaced the gap); (2) execution semantics per derived_decisions (a) —
  re-run only the four classification stages, hold extraction and evidence
  identity fixed, never multiply extraction/model calls by variation
  count; `source_family_overrides` as the narrowest lever satisfying
  MTH-018's three named examples; (3) the per-variation sidecar artifact
  mirroring ProtocolParameters, with the SYMMETRIC fail-closed coverage
  check; (4) results as ONE optional, nullable field on `EvidenceMatrix`
  (no new object kind — the seven-kind table stays closed; no migration;
  exclude_none back-compat proven by test per the E1-T03b pattern);
  (5) fail-conservative claim/ruling isolation — variations are reported
  data, never authoritative state (the future promotion question stays
  open in specification_gaps); (6) lock discipline per (f) — results are
  post-lock execution artifacts, never MTH-008 amendments; (7) the
  empty-group guard per (g), including the discipline of NOT "fixing" the
  unreachable base-path edge case out of scope — its stop_condition
  stands; (8) no new canonical error code (h) and no new event type (i);
  (9) fixtures-only scope per (l) — the real, sealed K1-T04 run is
  read-only evidence; the derivation's DB finding (the real declaration
  names exactly one entry operationalizing the question's core term, so a
  real re-run would be a non-comparative pseudo-demonstration) makes this
  scope choice evidence-based, not merely cautious.

  ONE PACKET CORRECTION, applied by the reviewer directly: derived_
  decisions (i) prescribes one additive `sensitivity_variation_count` key
  in `EvidenceMatrixService.create`'s event payload, but the packet as
  derived simultaneously listed that service file under forbidden_changes
  and omitted it from allowed_paths — an internal inconsistency that would
  have forced the implementer into a stop_condition immediately. Resolved
  by adding the file to allowed_paths with a strictly bounded permission
  (exactly that one payload key, nothing else) and narrowing the
  forbidden_changes entry accordingly; both edits are marked as
  reviewer-resolution amendments in place.

  SCHEDULING, binding on this session: implementation starts only AFTER
  E9-T00b (in flight at approval time) has merged. Verified at approval
  time: the two packets' diffs share ZERO files (E9-T00b touches the five
  trust resolvers, unit_of_work.py, and the 19 service files' UoW blocks;
  K1-T03b touches synthesis_executor.py, synthesis_orchestration.py,
  evidence-matrix schema/contract, exceptions.py additively, and the one
  bounded event-payload line) — the sequencing is discipline, not
  necessity.

  AMENDMENT (2026-07-21, after the implementation correctly hit the
  fail-closed stop_condition): the symmetric coverage check broke the two
  standing e2e tests in `tests/e2e/test_k1_t04_first_real_run.py` — the
  real corpus's own `method-protocol.proposal.json` declares
  `sensitivity_variations: ["model-collapse-mechanism-v1"]`, and those
  tests re-run the real corpus FRESH on every invocation without
  supplying variation parameters. The packet's derivation premise ("every
  protocol in the test suite today except the one real K1-T04 protocol,
  which this packet never re-executes") conflated the sealed one-time
  schema (truly never touched) with the corpus FIXTURES (re-executed by
  e2e on every run) — the implementer's root-cause analysis is accepted
  as correct. RULING: option (1), the honest route. `tests/e2e/
  test_k1_t04_first_real_run.py` is ADDED to allowed_paths, bounded to
  exactly this change: the two affected tests are updated to assert the
  fail-closed outcome (`run_state == "failed"` with the crate's failures
  naming `SensitivityVariationDeclarationMismatchError` and the exact
  missing entry id), MAY be renamed to reflect their new meaning, and
  MUST carry docstrings stating plainly WHY: the real run's own locked
  protocol declares a sensitivity analysis whose parameters have never
  been authored; MRR-MTH-018 enforcement now refuses to silently skip a
  declared analysis; authoring a genuine alternate operationalization for
  the model-collapse question remains the separate, named future task
  (specification_gaps); and the sealed archive `mrr_k1t04_real_run_v2` is
  unaffected. EXPLICITLY REJECTED: (2) rushing the authoring of a real
  variation into this packet (research-content work, deliberately open,
  arguably the practice's/owner's call, and a trivial noop-variation
  would be exactly the "fabricated demonstration of coverage" derived_
  decisions (l) warns against) and (3) any grandfather exemption for
  pre-existing declarations (the silent skip the MUST forbids). NOTED
  for the record: forward computational reproduction of the archived
  K1-T04 run via CURRENT code is now gated on that future task — this
  does not retroactively unmeet K1's exit criteria, which were assessed
  against the code version the run actually used; the runtime refusing
  to reproduce a run whose declaration it now knows to be unexecutable
  is the capability working, not a regression. The e2e happy path over
  a completing run remains covered by this packet's own new
  multi-variation fixture test and the existing K1-T03 loop test.
derivation: >-
  Derived per docs/spec/07_AGENT_TASK_TEMPLATE.md section 5. Closes a
  specific, named gap in the MERGED `systematic_evidence_synthesis` v1
  profile (K0-T01/K1-T01..T04, epic K1, formally closed at "4 tasks" per
  `docs/design/2026-07-21-research-method-kernel-plan.md` line 35's own
  title). This is NOT new profile behavior invented here — it is the
  execution of a requirement (MRR-MTH-018) that has been NORMATIVE since
  spec 08's ACCEPTED status (2026-07-21) and whose INPUT FIELD
  (`MethodProtocol.sensitivity_variations`) has been schema-required and
  populated in real, locked protocol instances since K1-T01, but whose
  EXECUTION was never wired into the executor K1-T03 built or the
  orchestration K1-T03/K1-T04 compose.

  MRR-MTH-018, quoted verbatim (docs/spec/08_RESEARCH_METHOD_KERNEL.md line
  134-136): "Where a protocol declares sensitivity analyses over
  classifications (party families, cluster taxonomies, period boundaries),
  the varied classifications MUST be versioned charter entries, and results
  under each variation MUST be reported."

  Gap provenance, each link independently verified against CURRENT code on
  `main` (commit `a3a78ba`), not merely asserted:

  (1) `docs/design/2026-07-21-session-handoff-first-real-run.md` section 5
  ("Offene Urteilsfragen, bewusst NICHT entschieden"), lines 95-96: "MRR-
  MTH-018: `sensitivity_variations` wird befüllt, aber nicht ausgeführt
  (Executor-Erweiterung, Folgetask)" — the literal source of this packet's
  mandate, written the same session K1-T04's real run and its independent
  review completed (section 1 of that same document: "Unabhängiger Review:
  alle 15 Klassifikationen gegen die Atlas-Originale geprüft ... keine
  Blocker" — i.e. the gap was NOT a review blocker for K1-T04 itself, but
  was explicitly carried forward as unfinished capability work).

  (2) `docs/design/2026-07-21-k2-gate-decision.md` (the formal K2-gate
  ruling, "K2 wird jetzt NICHT abgeleitet"), whose own evidence table
  states plainly: "MRR-MTH-018 Sensitivitäts-Variationen ausgeführt |
  NICHT ERFÜLLT (befüllt, nie konsumiert)" and whose own "Konsequenz für
  die Arbeitsreihenfolge" section states: "Nach E1-T03b und der DRY-
  Konsolidierung: **MTH-018-Sensitivitäts-Ausführung als eigenes Packet**
  vor neuen Claim-Formen" — this packet answers that instruction directly,
  named explicitly as the top-priority next capability task, ahead of any
  K2 (causal-contract) work.

  (3) Confirmed by direct code inspection, NOT by trusting either document's
  own prose: `grep -rn "sensitivity" services/control_plane/mrr/services/cli/
  synthesis_orchestration.py services/node_runtime/mrr/services/
  node_runtime/synthesis_executor.py services/control_plane/mrr/services/
  method_protocol/service.py` returns ZERO hits — the field is read by
  NOTHING in the executor, the orchestration composition function, or the
  MethodProtocol lifecycle service. The field IS declared and schema-
  required: `packages/contracts/mrr/contracts/method_protocol.py` line 106
  (`sensitivity_variations: list[str]`, no default — required),
  `schemas/method-protocol.schema.json` lines 36/60-64 (required property,
  `"type": "array", "items": {"type": "string"}`, own description: "MTH-018:
  intended as a list of ConceptCharterEntry.entry_id values naming the
  varied classifications a sensitivity analysis runs over. Not cross-
  validated against a real ConceptCharter here (service-level, deferred)."
  — an HONEST, already-disclosed deferral this packet does not need to
  re-litigate, only build on). `examples/method-protocol.example.json` line
  17 already carries a real, non-empty value:
  `"sensitivity_variations": ["model-collapse-mechanism-v1"]`.

  (4) THE REAL K1-T04 RUN'S OWN DECLARATION, verified directly against the
  local Postgres instance the session-handoff names (`/usr/local/opt/
  postgresql@16/bin/psql 'postgresql://mrr@127.0.0.1:54329/mrr_test'`,
  schema `mrr_k1t04_real_run_v2`, read-only `SELECT`s only, no write
  issued): the locked `MethodProtocol` (`urn:mrr:method-protocol:
  01KY1SNYA6CZAYGFVVP0PA2QC0`, revision 3, `status: "locked"`) carries
  `"sensitivity_variations": ["model-collapse-mechanism-v1"]` — the EXACT
  same value as the already-accepted K1-T01 example, not a new one authored
  for the real run. Resolving that single entry_id against the SAME schema's
  real, `accepted` `ConceptCharter` (`urn:mrr:concept-charter:
  01KY1SNY9J1WY3QJH53A75CMY1`, revision 2) shows it names the charter entry
  that operationalizes the QUESTION'S OWN CORE TERM ("model-collapse
  mechanism" — the technical-literature process itself), NOT an alternate,
  second VERSION of a classification to compare the base finding against.
  There is no `model-collapse-mechanism-v2` (or any other second variant)
  anywhere in the real run's charter. This is a genuine, load-bearing
  finding, not an assumption: even if this packet's new capability were
  pointed at the real, sealed run today, there is no second, actually-
  varied classification declared to execute a MEANINGFUL sensitivity
  comparison against — the real declaration names WHAT is being tested
  sensitivity over (implicitly), not two or more alternate operationalizations
  to run and compare. This directly informs derived_decisions (l) (scope:
  capability + fixtures, not a real re-run) and is reported prominently in
  required_output, not buried.

  (5) `task-packets/K1-T03.yaml`'s own derived_decisions (b) established the
  precedent this packet extends: `MethodProtocol`'s own `list[str]` fields
  (`inclusion_criteria`/`exclusion_criteria`/`sensitivity_variations`/
  `kill_conditions`/`planned_analyses`, `method_protocol.py` lines 104-108)
  are free HUMAN PROSE, not structured, machine-executable predicates or
  threshold tables — which is exactly why K1-T03 invented the separate,
  versioned, content-hash-pinned `ProtocolParameters` sidecar artifact for
  `inclusion_filter`/`eligibility_rules`/`kill_conditions` rather than
  proposing a structured field on the protected `MethodProtocol` contract.
  `sensitivity_variations` is subject to the IDENTICAL constraint (a bare
  list of `ConceptCharterEntry.entry_id` strings, no machine-executable
  parameterization anywhere) — this packet's own derived_decisions (b)
  applies the SAME sidecar-artifact solution, one sidecar per declared
  variation, rather than proposing a new field on `MethodProtocol` (which
  remains one of the six protected K1-T01 contracts, untouched here).

  Task-id and epic placement, reasoned from precedent exactly as
  `task-packets/E1-T03b.yaml`'s own derivation did (that packet's own
  words, quoted here as the applicable method): "the repository has no
  standing convention that names this exact case, so this packet reasons
  from the two precedents it DOES have." Three candidates were considered:

  - **`K1-T05`** — REJECTED. `docs/design/2026-07-21-research-method-kernel
    -plan.md` line 35 titles K1 explicitly "`systematic_evidence_synthesis`
    v1 on the atlases (4 tasks)" — a closed, already-fully-delivered count
    (K1-T01..T04, confirmed merged: `git log --oneline` shows `9afcbd5`
    "K1-T04: first real run" reachable from `main`, no open K1 PR). K1's own
    "Exit criteria" (same doc, lines 71-73: "a third party can follow one
    sealed crate from question to claim landscape entirely through recorded
