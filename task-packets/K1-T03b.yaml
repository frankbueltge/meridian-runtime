  - >-
    whether a sufficiently divergent variation outcome (e.g. base =
    `supported`, variation = `contested`) should, in a FUTURE task, be
    promoted from "reported data" into something that MANDATES a new
    non-applicability condition on the base claim's own `MethodRuling`, or
    triggers a `ResearchDecision` review flag, is explicitly NOT decided
    here (derived_decisions (e)) — a natural follow-up once real,
    multi-variation data exists to motivate the design, not designed,
    stubbed, or hinted at in code by this packet.
  - >-
    `source_family_overrides` is this packet's own chosen mechanism for
    "party families"/"cluster taxonomies" (derived_decisions (a)) — a
    reviewer may prefer a richer mechanism (e.g. a whole alternate corpus
    snapshot per variation, letting a variation change WHICH sources exist,
    not just how they group) as a later, separate extension; this packet's
    own choice deliberately holds evidence identity fixed and varies only
    inclusion/grouping/family membership, the narrowest reading that still
    satisfies MTH-018's own three named examples.
  - >-
    whether the future task named in derived_decisions (l) — authoring a
    genuinely alternate second `ConceptCharterEntry` for the real
    model-collapse question so THIS capability can run a meaningful
    sensitivity comparison on the real corpus, and whether that would
    constitute a fresh K1-T04-style real run or a smaller, targeted one — is
    left entirely open, named but not designed, per this packet's own scope
    decision.
  - >-
    nothing in this packet cross-validates that a declared
    `sensitivity_variations` entry_id actually resolves to a real
    `ConceptCharterEntry.entry_id` on a real, accepted `ConceptCharter` —
    this is the SAME already-disclosed, inherited limitation
