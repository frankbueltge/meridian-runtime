    reopen an epic whose own governing documents both treat as closed —
    exactly the reasoning `task-packets/E1-T03b.yaml`'s own derivation used
    to reject `K1-T05` for itself (a DIFFERENT packet, ADR-0010's
    classification field — but the SAME structural objection applies here
    with equal force, since this packet is even MORE squarely "K1's own
    deliverable" than E1-T03b's cross-cutting contracts work was, making
    the "closed epic" objection, if anything, sharper, not weaker).
  - **`K2-T00`** or similar — REJECTED. K2 is explicitly "not scheduled" and
    was just formally deferred (`2026-07-21-k2-gate-decision.md`); K2's own
    subject matter (causal contracts, propose-plus-human-ruling forms per
    spec 08 section 7) is categorically DIFFERENT from executing an existing
    profile's own declared sensitivity analysis — this work has nothing to
    do with causal contracts and minting a K2-prefixed id would misfile it
    under an epic that is not even open.
  - **`E9-T00c`** or a new standalone `E9-*` id — REJECTED. E9-T00's own
    seven items are ALL review-driven follow-ups from PR comments on
    ALREADY-MERGED E6/K0/K1 pull requests (`task-packets/E9-T00.yaml`
