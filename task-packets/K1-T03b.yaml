objective: >-
  Make `MethodProtocol.sensitivity_variations` (MRR-MTH-018) an executed
  capability, not a schema-only declaration: extend
  `SystematicEvidenceSynthesisExecutor`'s pure pipeline to re-run its own
  deterministic classification steps under each declared variation (using a
  NEW, versioned, content-hash-pinned sidecar artifact per variation,
  mirroring K1-T03's own `ProtocolParameters` precedent exactly, since
  `sensitivity_variations` is — like every other `MethodProtocol` `list[str]`
  field — free prose with no machine-executable parameterization of its
  own); extend `EvidenceMatrix` with one new, OPTIONAL, additive field,
  `sensitivity_analysis_results`, so "results under each variation MUST be
  reported" (MTH-018's own words) lands on the SAME governed, addressable
  object every other synthesis output already lives on; extend
  `run_synthesis_evidence_loop` with one new, additive, default-empty
  keyword parameter so every EXISTING caller (K1-T03's own e2e test,
  K1-T04's `establish_and_run_synthesis`) is byte-for-byte unaffected. Build
  the capability and prove it on NEW, small, synthetic fixtures exercising
  at least two variations with genuinely different — and at least one
  divergent — outcomes; do NOT touch, re-run, or mutate the already-sealed
  K1-T04 real run (schema `mrr_k1t04_real_run_v2`), whose own single
  declared variation entry names the question's core term operationalization
  itself, not a second, alternate classification a meaningful comparison
  could run against (derivation (4)) — a genuinely separate, future decision
  if a reviewer ever wants a fresh real run exercising this new capability.
