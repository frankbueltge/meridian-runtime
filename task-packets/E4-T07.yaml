task_id: E4-T07
title: Implement the model benchmark runner and deterministic promotion policy
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E4 (E4-T07,
  "model benchmark runner and promotion policy") and its exit criterion
  ("MB-CIT and MB-NUM targets are evaluated against a non-agent baseline"), and
  docs/spec/05_EVALUATION_AND_ACCEPTANCE.md section 3.1/3.2 (MB-CIT, MB-NUM
  cases and metrics), section 4 (initial calibrated targets), and section 8
  (Model evaluation protocol: frozen evaluation profiles; "no use of the test
  labels in prompts or retrieval sources"; "A model upgrade ... must re-run
  affected benchmark families before promotion"). Reuses the merged E4-T05
  deterministic verifier for scoring and the E4-T01 ModelAdapter port for a
  scripted agent-under-test. Approved by the repository owner's standing
  direction to continue through E4 (2026-07-19). Seventh and final task of
  Epic E4.
objective: >
  Populate the meridianbench tier (benchmarks/meridianbench/) with: (1) a
  benchmark harness - a BenchmarkCase model that STRUCTURALLY separates the
  case INPUT (given to the system under test) from its LABEL (used only for
  scoring, never reaching the system - docs/spec/05 section 8 "no use of the
  test labels in prompts"), plus a runner and a deterministic scorer; (2) an
  MB-NUM suite (numeric fidelity, scored with the E4-T05 numeric verifier) and
  an MB-CIT suite (citation-anchor resolution, scored with the E4-T05 source
  verifier); (3) the docs/spec/05 section 4 calibrated targets as declared
  constants; (4) a deterministic promotion policy that decides promote/hold from
  metrics vs targets and produces a promotion RECORD with exact evaluation-
  profile version attribution - it enacts no live promotion; and (5) a non-agent
  baseline run alongside the agent-under-test on the same suites, so MB-CIT and
  MB-NUM are evaluated against a non-agent baseline (the E4 exit criterion).
  Make `make benchmark` run real tests and remove meridianbench from
  tests/EMPTY_TIERS.txt in the same diff.
