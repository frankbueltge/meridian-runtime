derived_decisions: >
  The store is keyed by (recipient_node_id, id), not id alone: replay detection is
  per receiving node (the same object id delivered to two different nodes is not a
  replay at either), and the UNIQUE constraint on that pair is the single source of
  idempotency — record_processed uses INSERT ... ON CONFLICT DO NOTHING so a
  duplicate is a silent no-op at the database, not an application-level check that
  could race. already_processed is a SELECT of that key. Both are executed inside
  the existing UnitOfWork/Connection pattern so a real intake (validate then
  record) can be one transaction later (that full wiring is E2E-002, not here).
  The id_kind column keeps envelope and bundle ids in ONE table with a discriminator
  rather than two near-identical tables — a bundle_id and a message_id are already
  distinct URN namespaces so they cannot collide, and one table means one retention
  sweep. expires_at is stored so retention is safe by construction:
  processed_id_retention_horizon is a pure function (unit-tested without Postgres)
  and prune_expired deletes only rows past it, so an id can never be pruned while an
  object bearing it could still validate — pruning cannot reopen a replay window,
  and an unbounded store is avoided per docs/spec/04 section 8.2 "retained ...
  according to policy". The predicate returned to validate_inbound_envelope/bundle
  is the store's bound already_processed; no change to those functions is needed —
  this task fills the seam they were built with. No intake service, no run-linkage,
  and no revocation annotation are built here (see forbidden_changes / scope_note).
invariants:
  - >-
    recording a processed id is idempotent: record_processed(id) twice for the same
    (recipient_node_id, id) yields exactly one row, no error, and a stable
    already_processed(id) == True; the UNIQUE constraint, not application logic, is
    the idempotency anchor
  - already_processed(id) is True if and only if a row for (recipient_node_id, id)
    exists and has not been pruned; for any id never recorded (or pruned only after
    its retention horizon) it is False
  - >-
    retention never reopens a replay window: prune_expired(now) deletes a row only
    when now is at or past processed_id_retention_horizon(row.expires_at), which is
    at or after the object's own expiry — so no still-valid envelope/bundle's id is
    ever pruned
  - the store's already_processed is drop-in as the AlreadyProcessed predicate of
    BOTH validate_inbound_envelope (message_id) and validate_inbound_bundle
    (bundle_id) with NO change to either function; a resubmitted, already-recorded
    object is rejected fail closed (EnvelopeAlreadyProcessedError /
    BundleAlreadyProcessedError)
  - >-
    the store is internal node state: it adds no contract/schema/example, imports
    no provider SDK beyond SQLAlchemy (persistence layer), and both import-linter
    contracts stay KEPT (core packages still import no framework); the E1-T06
    tables and repositories are unchanged
  - >-
    a processed-id row is append-then-prune only: it is never mutated in place, and
    prune is the only deletion (docs/spec/04 section 8.2 retention)
acceptance_tests:
  - >-
    integration (Postgres, CI): record_processed then already_processed returns
    True; an id never recorded returns False; recording the SAME (node, id) twice
    leaves exactly one row and no error (idempotency); two different recipient nodes
    recording the same id do not shadow each other
  - >-
    integration: the store's already_processed wired verbatim as the predicate makes
    validate_inbound_envelope reject a resubmitted envelope
    (EnvelopeAlreadyProcessedError) and validate_inbound_bundle reject a resubmitted
    bundle (BundleAlreadyProcessedError), while first submission passes — durable
    replay fail-closed end to end (E5 exit criterion)
  - >-
    integration: prune_expired removes rows at/after their retention horizon and
    returns the count; a row whose object is still within its validity window is
    NOT pruned (assert already_processed stays True across a prune that predates the
    horizon); after a legitimate prune past the horizon, already_processed returns
    False
  - >-
    unit (no Postgres): processed_id_retention_horizon is at/after expires_at for
    any non-negative grace, is monotonic in expires_at, and its boundary (now ==
    horizon) is prunable — proving retention can never precede object expiry
  - >-
    property (no Postgres): for arbitrary expires_at and grace >= 0,
    processed_id_retention_horizon(expires_at, grace) >= expires_at (retention never
    reopens a replay window)
  - >-
    integration: idempotent record under a UnitOfWork rollback leaves no row (the
    record participates in the caller transaction, not a side channel)
  - all existing suites stay green; both import-linter contracts remain KEPT; the
    integration tier skips VISIBLY when MRR_TEST_DATABASE_URL is unset locally and
    FAILS (never skips) if unset in CI, per tests/integration/conftest.py
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-integration
required_output:
  - implementation summary
  - the processed-id table + migration, the PostgresProcessedIdStore
    (already_processed / record_processed / prune_expired) accept/record/prune
    rules, and the pure retention-horizon function
  - the demonstration that the store's already_processed is drop-in for BOTH
    validators and rejects a durable replay fail closed (envelope and bundle)
  - changed files and the new migration revision id
  - tests added and exact command results (format, lint, typecheck, test, and
    test-integration) — for test-integration, either the CI run's pass output or,
    if run locally without Postgres, the VISIBLE skip with its reason (never a
    silent green)
  - security/privacy implications (durable replay protection per recipient node,
    idempotency anchored at the DB unique constraint, retention that cannot reopen
    a replay window, internal state only — no new cross-practice object, no
    network)
  - open specification questions and what is deferred (durable revocation record +
    trust_revoked_after_creation annotation E5-T07b; full validate-then-record
    intake transaction + run-linkage at E2E-002; the concrete retention grace as a
    policy value)
stop_conditions:
  - durable replay protection cannot be expressed without changing
    validate_inbound_envelope / validate_inbound_bundle or the AlreadyProcessed
    predicate type, or without a new cross-practice contract/schema (it can — the
    store fills the existing predicate seam and is internal state; report if blocked)
  - honoring "processed IDs are retained ... according to policy" (section 8.2)
    would force building a general policy engine or a scheduler for prune_expired
    (it does not — expose prune_expired as a callable with a horizon; who schedules
    it is out of scope) — keep the callable and stop
  - the durable revocation record / trust_revoked_after_creation annotation turns
    out to be unavoidable to make replay fail closed (it is not — revocation is
    already enforced at-instant at intake; if genuinely blocked, report and defer
    to E5-T07b rather than expanding this packet)
  - integration coverage is impossible because the repo's Postgres harness cannot
    be reached even in CI (it can — tests/integration/conftest.py is the proven
    E1-T05/T06 path; report if the harness is actually broken)
