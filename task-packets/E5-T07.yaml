task_id: E5-T07
title: Durable federated replay/idempotency store — a Postgres processed-id repository backing the already_processed predicate for both envelopes and bundles, with retention that never reopens a replay window
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E5 (E5-T07
  "replay, expiry, revocation, and idempotency hardening"), docs/spec/04_
  SECURITY_AND_POLICY.md section 8.2 ("Task and result envelopes include nonces,
  expiry, recipient identity, content hashes, and signatures. Processed envelope
  IDs are retained for replay detection according to policy") and section 8.4
  (revocation), docs/spec/03_API_AND_EVENTS.md section 5.3 ("State changes and
  event publication MUST use a transactional outbox ... Consumers MUST be
  idempotent"), docs/spec/01_SYSTEM_SPEC.md section 8.4 (federated offline import
  MUST verify replay protection), and MRR-NFR-007/002/005/001. E5-T03
  (validate_inbound_envelope) and E5-T06 (validate_inbound_bundle) each take a
  caller-supplied replay predicate mrr.domain.envelope_validation.AlreadyProcessed
  (``Callable[[str], bool]``) and BOTH explicitly defer the DURABLE processed-id
  store to this task (see packages/domain/mrr/domain/offline_bundle.py: "No
  durable processed-id store or revocation sweep is built ... is
  task-packets/E5-T07.yaml's scope"). This task builds exactly that durable store
  — the persistence layer behind the predicate — on the proven E1-T05/E1-T06
  Postgres+Alembic+integration-test harness (tests/integration/conftest.py: a
  real PostgreSQL via MRR_TEST_DATABASE_URL, a fresh alembic-migrated schema per
  test, skipped VISIBLY outside CI, never a silent green). Unlike E5-T03/T06
  (pure object layer), a durable store is this task's whole point and the repo's
  integration harness makes it CI-testable.
scope_note: >
  The Epic-E5 line "replay, expiry, revocation, and idempotency hardening" spans
  TWO distinct behaviors. Replay + idempotency + expiry-retention are ONE cohesive
  behavior — the durable processed-id store — and are this packet's scope; they
  satisfy the E5 exit criterion "compromised signatures and replay fail closed"
  (replay) with durability. Durable REVOCATION state — a persisted revocation
  record plus the docs/spec/04 section 8.4 ``trust_revoked_after_creation``
  annotation on ALREADY-ACCEPTED objects — is a SEPARATE behavior (annotating
  existing objects, not gating intake) and is deferred to a follow-up packet
  E5-T07b, for three reasons: (1) revocation is ALREADY enforced at intake by
  every resolver's at-instant KeyRing.is_valid_at check (E5-T02..T06) — a revoked
  key's new objects already fail closed, so nothing about fail-closed acceptance
  waits on T07b; (2) bundling a second behavior would break template rules 1 and
  10 (one cohesive behavior; small enough for independent review and rollback);
  (3) it mirrors this repo's own E5-T00/E5-T00b and E5-T02/E5-T02b splits. This
  scope_note IS the "specification issue" AGENTS.md rule 14 asks for; the planning
  session will derive E5-T07b next.
objective: >
  Provide a durable, idempotent, Postgres-backed processed-id store that implements
  the replay predicate E5-T03/T06 deferred, framework-appropriate (persistence
  layer, not core) and CI-integration-testable: (1) a new Alembic migration and a
  processed-id table keyed by the recipient node and the processed object id,
  recording id, id_kind ('envelope' | 'bundle'), recipient_node_id, processed_at,
  and the object's own expires_at (retained so retention can never prune an id
  whose object could still be inside its validity window). A UNIQUE constraint on
  (recipient_node_id, id) is the idempotency anchor. (2) A PostgresProcessedIdStore
  repository (packages/persistence) exposing: already_processed(id) -> bool bound
  for a given recipient node — the exact mrr.domain.envelope_validation.
  AlreadyProcessed shape, usable verbatim as the predicate argument of BOTH
  validate_inbound_envelope (over message_id) and validate_inbound_bundle (over
  bundle_id); record_processed(id, *, id_kind, recipient_node_id, expires_at, at)
  that inserts idempotently (INSERT ... ON CONFLICT DO NOTHING) inside a caller
  transaction/UnitOfWork so recording the SAME id twice is a no-op, never a
  duplicate row and never an error, and returns whether the row was newly
  recorded; and prune_expired(now) that deletes ONLY rows whose retention horizon
  has passed, returning the count pruned. (3) A pure domain retention-horizon
  function processed_id_retention_horizon(expires_at, *, grace) — unit-testable
  WITHOUT Postgres — defining the instant an id becomes prunable (its object's
  expires_at plus a policy grace, so an id is prunable only once NO envelope/bundle
  bearing it could still be within its own [sent_at/created_at, expires_at) window;
  pruning therefore never reopens a replay window). The store proves durable replay
  fail-closed end to end: after record_processed, a resubmitted envelope/bundle is
  rejected by validate_inbound_envelope/validate_inbound_bundle
  (EnvelopeAlreadyProcessedError / BundleAlreadyProcessedError) because the durable
  predicate now returns True.
