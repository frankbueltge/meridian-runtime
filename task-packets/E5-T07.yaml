    predicate's shape or the validators' accept rule); the domain
    manifest/envelope/task/crate/bundle resolvers are not touched
  - the contract models (packages/contracts) and any JSON Schema semantics — a
    processed-id row is INTERNAL node state, not a cross-practice object, so it
    gets NO schema/contract/example and NO scripts/check_contracts.py entry
  - the durable REVOCATION record and the docs/spec/04 section 8.4
    ``trust_revoked_after_creation`` annotation on already-accepted objects
    (E5-T07b — see scope_note); the at-instant revocation check in the resolvers
    stays exactly as is
  - API endpoints, workflow-engine integration, external message brokers or
    delivery transports, and the physical air-gap medium (all out of Epic scope
    here); no new authoritative cross-practice object
  - the E1-T06 domain_events/outbox tables and the object/edge repositories
    (reuse the UnitOfWork/transaction and Alembic patterns unchanged; ADD a table
    and a repository, do not alter existing ones)
