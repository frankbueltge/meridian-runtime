task_id: N2-T02b
title: >-
  Archive anchoring-integrity audit and `mrr audit anchoring` (read-only, no-network,
  NO-DATABASE): over the two committed archive dumps behind a fail-closed file-hash
  gate, resolve every EvidenceAnchor to its SourceRecord and every Claim reference to
  its EvidenceAnchor, and report dangling references (integrity VIOLATIONS) strictly
  apart from unanchored sources and unreferenced anchors (OBSERVATIONS) — never
  collapsing the two. Verifies that an anchor points at a really archived source, NOT
  that the source supports the claim.
status: approved
epic: N2
reviewer_resolution: >-
  Approved 2026-07-25 by the main session as reviewing instance, under the owner's
  instruction the same day to derive and build N2-T02 (record citations + anchoring
  integrity, decomposed if warranted) recorded in
  docs/design/2026-07-25-n2-t02-derivation.md, and under the standing use-first
  decision (docs/design/2026-07-22-nutzungsentscheidung-e9-vertagt.md). This is the
  offline half of the decomposition; the network half is N2-T02a. Load-bearing choices
  CONFIRMED at derivation against the real dumps: (1) ANCHORING is not SUPPORT — a
  resolvable anchor proves the anchor points at a really archived SourceRecord, never
  that the source carries the claim (N2-T03); (2) VIOLATIONS and OBSERVATIONS are
  never collapsed — anchor_dangling / claim_reference_dangling are integrity
  violations (the machine form of AGENTS.md's "letting an agent cite a source it did
  not retrieve and anchor"), while source_unanchored / anchor_unreferenced are
  observations and NOT errors; collapsing them would immediately report 1 resp. 2
  false violations in the real archive; (3) the input is the COMMITTED DUMPS, not the
  local database — the local instance was reachable at derivation (127.0.0.1:54329)
  but is the declared throwaway (Befund 1), while the dumps are committed,
  hash-anchorable, and readable with no database connection at all; (4) the fail-closed
  file-hash gate mirrors R2-T01 but does NOT reuse its check_anchor, because that
  takes a closed BatchRole of {"manifest","snapshot"} — widening another packet's
  closed set for convenience is forbidden, so T02b mirrors the pattern with its own
  open dump set; (5) the dump parser is strict — columns indexed by the COPY header's
  names, \N mapped to None, anything unexpected a typed refusal, never a silent skip;
  (6) the real archive numbers computed offline at derivation are the acceptance
  oracle.
depends_on: []
derivation: >-
  Derived 2026-07-25 from docs/design/2026-07-25-n2-t02-derivation.md, closing the
  "interne Verknüpfungs-Integrität (jeder EvidenceAnchor -> realer SourceRecord)" half
  of the "N2-T02 (benannt)" slot in docs/design/2026-07-24-n2-derivation.md. Fact base
  verified first-hand at derivation by parsing both committed dumps offline: there are
  NO source_record/evidence_anchor tables — persistence is a generic objects table
  (id, revision, api_version, kind, practice_id, created_at, created_by, content_hash,
  supersedes, labels, body) with the domain object in the JSONB body, exported as a
  postgres COPY block. mrr_k1t04_real_run_v2: 67 object rows, 18 SourceRecord, 17
  EvidenceAnchor, 4 Claim; 0 anchors with an unresolvable source_record_id; 45
  claim->anchor references, 0 unresolvable; 1 SourceRecord referenced by no anchor
  ("The Next Biennial Should Be Curated by a Machine"); 0 anchors referenced by no
  claim. mrr_run2_corroboration_floor_v1: 125 object rows, 36 SourceRecord, 34
  EvidenceAnchor, 8 Claim; 0 dangling anchors; 90 claim->anchor references, 0
  unresolvable; 2 unanchored SourceRecords; 0 unreferenced anchors. Every anchor
  carries content_hash and snapshot_hash and anchor_validation_status "validated".
  The descriptor corpora/archive-integrity/anchoring-batch.v1.json is committed at the
  governance commit with both real file anchors (sha256:273db207... and
  sha256:79338a59..., both verified to match via descriptor-relative resolution) and is
  READ-ONLY for this build. hashlib and the parser are stdlib; no new dependency.
objective: >-
  After this packet, `mrr audit anchoring --batch corpora/archive-integrity/
  anchoring-batch.v1.json` renders a deterministic anchoring-integrity report (JSON and
  Markdown) over the committed archive dumps. It (a) resolves each declared dump path
  relative to the descriptor's own directory, (b) reads each dump's bytes and computes
  its sha256, (c) compares each against the descriptor's pinned anchor and, on ANY
  mismatch, raises a typed IntegrityGateError naming the dump and both hashes and HALTS
  before any dump is parsed (fail-closed), (d) on a clean gate parses each dump's
  objects COPY block strictly and resolves every EvidenceAnchor.source_record_id to a
  SourceRecord and every Claim evidence_relations/counterevidence_relations entry to an
  EvidenceAnchor, and (e) assembles a report that counts VIOLATIONS (anchor_dangling,
  claim_reference_dangling) strictly apart from OBSERVATIONS (source_unanchored,
  anchor_unreferenced), under a header stating in plain type that a resolvable anchor
  proves archival presence, NOT that the source supports the claim (N2-T03), and that
  unanchored sources and unreferenced anchors are observations, not errors. Run against
  the committed batch it reports 0 violations of both kinds across both dumps, with 1
  resp. 2 unanchored sources named. It opens NO database and NO network connection and
  writes only to the given output path (atomic os.replace).
