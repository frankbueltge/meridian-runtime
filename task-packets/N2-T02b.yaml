requirements:
  - >-
    R1 (strict dump parser, packages/domain/mrr/domain/archive_dump.py): pure, no-IO,
    stdlib only — takes ALREADY-READ dump text and returns typed rows (reading the file
    is the SERVICE's job, mirroring mrr.domain.citation_audit's "takes already-loaded
    values"). It locates the postgres COPY block for the objects table (COPY
    <schema>.objects (<columns>) FROM stdin; ... terminated by a line containing only
    \.), indexes fields by the COLUMN NAMES parsed from that header — never by fixed
    positions — splits data lines on tab, and unescapes postgres COPY text escapes
    (\t, \n, \r, \\). The NULL marker \N maps to None, never to the literal string
    "\N". Every deviation is a typed ArchiveDumpParseError naming what was expected and
    where: no objects COPY block, a required column absent from the header, a data row
    whose field count differs from the header's, or a body that is not valid JSON. No
    row is ever silently skipped and no missing field is ever defaulted. Returns frozen
    dataclasses: ArchivedObject(object_id, kind, body) plus the derived, typed views
    the integrity core consumes.
  - >-
    R2 (pure integrity core, packages/domain/mrr/domain/anchoring_integrity.py):
    hand-rolled, no new dependency, pure and no-IO. TWO closed Literal sets, kept
    apart by type and never unified: AnchorLinkStatus {"anchor_resolved",
    "anchor_dangling"} and ClaimReferenceStatus {"claim_reference_resolved",
    "claim_reference_dangling"} for REFERENCE resolution (violations when dangling);
    and SourceCoverage {"source_anchored","source_unanchored"} plus AnchorCoverage
    {"anchor_referenced","anchor_unreferenced"} for COVERAGE (observations, never
    violations). Frozen dataclasses for each verdict row carrying the ids involved.
    Pure functions check_anchor_links(anchors, source_record_ids), check_claim_
    references(claims, anchor_ids), source_coverage(sources, anchors), anchor_coverage
    (anchors, claims) — each returning a tuple sorted by its primary id, so results are
    caller-order-independent. A typed AnchoringIntegrityError base class. Determinism:
    no wall clock, no unordered iteration, no set-iteration leaking into output order.
  - >-
    R3 (report projection, packages/domain/mrr/domain/anchoring_integrity_report.py): a
    Pydantic v2 MRRModel (extra="forbid") assembling, per dump: schema_name, the file
    anchor rows (path, declared_sha256, actual_sha256, matched: bool), object counts by
    kind, the ORDERED verdict rows, and separate count blocks for VIOLATIONS
    (anchor_dangling, claim_reference_dangling) and OBSERVATIONS (source_unanchored,
    anchor_unreferenced) — the two blocks are distinct fields and are never summed into
    one "problems" number. A FIXED honesty header from a single module-level constant:
    anchoring_is_not_support = Literal[True], plus a note string stating verbatim that
    (i) a resolvable anchor proves the anchor points at a really archived SourceRecord,
    (ii) it does NOT establish that the source supports the claim it is cited for — that
    is N2-T03, (iii) unanchored sources and unreferenced anchors are OBSERVATIONS, not
    errors, and (iv) no external resolution of the archive's own sources is performed
    here. It is NOT a BaseObject, has NO schemas/*.schema.json mirror, and is NEVER
    written to the object store. Pure render_markdown/render_json (sort_keys=True, no
    wall clock) mirroring citation_audit_report's renderers, and a build_anchoring_
    integrity_report(...) factory taking already-computed values.
  - >-
    R4 (descriptor fixture already committed — read only, do NOT regenerate): the
    service reads corpora/archive-integrity/anchoring-batch.v1.json, committed at
    derivation with both REAL file anchors and descriptor-relative dump paths. The build
    MUST NOT edit it, MUST NOT recompute or replace its anchors, and MUST NOT fabricate
    one. Dump paths inside the descriptor resolve relative to the descriptor file's OWN
    directory, never the process CWD. Unlike R2-T01's fixed two-role batch, the dumps[]
    list is OPEN (it grows with each new run); the service must handle any length >= 1
    and reject an empty list as a typed input error.
  - >-
    R5 (AnchoringIntegrityService, services/control_plane/mrr/services/
    anchoring_integrity/service.py): read-only, NO-NETWORK, NO-DATABASE orchestration —
    it must not import sqlalchemy, construct an engine, or build a repository. Given a
    --batch descriptor path it: parses the descriptor (wrong shape / missing key / bad
    JSON / empty dumps[] -> typed AnchoringIntegrityInputError -> exit 2); resolves each
    dump path relative to the descriptor dir; reads each dump's bytes and computes
    "sha256:" + hashlib.sha256(bytes).hexdigest() (a missing/unreadable dump ->
    AnchoringIntegrityInputError -> exit 2); compares each against its pinned anchor and
    raises a typed IntegrityGateError naming the dump, both hashes, and halting BEFORE
    any dump is parsed (fail-closed — the gate is strictly before the evaluation, and no
    parse result may exist when it fires); on a clean gate parses each dump via R1,
    evaluates via R2, and builds the R3 report. Markdown shows, per dump, the anchor
    row, the kind counts, the violation block and — visually separate — the observation
    block with the unanchored sources named.
  - >-
    R6 (CLI, services/control_plane/mrr/services/cli/anchoring_integrity_main.py + 2
    lines in cli/main.py): `mrr audit anchoring` with --batch <descriptor path>
    (required), --format md|json (default md), --output <path> (default stdout).
    NFR-012 ordering: cheapest local checks first — (1) --output must not already exist;
    (2) the service reads/parses descriptor and dumps; a file-level problem
    (AnchoringIntegrityInputError) -> exit 2; a fail-closed anchor mismatch
    (IntegrityGateError) or a dump-structure refusal (ArchiveDumpParseError) -> exit 3
    (a REFUSAL, never a crash, never a silent pass). Exit 0 on success — INCLUDING when
    violations are found: this packet audits and reports, it does not gate a run (a
    non-zero-on-violation gate belongs to the nightly R2-T02, which does not exist).
    Atomic os.replace for --output. A standalone build_parser()/main() enables `python -m
    mrr.services.cli.anchoring_integrity_main anchoring ...`. IMPORTANT: `audit` is an
    EXISTING subcommand group (N2-T01's `mrr audit citations`); this packet adds the
    `anchoring` sub-subcommand to that same group without changing citations' parser,
    dispatch, or behaviour in any way.
  - >-
    R7 (tests every tier + security-check). unit (DB-free, no-network): R1 parses a
    small synthetic COPY block correctly (column-name indexing proven by reordering the
    header columns and getting the same result), maps \N to None, and raises the typed
    parse error for each named deviation (no objects block, missing column, wrong field
    count, invalid JSON body); R2 resolves and detects a dangling anchor and a dangling
    claim reference, and reports unanchored/unreferenced coverage — with an explicit
    test that a dangling reference and an unanchored source produce DIFFERENT statuses
    and land in DIFFERENT count blocks (the never-collapse invariant); R3 report shape
    incl. the honesty header (anchoring_is_not_support is Literal[True], the note names
    N2-T03) and determinism (two renders byte-identical, stable content hash).
    A fail-closed test proving the gate short-circuits: a descriptor whose declared
    anchor is wrong makes the service raise IntegrityGateError and the dump parser is
    provably NOT reached (monkeypatch the parser to raise AssertionError and assert
    IntegrityGateError is raised instead). architecture (lint-imports): the two domain
    modules import no framework/service module; the service imports no sqlalchemy.
    contract: the R3 model validates its own instances (extra="forbid" rejects an
    unknown field). acceptance (DB-free, no-network, over the REAL committed batch):
    both dump anchors match; k1t04 reports 18 SourceRecord / 17 EvidenceAnchor / 4
    Claim, 0 dangling anchors, 45 claim references with 0 dangling, 1 unanchored source;
    run2 reports 36 / 34 / 8, 0 dangling anchors, 90 claim references with 0 dangling,
    2 unanchored sources — asserted numerically. All existing suites pass UNMODIFIED.
    Every make tier green INCLUDING make security-check.
