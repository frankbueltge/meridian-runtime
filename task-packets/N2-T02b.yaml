derived_decisions:
  - >-
    (a) Anchoring is not support. A resolvable anchor proves the anchor points at a
    really archived SourceRecord; it says nothing about whether that source carries the
    claim (N2-T03). This is the packet's single most important honesty boundary — the
    T02b analogue of N1's reliability-not-validity, N2-T01's existence-not-support and
    R2-T01's observation-not-optimization.
  - >-
    (b) Violations and observations are never collapsed. anchor_dangling and
    claim_reference_dangling are integrity violations (the machine form of AGENTS.md's
    "letting an agent cite a source it did not retrieve and anchor"); source_unanchored
    and anchor_unreferenced are observations — a corpus source that ended up carrying no
    evidence is not an error. Folding them into one "problems" count would report 1
    resp. 2 false violations against the real archive on day one, and is the exact
    prohibited shortcut in AGENTS.md.
  - >-
    (c) The committed dumps are the input, not the database. The local instance was
    reachable at derivation but is the declared throwaway (Befund 1); auditing it would
    audit an ephemeral artefact nobody else can reproduce. The dumps are committed
    bytes (git authoritative), hash-anchorable, and readable with no database
    connection — which also keeps the whole audit offline and deterministic.
  - >-
    (d) The R2-T01 gate is mirrored, not reused, and its closed set is not widened.
    check_anchor takes role: BatchRole with the closed set {"manifest","snapshot"}; a
    dump is neither. Widening another packet's closed Literal to make reuse convenient
    would soften an invariant that packet deliberately established. T02b mirrors the
    pattern with its own OPEN dumps list (their number grows with each run). Reuse where
    it is real, mirror where the shape differs.
  - >-
    (e) The parser is strict by design. Column-name indexing (never fixed positions),
    \N -> None, and a typed refusal for every deviation. A lenient parser that skipped an
    unexpected row would under-report exactly the integrity failures this audit exists to
    find — a silent skip here is indistinguishable from a clean result.
  - >-
    (f) Report is a projection, not a persisted object. Pydantic-validated (rule 6) but
    never entering the object store (rule 7). No schemas/** mirror, no migration.
  - >-
    (g) No non-zero exit on violations. The audit reports; it does not judge a run. A
    gate exit belongs to the nightly routine R2-T02, which does not exist — adding it now
    would build for a caller that has not been named (use-first).
invariants:
  - No network connection and no database connection is opened anywhere; sqlalchemy is never imported by this packet's code.
  - Nothing is written except the requested --output file (atomic os.replace); the dumps and the descriptor are never modified.
  - No wall-clock timestamp in any rendered byte; identical inputs yield a byte-identical report and a stable content hash.
  - On ANY dump-anchor mismatch the run raises IntegrityGateError and NO dump is parsed — the gate is strictly before the evaluation (fail-closed).
  - Violation counts and observation counts are separate fields in the report and are never summed or presented as one number.
  - No row is silently skipped and no missing field silently defaulted; every parse deviation is a typed refusal.
  - The existing `mrr audit citations` parser, dispatch, and behaviour are unchanged.
acceptance_tests:
  - >-
    AT1: over the committed corpora/archive-integrity/anchoring-batch.v1.json, both dump
    anchors match (declared == actual), and the report states for mrr_k1t04_real_run_v2:
    18 SourceRecord, 17 EvidenceAnchor, 4 Claim, 0 anchor_dangling, 45 claim references
    with 0 claim_reference_dangling, 1 source_unanchored, 0 anchor_unreferenced —
    asserted numerically.
  - >-
    AT2: the same run states for mrr_run2_corroboration_floor_v1: 36 SourceRecord, 34
    EvidenceAnchor, 8 Claim, 0 anchor_dangling, 90 claim references with 0
    claim_reference_dangling, 2 source_unanchored, 0 anchor_unreferenced — asserted
    numerically.
  - >-
    AT3: never-collapsed — a synthetic archive containing BOTH a dangling anchor and an
    unanchored source yields two DIFFERENT statuses landing in DIFFERENT report count
    blocks (violations vs observations); no field of the report sums them.
  - >-
    AT4: fail-closed — a descriptor with a wrong declared dump anchor makes the service
    raise IntegrityGateError (naming the dump and both hashes), and the dump parser is
    provably NOT reached (monkeypatch it to raise AssertionError; IntegrityGateError is
    raised instead).
  - >-
    AT5: the report header carries anchoring_is_not_support=True with the note that a
    resolvable anchor proves archival presence and NOT support (N2-T03), and that
    unanchored sources and unreferenced anchors are observations, not errors.
  - >-
    AT6: strict parsing and refusals — column-name indexing survives a reordered COPY
    header; \N becomes None; no-objects-block, missing column, wrong field count and
    invalid JSON body each raise the typed parse error (exit 3 at the CLI); a missing or
    unparseable descriptor exits 2; two renders are byte-identical; existing suites pass
    unmodified.
commands:
  - make format
  - make lint
  - make typecheck
  - make test
  - make test-contract
  - make security-check
specification_gaps:
  - >-
    Support-checking (does the anchored source carry the claim?) and number-consistency
    are N2-T03 — named, not built. This packet establishes that the anchor points at a
    really archived source, and says so and no more.
  - >-
    External resolution of the archive's OWN SourceRecords is deliberately absent: of
    the 18 distinct records, 3 are arXiv papers and 1 carries a DOI, while 15 are
    curated-artwork-records with ordinary web URLs no metadata API knows. Such a run
    would be overwhelmingly "unverifiable" and would simulate a check that does not take
    place.
  - >-
    Verifying an anchor's own content_hash/snapshot_hash against the referenced snapshot
    BYTES would require those snapshot artefacts to be committed alongside the dumps;
    they are not, so this packet checks reference RESOLUTION and hash PRESENCE, not hash
    recomputation — stated in the report rather than implied.
  - >-
    A nightly gate exit on violations belongs to R2-T02 (which does not exist); this
    packet exits 0 on a successfully built report regardless of findings.
required_output:
  - Packet report per AGENTS.md "Required delivery format", embedding the exact
    `mrr audit anchoring` invocation, the rendered Markdown report verbatim (both dumps'
    anchor rows, kind counts, the violation block and the separate observation block
    with the unanchored sources named), and the honesty header.
stop_conditions:
  - >-
    If reproducing the expected result requires editing or regenerating the committed
    descriptor or either dump, STOP — they are the oracle and the archive (AGENTS.md
    rule 3; committed archive JSON/dumps are never edited).
  - >-
    If making a tier green requires collapsing violations and observations into one
    count, softening a status set, or reporting a dangling reference as anything but a
    violation, STOP — that is the prohibited shortcut this packet exists to avoid.
  - >-
    If the gate can only pass by parsing a dump before the hash check, or if any step
    appears to require a database connection, a network call, a new dependency, or
    widening R2-T01's closed BatchRole, STOP.
