task_id: E4-T01
title: Implement the provider-neutral ModelProfile and ModelInvocation record
status: approved
derivation: >
  Derived by the planning session per docs/spec/07_AGENT_TASK_TEMPLATE.md
  section 5 from docs/spec/01_SYSTEM_SPEC.md section 4.5 (MRR-FR-044, MRR-FR-045,
  MRR-FR-046), the vendor-neutrality requirement (MRR-NFR-004) and the
  framework-/provider-free core requirement (MRR-NFR-010), docs/spec/
  02_DOMAIN_MODEL.md section 2.6 (the RunManifest already records "tool and
  model invocations"), and docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E4;
  approved by the repository owner's standing direction to continue (2026-07-19).
  First task of Epic E4 - the provider-neutral model contracts and adapter
  boundary that every later E4 role (planner/proposer/skeptic/verifier) builds
  on. It writes NO concrete provider code, opens NO network, and creates NO
  authoritative state.
objective: >
  Provide the framework- and provider-neutral data and boundary for model use:
  (1) a ModelProfile - a canonically hashable, provider-opaque description of a
  model configuration (provider label, model family, model identifier/version,
  decoding parameters, determinism, optional seed, optional prompt-template
  family, optional tool permissions, config hash); (2) a ModelInvocation record
  - an auditable, redaction-aware record of a SINGLE model call (profile
  reference + profile hash, prompt/configuration hash, tool calls, token usage,
  response hash, a deterministic-vs-stochastic operation kind, and a DISTINCT
  terminal status); and (3) the abstract, provider-neutral ModelAdapter port
  (a framework-free Protocol plus request/result value objects) that concrete
  provider adapters will implement in E4-T02. A model result is recorded as a
  PROPOSAL and never as authoritative state.
