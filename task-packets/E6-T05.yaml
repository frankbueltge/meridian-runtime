required_output:
  - implementation summary
  - the new packages/domain/mrr/domain/public_correction_view.py module
    (PublicCorrectionRow, PublicClaimRow dataclasses; the redaction
    predicate; build_public_correction_row/build_public_claim_row) and the
    two new additive ProjectionService methods
    (build_public_correction_view, build_public_claim_table), with their
    exact signatures
  - changed files, and explicit confirmation that zero new domain errors
    were added, packages/domain/mrr/domain/projection.py and
    packages/domain/mrr/domain/lifecycles.py were not modified, no schema
    changed, and packages/persistence/** and migrations/ were not touched
  - tests added and exact command results (format, lint, typecheck, test,
    test-integration) proving green
  - security/privacy implications — the fail-closed classification redaction
    rule, why absence of an attestation never defaults to disclosure, and
    confirmation that no raw restricted or participant-identifiable free
    text can reach the public view without an explicit PUBLIC attestation
    for every contributing object id
  - open specification questions exactly as listed under specification_gaps
  - what is deliberately deferred — a genuine schema-level classification
    field (pending a future ADR), per-recipient response breakdown (E6-T04,
    undrafted), transferred-caveat visibility (E6-T01) and Obligation
    visibility (E6-T02), and a full E6-scope extension of E2E-003 with real
    cross-practice recipients
stop_conditions:
  - a reviewer determines MRR-FR-095's "public" must be satisfied by adding a
    genuine classification field to Claim's or CorrectionEvent's own schema
    rather than a caller-supplied runtime map — stop rather than modifying
    those schemas unilaterally; raise it as a candidate ADR
  - a reviewer determines this task must also surface TransferContract
    caveats, Obligation status, or a per-recipient delivery/response
    breakdown before E6-T01/T02/T03/T04 exist in reviewed, merged code —
    stop rather than inventing against draft or nonexistent shapes; report
    the dependency instead of guessing at field names that may still change
  - the fail-closed "every contributing id must be attested PUBLIC" redaction
    rule is judged too strict or too permissive by a reviewer — stop rather
    than silently loosening MRR-NFR-006's default in either direction;
    request a specification decision
  - honoring MRR-FR-095 in full is found to require writing new authoritative
    state — a persisted classification field, a new domain event, or
    anything beyond a pure read — stop and report the conflict with
    AGENTS.md's source-of-truth discipline rather than turning this
    projection into a second, competing record
