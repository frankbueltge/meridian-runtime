task_id: E6-T05
title: Public unresolved-correction projection — a classification-respecting, fail-closed-redacted public read-model over the already-approved CorrectionEvent/Claim state and CORRECTION_LIFECYCLE, reusing E3-T07's claim table and E1-T04's state machine verbatim, needing no TransferContract/Obligation/CorrectionNotification code to exist
status: draft
depends_on: []
derivation: >
  Derived by a planning session (not yet reviewed) per
  docs/spec/07_AGENT_TASK_TEMPLATE.md section 5 from
  docs/spec/06_IMPLEMENTATION_PLAN.md section 3 Epic E6 (line 196 — "E6-T05
  public unresolved-correction projection", fifth of six E6 tasks — T01
  TransferContract lifecycle, T02 caveat/obligation propagation, T03
  cross-practice correction notification, T04 local accept/adapt/reject/defer
  response to a correction, T06 offline recipient delivery tracking; the
  epic's own exit criteria at lines 201-202 — "correction propagation remains
  complete and cycle-safe across nodes" and "local autonomy and visible
  disagreement are both preserved" — name this task as the "visible
  disagreement" half), and docs/spec/01_SYSTEM_SPEC.md line 210, MRR-FR-095
  ("Public projections MUST display unresolved critical corrections"), which
  sits under section 4.10 "Stage 10 — Correction propagation" (line 203), not
  section 4.11 "Stage 11 — Projection and publication" (line 218, MRR-FR-100
  through MRR-FR-104) — the formal publication-bundle, A4-approval, and
  disclosure-level machinery (MRR-FR-101..104) is Epic E8, exactly as
  task-packets/E3-T07.yaml's own forbidden_changes already established when
  it built the claim-table/provenance-map projection this task extends.

  Direct code search at derivation time confirms none of TransferContract
  (E6-T01), Obligation (E6-T02), or CorrectionNotification (E6-T03) exist
  anywhere in the repository — no schemas/transfer-contract.schema.json, no
  schemas/obligation.schema.json, no schemas/correction-notification.schema.json,
  no matching packages/contracts/mrr/contracts/*.py, no matching
  services/control_plane/mrr/services/{transfer,obligation}/ directories —
  only their own draft, not-yet-reviewed task-packets/E6-T01.yaml and
  task-packets/E6-T02.yaml exist as text, and E6-T04 has no task packet at
  all yet, drafted or otherwise. Building this task's own code against any of
  those three still-unimplemented, still-unreviewed shapes would be
  inventing behavior against a moving target, contrary to AGENTS.md rules 3
  and 14. This task therefore treats none of them as a real dependency (see
  derived_decisions (a) for why the already-approved substrate is sufficient
  on its own) and instead builds directly on two already-merged and
  already-approved pieces — packages/domain/mrr/domain/lifecycles.py's
  CORRECTION_LIFECYCLE (E1-T04, docs/spec/01_SYSTEM_SPEC.md#64-correction,
  unmodified since) and task-packets/E3-T07.yaml's own claim-table
  projection (packages/domain/mrr/domain/projection.py,
  services/control_plane/mrr/services/projection/service.py) — mirroring
  that module's own explicit idiom, restated in its module docstring: "a
  projection is a deterministic, rebuildable read-model, never authoritative
  state."

  Also confirmed by direct schema inspection: neither schemas/claim.schema.json
  nor schemas/correction-event.schema.json (nor schemas/evidence-anchor.schema.json,
  nor schemas/source-record.schema.json) declares a classification field of
  its own anywhere in their required/properties lists. The only classification
  fields anywhere in schemas/ are schemas/common.schema.json's
  $defs.artifactRef.classification (optional, line 52) and
  schemas/task-bundle.schema.json's own required classification field (line 9,
  60) — neither of which is reachable from a Claim or a CorrectionEvent. This
  is the genuine specification gap this task's own objective exists to
  address (see derived_decisions (b) and specification_gaps item 1) — "what
  does 'public' mean" cannot be answered today by reading a stored field, so
  this task introduces the missing mechanism rather than silently assuming
  everything currently in the graph is safe to disclose.
objective: >
  Provide a read-only, deterministically rebuildable "public" projection over
  the already-persisted Claim/CorrectionEvent graph that (1) reuses,
  byte-for-byte unmodified, mrr.domain.projection's
  is_unresolved_critical_correction/RESOLVED_CORRECTION_STATUSES and
  ProjectionService's existing build_claim_table to decide which claims and
  corrections are an "unresolved critical correction" per MRR-FR-095 — a
  question this task does not re-derive, since task-packets/E3-T07.yaml
  already answered it correctly, including the REJECTED_BY_RECIPIENT case
  ("recipient autonomy preserved, correction still unresolved"); (2) adds the
  one mechanism no prior projection task built — classification-respecting,
  fail-closed redaction of free text (a CorrectionEvent's reason and
  requested_action; a Claim's assertion) given a caller-supplied
  classification_by_object_id attestation map, defaulting every missing,
  unrecognized, or non-PUBLIC entry to redacted; and (3) never omits the
  structural fact of an unresolved critical correction — its id, severity,
  status, correction_type, and the ids of every claim/object it names —
  regardless of redaction, so that MRR-FR-095's MUST and MRR-NFR-006's MUST
  are both honored at once rather than one being traded for the other.
  Framework-free at the domain layer
  (packages/domain/mrr/domain/public_correction_view.py); the companion
  read-only I/O is two additive methods on the existing
  services/control_plane/mrr/services/projection/service.py
  ProjectionService, reusing its already-existing repository/event-log
  reads. Writes nothing anywhere — no object revision, no domain event, no
  edge — mirroring task-packets/E3-T07.yaml's own invariant that a
  projection introduces no new authoritative state.
