acceptance_criteria:
  - THE SHARP CASE - a Practice produced by this command is accepted by the UNCHANGED
    receiver as --trusted-sender-practice - build a Practice from key K, sign an
    envelope and an OfflineBundle with the same key K, write the bundle to a file, and
    have the unchanged validate_inbound_bundle / validate_inbound_envelope path accept
    it with a KeyRing built by the unchanged practice_key_ring from that Practice. This
    is the first evidence that a Meridian-published identity actually functions as the
    counterparty's input.
  - THE COUNTER-CASE - a Practice built from key A does NOT legitimise an envelope
    signed with key B; the receiver fails signature verification.
  - No kid parameter exists - the domain function's signature is inspected in a test and
    accepts no kid, no key id, and no encoded public key; the only key input is the
    private key.
  - The produced kid equals derive_key_id(private_key.public_key()) and keys[0]
    .encoded_public_key equals encode_public_key(private_key.public_key()), both
    computed independently in the test rather than read back from the output.
  - The self-signature verifies against the UNCHANGED verify_object_signature using the
    public half of --key-file, and signature.signer_practice_id equals the object's own
    id, and signature.key_id is keys[0].kid.
  - content_hash equals compute_content_hash of the written object, recomputed
    independently in the test.
  - NO PRIVATE KEY MATERIAL REACHES THE OUTPUT - the written bytes are scanned and
    contain neither the PEM text, its base64 body, nor the raw private bytes in any
    encoding; nothing is printed to stdout or stderr either.
  - Reproducibility - identical inputs, including id and created_at, produce a
    byte-identical file. No wall clock and no randomness inside the domain function;
    both id minting and created_at are supplied by the caller.
  - Every content field is required with no default - omitting any one of them is a
    typed refusal and no file is written.
  - An existing --output is refused without being touched, mirroring `envelope sign`'s
    own discipline and exit semantics.
  - make format-check, lint, typecheck, test, test-contract and security-check pass.
explicitly_not:
  - No identity for a foreign practice - no key, no node id, no Practice minted for
    Ulysses. The E5-T08 boundary is unchanged.
  - No exchange is performed - this packet produces a file and sends nothing.
  - No second hashing or signing implementation; hashing_policy and keys.py are reused
    unchanged and are forbidden paths.
  - No change to the federation CLI or to any validating module.
  - No healing of the archive's placeholder key ids - "node-key-1" and "origin-key-1"
    remain unverifiable, a separate dated defect, neither fixed nor concealed here.
  - No network, no database, no model, no new dependency, no migration, no schemas/**.
  - No default, guessed, or example value for any owner content field.
