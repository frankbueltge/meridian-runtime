[project]
name = "mrr"
version = "0.1.0"
description = "Meridian Research Runtime — contracts and domain kernel monorepo."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
dependencies = [
  "rfc8785>=0.1.4",
  "cryptography>=43.0",
  "python-ulid>=2.7",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3",
  "alembic>=1.13",
]

# task-packets/E2-T07.yaml: the `mrr` CLI (mrr.services.cli.main, under the
# existing services/control_plane namespace root — see that module's own
# docstring for why this is a new leaf, not a new namespace root). A new
# console script is a rule-13 deviation, flagged in this task's PR.
[project.scripts]
mrr = "mrr.services.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pip-audit>=2.7",
  "bandit>=1.7",
  "hypothesis>=6.112",
  "jsonschema>=4.26.0",
  "referencing>=0.37.0",
  "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution ships one PEP 420 namespace package, `mrr`, merged at build
# time from eleven independent package roots under packages/, adapters/, and
# services/. Each root owns a leaf subpackage (mrr.domain, mrr.crypto, ...,
# mrr.adapters.object_store, mrr.adapters.llm (task-packets/E4-T02.yaml),
# mrr.adapters.prompts (task-packets/E4-T06.yaml), mrr.services.control_
# plane's several sub-services, mrr.services.node_runtime) and none of the
# intermediate `mrr` directories (nor, for the three adapters roots, the
# intermediate `mrr.adapters` directory, nor, for the two services roots,
# the intermediate `mrr.services` directory) carry an __init__.py, which is
# what makes the merge a namespace package instead of competing regular
# packages. adapters/object_store, adapters/llm, and adapters/prompts are
# three separate roots that all contribute subpackages under the single
# merged `mrr.adapters` namespace, exactly like services/control_plane and
# services/node_runtime already do for `mrr.services` (E2-T04).
[tool.hatch.build.targets.wheel]
only-include = [
  "packages/domain/mrr",
  "packages/crypto/mrr",
  "packages/contracts/mrr",
  "packages/policy/mrr",
  "packages/provenance/mrr",
  "packages/observability/mrr",
  "packages/persistence/mrr",
  "adapters/object_store/mrr",
  "adapters/llm/mrr",
  "adapters/prompts/mrr",
  "services/control_plane/mrr",
  "services/node_runtime/mrr",
]

# The regular wheel build above merges the ten roots via path remapping.
# Editable installs (uv sync / pip install -e) instead add each root
# directly to sys.path so PEP 420 merges them into one `mrr` namespace
# package at import time; `sources` remapping (below) is not honored in
# dev mode, hence the separate `dev-mode-dirs` list.
dev-mode-dirs = [
  "packages/domain",
  "packages/crypto",
  "packages/contracts",
  "packages/policy",
  "packages/provenance",
  "packages/observability",
  "packages/persistence",
  "adapters/object_store",
  "adapters/llm",
  "adapters/prompts",
  "services/control_plane",
  "services/node_runtime",
]

[tool.hatch.build.targets.wheel.sources]
"packages/domain" = ""
"packages/crypto" = ""
"packages/contracts" = ""
"packages/policy" = ""
"packages/provenance" = ""
"packages/observability" = ""
"packages/persistence" = ""
"adapters/object_store" = ""
"adapters/llm" = ""
"adapters/prompts" = ""
"services/control_plane" = ""
"services/node_runtime" = ""

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
strict = true
namespace_packages = true
explicit_package_bases = true
files = ["packages", "adapters", "services", "tests", "scripts"]
mypy_path = [
  "packages/domain",
  "packages/crypto",
  "packages/contracts",
  "packages/policy",
  "packages/provenance",
  "packages/observability",
  "packages/persistence",
  "adapters/object_store",
  "adapters/llm",
  "adapters/prompts",
  "services/control_plane",
  "services/node_runtime",
  "tests/property",
]

[tool.importlinter]
root_packages = ["mrr"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core packages stay framework- and provider-free (MRR-NFR-010)"
type = "forbidden"
source_modules = [
  "mrr.domain",
  "mrr.crypto",
  "mrr.contracts",
  "mrr.policy",
  "mrr.provenance",
  "mrr.observability",
  "mrr.persistence",
  "mrr.adapters.object_store",
  "mrr.adapters.llm",
  "mrr.adapters.prompts",
]
forbidden_modules = [
  "fastapi",
  "starlette",
  "temporalio",
  "openai",
  "anthropic",
  "boto3",
  "botocore",
]

[[tool.importlinter.contracts]]
# forbidden_modules names the "mrr.services" root, not a specific
# sub-service, so this one contract already covers every current and future
# leaf under it — mrr.services.research_score/capability_registry/task_bundle
# (services/control_plane, E2-T01/T02/T03) and mrr.services.node_runtime
# (services/node_runtime, E2-T04) alike. No new contract was needed to add
# the second services/ root; this is confirmed by
# tests/unit/architecture/test_import_boundaries.py, which runs this exact
# contract as an acceptance test.
name = "Nothing inward imports the services layer (E2-T01, E2-T04)"
type = "forbidden"
source_modules = [
  "mrr.domain",
  "mrr.crypto",
  "mrr.contracts",
  "mrr.policy",
  "mrr.provenance",
  "mrr.observability",
  "mrr.persistence",
]
forbidden_modules = [
  "mrr.services",
]

[tool.bandit]
exclude_dirs = ["tests"]
